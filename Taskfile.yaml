version: "3"

# Local inputs — the foreign-system exports and the path to the ETS project
# password file — come from the git-ignored .env (keys in .env.example).
dotenv: [".env"]

vars:
  SCRIPTS_DIR: "{{.ROOT_DIR}}/scripts"
  KNX_BRIDGE_DIR: "{{.ROOT_DIR}}/../knx-nats-bridge"
  KNX_BRIDGE_VALUES_PATH: "{{.ROOT_DIR}}/kubernetes/applications/knx-nats-bridge/base/values.yaml"
  KNX_CATALOG_PATH: "{{.ROOT_DIR}}/kubernetes/applications/knx-nats-bridge/base/config/ga-catalog.yaml"
  KNX_GA_MAPPINGS_DIR: "{{.ROOT_DIR}}/kubernetes/applications/knx-nats-bridge/base/ga-mappings"
  DIAGNOSTICS_CRONJOB_PATH: "{{.ROOT_DIR}}/kubernetes/applications/lares-diagnostics-engine/base/detect-faults-cronjob.yaml"
  DIAGNOSTICS_FAULTS_PATH: "{{.ROOT_DIR}}/kubernetes/applications/lares-diagnostics-engine/base/config/faults.yaml"
  DIAGNOSTICS_SITE_PATH: "{{.ROOT_DIR}}/kubernetes/applications/lares-diagnostics-engine/base/config/site.yaml"
  # The sidecar bridges whose GA mappings are generated: the values file
  # carries the deployed tag, the config file the devices and their address blocks.
  MIELE_VALUES_PATH: "{{.ROOT_DIR}}/kubernetes/applications/miele-nats-bridge/base/values.yaml"
  MIELE_CONFIG_PATH: "{{.ROOT_DIR}}/kubernetes/applications/miele-nats-bridge/base/config/appliances.yaml"
  MIDEA_VALUES_PATH: "{{.ROOT_DIR}}/kubernetes/applications/midea-nats-bridge/base/values.yaml"
  MIDEA_CONFIG_PATH: "{{.ROOT_DIR}}/kubernetes/applications/midea-nats-bridge/base/config/devices.yaml"
  DYSON_VALUES_PATH: "{{.ROOT_DIR}}/kubernetes/applications/dyson-nats-bridge/base/values.yaml"
  DYSON_CONFIG_PATH: "{{.ROOT_DIR}}/kubernetes/applications/dyson-nats-bridge/base/config/devices.yaml"

includes:
  infra:
    taskfile: ./tasks/infrastructure.tasks.yaml
    dir: ./infrastructure
  k8s:
    taskfile: ./tasks/kubernetes.tasks.yaml
  cluster:
    taskfile: ./tasks/cluster.tasks.yaml
  knx:
    taskfile: ./tasks/knx.tasks.yaml
  diagnostics:
    taskfile: ./tasks/diagnostics.tasks.yaml
  basalte:
    taskfile: ./tasks/basalte.tasks.yaml

tasks:
  default:
    cmds:
      - cmd: task --list
        silent: true

  initialize:
    desc: "initialize lares project environment"
    summary: |
      Setup project dependencies and environment.
      - Installs Homebrew packages (k8s-cli, tofu, omnictl, uv, etc)
      - Installs pre-commit as an isolated uv tool (no in-repo venv)
      - Configures pre-commit hooks
      The validate hooks install the sidecar loaders from GitHub at the
      deployed tags; uv must be recent enough to know the Python version the
      bridge requires — `brew upgrade uv` when the resolve says otherwise.
    vars:
      FORMULAS: >-
        kubernetes-cli
        kustomize
        helm
        argocd
        opentofu
        cilium-cli
        siderolabs/tap/sidero-tools
        nats-io/nats-tools/nats
        nats-io/nats-tools/nsc
        actionlint
        yq
        jq
        uv
        kubeseal
        gnu-sed
        coreutils
    preconditions:
      - sh: command -v brew
        msg: |
          Homebrew is not installed. Please install Homebrew using the following command:
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    cmds:
      # Install System Packages
      - for:
          var: FORMULAS
          as: FORMULA
        cmd: "brew list {{.FORMULA}} >/dev/null 2>&1 || brew install {{.FORMULA}} >/dev/null 2>&1"
      # Install pre-commit as an isolated uv tool (lives in ~/.local/share/uv/tools/)
      - uv tool install --quiet pre-commit
      - pre-commit install >/dev/null 2>&1
