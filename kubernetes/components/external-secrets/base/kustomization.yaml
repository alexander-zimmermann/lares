apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets
resources:
  - ./namespace.yaml

helmCharts:
  - name: external-secrets
    repo: oci://ghcr.io/external-secrets/charts
    releaseName: external-secrets
    version: 2.14.0
    valuesFile: values.yaml
    namespace: external-secrets
    # The chart checks for the kind, not just the group version
    apiVersions:
      - monitoring.coreos.com/v1/ServiceMonitor

labels:
  - includeSelectors: false
    pairs:
      homelab.component: external-secrets

# The CRDs are too large for a client-side apply's last-applied annotation
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"
  argocd.argoproj.io/compare-options: ServerSideDiff=true
  argocd.argoproj.io/sync-options: ServerSideApply=true
