apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy

metadata:
  name: mutate-certificates
  annotations:
    policies.kyverno.io/title: Mutate Certificates
    policies.kyverno.io/category: Cert-Manager
    policies.kyverno.io/subject: Certificate
    policies.kyverno.io/description: >-
      This policy sets default values for cert-manager Certificate resources
      if they are not specified.

spec:
  # Non-blocking to prevent outages if webhook fails
  failurePolicy: Ignore
  evaluation:
    # Admission only, no reports on existing Certificates
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["certificates"]
  variables:
    - name: key
      expression: object.spec.?privateKey.orValue({})
  mutations:
    # Each field is added only when the Certificate leaves it out; the key size only for an ECDSA key
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.spec.revisionHistoryLimit) ? [] : [JSONPatch{op: "add", path: "/spec/revisionHistoryLimit", value: 2}]) +
          (has(object.spec.privateKey) ? [] : [JSONPatch{op: "add", path: "/spec/privateKey", value: {}}]) +
          (has(variables.key.algorithm) ? [] : [JSONPatch{op: "add", path: "/spec/privateKey/algorithm", value: "ECDSA"}]) +
          (has(variables.key.size) || variables.key.?algorithm.orValue("ECDSA") != "ECDSA" ? [] : [JSONPatch{op: "add", path: "/spec/privateKey/size", value: 256}]) +
          (has(variables.key.encoding) ? [] : [JSONPatch{op: "add", path: "/spec/privateKey/encoding", value: "PKCS1"}]) +
          (has(variables.key.rotationPolicy) ? [] : [JSONPatch{op: "add", path: "/spec/privateKey/rotationPolicy", value: "Always"}])
