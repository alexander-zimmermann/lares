apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy

metadata:
  name: sync-cluster-secrets
  annotations:
    policies.kyverno.io/title: Sync Cluster Secrets
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Clones each listed Secret from its namespace into the namespace that
      needs it and keeps the copy in sync with the source.

spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  variables:
    # One line per copy: source namespace, Secret name, target namespace ("*" = every namespace but the source)
    - name: clones
      expression: |
        [
          {"from": "sealed-secrets-controller", "secret": "dhi-registry-secret",                               "to": "*"},
          {"from": "authentik",                 "secret": "argocd-oidc-secret",                                "to": "gitops-controller"},
          {"from": "crowdsec",                  "secret": "crowdsec-traefik-lapi-key",                         "to": "ingress-controller"},
          {"from": "crowdsec",                  "secret": "crowdsec-homepage-lapi-key",                        "to": "homepage"},
          {"from": "authentik",                 "secret": "authentik-homepage-token",                          "to": "homepage"},
          {"from": "authentik",                 "secret": "grafana-oidc-secret",                               "to": "grafana"},
          {"from": "authentik",                 "secret": "rustfs-oidc-secret",                                "to": "rustfs"},
          {"from": "grafana",                   "secret": "grafana-admin-credentials",                         "to": "homepage"},
          {"from": "gitops-controller",         "secret": "argocd-homepage-token",                             "to": "homepage"},
          {"from": "redis",                     "secret": "redis-admin-credentials",                           "to": "ingress-controller"},
          {"from": "authentik",                 "secret": "node-red-oidc-secret",                              "to": "node-red"},
          {"from": "authentik",                 "secret": "open-webui-oidc-secret",                            "to": "open-webui"},
          {"from": "authentik",                 "secret": "agentgateway-oidc-secret",                          "to": "agents"},
          {"from": "rustfs",                    "secret": "rustfs-authentik-credentials",                      "to": "authentik"},
          {"from": "nats",                      "secret": "solaredge2mqtt-credentials",                        "to": "solaredge2mqtt"},
          {"from": "rustfs",                    "secret": "rustfs-wiki-js-credentials",                        "to": "wiki-js"},
          {"from": "rustfs",                    "secret": "rustfs-timescaledb-credentials",                    "to": "timescaledb"},
          {"from": "rustfs",                    "secret": "rustfs-redpanda-connect-credentials",               "to": "redpanda-connect"},
          {"from": "rustfs",                    "secret": "rustfs-lares-mcp-bridge-credentials",               "to": "lares-mcp-bridge"},
          {"from": "nats",                      "secret": "knx-nats-bridge-credentials",                       "to": "knx-nats-bridge"},
          {"from": "nats",                      "secret": "dyson-nats-bridge-credentials",                     "to": "dyson-nats-bridge"},
          {"from": "nats",                      "secret": "midea-nats-bridge-credentials",                     "to": "midea-nats-bridge"},
          {"from": "nats",                      "secret": "miele-nats-bridge-credentials",                     "to": "miele-nats-bridge"},
          {"from": "nats",                      "secret": "redpanda-connect-credentials",                      "to": "redpanda-connect"},
          {"from": "timescaledb",               "secret": "timescaledb-db-connect-secret",                     "to": "redpanda-connect"},
          {"from": "timescaledb",               "secret": "timescaledb-db-lares-mcp-bridge-ro-secret",         "to": "lares-mcp-bridge"},
          {"from": "timescaledb",               "secret": "timescaledb-db-lares-mcp-bridge-verdict-secret",    "to": "lares-mcp-bridge"},
          {"from": "nats",                      "secret": "lares-mcp-bridge-nats-credentials",                 "to": "lares-mcp-bridge"},
          {"from": "timescaledb",               "secret": "timescaledb-db-grafana-ro-secret",                  "to": "grafana"},
          {"from": "timescaledb",               "secret": "timescaledb-db-lares-mcp-bridge-ro-secret",         "to": "lares-diagnostics-engine"},
          {"from": "timescaledb",               "secret": "timescaledb-db-lares-diagnostics-engine-rw-secret", "to": "lares-diagnostics-engine"},
          {"from": "nats",                      "secret": "lares-diagnostics-engine-credentials",              "to": "lares-diagnostics-engine"},
          {"from": "timescaledb",               "secret": "timescaledb-db-app",                                "to": "knx-nats-bridge"},
          {"from": "nats",                      "secret": "lares-agent-trigger-nats-credentials",              "to": "agents"},
          {"from": "timescaledb",               "secret": "timescaledb-db-lares-agent-trigger-secret",         "to": "agents"},
          {"from": "lares-mcp-bridge",          "secret": "lares-mcp-bridge-gateway-key",                      "to": "agents"},
          {"from": "grafana",                   "secret": "grafana-mcp-gateway-key",                           "to": "agents"},
          {"from": "unifi-mcp",                 "secret": "unifi-mcp-gateway-key",                             "to": "agents"},
          {"from": "agents",                    "secret": "lares-agent-trigger-api-key",                       "to": "lares-mcp-bridge"}
        ]
    - name: wanted
      expression: >-
        variables.clones.filter(c, c.to == object.metadata.name || (c.to == "*" && c.from != object.metadata.name))
  generate:
    - expression: >-
        variables.wanted.all(c, generator.Apply(object.metadata.name,
          dyn(resource.List("v1", "secrets", c.from).items).filter(s, s.metadata.name == c.secret)))
