apiVersion: kyverno.io/v1
kind: ClusterPolicy

metadata:
  name: sync-cluster-secrets
  annotations:
    policies.kyverno.io/title: Sync Cluster Secrets
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Synchronizes essential secrets across namespaces to ensure
      dependent services availability.

spec:
  generateExisting: true
  rules:
    # Syncs DHI registry secret from sealed-secrets-controller into all other namespaces
    - name: sync-dhi-registry-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - sealed-secrets-controller
      generate:
        apiVersion: v1
        kind: Secret
        name: dhi-registry-secret
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        clone:
          namespace: sealed-secrets-controller
          name: dhi-registry-secret

    # Syncs ArgoCD OIDC client secret from authentik into gitops-controller namespace
    - name: sync-argocd-oidc-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - gitops-controller
      generate:
        apiVersion: v1
        kind: Secret
        name: argocd-oidc-secret
        namespace: gitops-controller
        synchronize: true
        clone:
          namespace: authentik
          name: argocd-oidc-secret

    # Syncs CrowdSec Traefik LAPI key from crowdsec into ingress-controller for Traefik bouncer plugin
    - name: sync-crowdsec-traefik-lapi-key
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - ingress-controller
      generate:
        apiVersion: v1
        kind: Secret
        name: crowdsec-traefik-lapi-key
        namespace: ingress-controller
        synchronize: true
        clone:
          namespace: crowdsec
          name: crowdsec-traefik-lapi-key

    # Syncs CrowdSec Homepage LAPI key from crowdsec into homepage for CrowdSec widget
    - name: sync-crowdsec-homepage-lapi-key
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - homepage
      generate:
        apiVersion: v1
        kind: Secret
        name: crowdsec-homepage-lapi-key
        namespace: homepage
        synchronize: true
        clone:
          namespace: crowdsec
          name: crowdsec-homepage-lapi-key

    # Syncs Authentik Homepage API token from authentik into homepage for Authentik widget
    - name: sync-authentik-homepage-token
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - homepage
      generate:
        apiVersion: v1
        kind: Secret
        name: authentik-homepage-token
        namespace: homepage
        synchronize: true
        clone:
          namespace: authentik
          name: authentik-homepage-token

    # Syncs Grafana OIDC client secret from authentik into grafana namespace
    - name: sync-grafana-oidc-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - grafana
      generate:
        apiVersion: v1
        kind: Secret
        name: grafana-oidc-credentials
        namespace: grafana
        synchronize: true
        clone:
          namespace: authentik
          name: grafana-oidc-secret

    # Syncs RustFS Console OIDC client secret from authentik into rustfs namespace
    - name: sync-rustfs-oidc-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - rustfs
      generate:
        apiVersion: v1
        kind: Secret
        name: rustfs-oidc-credentials
        namespace: rustfs
        synchronize: true
        clone:
          namespace: authentik
          name: rustfs-oidc-secret

    # Syncs Grafana admin credentials from grafana into homepage for Grafana widget
    - name: sync-grafana-admin-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - homepage
      generate:
        apiVersion: v1
        kind: Secret
        name: grafana-admin-credentials
        namespace: homepage
        synchronize: true
        clone:
          namespace: grafana
          name: grafana-admin-credentials

    # Syncs ArgoCD Homepage token from gitops-controller into homepage for ArgoCD widget
    - name: sync-argocd-homepage-token
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - homepage
      generate:
        apiVersion: v1
        kind: Secret
        name: argocd-homepage-token
        namespace: homepage
        synchronize: true
        clone:
          namespace: gitops-controller
          name: argocd-homepage-token

    # Syncs the ArgoCD Holmes read-only token from gitops-controller into holmesgpt for the argocd/core toolset
    - name: sync-argocd-holmes-token
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - holmesgpt
      generate:
        apiVersion: v1
        kind: Secret
        name: argocd-holmes-token
        namespace: holmesgpt
        synchronize: true
        clone:
          namespace: gitops-controller
          name: argocd-holmes-token

    # Syncs Redis password from redis namespace into ingress-controller for CrowdSec bouncer
    - name: sync-redis-password
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - ingress-controller
      generate:
        apiVersion: v1
        kind: Secret
        name: redis-admin-credentials
        namespace: ingress-controller
        synchronize: true
        clone:
          namespace: redis
          name: redis-admin-credentials

    # Syncs Node-RED OIDC client secret from authentik into node-red namespace
    - name: sync-node-red-oidc-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - node-red
      generate:
        apiVersion: v1
        kind: Secret
        name: node-red-oidc-secret
        namespace: node-red
        synchronize: true
        clone:
          namespace: authentik
          name: node-red-oidc-secret

    # Syncs the per-app, bucket-scoped RustFS credentials into authentik for WAL
    # archiving/backup — the sole RustFS credential for this tenant; the shared
    # admin clone was removed after the cutover was verified (WAL + backup).
    - name: sync-rustfs-authentik-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - authentik
      generate:
        apiVersion: v1
        kind: Secret
        name: rustfs-authentik-credentials
        namespace: authentik
        synchronize: true
        clone:
          namespace: rustfs
          name: rustfs-authentik-credentials

    # Syncs SolarEdge2MQTT credentials from nats into solaredge2mqtt for MQTT authentication
    - name: sync-solaredge2mqtt-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - solaredge2mqtt
      generate:
        apiVersion: v1
        kind: Secret
        name: solaredge2mqtt-credentials
        namespace: solaredge2mqtt
        synchronize: true
        clone:
          namespace: nats
          name: solaredge2mqtt-credentials

    # Syncs the per-app, bucket-scoped RustFS credentials into wiki-js for WAL
    # archiving/backup — the sole RustFS credential for this tenant; the shared
    # admin clone was removed after the cutover was verified (WAL + backup).
    - name: sync-rustfs-wiki-js-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - wiki-js
      generate:
        apiVersion: v1
        kind: Secret
        name: rustfs-wiki-js-credentials
        namespace: wiki-js
        synchronize: true
        clone:
          namespace: rustfs
          name: rustfs-wiki-js-credentials

    # Syncs the per-app, bucket-scoped RustFS credentials into timescaledb for WAL
    # archiving/backup — the sole RustFS credential for this tenant; the shared
    # admin clone was removed after the cutover was verified (WAL + backup).
    - name: sync-rustfs-timescaledb-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - timescaledb
      generate:
        apiVersion: v1
        kind: Secret
        name: rustfs-timescaledb-credentials
        namespace: timescaledb
        synchronize: true
        clone:
          namespace: rustfs
          name: rustfs-timescaledb-credentials

    # Syncs the per-app, write-only-scoped RustFS credentials into redpanda-connect
    # for the cold-archive parquet output — the sole RustFS credential for this
    # tenant; the shared admin clone was removed after the cutover was verified.
    - name: sync-rustfs-redpanda-connect-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - redpanda-connect
      generate:
        apiVersion: v1
        kind: Secret
        name: rustfs-redpanda-connect-credentials
        namespace: redpanda-connect
        synchronize: true
        clone:
          namespace: rustfs
          name: rustfs-redpanda-connect-credentials

    # Syncs KNX NATS Bridge credentials from nats into knx-nats-bridge for NATS authentication
    - name: sync-knx-nats-bridge-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - knx-nats-bridge
      generate:
        apiVersion: v1
        kind: Secret
        name: knx-nats-bridge-credentials
        namespace: knx-nats-bridge
        synchronize: true
        clone:
          namespace: nats
          name: knx-nats-bridge-credentials

    # Syncs Dyson NATS Bridge credentials from nats into dyson-nats-bridge for NATS authentication
    - name: sync-dyson-nats-bridge-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - dyson-nats-bridge
      generate:
        apiVersion: v1
        kind: Secret
        name: dyson-nats-bridge-credentials
        namespace: dyson-nats-bridge
        synchronize: true
        clone:
          namespace: nats
          name: dyson-nats-bridge-credentials

    # Syncs Midea NATS Bridge credentials from nats into midea-nats-bridge for NATS authentication
    - name: sync-midea-nats-bridge-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - midea-nats-bridge
      generate:
        apiVersion: v1
        kind: Secret
        name: midea-nats-bridge-credentials
        namespace: midea-nats-bridge
        synchronize: true
        clone:
          namespace: nats
          name: midea-nats-bridge-credentials

    # Syncs Miele NATS Bridge credentials from nats into miele-nats-bridge for NATS authentication
    - name: sync-miele-nats-bridge-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - miele-nats-bridge
      generate:
        apiVersion: v1
        kind: Secret
        name: miele-nats-bridge-credentials
        namespace: miele-nats-bridge
        synchronize: true
        clone:
          namespace: nats
          name: miele-nats-bridge-credentials

    # Syncs Redpanda Connect NATS user/password from nats into redpanda-connect
    - name: sync-redpanda-connect-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - redpanda-connect
      generate:
        apiVersion: v1
        kind: Secret
        name: redpanda-connect-credentials
        namespace: redpanda-connect
        synchronize: true
        clone:
          namespace: nats
          name: redpanda-connect-credentials

    # Syncs CNPG-managed connect-DB-user secret from timescaledb into redpanda-connect
    - name: sync-timescaledb-db-connect-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - redpanda-connect
      generate:
        apiVersion: v1
        kind: Secret
        name: timescaledb-db-connect-secret
        namespace: redpanda-connect
        synchronize: true
        clone:
          namespace: timescaledb
          name: timescaledb-db-connect-secret

    # Syncs CNPG-managed iot-mcp-bridge read-only DB-user secret from
    # timescaledb into iot-mcp-bridge
    - name: sync-timescaledb-db-iot-mcp-bridge-ro-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - iot-mcp-bridge
      generate:
        apiVersion: v1
        kind: Secret
        name: timescaledb-db-iot-mcp-bridge-ro-secret
        namespace: iot-mcp-bridge
        synchronize: true
        clone:
          namespace: timescaledb
          name: timescaledb-db-iot-mcp-bridge-ro-secret

    # Syncs the MCP server's subscribe-only NATS nkey-seed from nats into
    # iot-mcp-bridge for Phase-3 live current-state reads (get_current_state /
    # subscribe_nats). Distinct from iot-mcp-bridge-credentials (the
    # insights-engine anomaly publisher); matches the nats-auth-config NKey entry.
    - name: sync-iot-mcp-bridge-nats-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - iot-mcp-bridge
      generate:
        apiVersion: v1
        kind: Secret
        name: iot-mcp-bridge-nats-credentials
        namespace: iot-mcp-bridge
        synchronize: true
        clone:
          namespace: nats
          name: iot-mcp-bridge-nats-credentials

    # Syncs CNPG-managed grafana read-only DB-user secret from
    # timescaledb into grafana so the TimescaleDB datasource can authenticate.
    - name: sync-timescaledb-db-grafana-ro-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - grafana
      generate:
        apiVersion: v1
        kind: Secret
        name: timescaledb-db-grafana-ro-secret
        namespace: grafana
        synchronize: true
        clone:
          namespace: timescaledb
          name: timescaledb-db-grafana-ro-secret

    # Syncs CNPG-managed read-only DB-user secret into iot-insights-engine.
    # The jobs image's Settings() validates DB_USERNAME/PASSWORD at
    # construct time even though most jobs only open the write connection.
    # Same PG-side role + secret name as iot-mcp-bridge.
    - name: sync-iot-insights-engine-db-ro
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - iot-insights-engine
      generate:
        apiVersion: v1
        kind: Secret
        name: timescaledb-db-iot-mcp-bridge-ro-secret
        namespace: iot-insights-engine
        synchronize: true
        clone:
          namespace: timescaledb
          name: timescaledb-db-iot-mcp-bridge-ro-secret

    # Syncs CNPG-managed read-write DB-user secret into iot-insights-engine
    # for INSERT/UPDATE on mcp_anomalies + mcp_forecasts.
    - name: sync-iot-insights-engine-db-rw
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - iot-insights-engine
      generate:
        apiVersion: v1
        kind: Secret
        name: timescaledb-db-iot-mcp-bridge-rw-secret
        namespace: iot-insights-engine
        synchronize: true
        clone:
          namespace: timescaledb
          name: timescaledb-db-iot-mcp-bridge-rw-secret

    # Syncs the per-app, bucket-scoped RustFS credentials into iot-insights-engine
    # — the sole RustFS credential for this tenant; the shared admin clone was
    # removed after the scoped-user cutover was verified end-to-end.
    - name: sync-rustfs-iot-insights-engine-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - iot-insights-engine
      generate:
        apiVersion: v1
        kind: Secret
        name: rustfs-iot-insights-engine-credentials
        namespace: iot-insights-engine
        synchronize: true
        clone:
          namespace: rustfs
          name: rustfs-iot-insights-engine-credentials

    # Syncs NATS nkey-seed into iot-insights-engine for anomaly publishes
    # (`anomaly.<uc>.<severity>`). Secret name stays iot-mcp-bridge-credentials
    # to match the existing nats-auth-config NKey allowlist entry.
    - name: sync-iot-insights-engine-nats
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - iot-insights-engine
      generate:
        apiVersion: v1
        kind: Secret
        name: iot-mcp-bridge-credentials
        namespace: iot-insights-engine
        synchronize: true
        clone:
          namespace: nats
          name: iot-mcp-bridge-credentials

    # Syncs CNPG-managed timescaledb admin-user secret into knx-nats-bridge
    # so the import-catalog Job can write to the `ga_catalog` table
    # (after the iot-insights-engine split, this Job runs from the
    # knx-nats-bridge image as a 2nd entrypoint alongside the bridge).
    - name: sync-knx-nats-bridge-db-app
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - knx-nats-bridge
      generate:
        apiVersion: v1
        kind: Secret
        name: timescaledb-db-app
        namespace: knx-nats-bridge
        synchronize: true
        clone:
          namespace: timescaledb
          name: timescaledb-db-app
