deployment:
  # Deploy as a Deployment for controlled scaling (alternate: DaemonSet)
  kind: Deployment

  additionalVolumes:
    - name: crowdsec-traefik-lapi-key
      secret:
        secretName: crowdsec-traefik-lapi-key
        items:
          - key: crowdsec_traefik_lapi_key
            path: crowdsec_lapi_key
    - name: redis-password
      secret:
        secretName: redis-admin-credentials
        items:
          - key: redis-password
            path: redis_password

# Additional volumeMounts to add to the Traefik container
additionalVolumeMounts:
  - name: crowdsec-traefik-lapi-key
    mountPath: /etc/traefik/crowdsec-secrets
    readOnly: true
  - name: redis-password
    mountPath: /etc/traefik/redis-secrets
    readOnly: true

# Pod Disruption Budget: Ensure at least one replica is available during maintenance
podDisruptionBudget:
  enabled: true
  minAvailable: 1

experimental:
  plugins:
    # CrowdSec Bouncer
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.5.0
    # Cloudflare: only allow traffic originating from Cloudflare
    cloudflare:
      moduleName: github.com/agence-gaya/traefik-plugin-cloudflare
      version: v1.2.0
    # Strip Cookies: selectively remove cookies by name from requests
    stripcookie:
      moduleName: github.com/nilskohrs/stripcookie
      version: v0.1.0

api:
  # Enable insecure API access on the traefik entrypoint port (8080)
  # Safe because the port is only exposed via internal ClusterIP service
  insecure: true

ingressRoute:
  # Create an IngressRoute for the dashboard
  dashboard:
    enabled: true
    annotations:
      # Homepage Service Discovery
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Networking
      gethomepage.dev/name: Traefik
      gethomepage.dev/icon: traefik.png
      gethomepage.dev/weight: 3
      gethomepage.dev/href: https://PLACEHOLDER
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=traefik"
      gethomepage.dev/widget.type: "traefik"
      gethomepage.dev/widget.url: "http://traefik-internal.ingress-controller.svc.cluster.local:8080"
    matchRule: Host(`PLACEHOLDER`)
    entryPoints: ["websecure"]
    middlewares:
      - name: chain-mfa-auth
    tls:
      secretName: traefik-tls-cert

providers:
  kubernetesCRD:
    # Allows IngressRoute to reference resources in namespace other than theirs (e.g. middlewares)
    allowCrossNamespace: true
    # Allows IngressRoute to use ExternalName services as backends
    allowExternalNameServices: true

# General Traefik logs (startup, configuration, events, shutdown, ...)
log:
  format: json
  level: WARN
# Access logs (HTTP requests)
accessLog:
  enabled: true
  format: json
  bufferingSize: 100
  filters:
    statusCodes: "400-599"
    # Also log requests that only succeeded after a retry (e.g. dali retry-transient)
    retryAttempts: true

metrics:
  # Prometheus Monitoring
  prometheus:
    serviceMonitor:
      enabled: true
      # Prometheus Operator label (Opt-In)
      labels:
        release: prometheus

global:
  # Disable new version checks
  checkNewVersion: false

env:
  # Load trusted Ingress IPs as ENV variables for use in arguments
  - name: LOCAL_IPv4
    valueFrom:
      configMapKeyRef:
        name: ingress-ips
        key: LOCAL_IPv4
  - name: LOCAL_IPv6
    valueFrom:
      configMapKeyRef:
        name: ingress-ips
        key: LOCAL_IPv6
  - name: CLOUDFLARE_IPv4
    valueFrom:
      configMapKeyRef:
        name: ingress-ips
        key: CLOUDFLARE_IPv4
  - name: CLOUDFLARE_IPv6
    valueFrom:
      configMapKeyRef:
        name: ingress-ips
        key: CLOUDFLARE_IPv6

ports:
  # Traefik dashboard/API – only exposed on internal ClusterIP service for homepage widget
  traefik:
    expose:
      default: false
      internal: true

  # Prometheus metrics (Port 9100) – only exposed on internal ClusterIP service for the ServiceMonitor
  metrics:
    expose:
      default: false
      internal: true

  # Web entry point (Port 80)
  web:
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    forwardedHeaders:
      insecure: false
      trustedIPs:
        - $(CLOUDFLARE_IPv4)
        - $(CLOUDFLARE_IPv6)
        - $(LOCAL_IPv4)
        - $(LOCAL_IPv6)
    proxyProtocol:
      insecure: false
      trustedIPs:
        - $(CLOUDFLARE_IPv4)
        - $(CLOUDFLARE_IPv6)
        - $(LOCAL_IPv4)
        - $(LOCAL_IPv6)

  # Websecure entry point (Port 443)
  websecure:
    exposedPort: 443
    http3:
      enabled: true
    forwardedHeaders:
      insecure: false
      trustedIPs:
        - $(CLOUDFLARE_IPv4)
        - $(CLOUDFLARE_IPv6)
        - $(LOCAL_IPv4)
        - $(LOCAL_IPv6)
    proxyProtocol:
      insecure: false
      trustedIPs:
        - $(CLOUDFLARE_IPv4)
        - $(CLOUDFLARE_IPv6)
        - $(LOCAL_IPv4)
        - $(LOCAL_IPv6)

  # MQTT entry point (Port 8883)
  mqtt:
    port: 8883
    exposedPort: 8883
    protocol: TCP

tlsOptions:
  default:
    minVersion: VersionTLS12
    cipherSuites:
      # Recommended ciphers for TLSv1.2
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      # Recommended ciphers for TLSv1.3
      - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
    curvePreferences:
      - CurveP521
      - CurveP384
    sniStrict: true
    # Cloudflare Authenticated Origin Pulls — require every inbound TLS connection
    # to present Cloudflare's origin-pull client certificate. Rejects direct-to-origin
    # traffic at the TLS handshake layer, before any middleware runs.
    clientAuth:
      secretNames:
        - cloudflare-origin-pull-ca
      clientAuthType: RequireAndVerifyClientCert

service:
  # Expose Traefik via Cilium/BGP-announced LoadBalancer with source IP preservation
  type: LoadBalancer
  spec:
    externalTrafficPolicy: Local
  labels:
    bgp.cilium.io/ip-pool: default
    bgp.cilium.io/advertise-service: default
  # Internal ClusterIP service for homepage widget (dashboard/API port only)
  additionalServices:
    internal:
      type: ClusterIP

affinity:
  # Pod anti-affinity forces scheduler to put Traefik pods on nodes where no other Traefik are
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        topologyKey: kubernetes.io/hostname
