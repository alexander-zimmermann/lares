# Post-sync Job that provisions an ArgoCD service account + token via the
# ArgoCD admin API for other controllers to consume. Runs after every sync;
# the script is idempotent, and hook-delete-policy removes the Job on success.
apiVersion: batch/v1
kind: Job

metadata:
  name: provision-argocd-sa
  namespace: gitops-controller
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded

spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: argocd-sa-provisioner
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: dhi-registry-secret
      initContainers:
        # Wait until ArgoCD is ready
        - name: wait-for-argocd
          image: dhi.io/curl:8-alpine3.23
          command: ["curl"]
          args:
            - --silent
            - --fail
            - --retry-connrefused
            - --retry-all-errors
            - --retry=60
            - --retry-delay=3
            - --retry-max-time=300
            - http://argocd-server.gitops-controller.svc.cluster.local/healthz
      containers:
        - name: provision
          image: alpine/k8s:1.36.2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          command: ["/bin/sh", "/scripts/provision-argocd-sa.sh"]
          env:
            - name: ARGOCD_URL
              value: "http://argocd-server.gitops-controller.svc.cluster.local"
            - name: ADMIN_USER
              value: "admin"
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: argocd-initial-admin-secret
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: argocd-sa-provisioner-script
            defaultMode: 0555
        - name: config
          configMap:
            name: argocd-sa-provisioner-config
        - name: tmp
          emptyDir: {}
