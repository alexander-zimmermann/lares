apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../../../bootstrap/gitops-controller/overlays/prod/

replacements:
  # Inject domain name into the Certificate and IngressRoute
  - sourceValue: argocd.zimmermann.sh
    targets:
      - select:
          kind: IngressRoute
          name: argocd-server
        fieldPaths:
          - spec.routes.0.match
          - spec.routes.1.match
          - spec.routes.2.match
          - spec.routes.3.match
        options:
          delimiter: "`"
          index: 1
      - select:
          kind: Certificate
          name: argocd-tls-cert
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: IngressRoute
          name: argocd-server
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: "//"
          index: 1
      - select:
          kind: IngressRoute
          name: argocd-server
        fieldPaths:
          - metadata.annotations.[gatus.home-operations.com/endpoint]
        options:
          delimiter: "/"
          index: 2

  # Rewrite external-dns target annotation to prod UDM Pro
  - sourceValue: udm-pro.zimmermann.sh
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]
