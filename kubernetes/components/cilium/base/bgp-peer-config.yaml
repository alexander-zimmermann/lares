apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig

metadata:
  name: peer-config

spec:
  authSecretRef: cilium-unifi-bgp-credentials
  gracefulRestart:
    enabled: true
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchExpressions:
          - key: bgp.cilium.io/advertise
            operator: In
            values: [loadbalancer-services, pod-cidrs]
