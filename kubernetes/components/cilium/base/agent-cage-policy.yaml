apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy

metadata:
  name: agent-cage

spec:
  # The pods that run agents or act on their behalf (the hermes harness, the
  # gateway in front of its tool servers, GitHub's, Grafana's and UniFi's own
  # servers, the MCP bridge, the agent trigger, Node-RED) are the one place the UDM cannot see: pods leave
  # with the node IP, so their egress is fenced here, inside the cluster and towards
  # the internet by name. The cage touches no ingress. One policy for all of them, so the
  # allow list is the union of what each needs.
  endpointSelector:
    matchLabels:
      role: agent

  egress:
    # DNS through the Cilium DNS proxy; the toFQDNs rules below are learned from these answers
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"

    # In-cluster services, container ports: the policy sees the pod behind the Service.
    # The gateway calling the bridge behind its routes.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: lares-mcp-bridge
            app.kubernetes.io/name: lares-mcp-bridge
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # hermes reaching every tool server through the gateway
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents
            app.kubernetes.io/name: agentgateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # The gateway calling GitHub's own server behind the github route
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents
            app.kubernetes.io/name: github-mcp-server
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP

    # The gateway calling Grafana's own server behind the grafana route
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: grafana
            app.kubernetes.io/name: grafana-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP

    # The gateway calling UniFi's own servers behind the unifi-network and unifi-protect routes
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: unifi-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

    # grafana-mcp reading Grafana, which queries the data sources itself (Service port 80)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: grafana
            component: grafana-server
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

    # lares-agent-trigger reaching the harness's API server: the Runs API is
    # how an episode event becomes a run, the Jobs API how the cron jobs are
    # kept in line with the declaration; the trigger is the only caller in the cage.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "8642"
              protocol: TCP

    # hermes posting every finished chat and cron turn to lares-agent-trigger,
    # which writes its ledger row; the bridge forwarding the chat's start_run.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents
            app.kubernetes.io/name: lares-agent-trigger
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # lares-agent-trigger posting AgentRunFailed: a failed run is an event no
    # scrape can see, so the trigger raises the alert itself.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP

    # lares-agent-trigger mailing an explanation through the relay (Service port 25)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: smtprelay
            app.kubernetes.io/name: smtprelay
      toPorts:
        - ports:
            - port: "2525"
              protocol: TCP

    # NATS client and MQTT; node-red reaches it as mqtt.zimmermann.eu.com, the LB IP lands on the same pod
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: nats
            app.kubernetes.io/name: nats
            app.kubernetes.io/component: nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
            - port: "1883"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: timescaledb
            cnpg.io/cluster: timescaledb-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # lares-mcp-bridge: the storage tools list the object store (Service port 9000)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: rustfs
            app.kubernetes.io/name: rustfs
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: wiki-js
            app.kubernetes.io/name: wiki
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

    # hermes: OTLP traces and its process metrics; the trigger, the bridge, the gateway and
    # the UniFi servers: OTLP traces; grafana-mcp: OTLP traces over gRPC, the only protocol it exports
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: alloy
            app.kubernetes.io/name: alloy-receiver
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
            - port: "4317"
              protocol: TCP

    # Internet by name. Authentik sits behind Cloudflare like every *.zimmermann.sh host,
    # so the OIDC and JWKS calls (hermes, node-red, the gateway) leave the cluster too.
    - toFQDNs:
        - matchName: chatgpt.com # hermes: Codex, the primary model (ChatGPT login)
        - matchName: auth.openai.com # hermes: Codex token refresh
        - matchName: api.openai.com # hermes: the capped API fallback; agentgateway: the speech route
        - matchName: models.dev # hermes: model registry, refreshed every 4 h; blocked, it retries every 5 min
        - matchName: discord.com # hermes and lares-agent-trigger: Discord REST
        - matchPattern: "*.discord.gg" # hermes: Discord gateway websocket and the per-region resume URL it hands out
        - matchPattern: "*.discordapp.com" # hermes: Discord CDN (attachments)
        - matchPattern: "*.discordapp.net" # hermes: Discord media proxy
        - matchName: api.github.com # github-mcp-server: the reads; lares-agent-trigger: deliveries and read-back as the write App
        - matchName: raw.githubusercontent.com # github-mcp-server: file contents
        - matchName: mcp.cloudflare.com # agentgateway: Cloudflare's hosted server behind the cloudflare route
        - matchName: PLACEHOLDER_AUTH_HOST
        - matchName: registry.npmjs.org # node-red: OIDC dependency at start, palette installs
        - matchName: api.mcs3.miele.com # node-red: Miele flows
        - matchPattern: "*.hydrawise.com" # node-red: irrigation controller
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # lares-mcp-bridge: the backup tools read the PBS API
    - toFQDNs:
        - matchName: backup-01.zimmermann.eu.com
      toPorts:
        - ports:
            - port: "8007"
              protocol: TCP

    # unifi-network-mcp and unifi-protect-mcp: UniFi OS on the UDM Pro, its API and event websockets
    - toFQDNs:
        - matchName: udm-pro.zimmermann.eu.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # node-red: UniFi mails via iCloud IMAP
    - toFQDNs:
        - matchName: imap.mail.me.com
      toPorts:
        - ports:
            - port: "993"
              protocol: TCP

    # node-red: KNX IP interface, UDP tunnelling. By name, so the VLAN-6 move needs no policy
    # change; a flow that holds the address as an IP never matches this rule and shows up as AUDIT
    - toFQDNs:
        - matchName: knx-ip.zimmermann.eu.com
      toPorts:
        - ports:
            - port: "3671"
              protocol: UDP
