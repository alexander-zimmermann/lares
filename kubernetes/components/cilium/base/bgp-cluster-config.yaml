apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig

metadata:
  name: cilium-unifi

spec:
  nodeSelector:
    matchLabels: {}
  bgpInstances:
    - name: "65200"
      localASN: 65200
      peers:
        - name: "udm-pro-65100"
          peerASN: 65100
          peerAddress: 192.168.10.1
          peerConfigRef:
            name: peer-config
