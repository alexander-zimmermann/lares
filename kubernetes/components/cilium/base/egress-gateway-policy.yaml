---
apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy

metadata:
  name: egress-internal

spec:
  # Internal holds the clients, so only single devices get the egress IPs: the Basalte Core for homepage's status check
  selectors:
    - podSelector:
        matchLabels:
          lares.egress-internal: "true"
  destinationCIDRs:
    - 192.168.1.175/32
  # Required by the CRD, ignored while egressGateways has entries
  egressGateway:
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: talos-dp-01
    egressIP: PLACEHOLDER
  egressGateways:
    - nodeSelector:
        matchLabels:
          kubernetes.io/hostname: talos-dp-01
      egressIP: PLACEHOLDER
    - nodeSelector:
        matchLabels:
          kubernetes.io/hostname: talos-dp-02
      egressIP: PLACEHOLDER

---
apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy

metadata:
  name: egress-traefik

spec:
  # DALI gateways bind a session to its source IP, so both Traefik replicas take .2 into the IoT LAN, without failover
  selectors:
    - podSelector:
        matchLabels:
          io.kubernetes.pod.namespace: ingress-controller
          app.kubernetes.io/name: traefik
  destinationCIDRs:
    - 192.168.6.0/24
  egressGateway:
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: talos-dp-01
    egressIP: PLACEHOLDER
