apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy

# Pods labelled lares.egress-<zone> reach that zone with .2 or .3, every other pod keeps the node IP (ADR 0004)
metadata:
  name: egress-infra

spec:
  selectors:
    - podSelector:
        matchLabels:
          lares.egress-infra: "true"
  destinationCIDRs:
    - 192.168.5.0/24
  # Required by the CRD, ignored while egressGateways has entries
  egressGateway:
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: talos-dp-01
    egressIP: PLACEHOLDER
  # Each overlay injects .2 and .3 of its /24, bound to these workers' MACs (cluster/patches); each pod sticks to one
  egressGateways:
    - nodeSelector:
        matchLabels:
          kubernetes.io/hostname: talos-dp-01
      egressIP: PLACEHOLDER
    - nodeSelector:
        matchLabels:
          kubernetes.io/hostname: talos-dp-02
      egressIP: PLACEHOLDER

