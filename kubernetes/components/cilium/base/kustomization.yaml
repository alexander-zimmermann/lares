apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cilium
resources:
  - ./issuer.yaml
  - ./certificate.yaml
  - ./ingress-route.yaml
  - ./sealed-secret.yaml
  - ./bgp-cluster-config.yaml
  - ./bgp-peer-config.yaml
  - ./bgp-advertisement.yaml
  - ./bgp-lb-ip-pool.yaml
  - ./egress-gateway-policy.yaml
  - ./clusterwide-network-policy.yaml

labels:
  - includeSelectors: false
    pairs:
      lares.component: cilium

commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"
  argocd.argoproj.io/compare-options: ServerSideDiff=true
  argocd.argoproj.io/sync-options: ServerSideApply=true
  # Overlay also renders the bootstrap directory, so track it for change detection
  argocd.argoproj.io/manifest-generate-paths: ../..;/kubernetes/bootstrap/cilium
