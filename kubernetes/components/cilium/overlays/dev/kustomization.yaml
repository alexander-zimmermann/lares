apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../../../bootstrap/cilium/overlays/dev/

replacements:
  # Inject domain name into the Certificate and IngressRoute
  - sourceValue: hubble.zimmermann.phd
    targets:
      - select:
          kind: Certificate
          name: hubble-tls-cert
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: IngressRoute
          name: hubble
        fieldPaths:
          - spec.routes.0.match
        options:
          delimiter: "`"
          index: 1
      - select:
          kind: IngressRoute
          name: hubble
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: "//"
          index: 1

  # Inject the LoadBalancer pool: dev's /24 is prod's VLAN 10 plus 100, same `.200`-`.254` block as prod
  - sourceValue: 192.168.110.200
    targets:
      - select:
          kind: CiliumLoadBalancerIPPool
          name: default-bgp-ip-pool
        fieldPaths:
          - spec.blocks.0.start
  - sourceValue: 192.168.110.254
    targets:
      - select:
          kind: CiliumLoadBalancerIPPool
          name: default-bgp-ip-pool
        fieldPaths:
          - spec.blocks.0.stop

  # Inject the egress IPs: dev's /24 is prod's VLAN 10 plus 100, same `.2` and `.3` as prod
  - sourceValue: 192.168.110.2
    targets:
      - select:
          kind: CiliumEgressGatewayPolicy
        fieldPaths:
          - spec.egressGateway.egressIP
      - select:
          kind: CiliumEgressGatewayPolicy
        reject:
          - name: egress-traefik
        fieldPaths:
          - spec.egressGateways.0.egressIP
  - sourceValue: 192.168.110.3
    targets:
      - select:
          kind: CiliumEgressGatewayPolicy
        reject:
          - name: egress-traefik
        fieldPaths:
          - spec.egressGateways.1.egressIP

  # Authentik host the caged agents and Open WebUI may call for OIDC and JWKS
  - sourceValue: auth.zimmermann.phd
    targets:
      - select:
          kind: CiliumClusterwideNetworkPolicy
          name: agent-cage
        fieldPaths:
          - spec.egress.*.toFQDNs.[matchName=PLACEHOLDER_AUTH_HOST].matchName
      - select:
          kind: CiliumClusterwideNetworkPolicy
          name: open-webui-cage
        fieldPaths:
          - spec.egress.*.toFQDNs.[matchName=PLACEHOLDER_AUTH_HOST].matchName

  # Rewrite external-dns target annotation to dev UDM Pro
  - sourceValue: udm-pro.zimmermann.phd
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - metadata.annotations.[external-dns.kubernetes.io/target]
