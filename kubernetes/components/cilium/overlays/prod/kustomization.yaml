apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../../../bootstrap/cilium/overlays/prod/

replacements:
  # Inject domain name into the Certificate and IngressRoute
  - sourceValue: hubble.zimmermann.sh
    targets:
      - select:
          kind: Certificate
          name: hubble-tls-cert
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: IngressRoute
          name: hubble
        fieldPaths:
          - spec.routes.0.match
        options:
          delimiter: "`"
          index: 1
      - select:
          kind: IngressRoute
          name: hubble
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: "//"
          index: 1

  # Inject the LoadBalancer pool: the `.200`-`.254` special-purpose block of VLAN 10
  - sourceValue: 192.168.10.200
    targets:
      - select:
          kind: CiliumLoadBalancerIPPool
          name: default-bgp-ip-pool
        fieldPaths:
          - spec.blocks.0.start
  - sourceValue: 192.168.10.254
    targets:
      - select:
          kind: CiliumLoadBalancerIPPool
          name: default-bgp-ip-pool
        fieldPaths:
          - spec.blocks.0.stop

  # Authentik host the caged agents may call for OIDC and JWKS
  - sourceValue: auth.zimmermann.sh
    targets:
      - select:
          kind: CiliumClusterwideNetworkPolicy
          name: agent-cage
        fieldPaths:
          - spec.egress.*.toFQDNs.[matchName=PLACEHOLDER_AUTH_HOST].matchName

  # Rewrite external-dns target annotation to prod UDM Pro
  - sourceValue: udm-pro.zimmermann.sh
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]
