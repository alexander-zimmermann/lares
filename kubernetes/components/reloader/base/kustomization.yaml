apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: reloader
resources:
  - ./namespace.yaml

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    releaseName: reloader
    version: 2.2.18
    valuesFile: values.yaml
    namespace: reloader

patches:
  # The chart stamps release=reloader on every object; the PodMonitor carries the Prometheus Operator opt-in label instead
  - target:
      kind: PodMonitor
      name: reloader
    patch: |-
      - op: test
        path: /metadata/labels/release
        value: reloader
      - op: replace
        path: /metadata/labels/release
        value: prometheus

labels:
  - includeSelectors: false
    pairs:
      homelab.component: reloader

commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"
