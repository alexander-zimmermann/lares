# Use a stable, short name for all rendered resources
fullnameOverride: reloader

reloader:
  # Secrets only: a ConfigMap change rolls its workload through the kustomize content-hash name
  ignoreConfigMaps: true
  # Stamps the pod template with an annotation Argo CD does not track, so a reload leaves no drift
  reloadStrategy: annotations

  # Prometheus Monitoring (opt-in label set in kustomization.yaml)
  podMonitor:
    enabled: true
