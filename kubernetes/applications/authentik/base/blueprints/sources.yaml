version: 1
metadata:
  name: homelab-sources
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # OAuth Source: redirects users to GitHub for authentication; household.yaml lists it on the login page
  - model: authentik_sources_oauth.oauthsource
    state: present
    identifiers:
      slug: github
    attrs:
      name: GitHub
      slug: github
      provider_type: github
      consumer_key: !Env AUTHENTIK_GITHUB_CLIENT_ID
      consumer_secret: !Env AUTHENTIK_GITHUB_CLIENT_SECRET
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      # No enrollment flow: GitHub signs in existing accounts, it does not create them.
      # Explicitly null rather than omitted — blueprints leave unlisted attrs untouched.
      enrollment_flow: null
      enabled: true

  # Expression Policy: denies login if the GitHub account does not have 2FA enabled
  - model: authentik_policies_expression.expressionpolicy
    state: present
    identifiers:
      name: github-require-2fa
    attrs:
      name: github-require-2fa
      # Passing runs land in the event log too, not only failures
      execution_logging: true
      expression: |
        userinfo = context.get("oauth_userinfo", {})
        if not userinfo.get("two_factor_authentication", False):
            ak_message("GitHub 2FA must be enabled to log in.")
            return False
        return True

  # Source bindings never run at sign-in, so the 2FA policy is not bound to the source
  - model: authentik_policies.policybinding
    state: absent
    identifiers:
      target: !Find [authentik_sources_oauth.oauthsource, [slug, github]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, github-require-2fa]]
      order: 0

  # Source flow: every bound policy must pass, else the SSO check alone admits the sign-in
  - model: authentik_flows.flow
    state: present
    id: source-authentication
    identifiers:
      slug: default-source-authentication
    attrs:
      policy_engine_mode: all

  # Policy Binding: the 2FA policy runs when a GitHub sign-in plans the source flow; !KeyOf, as !Find yields a flow's own key, not its binding key
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf source-authentication
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, github-require-2fa]]
      order: 10
    attrs:
      target: !KeyOf source-authentication
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, github-require-2fa]]
      order: 10
      enabled: true
