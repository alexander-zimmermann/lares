version: 1
metadata:
  name: forward-auth-proxy
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Generic Proxy Provider for Traefik ForwardAuth — shared across all internal services
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: forward-auth-proxy
    attrs:
      name: forward-auth-proxy
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_domain
      cookie_domain: !Env AUTHENTIK_COOKIE_DOMAIN
      external_host: !Env AUTHENTIK_HOST

  # Application entry in Authentik's app library
  - model: authentik_core.application
    state: present
    identifiers:
      slug: forward-auth-proxy
    attrs:
      name: forward-auth-proxy
      slug: forward-auth-proxy
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, forward-auth-proxy]]
      policy_engine_mode: any

  # Assign the proxy provider to the embedded outpost
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      name: authentik Embedded Outpost
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, forward-auth-proxy]]
      _config:
        authentik_host: !Env AUTHENTIK_HOST
        authentik_host_browser: !Env AUTHENTIK_HOST

  # Restrict the shared forward-auth gate to platform-admins. Without this binding
  # every account authentik knows passes the edge for all apps behind it.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, forward-auth-proxy]]
      group: !Find [authentik_core.group, [name, platform-admins]]
      order: 0
    attrs:
      enabled: true
