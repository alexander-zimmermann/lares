version: 1
metadata:
  name: claude-ai-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # OAuth2/OIDC Provider of the claude.ai connector, which signs in on the gateway's
  # public route; the gateway checks the tokens and hands out this client.
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: claude-ai
    attrs:
      name: claude-ai
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: claude-ai
      client_secret: !Env CLAUDE_AI_OIDC_CLIENT_SECRET
      # Explicit, because a provider created from a blueprint starts with an
      # empty grant list and then rejects the authorization code flow.
      grant_types:
        - authorization_code
        - refresh_token
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: hours=1
      refresh_token_validity: days=30
      redirect_uris:
        - matching_mode: strict
          url: !Env AUTHENTIK_CLAUDE_AI_REDIRECT_URI
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        # Without offline_access authentik issues no refresh token and the connector dies with the access token
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  # Application entry in Authentik's app library
  - model: authentik_core.application
    state: present
    identifiers:
      slug: claude-ai
    attrs:
      name: claude-ai
      slug: claude-ai
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, claude-ai]]
      policy_engine_mode: any

  # Restrict token issuance for this audience to platform-admins
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, claude-ai]]
      group: !Find [authentik_core.group, [name, platform-admins]]
      order: 0
    attrs:
      enabled: true
