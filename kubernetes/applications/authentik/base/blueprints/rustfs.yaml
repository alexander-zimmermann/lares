version: 1
metadata:
  name: rustfs-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # RustFS resolves each groups value against a policy of the same name, so the
  # claim carries RustFS' built-in policy names rather than Authentik group names.
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      managed: custom.homelab/scope-rustfs-policies
    attrs:
      name: "OAuth Mapping: RustFS policies"
      scope_name: groups
      description: "Maps platform-admins to the RustFS consoleAdmin policy"
      expression: |
        groups = [group.name for group in request.user.ak_groups.all()]
        return {"groups": ["consoleAdmin"] if "platform-admins" in groups else []}

  # OAuth2/OIDC Provider for the RustFS Console
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: RustFS
    attrs:
      name: RustFS
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Providers created after authentik migration 0032 default to an empty list,
      # which rejects every authorize request as invalid_request.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: rustfs
      client_secret: !Env RUSTFS_OIDC_CLIENT_SECRET
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Env AUTHENTIK_RUSTFS_REDIRECT_URI
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, custom.homelab/scope-rustfs-policies]]

  # Application entry in Authentik's app library
  - model: authentik_core.application
    state: present
    identifiers:
      slug: rustfs
    attrs:
      name: RustFS
      slug: rustfs
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, RustFS]]
      policy_engine_mode: any

  # Restrict RustFS Console access to platform-admins group
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, rustfs]]
      group: !Find [authentik_core.group, [name, platform-admins]]
      order: 0
    attrs:
      enabled: true
