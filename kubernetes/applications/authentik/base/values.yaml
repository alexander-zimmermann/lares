global:
  env:
    # Database password from a Secret created by the CloudNativePG Cluster
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db-app
          key: password
    # Authentik internal secret key (signing/encryption)
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-credentials
          key: AUTHENTIK_SECRET_KEY
    # Initial bootstrap admin password
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-credentials
          key: AUTHENTIK_BOOTSTRAP_PASSWORD
    # GitHub OAuth credentials for the homelab-sources blueprint
    - name: AUTHENTIK_GITHUB_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: authentik-github-source
          key: AUTHENTIK_GITHUB_CLIENT_ID
    - name: AUTHENTIK_GITHUB_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-github-source
          key: AUTHENTIK_GITHUB_CLIENT_SECRET
    # ArgoCD OIDC client secret for the argocd-oidc blueprint
    - name: ARGOCD_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: argocd-oidc-secret
          key: oidc.authentik.clientSecret
    # Grafana OIDC client secret for the grafana-oidc blueprint
    - name: GRAFANA_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: grafana-oidc-secret
          key: GRAFANA_OIDC_CLIENT_SECRET
    # Homepage API token for the homepage-api-token blueprint
    - name: AUTHENTIK_HOMEPAGE_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: authentik-homepage-token
          key: AUTHENTIK_HOMEPAGE_API_TOKEN
    # Node-RED OIDC client secret for the node-red-oidc blueprint
    - name: NODE_RED_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: node-red-oidc-secret
          key: NODE_RED_OIDC_CLIENT_SECRET
    # Wiki.js OIDC client secret for the wikijs-oidc blueprint
    - name: WIKIJS_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: wikijs-oidc-secret
          key: WIKIJS_OIDC_CLIENT_SECRET
    # iot-mcp-bridge OIDC client secret for the iot-mcp-bridge-oidc blueprint
    - name: IOT_MCP_BRIDGE_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: iot-mcp-bridge-oidc-secret
          key: IOT_MCP_BRIDGE_OIDC_CLIENT_SECRET
    # RustFS Console OIDC client secret for the rustfs-oidc blueprint
    - name: RUSTFS_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: rustfs-oidc-secret
          key: RUSTFS_OIDC_CLIENT_SECRET

    # Blueprint variables — injected per environment via overlay replacements
    - name: AUTHENTIK_ARGOCD_REDIRECT_URI
      value: https://PLACEHOLDER_ARGOCD_HOST/auth/callback
    - name: AUTHENTIK_GRAFANA_REDIRECT_URI
      value: https://PLACEHOLDER_GRAFANA_HOST/login/generic_oauth
    - name: AUTHENTIK_COOKIE_DOMAIN
      value: PLACEHOLDER_COOKIE_DOMAIN
    - name: AUTHENTIK_HOST
      value: https://PLACEHOLDER_AUTH_HOST
    - name: AUTHENTIK_NODE_RED_REDIRECT_URI
      value: https://PLACEHOLDER_NODE_RED_HOST/auth/strategy/callback/
    - name: AUTHENTIK_WIKIJS_REDIRECT_URI
      value: https://PLACEHOLDER_WIKIJS_HOST/login/b7746d63-71b4-47c1-bd32-903833a0a8ca/callback
    - name: AUTHENTIK_RUSTFS_REDIRECT_URI
      value: https://PLACEHOLDER_RUSTFS_HOST/rustfs/admin/v3/oidc/callback/default
    - name: ANTHROPIC_OAUTH_REDIRECT_URI
      value: https://claude.ai/api/mcp/auth_callback

    # Optimization: Fewer workers and no preloading saves RAM in small setups
    - name: AUTHENTIK_WEB__WORKERS
      value: "1"
    - name: AUTHENTIK_WEB__PRELOAD
      value: "false"
    - name: AUTHENTIK_WORKER__WORKERS
      value: "1"
    - name: AUTHENTIK_WORKER__PREFETCH_MULTIPLIER
      value: "1"
    - name: AUTHENTIK_WORKER__MAX_MEMORY_PER_CHILD
      value: "300000" # ~300 MiB limit per process
    - name: AUTHENTIK_EVENTS__RETENTION_DAYS
      value: "14"

authentik:
  # SMTP configuration for notifications and password resets
  email:
    host: smtprelay.smtprelay.svc.cluster.local
    port: 25
    from: "Authentik <admin@zimmermann.sh>"

  # PostgreSQL connection settings (external DB via CloudNativePG)
  postgresql:
    host: "{{ .Release.Name }}-db-rw"

blueprints:
  # ConfigMaps containing Authentik blueprint YAMLs (generated by kustomize configMapGenerator)
  configMaps:
    - authentik-blueprint-sources
    - authentik-blueprint-groups
    - authentik-blueprint-forward-auth
    - authentik-blueprint-argocd
    - authentik-blueprint-homepage
    - authentik-blueprint-grafana
    - authentik-blueprint-node-red
    - authentik-blueprint-wikijs
    - authentik-blueprint-iot-mcp-bridge
    - authentik-blueprint-rustfs

server:
  # Expose Authentik service via Cilium/BGP-announced LoadBalancer
  service:
    type: LoadBalancer
    labels:
      bgp.cilium.io/ip-pool: default
      bgp.cilium.io/advertise-service: default

  metrics:
    enabled: true
    # Prometheus Monitoring
    serviceMonitor:
      enabled: true
      # Prometheus Operator label (Opt-In)
      labels:
        release: prometheus
