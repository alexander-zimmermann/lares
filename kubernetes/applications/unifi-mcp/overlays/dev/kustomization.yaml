apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # One Python process each, ~115 MiB idle; the controller's data and the event buffer come on top.
  - target:
      kind: Deployment
      name: unifi-network-mcp
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: unifi-network-mcp
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi

  - target:
      kind: Deployment
      name: unifi-protect-mcp
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: unifi-protect-mcp
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
