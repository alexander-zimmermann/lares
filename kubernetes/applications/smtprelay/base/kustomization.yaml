apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smtprelay
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: smtprelay
    version: 7.0.0
    valuesFile: values.yaml
    namespace: smtprelay

configMapGenerator:
  - name: smtprelay-config
    files:
      - config/smtprelay.ini

labels:
  - includeSelectors: false
    pairs:
      homelab.app: smtprelay

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
