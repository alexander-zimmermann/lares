apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replacements:
  # The connectors' public hostname in the Certificate and the IngressRoute Host(...) match.
  - sourceValue: mcp.zimmermann.sh
    targets:
      - select:
          kind: Certificate
          name: agentgateway-tls-cert
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: IngressRoute
          name: agentgateway
        fieldPaths:
          - spec.routes.0.match
        options:
          delimiter: "`"
          index: 1

  # Rewrite external-dns target annotation to the prod UDM Pro
  - sourceValue: udm-pro.zimmermann.sh
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - metadata.annotations.[external-dns.kubernetes.io/target]

patches:
  # One Rust process proxying a few calls a minute, no session state.
  - target:
      kind: Deployment
      name: agentgateway
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: agentgateway
      # The cluster's Authentik, which the connectors' issuer names
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AUTHENTIK_URL
          value: https://auth.zimmermann.sh
      # The agent platform's sampling ratio, which the rendered routes name
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TRACING_SAMPLING_RATIO
          value: "1.0"
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 500m
            memory: 192Mi
