# One gateway in front of every tool server. Its routes come from the ConfigMap
# agentgateway-routes, their keys from the SealedSecret agentgateway-keys
# (config/routes.values.yaml); a renewed credential reloads without a restart.
nameOverride: agentgateway
fullnameOverride: agentgateway

# Caged by the CiliumClusterwideNetworkPolicy agent-cage (components/cilium)
podLabels:
  role: agent

gateway:
  service:
    type: ClusterIP
    ports:
      - name: mcp
        port: 8080
        targetPort: 8080
        protocol: TCP

# Prometheus Monitoring (opt-in label)
monitoring:
  enabled: true
  extraLabels:
    release: prometheus

# The settings it reads at start; the routes file brings the rest
config:
  config:
    logging:
      format: json
