# One gateway in front of every tool server and of OpenAI's transcriptions. Its
# routes come from the ConfigMap agentgateway-routes, every profile's key from
# hermes-credentials, a server's credential from that server's Secret cloned here
# by Kyverno, and a hosted vendor's token, OpenAI's key and Open WebUI's key from
# agentgateway-keys (config/routes.values.yaml). A renewed credential reloads
# without a restart; a resealed key rolls the gateway, as does any change to
# agentgateway-keys.
nameOverride: agentgateway
fullnameOverride: agentgateway

# Caged by the CiliumClusterwideNetworkPolicy agent-cage (components/cilium)
podLabels:
  role: agent

gateway:
  service:
    type: ClusterIP
    ports:
      - name: mcp
        port: 8080
        targetPort: 8080
        protocol: TCP

# Prometheus Monitoring (opt-in label)
monitoring:
  enabled: true
  extraLabels:
    release: prometheus

# The settings it reads at start; the routes file brings the rest
config:
  config:
    logging:
      format: json
