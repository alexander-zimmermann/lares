# generated by `task agents:create-harness-config`, do not edit
# The gateway's routes. A key is a variable the gateway expands at start, set from
# agentgateway-keys, as is a connector's issuer; a credential is a file it reads
# and watches.
frontendPolicies:
  tracing:
    host: alloy-alloy-receiver.alloy.svc.cluster.local:4318
    protocol: http
    randomSampling: '1.0'
binds:
  - port: 8080
    listeners:
      - routes:
          - name: lares
            matches:
              - path:
                  exact: /mcp/lares
            policies:
              apiKey:
                mode: strict
                keys:
                  - key: ${LARES_GATEWAY_KEY}
                  - key: ${AZ1003_LARES_GATEWAY_KEY}
                    metadata:
                      enduser_id: az1003
              mcpAuthorization:
                rules:
                  - mcp.tool.name.startsWith("list_")
                  - mcp.tool.name == "get_schema"
                  - mcp.tool.name == "get_forecast"
                  - mcp.tool.name == "get_pv_forecast"
                  - mcp.tool.name == "get_weather_forecast"
                  - mcp.tool.name == "get_episode"
                  - mcp.tool.name == "get_current_state"
                  - mcp.tool.name == "get_current_knx"
                  - mcp.tool.name == "get_wiki_page"
                  - mcp.tool.name.startsWith("query_")
                  - mcp.tool.name == "correlate_events"
                  - mcp.tool.name == "search_wiki"
                  - mcp.tool.name == "backtest_fault"
              backendAuth:
                key:
                  value:
                    file: /etc/agentgateway/credentials/agentgateway-keys/lares-mcp-bridge
            backends:
              - mcp:
                  statefulMode: stateless
                  targets:
                    - name: lares
                      mcp:
                        host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                      policies:
                        transformations:
                          request:
                            set:
                              X-Client-Id: '"lares"'
                              X-Enduser-Id: apiKey.enduser_id
          - name: lares-runs
            matches:
              - path:
                  exact: /mcp/lares-runs
            policies:
              apiKey:
                mode: strict
                keys:
                  - key: ${AZ1003_LARES_RUNS_GATEWAY_KEY}
                    metadata:
                      enduser_id: az1003
              mcpAuthorization:
                rules:
                  - mcp.tool.name == "start_run"
              backendAuth:
                key:
                  value:
                    file: /etc/agentgateway/credentials/agentgateway-keys/lares-mcp-bridge
            backends:
              - mcp:
                  statefulMode: stateless
                  targets:
                    - name: lares-runs
                      mcp:
                        host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                      policies:
                        transformations:
                          request:
                            set:
                              X-Client-Id: '"lares-runs"'
                              X-Enduser-Id: apiKey.enduser_id
          - name: lares-memory
            matches:
              - path:
                  exact: /mcp/lares-memory
            policies:
              apiKey:
                mode: strict
                keys:
                  - key: ${LARES_MEMORY_GATEWAY_KEY}
              mcpAuthorization:
                rules:
                  - mcp.tool.name == "get_memory"
                  - mcp.tool.name == "append_memory"
              backendAuth:
                key:
                  value:
                    file: /etc/agentgateway/credentials/agentgateway-keys/lares-mcp-bridge
            backends:
              - mcp:
                  statefulMode: stateless
                  targets:
                    - name: lares-memory
                      mcp:
                        host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                      policies:
                        transformations:
                          request:
                            set:
                              X-Client-Id: '"lares-memory"'
                              X-Enduser-Id: apiKey.enduser_id
          - name: github
            matches:
              - path:
                  exact: /mcp/github
            policies:
              apiKey:
                mode: strict
                keys:
                  - key: ${GITHUB_GATEWAY_KEY}
                  - key: ${AZ1003_GITHUB_GATEWAY_KEY}
                    metadata:
                      enduser_id: az1003
              mcpAuthorization:
                rules:
                  - mcp.tool.name.startsWith("get_")
                  - mcp.tool.name.startsWith("list_")
                  - mcp.tool.name.startsWith("search_")
                  - mcp.tool.name == "issue_read"
                  - mcp.tool.name == "pull_request_read"
              backendAuth:
                key:
                  value:
                    file: /etc/agentgateway/credentials/github-mcp-server-token/token
            backends:
              - mcp:
                  statefulMode: stateless
                  targets:
                    - name: github
                      mcp:
                        host: http://github-mcp-server.agents.svc.cluster.local:8082/mcp
                      policies:
                        transformations:
                          request:
                            set:
                              X-Client-Id: '"github"'
                              X-Enduser-Id: apiKey.enduser_id
          - name: claude-ai
            matches:
              - path:
                  exact: /mcp
              - path:
                  exact: /.well-known/oauth-protected-resource/mcp
              - path:
                  exact: /.well-known/oauth-authorization-server/mcp
              - path:
                  exact: /.well-known/oauth-authorization-server/mcp/client-registration
            policies:
              mcpAuthentication:
                issuer: ${AUTHENTIK_URL}/application/o/lares-mcp-bridge/
                audiences:
                  - lares-mcp-bridge
                provider:
                  authentik: {}
                clientId: lares-mcp-bridge
                resourceMetadata:
                  scopesSupported:
                    - openid
                    - profile
                    - email
                    - offline_access
                  bearerMethodsSupported:
                    - header
              mcpAuthorization:
                rules:
                  - mcp.tool.name.startsWith("")
              backendAuth:
                key:
                  value:
                    file: /etc/agentgateway/credentials/agentgateway-keys/lares-mcp-bridge
            backends:
              - mcp:
                  statefulMode: stateless
                  targets:
                    - name: claude-ai
                      mcp:
                        host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                      policies:
                        transformations:
                          request:
                            set:
                              X-Client-Id: '"claude-ai"'
                              X-Enduser-Id: jwt.preferred_username
                policies:
                  authorization:
                    rules:
                      - jwt.preferred_username in ["az1003"]
