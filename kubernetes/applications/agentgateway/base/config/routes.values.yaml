# generated by `task agents:create-harness-config`, do not edit
# An additional values file of the gateway's chart: the routes' keys as variables, and
# the routes and every credential they attach, mounted whole so a renewed one
# reaches the gateway; a resealed key rolls it.
config:
  config:
    localXdsPath: /etc/agentgateway/routes/config.yaml
podAnnotations:
  secret.reloader.stakater.com/reload: agentgateway-keys
extraEnv:
  - name: LARES_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: agentgateway-keys
        key: lares-gateway-key
  - name: AZ1003_LARES_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: agentgateway-keys
        key: az1003-lares-gateway-key
  - name: AZ1003_LARES_RUNS_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: agentgateway-keys
        key: az1003-lares-runs-gateway-key
  - name: LARES_MEMORY_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: agentgateway-keys
        key: lares-memory-gateway-key
  - name: GITHUB_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: agentgateway-keys
        key: github-gateway-key
  - name: AZ1003_GITHUB_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: agentgateway-keys
        key: az1003-github-gateway-key
extraVolumes:
  - name: routes
    configMap:
      name: agentgateway-routes
  - name: agentgateway-keys
    secret:
      secretName: agentgateway-keys
      items:
        - key: lares-mcp-bridge
          path: lares-mcp-bridge
  - name: github-mcp-server-token
    secret:
      secretName: github-mcp-server-token
      items:
        - key: token
          path: token
extraVolumeMounts:
  - name: routes
    mountPath: /etc/agentgateway/routes
    readOnly: true
  - name: agentgateway-keys
    mountPath: /etc/agentgateway/credentials/agentgateway-keys
    readOnly: true
  - name: github-mcp-server-token
    mountPath: /etc/agentgateway/credentials/github-mcp-server-token
    readOnly: true
