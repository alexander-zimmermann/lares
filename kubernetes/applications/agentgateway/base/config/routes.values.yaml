# generated by `task agents:create-harness-config`, do not edit
# An additional values file of the gateway's chart: the routes' keys as variables, and
# the routes and every credential they attach, mounted whole so a renewed one
# reaches the gateway; a resealed key rolls it.
config:
  config:
    localXdsPath: /etc/agentgateway/routes/config.yaml
podAnnotations:
  secret.reloader.stakater.com/reload: hermes-credentials
extraEnv:
  - name: GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: gateway-key
  - name: AZ1003_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: az1003-gateway-key
  - name: GZ1410_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: gz1410-gateway-key
  - name: LZ1410_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: lz1410-gateway-key
  - name: VZ1604_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: vz1604-gateway-key
extraVolumes:
  - name: routes
    configMap:
      name: agentgateway-routes
  - name: lares-mcp-bridge-gateway-key
    secret:
      secretName: lares-mcp-bridge-gateway-key
      items:
        - key: key
          path: key
  - name: github-mcp-server-token
    secret:
      secretName: github-mcp-server-token
      items:
        - key: token
          path: token
  - name: grafana-mcp-gateway-key
    secret:
      secretName: grafana-mcp-gateway-key
      items:
        - key: key
          path: key
  - name: agentgateway-keys
    secret:
      secretName: agentgateway-keys
      items:
        - key: cloudflare-mcp-token
          path: cloudflare-mcp-token
extraVolumeMounts:
  - name: routes
    mountPath: /etc/agentgateway/routes
    readOnly: true
  - name: lares-mcp-bridge-gateway-key
    mountPath: /etc/agentgateway/credentials/lares-mcp-bridge-gateway-key
    readOnly: true
  - name: github-mcp-server-token
    mountPath: /etc/agentgateway/credentials/github-mcp-server-token
    readOnly: true
  - name: grafana-mcp-gateway-key
    mountPath: /etc/agentgateway/credentials/grafana-mcp-gateway-key
    readOnly: true
  - name: agentgateway-keys
    mountPath: /etc/agentgateway/credentials/agentgateway-keys
    readOnly: true
