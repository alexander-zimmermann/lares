# generated by `task agents:create-harness-config`, do not edit
# An additional values file of the gateway's chart: its routes, which the chart joins
# to lares's own settings in one config file, the routes' keys as variables, and every
# credential they attach, mounted whole so a renewed one reaches the gateway. A key is
# a variable the gateway expands at start, set from hermes-credentials or a speech
# client's Secret, as is a connector's issuer; a resealed key rolls the gateway, a
# changed route reloads without a restart.
config:
  frontendPolicies:
    tracing:
      host: alloy-alloy-receiver.alloy.svc.cluster.local:4318
      protocol: http
      randomSampling: ${TRACING_SAMPLING_RATIO}
      attributes:
        enduser.id: default(apiKey.enduser_id, jwt.preferred_username)
  gateways:
    default:
      port: 8080
  routes:
    - name: lares
      matches:
        - path:
            exact: /mcp/lares
      policies:
        apiKey:
          mode: strict
          keys:
            - key: ${GATEWAY_KEY}
            - key: ${AZ1003_GATEWAY_KEY}
              metadata:
                enduser_id: az1003
            - key: ${GZ1410_GATEWAY_KEY}
              metadata:
                enduser_id: gz1410
            - key: ${LZ1410_GATEWAY_KEY}
              metadata:
                enduser_id: lz1410
            - key: ${VZ1604_GATEWAY_KEY}
              metadata:
                enduser_id: vz1604
        mcpAuthorization:
          rules:
            - mcp.tool.name.startsWith("list_")
            - mcp.tool.name == "get_schema"
            - mcp.tool.name == "get_forecast"
            - mcp.tool.name == "get_pv_forecast"
            - mcp.tool.name == "get_weather_forecast"
            - mcp.tool.name == "get_episode"
            - mcp.tool.name == "get_current_state"
            - mcp.tool.name == "get_current_knx"
            - mcp.tool.name == "get_wiki_page"
            - mcp.tool.name.startsWith("query_")
            - mcp.tool.name == "correlate_events"
            - mcp.tool.name == "search_wiki"
            - mcp.tool.name == "backtest_fault"
        backendAuth:
          key:
            value:
              file: /etc/agentgateway/credentials/lares-mcp-bridge-gateway-key/key
      backends:
        - mcp:
            statefulMode: stateless
            targets:
              - name: lares
                mcp:
                  host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                policies:
                  http:
                    requestTimeout: 60s
                  transformations:
                    request:
                      set:
                        X-Client-Id: '"lares"'
                        X-Enduser-Id: apiKey.enduser_id
    - name: lares-runs
      matches:
        - path:
            exact: /mcp/lares-runs
      policies:
        apiKey:
          mode: strict
          keys:
            - key: ${AZ1003_GATEWAY_KEY}
              metadata:
                enduser_id: az1003
        mcpAuthorization:
          rules:
            - mcp.tool.name == "start_run"
        backendAuth:
          key:
            value:
              file: /etc/agentgateway/credentials/lares-mcp-bridge-gateway-key/key
      backends:
        - mcp:
            statefulMode: stateless
            targets:
              - name: lares-runs
                mcp:
                  host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                policies:
                  http:
                    requestTimeout: 30s
                  transformations:
                    request:
                      set:
                        X-Client-Id: '"lares-runs"'
                        X-Enduser-Id: apiKey.enduser_id
    - name: lares-memory
      matches:
        - path:
            exact: /mcp/lares-memory
      policies:
        apiKey:
          mode: strict
          keys:
            - key: ${GATEWAY_KEY}
        mcpAuthorization:
          rules:
            - mcp.tool.name == "get_memory"
            - mcp.tool.name == "append_memory"
        backendAuth:
          key:
            value:
              file: /etc/agentgateway/credentials/lares-mcp-bridge-gateway-key/key
      backends:
        - mcp:
            statefulMode: stateless
            targets:
              - name: lares-memory
                mcp:
                  host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                policies:
                  http:
                    requestTimeout: 30s
                  transformations:
                    request:
                      set:
                        X-Client-Id: '"lares-memory"'
                        X-Enduser-Id: apiKey.enduser_id
    - name: github
      matches:
        - path:
            exact: /mcp/github
      policies:
        apiKey:
          mode: strict
          keys:
            - key: ${GATEWAY_KEY}
            - key: ${AZ1003_GATEWAY_KEY}
              metadata:
                enduser_id: az1003
        mcpAuthorization:
          rules:
            - mcp.tool.name.startsWith("get_")
            - mcp.tool.name.startsWith("list_")
            - mcp.tool.name.startsWith("search_")
            - mcp.tool.name == "issue_read"
            - mcp.tool.name == "pull_request_read"
        backendAuth:
          key:
            value:
              file: /etc/agentgateway/credentials/github-mcp-server-token/token
      backends:
        - mcp:
            statefulMode: stateless
            targets:
              - name: github
                mcp:
                  host: http://github-mcp-server.agents.svc.cluster.local:8082/mcp
                policies:
                  http:
                    requestTimeout: 60s
                  transformations:
                    request:
                      set:
                        X-Client-Id: '"github"'
                        X-Enduser-Id: apiKey.enduser_id
    - name: grafana
      matches:
        - path:
            exact: /mcp/grafana
      policies:
        apiKey:
          mode: strict
          keys:
            - key: ${AZ1003_GATEWAY_KEY}
              metadata:
                enduser_id: az1003
        mcpAuthorization:
          rules:
            - mcp.tool.name == "list_datasources"
            - mcp.tool.name == "query_prometheus"
            - mcp.tool.name == "list_prometheus_metric_names"
            - mcp.tool.name == "list_prometheus_label_values"
            - mcp.tool.name == "query_loki_logs"
            - mcp.tool.name == "query_loki_stats"
            - mcp.tool.name == "list_loki_label_values"
            - mcp.tool.name == "search_tempo_traces"
            - mcp.tool.name == "get_tempo_trace"
            - mcp.tool.name == "alerting_rules_read"
            - mcp.tool.name == "alerting_silences_read"
            - mcp.tool.name == "search_dashboards"
            - mcp.tool.name == "get_dashboard_panel_queries"
        backendAuth:
          key:
            value:
              file: /etc/agentgateway/credentials/grafana-mcp-gateway-key/key
      backends:
        - mcp:
            statefulMode: stateless
            targets:
              - name: grafana
                mcp:
                  host: http://grafana-mcp.grafana.svc.cluster.local:8000/mcp
                policies:
                  http:
                    requestTimeout: 60s
                  transformations:
                    request:
                      set:
                        X-Client-Id: '"grafana"'
                        X-Enduser-Id: apiKey.enduser_id
    - name: cloudflare
      matches:
        - path:
            exact: /mcp/cloudflare
      policies:
        apiKey:
          mode: strict
          keys:
            - key: ${AZ1003_GATEWAY_KEY}
              metadata:
                enduser_id: az1003
        mcpAuthorization:
          rules:
            - mcp.tool.name == "search"
            - mcp.tool.name == "execute"
            - mcp.tool.name == "docs"
            - mcp.tool.name == "whoami"
        backendAuth:
          key:
            value:
              file: /etc/agentgateway/credentials/agentgateway-keys/cloudflare-mcp-token
      backends:
        - mcp:
            statefulMode: stateless
            targets:
              - name: cloudflare
                mcp:
                  host: https://mcp.cloudflare.com/mcp
                policies:
                  http:
                    requestTimeout: 60s
    - name: unifi-network
      matches:
        - path:
            exact: /mcp/unifi-network
      policies:
        apiKey:
          mode: strict
          keys:
            - key: ${AZ1003_GATEWAY_KEY}
              metadata:
                enduser_id: az1003
        mcpAuthorization:
          rules:
            - mcp.tool.name == "unifi_list_clients"
            - mcp.tool.name == "unifi_get_client_details"
            - mcp.tool.name == "unifi_get_client_wifi_details"
            - mcp.tool.name == "unifi_list_devices"
            - mcp.tool.name == "unifi_get_device_details"
            - mcp.tool.name == "unifi_list_events"
            - mcp.tool.name == "unifi_get_event_types"
            - mcp.tool.name == "unifi_list_alarms"
            - mcp.tool.name == "unifi_list_networks"
            - mcp.tool.name == "unifi_list_wlans"
            - mcp.tool.name == "unifi_get_network_health"
            - mcp.tool.name == "unifi_get_system_info"
            - mcp.tool.name == "unifi_get_device_stats"
            - mcp.tool.name == "unifi_get_client_stats"
            - mcp.tool.name == "unifi_get_top_clients"
            - mcp.tool.name == "unifi_get_gateway_stats"
            - mcp.tool.name == "unifi_get_ips_events"
        backendAuth:
          key:
            value:
              file: /etc/agentgateway/credentials/unifi-mcp-gateway-key/key
      backends:
        - mcp:
            statefulMode: stateless
            targets:
              - name: unifi-network
                mcp:
                  host: http://unifi-network-mcp.unifi-mcp.svc.cluster.local:3000/mcp
                policies:
                  http:
                    requestTimeout: 60s
                  transformations:
                    request:
                      set:
                        X-Client-Id: '"unifi-network"'
                        X-Enduser-Id: apiKey.enduser_id
    - name: unifi-protect
      matches:
        - path:
            exact: /mcp/unifi-protect
      policies:
        apiKey:
          mode: strict
          keys:
            - key: ${AZ1003_GATEWAY_KEY}
              metadata:
                enduser_id: az1003
        mcpAuthorization:
          rules:
            - mcp.tool.name == "protect_list_cameras"
            - mcp.tool.name == "protect_get_camera"
            - mcp.tool.name == "protect_get_camera_analytics"
            - mcp.tool.name == "protect_list_events"
            - mcp.tool.name == "protect_get_event"
            - mcp.tool.name == "protect_list_smart_detections"
            - mcp.tool.name == "protect_list_sensors"
            - mcp.tool.name == "protect_list_lights"
            - mcp.tool.name == "protect_list_chimes"
            - mcp.tool.name == "protect_get_system_info"
            - mcp.tool.name == "protect_get_health"
            - mcp.tool.name == "protect_get_firmware_status"
            - mcp.tool.name == "protect_list_viewers"
        backendAuth:
          key:
            value:
              file: /etc/agentgateway/credentials/unifi-mcp-gateway-key/key
      backends:
        - mcp:
            statefulMode: stateless
            targets:
              - name: unifi-protect
                mcp:
                  host: http://unifi-protect-mcp.unifi-mcp.svc.cluster.local:3000/mcp
                policies:
                  http:
                    requestTimeout: 60s
                  transformations:
                    request:
                      set:
                        X-Client-Id: '"unifi-protect"'
                        X-Enduser-Id: apiKey.enduser_id
    - name: claude-ai
      matches:
        - path:
            exact: /mcp
        - path:
            exact: /.well-known/oauth-protected-resource/mcp
        - path:
            exact: /.well-known/oauth-authorization-server/mcp
        - path:
            exact: /.well-known/oauth-authorization-server/mcp/client-registration
      policies:
        mcpAuthentication:
          issuer: ${AUTHENTIK_URL}/application/o/claude-ai/
          audiences:
            - claude-ai
          provider:
            authentik: {}
          clientId: claude-ai
          resourceMetadata:
            scopesSupported:
              - openid
              - profile
              - email
              - offline_access
            bearerMethodsSupported:
              - header
        mcpAuthorization:
          rules:
            - mcp.tool.name.startsWith("")
        backendAuth:
          key:
            value:
              file: /etc/agentgateway/credentials/lares-mcp-bridge-gateway-key/key
      backends:
        - mcp:
            statefulMode: stateless
            targets:
              - name: claude-ai
                mcp:
                  host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                policies:
                  http:
                    requestTimeout: 60s
                  transformations:
                    request:
                      set:
                        X-Client-Id: '"claude-ai"'
                        X-Enduser-Id: jwt.preferred_username
          policies:
            authorization:
              rules:
                - jwt.preferred_username in ["az1003"]
    - name: speech
      matches:
        - path:
            exact: /v1/audio/transcriptions
      policies:
        apiKey:
          mode: strict
          keys:
            - key: ${GATEWAY_KEY}
            - key: ${AZ1003_GATEWAY_KEY}
              metadata:
                enduser_id: az1003
            - key: ${GZ1410_GATEWAY_KEY}
              metadata:
                enduser_id: gz1410
            - key: ${LZ1410_GATEWAY_KEY}
              metadata:
                enduser_id: lz1410
            - key: ${VZ1604_GATEWAY_KEY}
              metadata:
                enduser_id: vz1604
            - key: ${OPEN_WEBUI_GATEWAY_KEY}
              metadata:
                enduser_id: open-webui
        backendAuth:
          key:
            value:
              file: /etc/agentgateway/credentials/agentgateway-keys/openai-api-key
        ai:
          routes:
            /v1/audio/transcriptions: detect
      backends:
        - ai:
            name: openai
            provider:
              openAI: {}
            hostOverride: api.openai.com:443
            policies:
              backendTLS: {}
              http:
                requestTimeout: 60s
podAnnotations:
  secret.reloader.stakater.com/reload: hermes-credentials,agentgateway-keys
extraEnv:
  - name: GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: gateway-key
  - name: AZ1003_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: az1003-gateway-key
  - name: GZ1410_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: gz1410-gateway-key
  - name: LZ1410_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: lz1410-gateway-key
  - name: VZ1604_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: vz1604-gateway-key
  - name: OPEN_WEBUI_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: agentgateway-keys
        key: open-webui-gateway-key
extraVolumes:
  - name: lares-mcp-bridge-gateway-key
    secret:
      secretName: lares-mcp-bridge-gateway-key
      items:
        - key: key
          path: key
  - name: github-mcp-server-token
    secret:
      secretName: github-mcp-server-token
      items:
        - key: token
          path: token
  - name: grafana-mcp-gateway-key
    secret:
      secretName: grafana-mcp-gateway-key
      items:
        - key: key
          path: key
  - name: agentgateway-keys
    secret:
      secretName: agentgateway-keys
      items:
        - key: cloudflare-mcp-token
          path: cloudflare-mcp-token
        - key: openai-api-key
          path: openai-api-key
  - name: unifi-mcp-gateway-key
    secret:
      secretName: unifi-mcp-gateway-key
      items:
        - key: key
          path: key
extraVolumeMounts:
  - name: lares-mcp-bridge-gateway-key
    mountPath: /etc/agentgateway/credentials/lares-mcp-bridge-gateway-key
    readOnly: true
  - name: github-mcp-server-token
    mountPath: /etc/agentgateway/credentials/github-mcp-server-token
    readOnly: true
  - name: grafana-mcp-gateway-key
    mountPath: /etc/agentgateway/credentials/grafana-mcp-gateway-key
    readOnly: true
  - name: agentgateway-keys
    mountPath: /etc/agentgateway/credentials/agentgateway-keys
    readOnly: true
  - name: unifi-mcp-gateway-key
    mountPath: /etc/agentgateway/credentials/unifi-mcp-gateway-key
    readOnly: true
