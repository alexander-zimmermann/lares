apiVersion: cert-manager.io/v1
kind: Certificate

metadata:
  name: agentgateway-tls-cert
  namespace: agents

spec:
  secretName: agentgateway-tls-cert
  issuerRef:
    name: letsencrypt-dns01-issuer
    kind: ClusterIssuer
  dnsNames:
    - PLACEHOLDER

---
apiVersion: cert-manager.io/v1
kind: Certificate

metadata:
  name: agentgateway-ui-tls-cert
  namespace: agents

spec:
  secretName: agentgateway-ui-tls-cert
  issuerRef:
    name: letsencrypt-dns01-issuer
    kind: ClusterIssuer
  dnsNames:
    - PLACEHOLDER
