apiVersion: bitnami.com/v1alpha1
kind: SealedSecret

metadata:
  name: agentgateway-keys
  namespace: agents

spec:
  encryptedData:
    cloudflare-mcp-token: 
    open-webui-gateway-key: 
    openai-api-key: 
  template:
    metadata:
      name: agentgateway-keys
      namespace: agents
    type: Opaque

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret

metadata:
  name: agentgateway-oidc
  namespace: agents

spec:
  encryptedData:
    OIDC_COOKIE_SECRET: 
  template:
    metadata:
      annotations:
        reloader.stakater.com/match: "true"
      name: agentgateway-oidc
      namespace: agents
    type: Opaque
