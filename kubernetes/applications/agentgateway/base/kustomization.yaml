apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agents

# No namespace.yaml here: `agents` is created and owned by the hermes
# application at wave 12, and two ArgoCD apps rendering one Namespace would
# fight over its labels.
resources:
  - sealed-secret.yaml
  - certificate.yaml
  - middleware.yaml
  - ingress-route.yaml

helmCharts:
  - name: agentgateway-standalone
    repo: oci://ghcr.io/agentgateway/charts
    releaseName: agentgateway
    version: v1.7.0
    valuesFile: values.yaml
    # The routes as the chart's config, their keys as variables and each
    # credential they attach, mounted whole (task agents:create-harness-config)
    additionalValuesFiles:
      - config/routes.values.yaml
    namespace: agents
    apiVersions:
      - monitoring.coreos.com/v1

# Two variables the chart has no value for (its extraEnv is config/routes.values.yaml's):
# the UI shows the configuration and changes none, and its sign-in's client secret
# is the one Kyverno clones from authentik.
patches:
  - target:
      kind: Deployment
      name: agentgateway
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: agentgateway
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: UI_READ_ONLY
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AGENTGATEWAY_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: agentgateway-oidc-secret
              key: AGENTGATEWAY_OIDC_CLIENT_SECRET

labels:
  - includeSelectors: false
    pairs:
      homelab.app: agentgateway

# Wave 12 = beside hermes, which owns the namespace; after lares-mcp-bridge (11),
# whose key it attaches.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "12"
