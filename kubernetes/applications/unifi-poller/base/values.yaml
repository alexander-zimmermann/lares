applicationName: unpoller

deployment:
  enabled: true
  # ConfigMap uses a kustomize content-hash name, so a config change rolls the
  # pod natively. No Stakater Reloader controller in the cluster.
  reloadOnChange: false
  image:
    repository: ghcr.io/unpoller/unpoller
    tag: v5.2.2
    pullPolicy: IfNotPresent

  # unpoller is a static distroless binary that writes nothing to disk; run it
  # as the distroless nonroot user (65532) with a read-only root filesystem.
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    fsGroup: 65532

  env:
    TZ:
      value: Europe/Berlin

  volumes:
    config:
      configMap:
        name: unpoller-config
    unifi-creds:
      secret:
        secretName: unpoller-unifi-credentials

  volumeMounts:
    config:
      mountPath: /etc/unpoller/up.conf
      subPath: up.conf
    unifi-creds:
      mountPath: /etc/unifi-poller/secrets/unifi-api-key
      subPath: unifi-api-key

  ports:
    - containerPort: 9130
      name: metrics
      protocol: TCP

  livenessProbe:
    enabled: true
    httpGet:
      path: /metrics
      port: metrics
    initialDelaySeconds: 30
    periodSeconds: 60
  readinessProbe:
    enabled: true
    httpGet:
      path: /metrics
      port: metrics
    initialDelaySeconds: 10
    periodSeconds: 30

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 9130
      name: metrics
      protocol: TCP
      targetPort: metrics

serviceMonitor:
  enabled: true
  additionalLabels:
    # Prometheus Operator label (Opt-In)
    release: prometheus
  endpoints:
    - port: metrics
      interval: 60s
      path: /metrics
