apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: unifi-poller
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: unpoller
    version: 9.0.0
    valuesFile: values.yaml
    namespace: unifi-poller
    apiVersions:
      - monitoring.coreos.com/v1

# Content-hash suffix: a config change produces a new ConfigMap name, so the
# Deployment volume reference updates and ArgoCD rolls the pod natively.
configMapGenerator:
  - name: unpoller-config
    files:
      - up.conf=config/up.conf

labels:
  - includeSelectors: false
    pairs:
      homelab.app: unifi-poller

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
