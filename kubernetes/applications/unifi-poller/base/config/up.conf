[poller]
  debug = false
  quiet = false
  plugins = []
[prometheus]
  disable = false
  http_listen = "0.0.0.0:9130"
  report_errors = false
[loki]
  disable = false
  url = "http://loki-gateway.loki.svc:80"
  verify_ssl = false
[datadog]
  disable = true
[webserver]
  enable = false
[unifi]
  dynamic = false
[[unifi.controller]]
  url = "https://udm-pro.zimmermann.eu.com"
  # API key auth (exclusive of user/pass); resolved from the mounted secret file
  api_key = "file:///etc/unifi-poller/secrets/unifi-api-key"
  sites = ["all"]
  save_ids = false
  save_events = false
  save_alarms = false
  save_anomalies = false
  save_dpi = false
  save_rogue = false
  verify_ssl = false
