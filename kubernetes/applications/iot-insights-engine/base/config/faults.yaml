# The fault list: one sentence with a unit per entry, parameters in the
# channel's own unit, scope as a catalog query — never an address list.
# Check before shipping: task insights:validate-faults

faults:
  # Tracer fault: needs no model and exercises the whole chain.
  - name: channel_silence
    sentence: "Ein Kanal, der sonst regelmäßig sendet, schweigt länger als das
      Fünffache der Sendepause, die er sonst in 19 von 20 Fällen einhält."
    unit: "× der üblichen Sendepause"
    kind: silence
    parameters:
      gap_factor: 5
      # The pause is read at this quantile of the channel's own gaps: the
      # median sits inside an evening's switching, where nothing returns from.
      gap_quantile: 0.95
    scope:
      name_like: "%"
    target:
      # One severity address per matched main group, in its Zentral block.
      per_main_group: true

  - name: appliance_runtime
    sentence: "Ein Gerät zieht ununterbrochen länger Strom, als seine je Gerät
      erlaubte Laufzeit zulässt — vergessen eingeschaltet oder hängen geblieben."
    unit: "× der erlaubten Laufzeit"
    kind: duration
    parameters:
      # An hour counts as active when half its samples sit above the
      # standby valley baked into knx_appliance_1h.
      active_hour_fraction: 0.5
    scope:
      dpt: "7.012"
      name_like: "%.Stromwert"
      # By-design continuous loads, and the cooling appliances whose
      # compressor cycles faster than the hourly grid can resolve.
      exclude_name_like:
        - "%.Netzwerkschrank.%"
        - "%.Heizung.%"
        - "%.Kühlschrank.%"
        - "%.Gefrierschrank.%"
        - "%.Lüftung.%"
    devices:
      Garage.K1-L3.Entfeuchter:
        max_run_hours: 24
      Technikraum.K3-L3.Entfeuchter:
        max_run_hours: 24
      Vorratsraum.K1-L3.Entfeuchter:
        max_run_hours: 24
      Hauswirtschaftsraum.K1-L3.Entfeuchter:
        max_run_hours: 24
      Hauswirtschaftsraum.K3-L1.Trockner:
        max_run_hours: 4
      # Laundry days chain loads back to back for 10-13 h; only a run past
      # two of those in a row is a fault.
      Hauswirtschaftsraum.K4-L1.Waschmaschine:
        max_run_hours: 16
      Wohnzimmer.K4-L1.Ofen:
        max_run_hours: 8
      Küche.K4-L1.Geschirrspüler:
        max_run_hours: 4
      Küche.K5-L1.Haubenlüfter:
        max_run_hours: 3
      Küche.K9-L1.Backofen:
        max_run_hours: 4
      Küche.K10-L1.Tellerwärmer:
        max_run_hours: 3
      Küche.K12-L1.Mikrowelle:
        max_run_hours: 2
      Küche.K13-L1.Kaffeemaschine:
        max_run_hours: 3
      Küche.K14-L1.Dampfgarer:
        max_run_hours: 3
    target:
      # One severity address per device: the writer rules carry
      # anomaly.appliance_runtime.<ga-slug> to the Dauerbetrieb address.
      per_device: true

  - name: appliance_standby
    sentence: "Die Standby-Aufnahme eines Geräts liegt dauerhaft mehr als 40 mA
      über ihrem gesunden Wert — ein klemmendes Relais, keine Sparfrage."
    unit: "× der erlaubten Erhöhung"
    kind: drift
    # The idle draw in mA — the series this fault's CUSUM walks.
    signal: standby
    parameters:
      # A floor, not a noise band: nothing below it ever accumulates, so the
      # Vorratsraum's real 10 mA step cannot fire however long it stands.
      rise_ma: 40
      # How long a larger rise must stand: 60 mA fill this in a day, a stuck
      # relay drawing amps within the hour.
      budget_ma_h: 480
      # Standby is the quietest hour of the trailing day — an hourly floor is
      # the idle draw only in the hours the device does not run.
      window_hours: 24
      min_window_fraction: 0.8
    scope:
      # All 21 Stromwert channels: the continuous loads the runtime fault
      # excludes have a standby level too, and a relay sticks on any of them.
      dpt: "7.012"
      name_like: "%.Stromwert"
    references:
      # Each device's healthy standby, read once off 30 days of daily floors
      # and written here: a reference the detector derives for itself would
      # adopt a fault that has stood for months as the new normal.
      Garage.K1-L3.Entfeuchter:
        healthy_ma: 0
      Technikraum.K1-L1.Heizung:
        healthy_ma: 0
      Technikraum.K1-L2.Heizung:
        healthy_ma: 96
      # The cabinet's own load swings ±35 mA around this, the narrowest
      # headroom of the 21 — the first device to revisit if it cries wolf.
      Technikraum.K2-L1.Netzwerkschrank:
        healthy_ma: 1960
      Technikraum.K2-L2.Netzwerkschrank:
        healthy_ma: 150
      Technikraum.K3-L3.Entfeuchter:
        healthy_ma: 0
      Vorratsraum.K1-L3.Entfeuchter:
        healthy_ma: 10
      Vorratsraum.K3-L1.Lüftung:
        healthy_ma: 238
      Hauswirtschaftsraum.K1-L3.Entfeuchter:
        healthy_ma: 0
      Hauswirtschaftsraum.K3-L1.Trockner:
        healthy_ma: 0
      Hauswirtschaftsraum.K4-L1.Waschmaschine:
        healthy_ma: 0
      Wohnzimmer.K4-L1.Ofen:
        healthy_ma: 14
      Küche.K4-L1.Geschirrspüler:
        healthy_ma: 21
      Küche.K5-L1.Haubenlüfter:
        healthy_ma: 13
      Küche.K7-L1.Kühlschrank:
        healthy_ma: 50
      Küche.K9-L1.Backofen:
        healthy_ma: 42
      Küche.K10-L1.Tellerwärmer:
        healthy_ma: 16
      Küche.K12-L1.Mikrowelle:
        healthy_ma: 41
      Küche.K13-L1.Kaffeemaschine:
        healthy_ma: 54
      Küche.K14-L1.Dampfgarer:
        healthy_ma: 52
      Küche.K15-L1.Gefrierschrank:
        healthy_ma: 48
    target:
      # One severity address per device: the writer rules carry
      # anomaly.appliance_standby.<ga-slug> to the Standby address.
      per_device: true

  - name: freezer_icing
    sentence: "Der Gefrierschrank lässt seinen Verdichter über den Tag mehr als
      15 Prozentpunkte länger laufen als im gesunden Zustand — der Verdampfer
      vereist, lange bevor im Fach etwas antaut."
    unit: "× der erlaubten Erhöhung"
    kind: drift
    # The share of the day the compressor runs, in percent — same CUSUM as
    # standby drift, over the one signal that shows ice before the food does.
    signal: duty_cycle
    parameters:
      # A healthy freezer has headroom to spare; 15 points of it gone is the
      # line, and only what stands past that line accumulates.
      rise_pct: 15
      # How long a larger rise must stand: the June measurement (80 % of the
      # day) fills this in under two days, a warm shopping load never does.
      budget_pct_h: 600
      window_hours: 24
      # Lower than the standby fault's: the hours a door event covers are cut
      # out of the day, so the coverage has to leave room for one.
      min_window_fraction: 0.6
      # Three hours in which the compressor never stopped is a door standing
      # open, not ice — normal cycling idles at some point in every hour.
      door_run_hours: 3
      # This compressor runs at 180 mA and up and idles at 50-67, so the
      # threshold sits in the middle of a wide gap.
      on_ma: 120
    scope:
      dpt: "7.012"
      name_like: "%.Gefrierschrank.Stromwert"
    references:
      # Read off the summers before the icing, never derived from history:
      # the iced state has stood for months and would become the new normal.
      Küche.K15-L1.Gefrierschrank:
        healthy_duty_pct: 50
    target:
      # The writer rule carries anomaly.freezer_icing.<ga-slug> to the
      # freezer's own Vereisung address in the appliance group.
      per_device: true

  - name: fbh_cold
    sentence: "Ein Raum liegt bei mehr als 50 % Stellwert seit mindestens 2 h
      weiter unter seiner Soll-Temperatur, als seine je Raum erlaubte Abweichung
      zulässt — Ventil klemmt, Luft im Heizkreis oder ein Fühler steht falsch."
    unit: "× der erlaubten Abweichung"
    kind: deviation
    parameters:
      min_hours: 2
      gate_min_pct: 50
    roles:
      # Setpoint and valve position follow one naming rule across all
      # rooms, so a pattern is the rule itself; the reference is the
      # setpoint — the deviation kind's swappable expectation. The measured
      # value follows no such rule and is named per room below.
      reference: "%.FBH.Soll-Temperatur-Status"
      gate: "%.FBH.Stellwert-Status"
    scope:
      name_like:
        - "Raumklima.%.FBH.Stellwert-Status"
        - "Raumklima.%.FBH.Soll-Temperatur-Status"
        - "Sensorik.%.Sensor.Temperatur"
        - "Sensorik.EG.Flur.BWM.Eingang.Temperatur"
        - "Sensorik.OG.Flur.BWM.Treppe.Temperatur"
        - "Sensorik.OG.Begehbarer-Schrank.BWM.Temperatur"
      # Unheated rooms (basement, attic) carry room sensors but no FBH
      # circuit.
      exclude_name_like:
        - "Sensorik.KG.%"
        - "Sensorik.DG.%"
    rooms:
      # Every room names the channel it measures with — the address its
      # Basalte thermostat reads (task basalte:thermostats): eleven read
      # their room sensor, the three without one read a single
      # motion-detector head. Gaps start at 1 K everywhere, to be revisited
      # against the 30-day verification.
      EG.Flur:
        min_gap_k: 1.0
        value: "Sensorik.EG.Flur.BWM.Eingang.Temperatur"
      EG.Gäste-WC:
        min_gap_k: 1.0
        value: "Sensorik.EG.Gäste-WC.Sensor.Temperatur"
      EG.Büro:
        min_gap_k: 1.0
        value: "Sensorik.EG.Büro.Sensor.Temperatur"
      EG.Wohnzimmer:
        min_gap_k: 1.0
        value: "Sensorik.EG.Wohnzimmer.Sensor.Temperatur"
      EG.Esszimmer:
        min_gap_k: 1.0
        value: "Sensorik.EG.Esszimmer.Sensor.Temperatur"
      EG.Küche:
        min_gap_k: 1.0
        value: "Sensorik.EG.Küche.Sensor.Temperatur"
      OG.Flur:
        min_gap_k: 1.0
        value: "Sensorik.OG.Flur.BWM.Treppe.Temperatur"
      OG.Abstellraum:
        min_gap_k: 1.0
        value: "Sensorik.OG.Abstellraum.Sensor.Temperatur"
      OG.Badezimmer-Kinder:
        min_gap_k: 1.0
        value: "Sensorik.OG.Badezimmer-Kinder.Sensor.Temperatur"
      OG.Schlafzimmer-Gregory:
        min_gap_k: 1.0
        value: "Sensorik.OG.Schlafzimmer-Gregory.Sensor.Temperatur"
      OG.Schlafzimmer-Luis:
        min_gap_k: 1.0
        value: "Sensorik.OG.Schlafzimmer-Luis.Sensor.Temperatur"
      OG.Schlafzimmer-Eltern:
        min_gap_k: 1.0
        value: "Sensorik.OG.Schlafzimmer-Eltern.Sensor.Temperatur"
      OG.Begehbarer-Schrank:
        min_gap_k: 1.0
        value: "Sensorik.OG.Begehbarer-Schrank.BWM.Temperatur"
      OG.Badezimmer-Eltern:
        min_gap_k: 1.0
        value: "Sensorik.OG.Badezimmer-Eltern.Sensor.Temperatur"
    target:
      # One severity address per room: the writer rules carry
      # anomaly.fbh_cold.<room-slug> to the room's FBH Aktiv-Anomalie
      # address.
      per_room: true

  - name: heat_recovery_decay
    sentence: "Der Wärmetauscher der KWL holt dauerhaft mehr als 10
      Prozentpunkte weniger Wärme zurück als seine gesunden 94 % — die Zuluft
      nähert sich der Außenluft, der Tauscher verschmutzt."
    unit: "× des erlaubten Abfalls"
    kind: drift
    # The recovery efficiency in percent of the extract-outdoor gradient —
    # the one drift series that walks downward.
    signal: recovery
    parameters:
      # A floor, not a noise band: the healthy capability never dropped
      # below 87.7 % in 15 months, so 10 points under 94 cannot cry wolf.
      fall_pct: 10
      # How long a larger fall must stand, in measured winter hours: a
      # 20-point drop fills this in two days of valid readings.
      budget_pct_h: 480
      # The capability is the best valid hour of the trailing three days,
      # so bypass, defrost and boost transients never set the level.
      window_hours: 72
      # Valid hours are gate-limited, so the window asks for few of them.
      min_window_fraction: 0.1
      # Below 16 K of gradient the quotient is noise — and the summer
      # comfort bypass, which reads exactly like fouling hour by hour.
      # Summer is unmeasured by design, not healthy.
      min_delta_k: 16
    roles:
      outdoor: "%.KWL.Temperatur-Außenluft"
      extract: "%.KWL.Temperatur-Abluft"
      supply: "%.KWL.Temperatur-Zuluft"
    scope:
      name_like:
        - "%.KWL.Temperatur-Außenluft"
        - "%.KWL.Temperatur-Abluft"
        - "%.KWL.Temperatur-Zuluft"
    references:
      # Read once off two heating seasons of capability levels (p50 95.1,
      # p01 90.5) and written here: a reference the detector derives for
      # itself would adopt a fouled exchanger as the new normal.
      KWL:
        healthy_pct: 94
    target:
      # The writer rule carries anomaly.heat_recovery_decay.kwl to the
      # KWL's Wärmerückgewinnung address.
      ga: "15/3/34"

  - name: pv_underperformance
    sentence: "Die Anlage hat an einem Tag mehr als 35 % weniger erzeugt, als
      die wetterbereinigte Prognose für diesen Tag erwartet hat — Verschmutzung,
      Verschattung, ein toter String oder ein abregelnder Wechselrichter."
    unit: "× des erlaubten Fehlbetrags"
    kind: deviation
    # Where the day's expectation comes from — the one line that swaps the
    # reference: today the weather-adjusted forecast, tomorrow a sibling
    # inverter or a clear-sky model. The comparison itself never changes.
    expectation: forecast_solar
    parameters:
      # Clouds are already in the forecast, so only a clear shortfall
      # against it means anything. Taken from the retired detector's first
      # tier; to be revisited against the 30-day verification.
      min_shortfall_pct: 35
      # Below this the day expected too little for a percentage of it to
      # mean anything — December overcast, or a forecast that never
      # arrived. Such a day counts as unmeasured, not as quiet.
      min_expected_kwh: 3
    target:
      # The writer rule carries anomaly.pv_underperformance to the PV
      # Erzeugung-Leistung-Anomalie address.
      ga: "15/4/11"

  # External faults: Basalte detects, writes the severity to the fault
  # address and delivers push/e-mail itself; the engine reads the writes
  # back and records episodes. All dormant until the Studio logic writes
  # them — and, on the re-purposed addresses, until the telegrams of the
  # switched-off engine detectors have left the 30-day read window.
  - name: system_pressure_low
    sentence: "Der Systemdruck der Gastherme liegt unter 1,0 bar."
    unit: "bar"
    kind: external
    scope:
      name_like: "%.Gastherme.System-Druck-Anomalie"
    dormant:
      reason: "Die Adresse existiert in ETS noch nicht."
      active_when: "Die Adresse steht im Katalog und die Studio-Logik schreibt sie."

  - name: burner_idle_despite_demand
    sentence: "Der Brenner liefert länger als 2 h 0 % Modulation, obwohl das
      Vorlauf-Soll mehr als 5 K über dem Ist liegt."
    unit: "%"
    kind: external
    scope:
      name_like: "%.Gastherme.Brenner.Modulation-Anomalie"
    dormant:
      reason: "Die Studio-Logik ist noch nicht gebaut; auf der Adresse liegen
        noch Alt-Telegramme der abgeschalteten Engine-Detektoren."
      active_when: "Die Studio-Logik schreibt die Adresse und die Alt-Telegramme
        (vor September 2026) sind aus dem 30-Tage-Fenster gelaufen."

  - name: dhw_cold
    sentence: "Das Warmwasser liegt länger als 3 h unter 40 °C."
    unit: "°C"
    kind: external
    scope:
      name_like: "%.Gastherme.Warmwasser.Ist-Temperatur-Anomalie"
    dormant:
      reason: "Die Studio-Logik ist noch nicht gebaut; auf der Adresse liegen
        noch Alt-Telegramme der abgeschalteten Engine-Detektoren."
      active_when: "Die Studio-Logik schreibt die Adresse und die Alt-Telegramme
        (vor September 2026) sind aus dem 30-Tage-Fenster gelaufen."

  - name: flow_under_setpoint
    sentence: "Der Vorlauf bleibt bei laufendem Brenner über 3 h mehr als 5 K
      unter dem Sollwert."
    unit: "K"
    kind: external
    scope:
      name_like: "%.Gastherme.Heizung.Vorlauf.Ist-Temperatur-Anomalie"
    dormant:
      reason: "Die Studio-Logik ist noch nicht gebaut; auf der Adresse liegen
        noch Alt-Telegramme der abgeschalteten Engine-Detektoren."
      active_when: "Die Studio-Logik schreibt die Adresse und die Alt-Telegramme
        (vor September 2026) sind aus dem 30-Tage-Fenster gelaufen."

  - name: heating_spread_collapsed
    sentence: "Der Rücklauf liegt bei laufendem Brenner über 1 h weniger als
      3 K unter dem Vorlauf."
    unit: "K"
    kind: external
    scope:
      name_like: "%.Gastherme.Heizung.Rücklauf.Ist-Temperatur-Anomalie"
    dormant:
      reason: "Die Studio-Logik ist noch nicht gebaut; auf der Adresse liegen
        noch Alt-Telegramme der abgeschalteten Engine-Detektoren."
      active_when: "Die Studio-Logik schreibt die Adresse und die Alt-Telegramme
        (vor September 2026) sind aus dem 30-Tage-Fenster gelaufen."

  - name: kwl_airflow_low
    sentence: "Die KWL liefert bei der eingestellten Stufe anhaltend weniger
      als 80 % des Sollvolumens oder gar keinen Luftstrom."
    unit: "m³/h"
    kind: external
    scope:
      name_like: "%.KWL.Luftstrom-Anomalie"
    dormant:
      reason: "Die Adresse existiert in ETS noch nicht."
      active_when: "Die Adresse steht im Katalog und die Studio-Logik schreibt sie."

  - name: inverter_temperature_high
    sentence: "Die Temperatur eines Wechselrichters liegt über 70 °C."
    unit: "°C"
    kind: external
    scope:
      name_like: "%.Photovoltaik.Wechselrichter-%.Temperatur-Anomalie"
    dormant:
      reason: "Die Studio-Logik ist noch nicht gebaut; auf den Adressen liegen
        noch Alt-Telegramme der abgeschalteten Engine-Detektoren."
      active_when: "Die Studio-Logik schreibt die Adressen und die Alt-Telegramme
        (vor September 2026) sind aus dem 30-Tage-Fenster gelaufen."

  - name: grid_voltage_out_of_range
    sentence: "Die Netzspannung liegt auf mindestens einer Phase außerhalb von
      207–253 V."
    unit: "V"
    kind: external
    scope:
      name_like: "%.Energiezähler.Strom.Spannung-Anomalie"
    dormant:
      reason: "Die Adresse existiert in ETS noch nicht."
      active_when: "Die Adresse steht im Katalog und die Studio-Logik schreibt sie."

  - name: dehumidifier_ineffective
    sentence: "Ein Entfeuchter läuft über 4 h, während die Luftfeuchte um
      weniger als 2 % fällt."
    unit: "%"
    kind: external
    scope:
      name_like: "Raumklima.%.Entfeuchter.Anomalie"
    dormant:
      reason: "Die Adressen existieren in ETS noch nicht."
      active_when: "Die Adressen stehen im Katalog und die Studio-Logik schreibt sie."

  # The volume watchdog: the notification count is itself a declared fault.
  # It measures the episode stream every other fault writes, so it is
  # declared last — the week it counts already includes what this run
  # produced. Externally delivered episodes count too, and so do its own:
  # what matters is how much reached a human.
  - name: notification_volume
    sentence: "Mehr als 5 Vorfälle in sieben Tagen — die Meldungsmenge selbst
      driftet zurück ins Rauschen."
    unit: "× der erlaubten Wochenmenge"
    kind: volume
    parameters:
      # The declared target: about five notifications a week. Tuning it is
      # an edit to this line in a PR, never an engine release.
      max_episodes_per_week: 5
    target:
      # One house-wide severity address in the central Diagnose block.
      ga: "0/0/251"
