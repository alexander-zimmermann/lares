# The fault list: one sentence with a unit per entry, parameters in the
# channel's own unit, scope as a catalog query — never an address list.
# Check before shipping: task insights:validate-faults

faults:
  # Tracer fault: needs no model and exercises the whole chain.
  - name: channel_silence
    sentence: "Ein Kanal, der sonst regelmäßig sendet, schweigt länger als das
      Fünffache seiner üblichen Sendepause."
    unit: "× der üblichen Sendepause"
    kind: silence
    parameters:
      gap_factor: 5
    scope:
      name_like: "%"
    target:
      # One severity address per matched main group, in its Zentral block.
      per_main_group: true

  - name: appliance_runtime
    sentence: "Ein Gerät zieht ununterbrochen länger Strom, als seine je Gerät
      erlaubte Laufzeit zulässt — vergessen eingeschaltet oder hängen geblieben."
    unit: "× der erlaubten Laufzeit"
    kind: duration
    parameters:
      # An hour counts as active when half its samples sit above the
      # standby valley baked into knx_appliance_1h.
      active_hour_fraction: 0.5
    scope:
      dpt: "7.012"
      name_like: "%.Stromwert"
      # By-design continuous loads, and the cooling appliances whose
      # compressor cycles faster than the hourly grid can resolve.
      exclude_name_like:
        - "%.Netzwerkschrank.%"
        - "%.Heizung.%"
        - "%.Kühlschrank.%"
        - "%.Gefrierschrank.%"
        - "%.Lüftung.%"
    devices:
      Garage.K1-L3.Entfeuchter:
        max_run_hours: 24
      Technikraum.K3-L3.Entfeuchter:
        max_run_hours: 24
      Vorratsraum.K1-L3.Entfeuchter:
        max_run_hours: 24
      Hauswirtschaftsraum.K1-L3.Entfeuchter:
        max_run_hours: 24
      Hauswirtschaftsraum.K3-L1.Trockner:
        max_run_hours: 4
      # Laundry days chain loads back to back for 10-13 h; only a run past
      # two of those in a row is a fault.
      Hauswirtschaftsraum.K4-L1.Waschmaschine:
        max_run_hours: 16
      Wohnzimmer.K4-L1.Ofen:
        max_run_hours: 8
      Küche.K4-L1.Geschirrspüler:
        max_run_hours: 4
      Küche.K5-L1.Haubenlüfter:
        max_run_hours: 3
      Küche.K9-L1.Backofen:
        max_run_hours: 4
      Küche.K10-L1.Tellerwärmer:
        max_run_hours: 3
      Küche.K12-L1.Mikrowelle:
        max_run_hours: 2
      Küche.K13-L1.Kaffeemaschine:
        max_run_hours: 3
      Küche.K14-L1.Dampfgarer:
        max_run_hours: 3
    target:
      # One severity address per device: the writer rules carry
      # anomaly.appliance_runtime.<ga-slug> to the Dauerbetrieb address.
      per_device: true

  - name: fbh_cold
    sentence: "Ein Raum liegt bei mehr als 50 % Stellwert seit mindestens 2 h
      weiter unter seiner Soll-Temperatur, als seine je Raum erlaubte Abweichung
      zulässt — Ventil klemmt, Luft im Heizkreis oder ein Fühler steht falsch."
    unit: "× der erlaubten Abweichung"
    kind: deviation
    parameters:
      min_hours: 2
      gate_min_pct: 50
    roles:
      # Setpoint and valve position follow one naming rule across all
      # rooms, so a pattern is the rule itself; the reference is the
      # setpoint — the deviation kind's swappable expectation. The measured
      # value follows no such rule and is named per room below.
      reference: "%.FBH.Soll-Temperatur-Status"
      gate: "%.FBH.Stellwert-Status"
    scope:
      name_like:
        - "Raumklima.%.FBH.Stellwert-Status"
        - "Raumklima.%.FBH.Soll-Temperatur-Status"
        - "Sensorik.%.Sensor.Temperatur"
        - "Sensorik.EG.Flur.BWM.Eingang.Temperatur"
        - "Sensorik.OG.Flur.BWM.Treppe.Temperatur"
        - "Sensorik.OG.Begehbarer-Schrank.BWM.Temperatur"
      # Unheated rooms (basement, attic) carry room sensors but no FBH
      # circuit.
      exclude_name_like:
        - "Sensorik.KG.%"
        - "Sensorik.DG.%"
    rooms:
      # Every room names the channel it measures with — the address its
      # Basalte thermostat reads (task basalte:thermostats): eleven read
      # their room sensor, the three without one read a single
      # motion-detector head. Gaps start at 1 K everywhere, to be revisited
      # against the 30-day verification.
      EG.Flur:
        min_gap_k: 1.0
        value: "Sensorik.EG.Flur.BWM.Eingang.Temperatur"
      EG.Gäste-WC:
        min_gap_k: 1.0
        value: "Sensorik.EG.Gäste-WC.Sensor.Temperatur"
      EG.Büro:
        min_gap_k: 1.0
        value: "Sensorik.EG.Büro.Sensor.Temperatur"
      EG.Wohnzimmer:
        min_gap_k: 1.0
        value: "Sensorik.EG.Wohnzimmer.Sensor.Temperatur"
      EG.Esszimmer:
        min_gap_k: 1.0
        value: "Sensorik.EG.Esszimmer.Sensor.Temperatur"
      EG.Küche:
        min_gap_k: 1.0
        value: "Sensorik.EG.Küche.Sensor.Temperatur"
      OG.Flur:
        min_gap_k: 1.0
        value: "Sensorik.OG.Flur.BWM.Treppe.Temperatur"
      OG.Abstellraum:
        min_gap_k: 1.0
        value: "Sensorik.OG.Abstellraum.Sensor.Temperatur"
      OG.Badezimmer-Kinder:
        min_gap_k: 1.0
        value: "Sensorik.OG.Badezimmer-Kinder.Sensor.Temperatur"
      OG.Schlafzimmer-Gregory:
        min_gap_k: 1.0
        value: "Sensorik.OG.Schlafzimmer-Gregory.Sensor.Temperatur"
      OG.Schlafzimmer-Luis:
        min_gap_k: 1.0
        value: "Sensorik.OG.Schlafzimmer-Luis.Sensor.Temperatur"
      OG.Schlafzimmer-Eltern:
        min_gap_k: 1.0
        value: "Sensorik.OG.Schlafzimmer-Eltern.Sensor.Temperatur"
      OG.Begehbarer-Schrank:
        min_gap_k: 1.0
        value: "Sensorik.OG.Begehbarer-Schrank.BWM.Temperatur"
      OG.Badezimmer-Eltern:
        min_gap_k: 1.0
        value: "Sensorik.OG.Badezimmer-Eltern.Sensor.Temperatur"
    target:
      # One severity address per room: the writer rules carry
      # anomaly.fbh_cold.<room-slug> to the room's FBH Aktiv-Anomalie
      # address.
      per_room: true

  # External faults: Basalte detects, writes the severity to the fault
  # address and delivers push/e-mail itself; the engine reads the writes
  # back and records episodes. All dormant until the Studio logic writes
  # them — and, on the re-purposed addresses, until the telegrams of the
  # switched-off engine detectors have left the 30-day read window.
  - name: system_pressure_low
    sentence: "Der Systemdruck der Gastherme liegt unter 1,0 bar."
    unit: "bar"
    kind: external
    scope:
      name_like: "%.Gastherme.System-Druck-Anomalie"
    dormant:
      reason: "Die Adresse existiert in ETS noch nicht."
      active_when: "Die Adresse steht im Katalog und die Studio-Logik schreibt sie."

  - name: burner_idle_despite_demand
    sentence: "Der Brenner liefert länger als 2 h 0 % Modulation, obwohl das
      Vorlauf-Soll mehr als 5 K über dem Ist liegt."
    unit: "%"
    kind: external
    scope:
      name_like: "%.Gastherme.Brenner.Modulation-Anomalie"
    dormant:
      reason: "Die Studio-Logik ist noch nicht gebaut; auf der Adresse liegen
        noch Alt-Telegramme der abgeschalteten Engine-Detektoren."
      active_when: "Die Studio-Logik schreibt die Adresse und die Alt-Telegramme
        (vor September 2026) sind aus dem 30-Tage-Fenster gelaufen."

  - name: dhw_cold
    sentence: "Das Warmwasser liegt länger als 3 h unter 40 °C."
    unit: "°C"
    kind: external
    scope:
      name_like: "%.Gastherme.Warmwasser.Ist-Temperatur-Anomalie"
    dormant:
      reason: "Die Studio-Logik ist noch nicht gebaut; auf der Adresse liegen
        noch Alt-Telegramme der abgeschalteten Engine-Detektoren."
      active_when: "Die Studio-Logik schreibt die Adresse und die Alt-Telegramme
        (vor September 2026) sind aus dem 30-Tage-Fenster gelaufen."

  - name: flow_under_setpoint
    sentence: "Der Vorlauf bleibt bei laufendem Brenner über 3 h mehr als 5 K
      unter dem Sollwert."
    unit: "K"
    kind: external
    scope:
      name_like: "%.Gastherme.Heizung.Vorlauf.Ist-Temperatur-Anomalie"
    dormant:
      reason: "Die Studio-Logik ist noch nicht gebaut; auf der Adresse liegen
        noch Alt-Telegramme der abgeschalteten Engine-Detektoren."
      active_when: "Die Studio-Logik schreibt die Adresse und die Alt-Telegramme
        (vor September 2026) sind aus dem 30-Tage-Fenster gelaufen."

  - name: heating_spread_collapsed
    sentence: "Der Rücklauf liegt bei laufendem Brenner über 1 h weniger als
      3 K unter dem Vorlauf."
    unit: "K"
    kind: external
    scope:
      name_like: "%.Gastherme.Heizung.Rücklauf.Ist-Temperatur-Anomalie"
    dormant:
      reason: "Die Studio-Logik ist noch nicht gebaut; auf der Adresse liegen
        noch Alt-Telegramme der abgeschalteten Engine-Detektoren."
      active_when: "Die Studio-Logik schreibt die Adresse und die Alt-Telegramme
        (vor September 2026) sind aus dem 30-Tage-Fenster gelaufen."

  - name: kwl_airflow_low
    sentence: "Die KWL liefert bei der eingestellten Stufe anhaltend weniger
      als 80 % des Sollvolumens oder gar keinen Luftstrom."
    unit: "m³/h"
    kind: external
    scope:
      name_like: "%.KWL.Luftstrom-Anomalie"
    dormant:
      reason: "Die Adresse existiert in ETS noch nicht."
      active_when: "Die Adresse steht im Katalog und die Studio-Logik schreibt sie."

  - name: inverter_temperature_high
    sentence: "Die Temperatur eines Wechselrichters liegt über 70 °C."
    unit: "°C"
    kind: external
    scope:
      name_like: "%.Photovoltaik.Wechselrichter-%.Temperatur-Anomalie"
    dormant:
      reason: "Die Studio-Logik ist noch nicht gebaut; auf den Adressen liegen
        noch Alt-Telegramme der abgeschalteten Engine-Detektoren."
      active_when: "Die Studio-Logik schreibt die Adressen und die Alt-Telegramme
        (vor September 2026) sind aus dem 30-Tage-Fenster gelaufen."

  - name: grid_voltage_out_of_range
    sentence: "Die Netzspannung liegt auf mindestens einer Phase außerhalb von
      207–253 V."
    unit: "V"
    kind: external
    scope:
      name_like: "%.Energiezähler.Strom.Spannung-Anomalie"
    dormant:
      reason: "Die Adresse existiert in ETS noch nicht."
      active_when: "Die Adresse steht im Katalog und die Studio-Logik schreibt sie."

  - name: dehumidifier_ineffective
    sentence: "Ein Entfeuchter läuft über 4 h, während die Luftfeuchte um
      weniger als 2 % fällt."
    unit: "%"
    kind: external
    scope:
      name_like: "Raumklima.%.Entfeuchter.Anomalie"
    dormant:
      reason: "Die Adressen existieren in ETS noch nicht."
      active_when: "Die Adressen stehen im Katalog und die Studio-Logik schreibt sie."

  # The volume watchdog: the notification count is itself a declared fault.
  # It measures the episode stream every other fault writes, so it is
  # declared last — the week it counts already includes what this run
  # produced. Externally delivered episodes count too, and so do its own:
  # what matters is how much reached a human.
  - name: notification_volume
    sentence: "Mehr als 5 Vorfälle in sieben Tagen — die Meldungsmenge selbst
      driftet zurück ins Rauschen."
    unit: "× der erlaubten Wochenmenge"
    kind: volume
    parameters:
      # The declared target: about five notifications a week. Tuning it is
      # an edit to this line in a PR, never an engine release.
      max_episodes_per_week: 5
    target:
      # One house-wide severity address in the central Diagnose block.
      ga: "0/0/251"
