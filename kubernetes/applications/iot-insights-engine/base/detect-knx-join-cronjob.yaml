# CronJob: rule-based detectors against per-room KNX-Joins
# (knx_1h × ga_catalog). Two UCs:
#   fbh_cold              — FBH open >50% and room stays >=1°C below
#                           setpoint over 2h
#   window_while_heating  — window open + FBH heating + outdoor <12°C
# Idempotent INSERT into mcp_anomalies; NATS publish on new inserts.
# Schedule */15 — same as detect-univariate; offset +10s of the hour
# would gain nothing, the CAGG window doesn't shift mid-hour.
apiVersion: batch/v1
kind: CronJob

metadata:
  name: iot-insights-engine-detect-knx-join
  namespace: iot-insights-engine

spec:
  schedule: "*/15 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600

  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: detector
              image: ghcr.io/alexander-zimmermann/iot-insights-engine:1.5.0
              command: ["iot-insights-engine", "detect-knx-join"]
              env:
                - name: MCP_DB_HOST
                  value: timescaledb-db-rw.timescaledb.svc.cluster.local
                - name: MCP_DB_PORT
                  value: "5432"
                - name: MCP_DB_NAME
                  value: homelab
                - name: MCP_DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-db-iot-mcp-bridge-ro-secret
                      key: username
                - name: MCP_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-db-iot-mcp-bridge-ro-secret
                      key: password
                - name: MCP_DB_WRITE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-db-iot-mcp-bridge-rw-secret
                      key: username
                - name: MCP_DB_WRITE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-db-iot-mcp-bridge-rw-secret
                      key: password
                - name: MCP_NATS_SERVERS
                  value: nats://nats.nats.svc.cluster.local:4222
                - name: MCP_NATS_NKEY_SEED_FILE
                  value: /etc/iot-insights-engine/nats/nkey-seed
                - name: MCP_AUTH_ENABLED
                  value: "false"
                - name: TZ
                  value: Europe/Berlin
              resources:
                requests:
                  cpu: 20m
                  memory: 96Mi
                limits:
                  cpu: 200m
                  memory: 192Mi
              volumeMounts:
                - name: nats-credentials
                  mountPath: /etc/iot-insights-engine/nats/nkey-seed
                  subPath: nkey-seed
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: nats-credentials
              secret:
                secretName: iot-mcp-bridge-credentials
