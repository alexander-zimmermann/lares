apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iot-insights-engine
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml
  - ./detect-univariate-cronjob.yaml
  - ./detect-knx-join-cronjob.yaml
  - ./train-iforest-cronjob.yaml
  - ./score-iforest-cronjob.yaml
  - ./forecast-solar-cronjob.yaml
  - ./train-seasonal-cronjob.yaml
  - ./score-seasonal-cronjob.yaml

labels:
  - includeSelectors: false
    pairs:
      homelab.app: iot-insights-engine

# Wave 11 = after Kyverno (-4), timescaledb (3), nats-operator (9) and
# knx-nats-bridge (10) — aligns with iot-mcp-bridge so the secret
# clones from those upstream namespaces are already in place.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "11"
