apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iot-insights-engine
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml
  - ./forecast-solar-cronjob.yaml
  - ./forecast-weather-cronjob.yaml
  - ./energy-balance-cronjob.yaml
  - ./detect-faults-cronjob.yaml

# Hash suffix on: a faults.yaml edit re-renders the CronJob reference, so
# the next run picks it up without a manual restart.
configMapGenerator:
  - name: iot-insights-engine-faults
    files:
      - ./config/faults.yaml

labels:
  - includeSelectors: false
    pairs:
      homelab.app: iot-insights-engine

# Wave 11 = after Kyverno (-4), timescaledb (3), nats-operator (9) and
# knx-nats-bridge (10) — aligns with iot-mcp-bridge so the secret
# clones from those upstream namespaces are already in place.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "11"
