# CronJob: score the last completed 1h-bucket per (uc, group) against
# the persisted IsolationForest model. Idempotent INSERT into
# mcp_anomalies; NATS publish on `anomaly.<uc>.<severity>` only on new
# inserts. Cold-start safe — score-job is a no-op for a UC until train
# has run once.
# Schedule 5,20,35,50 — 5 min offset from the detect-univariate */15
# tick so the two jobs don't fight for the same DB write window.
apiVersion: batch/v1
kind: CronJob

metadata:
  name: iot-insights-engine-score-iforest
  namespace: iot-insights-engine

spec:
  schedule: "5,20,35,50 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600

  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: scorer
              image: ghcr.io/alexander-zimmermann/iot-insights-engine:1.4.0
              command: ["iot-insights-engine", "score-iforest"]
              env:
                - name: MCP_DB_HOST
                  value: timescaledb-db-rw.timescaledb.svc.cluster.local
                - name: MCP_DB_PORT
                  value: "5432"
                - name: MCP_DB_NAME
                  value: homelab
                - name: MCP_DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-db-iot-mcp-bridge-ro-secret
                      key: username
                - name: MCP_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-db-iot-mcp-bridge-ro-secret
                      key: password
                - name: MCP_DB_WRITE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-db-iot-mcp-bridge-rw-secret
                      key: username
                - name: MCP_DB_WRITE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-db-iot-mcp-bridge-rw-secret
                      key: password
                - name: MCP_S3_ENDPOINT
                  value: http://rustfs-svc.rustfs.svc.cluster.local:9000
                - name: MCP_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-iot-insights-engine-credentials
                      key: RUSTFS_ACCESS_KEY
                - name: MCP_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-iot-insights-engine-credentials
                      key: RUSTFS_SECRET_KEY
                - name: MCP_NATS_SERVERS
                  value: nats://nats.nats.svc.cluster.local:4222
                - name: MCP_NATS_NKEY_SEED_FILE
                  value: /etc/iot-insights-engine/nats/nkey-seed
                - name: MCP_AUTH_ENABLED
                  value: "false"
                - name: TZ
                  value: Europe/Berlin
              resources:
                requests:
                  cpu: 30m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              volumeMounts:
                - name: nats-credentials
                  mountPath: /etc/iot-insights-engine/nats/nkey-seed
                  subPath: nkey-seed
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: nats-credentials
              secret:
                secretName: iot-mcp-bridge-credentials
