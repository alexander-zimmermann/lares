apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replacements:
  # Inject domain name into Certificate, IngressRoute (both routes) and Homepage href annotation
  - sourceValue: status.zimmermann.sh
    targets:
      - select:
          kind: Certificate
          name: gatus-tls
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: IngressRoute
          name: gatus
        fieldPaths:
          - spec.routes.0.match
        options:
          delimiter: "`"
          index: 1
      - select:
          kind: IngressRoute
          name: gatus
        fieldPaths:
          - spec.routes.1.match
        options:
          delimiter: "`"
          index: 1
      - select:
          kind: IngressRoute
          name: gatus
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: "//"
          index: 1

  # Inject CNPG storage sizes
  - sourceValue: 512Mi
    targets:
      - select:
          kind: Cluster
          name: gatus-db
        fieldPaths:
          - spec.storage.size
      - select:
          kind: Cluster
          name: gatus-db
        fieldPaths:
          - spec.walStorage.size
  - sourceValue: 256MB
    targets:
      - select:
          kind: Cluster
          name: gatus-db
        fieldPaths:
          - spec.postgresql.parameters.max_wal_size

  # Rewrite external-dns target annotation to prod UDM Pro
  - sourceValue: udm-pro.zimmermann.sh
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]

patches:
  # Gatus service with static IP and BGP advertisement
  - target:
      kind: Service
      name: gatus
    patch: |-
      - op: test
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/annotations/io.cilium~1lb-ipam-ips
        value: "192.168.10.35"

  # PostgreSQL Cluster resources
  - target:
      kind: Cluster
      name: gatus-db
    patch: |-
      - op: test
        path: /spec/instances
        value: 2
      - op: add
        path: /spec/resources
        value:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

  - target:
      kind: Deployment
      name: gatus
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: gatus
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
