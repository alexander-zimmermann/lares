storage:
  type: postgres
  path: "${GATUS_POSTGRES_DSN}"
  caching: true
  maximum-number-of-results-per-endpoint: 100

metrics: true

ui:
  title: "Home Lab Status"
  header: "Home Lab Status"
  # Group endpoints into collapsible sections (Observability, Infrastructure, etc.) instead of a flat list
  default-sort-by: group

alerting:
  pushover:
    application-token: "${PUSHOVER_APP_TOKEN}"
    user-key: "${PUSHOVER_USER_KEY}"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

# Statically declared endpoints; everything else is discovered by the sidecar
# from the IngressRoute annotations.
endpoints:
  - name: Cloudflare DNS
    group: External
    url: https://1.1.1.1
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: GitHub
    group: External
    url: https://github.com
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: Pushover API
    group: External
    url: https://api.pushover.net
    interval: 5m
    conditions:
      - "[STATUS] == any(200, 404)"

  # The household's Google sign-in: Google deletes a client unused for six months
  # and answers a refused one with its error page. The client id is public.
  - name: Google sign-in client
    group: Security & Identity
    url: "https://accounts.google.com/o/oauth2/v2/auth?client_id=586915964157-jlfgj7jsia3f0jrcunqu3u03n5f5mfvi.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fauth.zimmermann.sh%2Fsource%2Foauth%2Fcallback%2Fgoogle%2F&response_type=code&scope=email%20profile"
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "[BODY] != pat(*signin/oauth/error*)"

  # The UniFi core. Probed directly on the LAN rather than through the
  # Cloudflare path the other device endpoints use, so the result says
  # whether the gateway itself answers, not whether the way in from outside
  # works. Self-signed cert, hence insecure. Feeds KNX 16/0/222 (Netzwerk).
  - name: UniFi
    group: Networking
    url: https://udm-pro.zimmermann.eu.com
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[STATUS] < 500"
