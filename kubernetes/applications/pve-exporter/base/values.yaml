applicationName: pve-exporter

deployment:
  enabled: true
  image:
    repository: docker.io/prompve/prometheus-pve-exporter
    tag: 3.8.3
    pullPolicy: IfNotPresent

  args:
    - --config.file=/etc/pve.yml

  # PVE_<FIELD>_<MODULE> env vars override the YAML config; ${...} in
  # pve.yml is not interpolated.
  env:
    PVE_TOKEN_VALUE_PBS:
      valueFrom:
        secretKeyRef:
          name: pve-exporter-credentials
          key: PVE_TOKEN

  volumes:
    config:
      configMap:
        name: pve-exporter-config
    # gunicorn needs a writable tmpdir for its worker lifecycle files; the
    # chart's containerSecurityContext defaults to readOnlyRootFilesystem.
    tmp:
      emptyDir: {}

  volumeMounts:
    config:
      mountPath: /etc/pve.yml
      subPath: pve.yml
      readOnly: true
    tmp:
      mountPath: /tmp

  ports:
    - containerPort: 9221
      name: metrics
      protocol: TCP

  # Probe through the PBS module so a 200 implies the API token works end-to-end.
  readinessProbe:
    enabled: true
    httpGet:
      path: /pve?target=backup-01.zimmermann.eu.com&module=pbs
      port: metrics
    initialDelaySeconds: 15
    periodSeconds: 60
    timeoutSeconds: 30
    failureThreshold: 3

  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: metrics
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 5

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Image's USER directive is the literal string "prometheus" (UID 101); pin
  # the numeric UID so PodSecurity restricted's runAsNonRoot can verify it.
  containerSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    runAsNonRoot: true

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 9221
      name: metrics
      protocol: TCP
      targetPort: metrics

# Scrapes the PBS module only — PVE host/VM gauges arrive via OTel push.
serviceMonitor:
  enabled: true
  additionalLabels:
    release: prometheus
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
      path: /pve
      params:
        target:
          - backup-01.zimmermann.eu.com
        module:
          - pbs
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: instance
          replacement: backup-01
