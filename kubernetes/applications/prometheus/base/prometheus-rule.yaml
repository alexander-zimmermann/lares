apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: homelab-rules
  labels:
    release: prometheus

spec:
  groups:
    - name: instance-down
      rules:
        - alert: InstanceDown
          expr: up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Instance {{ $labels.instance }} down"
            description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

    - name: traefik-alerts
      rules:
        - alert: HighHttp4xxErrorRateService
          expr: 'sum(rate(traefik_service_requests_total{code=~"4.*"}[3m])) by (service) / sum(rate(traefik_service_requests_total[3m])) by (service) * 100 > 10'
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Traefik high HTTP 4xx error rate ({{ $labels.service }})"
            description: "Traefik service 4xx error rate is above 10%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HighHttp5xxErrorRateService
          expr: 'sum(rate(traefik_service_requests_total{code=~"5.*"}[3m])) by (service) / sum(rate(traefik_service_requests_total[3m])) by (service) * 100 > 5'
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Traefik high HTTP 5xx error rate ({{ $labels.service }})"
            description: "Traefik service 5xx error rate is above 5%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - name: gatus-alerts
      rules:
        - alert: GatusDown
          expr: absent(up{job="gatus"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Gatus is not being scraped"
            description: "Gatus has not been scraped by Prometheus for more than 5 minutes — external reachability monitoring is offline."

    - name: pbs-alerts
      rules:
        - alert: PbsDatastoreAlmostFull
          expr: 'pbs_used / pbs_size > 0.85'
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "PBS datastore {{ $labels.datastore }} almost full"
            description: "PBS datastore {{ $labels.datastore }} is above 85% used — prune/GC may be falling behind."

        - alert: PbsHostRootFsAlmostFull
          expr: 'pbs_host_disk_available / pbs_host_disk_total < 0.10'
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PBS host root filesystem almost full"
            description: "Less than 10% free on backup-01 root filesystem — investigate logs/journal growth."

        - alert: PbsBackupStale
          expr: 'time() - pbs_snapshot_vm_last_timestamp > 2 * 86400'
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "PBS backup of {{ $labels.vm_name }} stale"
            description: "Last backup of VM {{ $labels.vm_name }} (id {{ $labels.vm_id }}) in datastore {{ $labels.datastore }} is older than 2 days."

        - alert: PbsLastVerifyFailed
          # pbs-exporter values: 0 = not verified yet, 1 = ok, 2 = failed.
          # Only alert on real failures, not on fresh snapshots awaiting the next verify run.
          expr: 'pbs_snapshot_vm_last_verify == 2'
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PBS verify failed for {{ $labels.vm_name }}"
            description: "The last verify of VM {{ $labels.vm_name }} (id {{ $labels.vm_id }}) in datastore {{ $labels.datastore }} did not pass."

    - name: rustfs-alerts
      rules:
        - alert: RustfsDriveOffline
          expr: max by (endpoint) (rustfs_drive_runtime_state{state="offline"}) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "RustFS drive {{ $labels.endpoint }} marked offline"
            description: "Health-state machine flipped {{ $labels.endpoint }} to offline — every S3 op will fail (rustfs#2601 class regression)."

        - alert: RustfsDriveStateFlapping
          expr: sum(increase(rustfs_drive_state_transition_total[15m])) by (endpoint) > 4
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "RustFS drive {{ $labels.endpoint }} flapping"
            description: "More than 4 health-state transitions in 15m — likely too-aggressive timeouts or NFS-side latency."

        - alert: RustfsDriveOpTimeout
          expr: sum(increase(rustfs_drive_op_timeout_total[10m])) by (op) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "RustFS drive op {{ $labels.op }} timing out"
            description: "Drive operation {{ $labels.op }} hit the per-op timeout — consider raising the matching RUSTFS_DRIVE_*_TIMEOUT_SECS env var."

    - name: unifi-arm-sync-alerts
      rules:
        - alert: UnifiArmStateDrift
          # unifi_arm_sync_ok is emitted by the redpanda-connect unifi_arm_alarm
          # stream on every KNX status telegram (~5 min heartbeat): 1 = UniFi
          # reached the KNX-requested state, 0 = it did not.
          expr: min(unifi_arm_sync_ok) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "UniFi arm state out of sync with KNX"
            description: "UniFi has not reached the state requested by KNX for >10m. The ~5min KNX status heartbeat re-asserts every cycle, so persistent drift means the POST is not taking effect — the house may be unprotected or falsely armed."

        - alert: UnifiArmSyncStale
          expr: absent(unifi_arm_sync_ok)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "UniFi arm-sync metric stale/absent"
            description: "unifi_arm_sync_ok has not been reported for >15m (expected every ~5min via the KNX status heartbeat). The redpanda-connect stream, its JetStream consumer binding, or the scrape is stuck — drift detection is blind."

    - name: solaredge-alerts
      rules:
        - alert: SolarEdgeInverterDataStale
          # solaredge_inverter_last_reading_timestamp_seconds is emitted by the
          # redpanda-connect solaredge_inverter stream on every reading (~1/5s, 24/7).
          expr: time() - max by (inverter) (solaredge_inverter_last_reading_timestamp_seconds) > 600
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SolarEdge inverter {{ $labels.inverter }} delivering no data"
            description: "No modbus reading from inverter {{ $labels.inverter }} (pod solaredge2mqtt-{{ $labels.inverter }}) for {{ $value | humanizeDuration }}. Readings arrive every 5s around the clock, so a gap this long means the inverter or its modbus interface is dead — the pod stays Running 1/1 and silently publishes nothing. Reboot the inverter; restarting the pod does not clear it."

        - alert: SolarEdgeInverterDataAbsent
          # The staleness rule needs an existing series — an inverter that never
          # reported since the connect stream started has none.
          expr: |
            absent(solaredge_inverter_last_reading_timestamp_seconds{inverter="1"})
            or absent(solaredge_inverter_last_reading_timestamp_seconds{inverter="2"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "SolarEdge inverter {{ $labels.inverter }} never reported"
            description: "Inverter {{ $labels.inverter }} has not delivered a single reading since the redpanda-connect solaredge_inverter stream last started — check the solaredge2mqtt pod, the SOLAREDGE JetStream consumer and the inverter itself."

    - name: argocd-alerts
      rules:
        - alert: ArgoCDAppOutOfSync
          # Level-triggered: ArgoCD's own notifications only fire on a failed sync operation,
          # so an app that just sits OutOfSync never raises one.
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD application {{ $labels.name }} out of sync"
            description: "{{ $labels.name }} has been {{ $labels.sync_status }} for more than 15m — no sync operation failed, so no ArgoCD notification was sent."

        - alert: ArgoCDAppNotHealthy
          # ArgoCD notifies only on health=Degraded; Progressing/Missing/Unknown stay silent.
          expr: argocd_app_info{health_status!="Healthy"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD application {{ $labels.name }} not healthy"
            description: "{{ $labels.name }} health is {{ $labels.health_status }} for more than 15m."

        - alert: ArgoCDMetricsAbsent
          expr: absent(argocd_app_info)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD application metrics absent"
            description: "argocd_app_info has not been scraped for more than 15m — sync/health drift detection is blind."

    - name: kubernetes-pods
      rules:
        - alert: PodCrashLooping
          # Restart-rate based — also catches transient crash-loops (count persists in the window)
          expr: increase(kube_pod_container_status_restarts_total[15m]) >= 3
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} crash-looping"
            description: "Container {{ $labels.container }} restarted {{ $value | humanize }} times in the last 15m."

        - alert: ContainerOOMKilled
          expr: |
            (increase(kube_pod_container_status_restarts_total[10m]) >= 1)
            and on(namespace, pod, container)
            (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }} OOMKilled"
            description: "Container {{ $labels.container }} was OOMKilled and restarted in the last 10m."

    - name: dyson-alerts
      rules:
        # Slow-moving: a filter loses a few percent a month, so a long `for`
        # costs nothing and keeps a flapping scrape from paging.
        - alert: DysonFilterLow
          expr: dyson_filter_life_percent < 10
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "Dyson {{ $labels.device }} filter almost spent"
            description: "HEPA filter at {{ $value | humanize }}% — order a replacement before it runs out."

        - alert: DysonDeviceDisconnected
          expr: dyson_connected == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Dyson {{ $labels.device }} unreachable"
            description: "The bridge has not held a connection for 30m — device unplugged, moved, or off the WLAN."

    - name: midea-alerts
      rules:
        # The appliances are permanently powered and answer even while switched
        # off, so unreachable means unreachable. Reconnect backoff caps at 5m.
        - alert: MideaDeviceDisconnected
          expr: midea_connected == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Dehumidifier {{ $labels.device }} unreachable"
            description: "The bridge has not held a connection for 30m — device unplugged, moved, or off the WLAN."

    # The only cloud-dependent bridge in the stack: appliance state goes stale
    # whenever the WAN link or Miele is down, and the access token is a second
    # way to lose the stream without the pod noticing. Warning throughout —
    # nothing safety-relevant hangs off this path, the KNX current detectors do.
    - name: miele-alerts
      rules:
        - alert: MieleCloudDisconnected
          expr: miele_connected == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Miele cloud event stream down"
            description: "The bridge has not held the SSE stream for 30m — WAN outage or a Miele-side problem. It reconnects on its own with backoff; the 17/1 GAs keep their last value meanwhile."

        - alert: MieleEventStreamStale
          # The keep-alive arrives every ~20s and never gapped below 14 per 5min
          # in measurement, so silence is decisive. Appliance events alone would
          # not be: they average 30/h with 15min windows of nothing. Guarded
          # against the 0 a fresh pod reports until its first frame.
          expr: miele_last_event_received_timestamp > 0 and time() - miele_last_event_received_timestamp > 300
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Miele stream silent while connected"
            description: "No SSE frame for {{ $value | humanizeDuration }} although miele_connected is 1 — a half-open connection the read timeout has not yet cut. Restart the pod if it persists."

        # No alert on miele_token_expiry_timestamp_seconds: the token is
        # refreshed lazily, on the next call that needs it, so it sits expired
        # for hours while a long-lived stream runs perfectly. A broken refresh
        # shows up as token_* below, or as PodCrashLooping when consent lapsed.
        - alert: MieleTokenRefreshFailing
          expr: sum(rate(miele_api_errors_total{reason=~"token_.*"}[30m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Miele token refresh failing"
            description: "Token refresh has been erroring for 15m. reason=token_rejected means consent lapsed and only a new round via miele-cloud-auth plus a re-sealed secret repairs it; token_http and token_transport are usually transient."

        - alert: MieleApiErrors
          expr: sum by (reason) (rate(miele_api_errors_total{reason!~"token_.*"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Miele API errors ({{ $labels.reason }})"
            description: "The cloud API has returned {{ $labels.reason }} continuously for 30m. Healthy operation produces none of these."

        - alert: MieleMetricsAbsent
          # `up` covers a failing scrape; this covers the ServiceMonitor being
          # dropped or relabelled away, which would silence every rule above.
          expr: absent(miele_connected)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Miele bridge metrics absent"
            description: "miele_connected has not been scraped for 15m — check the pod and its ServiceMonitor. Every other Miele alert is blind until this clears."
