# Use a stable, short name for all rendered resources
fullnameOverride: prometheus

# Reduce duplicate prefixes for objects created by the Prometheus Operator
cleanPrometheusOperatorObjectNames: true

# Grafana runs as a separate app
grafana:
  enabled: false

alertmanager:
  # Central notification router: the source picks the Pushover application
  # (its icon in the app), severity picks sound and repeat cadence.
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtprelay.smtprelay.svc.cluster.local:25
      smtp_from: admin@zimmermann.sh
      # The in-cluster relay speaks plaintext SMTP
      smtp_require_tls: false
    route:
      # Group by job to avoid alert storms when multiple alerts fire together
      group_by: ["alertname", "job"]
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 6h
      receiver: "cluster-warning"
      routes:
        # Watchdog heartbeat: silent Pushover ping (priority -1, no resolved alarm)
        - matchers:
            - alertname = "Watchdog"
          receiver: "watchdog"
          repeat_interval: 12h
        # Review-at-leisure findings (HolmesGPT) go to e-mail, batched per run
        - matchers:
            - severity = "info"
          receiver: "email"
          group_wait: 5m
          group_interval: 10m
          repeat_interval: 24h
        - matchers:
            - alertname =~ "Gatus.*"
          receiver: "gatus-warning"
          repeat_interval: 24h
          routes:
            - matchers:
                - severity = "critical"
              receiver: "gatus-critical"
              repeat_interval: 4h
        - matchers:
            - alertname =~ "ArgoCD.*"
          receiver: "argocd-warning"
          repeat_interval: 24h
          routes:
            - matchers:
                - severity = "critical"
              receiver: "argocd-critical"
              repeat_interval: 4h
        # Delivery watchdogs: grouped by their shared label instead of the
        # alertname, so a multi-bridge outage stays a single notification
        - matchers:
            - alert_group = "bridge-delivery"
          group_by: ["alert_group"]
          receiver: "devices-warning"
          repeat_interval: 24h
          routes:
            - matchers:
                - severity = "critical"
              receiver: "devices-critical"
              repeat_interval: 4h
        # House-device bridges: chatty by nature, own application to mute at will
        - matchers:
            - alertname =~ "Dyson.*|Midea.*|Miele.*|SolarEdge.*|UnifiArm.*"
          receiver: "devices-warning"
          repeat_interval: 24h
          routes:
            - matchers:
                - severity = "critical"
              receiver: "devices-critical"
              repeat_interval: 4h
        - matchers:
            - severity = "critical"
          receiver: "cluster-critical"
          repeat_interval: 4h
    receivers:
      - name: "cluster-critical"
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/prometheus-token
            user_key_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/user_key
            sound: siren
            priority: "1"
      - name: "cluster-warning"
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/prometheus-token
            user_key_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/user_key
      - name: "gatus-critical"
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/gatus-token
            user_key_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/user_key
            sound: siren
            priority: "1"
      - name: "gatus-warning"
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/gatus-token
            user_key_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/user_key
      - name: "argocd-critical"
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/argocd-token
            user_key_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/user_key
            sound: siren
            priority: "1"
      - name: "argocd-warning"
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/argocd-token
            user_key_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/user_key
      - name: "devices-critical"
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/devices-token
            user_key_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/user_key
            sound: siren
            priority: "1"
      - name: "devices-warning"
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/devices-token
            user_key_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/user_key
      - name: "watchdog"
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/prometheus-token
            user_key_file: /etc/alertmanager/secrets/alertmanager-pushover-tokens/user_key
            priority: "-1"
            send_resolved: false
      # send_resolved stays at its email default (false): info alerts are
      # event-shaped findings, a resolved mail would only be noise
      - name: "email"
        email_configs:
          - to: admin@zimmermann.sh
    # Setting this key replaces the chart defaults wholesale — the first four
    # rules below are carried over from them verbatim.
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal: ["namespace", "alertname"]
      - source_matchers:
          - severity = "warning"
        target_matchers:
          - severity = "info"
        equal: ["namespace", "alertname"]
      - source_matchers:
          - alertname = "InfoInhibitor"
        target_matchers:
          - severity = "info"
        equal: ["namespace"]
      - target_matchers:
          - alertname = "InfoInhibitor"
      # A WAN outage collapses every Gatus endpoint alert into the one naming the cause
      - source_matchers:
          - alertname = "GatusWanDown"
        target_matchers:
          - alertname =~ "Gatus.*"
      # A dead instance silences everything below it on the same instance
      - source_matchers:
          - alertname = "InstanceDown"
        target_matchers:
          - severity =~ "warning|info"
        equal: ["instance"]

  alertmanagerSpec:
    # Mount the Pushover secret so token_file / user_key_file can reference it
    secrets:
      - alertmanager-pushover-tokens
    # Links notifications back to the UI; silences are the mute mechanism now
    externalUrl: https://PLACEHOLDER
    # Persist Alertmanager state (silences, notification log)
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: PLACEHOLDER

prometheus:
  # Expose Prometheus service via Cilium/BGP-announced LoadBalancer
  service:
    type: LoadBalancer
    labels:
      bgp.cilium.io/ip-pool: default
      bgp.cilium.io/advertise-service: default

  prometheusSpec:
    # Required for remote_write receiver (e.g. for agent-based ingestion)
    enableRemoteWriteReceiver: true

    # Opt-In Model: Only scrape ServiceMonitors/PodMonitors/ScrapeConfigs with 'release: prometheus'
    serviceMonitorSelector:
      matchLabels:
        release: prometheus
    podMonitorSelector:
      matchLabels:
        release: prometheus
    scrapeConfigSelector:
      matchLabels:
        release: prometheus

    # Reduces TSDB disk usage by approx. 30-40% with minimal CPU overhead
    walCompression: true

    # Stability guards to prevent OOM kills from heavy queries or dashboards
    additionalArgs:
      - name: query.max-concurrency
        value: "5"
      - name: query.timeout
        value: "30s"
      - name: query.max-samples
        value: "5000000"

    # Enable Experimental Features
    enableFeatures:
      # Enable Memory snapshot on shutdown for faster restarts
      - memory-snapshot-on-shutdown

    # Administrative maintenance API
    enableAdminAPI: true

    # Enable lifecycle API for dynamic reloads
    enableLifecycle: true

    # Retention data configuration
    retention: PLACEHOLDER
    retentionSize: PLACEHOLDER

    # Persist TSDB data
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: PLACEHOLDER

    # Alertmanager configuration
    alerting:
      alertmanagers:
        - apiVersion: v2
          name: prometheus-alertmanager
          namespace: prometheus
          port: web

# Component scraping the kube api server
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: (apiserver_request_total|apiserver_request_duration_seconds_sum|apiserver_request_duration_seconds_count|apiserver_current_inflight_requests|apiserver_cache_.*|apiserver_flowcontrol_.*|apiserver_storage_.*|process_start_time_seconds)

# Component scraping the kubelet and kubelet-hosted cAdvisor
kubelet:
  serviceMonitor:
    # cadvisor "Minimal" Profile (Azure-inspired)
    cAdvisorMetricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: (container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_fs_usage_bytes|kubernetes_build_info)
    # kubelet "Minimal" Profile
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: (kubelet_running_pods|kubelet_running_containers|kubelet_volume_stats_used_bytes|kubelet_node_name|kubernetes_build_info)

# Component scraping coreDNS
coreDns:
  serviceMonitor:
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: (coredns_dns_request_duration_seconds_(sum|count)|coredns_dns_requests_total|coredns_forward_request_duration_seconds_(sum|count)|coredns_forward_requests_total|coredns_build_info|coredns_panics_total|coredns_dns_responses_total|coredns_cache_hits_total|coredns_cache_misses_total|coredns_cache_entries|process_resident_memory_bytes|process_cpu_seconds_total|go_goroutines|kubernetes_build_info)

# Component scraping kube proxy (disabled: Cilium runs in kube-proxy replacement mode)
kubeProxy:
  enabled: false

# Component scraping the kube controller manager
kubeControllerManager:
  serviceMonitor:
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: (workqueue_adds_total|workqueue_depth|workqueue_queue_duration_seconds_(sum|count)|process_resident_memory_bytes|process_cpu_seconds_total|go_goroutines|kubernetes_build_info)

# Component scraping kube scheduler
kubeScheduler:
  serviceMonitor:
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: (scheduler_framework_extension_point_duration_seconds_(sum|count)|scheduler_scheduling_attempt_duration_seconds_(sum|count)|process_resident_memory_bytes|process_cpu_seconds_total|go_goroutines|kubernetes_build_info)

# etcd is scraped via a dynamic ScrapeConfig (Node discovery → CP nodes :2381),
# not the chart's selector-based service (no component=etcd pod on Talos).
kubeEtcd:
  enabled: false

# Disable exporters/components that are provided via alloy
nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: false
