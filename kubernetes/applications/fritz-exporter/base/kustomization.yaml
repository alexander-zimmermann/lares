apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fritz-exporter
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: fritz-exporter
    version: 8.1.2
    valuesFile: values.yaml
    namespace: fritz-exporter
    apiVersions:
      - monitoring.coreos.com/v1

configMapGenerator:
  - name: fritz-exporter-config
    files:
      - config/fritz-exporter.yaml

labels:
  - includeSelectors: false
    pairs:
      homelab.app: fritz-exporter

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
