applicationName: fritz-exporter

deployment:
  enabled: true
  # Single instance is sufficient; fritz-exporter is stateless and scrapes one FritzBox.
  replicas: 1
  image:
    repository: docker.io/pdreker/fritz_exporter
    tag: 3.2.0
    pullPolicy: IfNotPresent

  args:
    - --config=/etc/fritz-exporter.yml

  volumes:
    # Non-secret exporter config from ConfigMap (kustomize hash-suffix is auto-resolved by reference rewrite).
    fritz-exporter-config:
      configMap:
        name: fritz-exporter-config
    # FritzBox credentials (password_file reference in config).
    fritz-exporter-credentials:
      secret:
        secretName: fritz-exporter-credentials

  volumeMounts:
    # Mount the exporter config at the expected path.
    fritz-exporter-config:
      mountPath: /etc/fritz-exporter.yml
      subPath: fritz-exporter.yaml
      readOnly: true
    # Credentials directory (read-only); referenced via password_file in config.
    fritz-exporter-credentials:
      mountPath: /etc/fritz-exporter/secrets
      readOnly: true

  ports:
    - name: metrics
      containerPort: 9787
      protocol: TCP

  # TCP probe only: probing /metrics triggers a live FritzBox scrape that
  # serializes under load and kills a healthy-but-slow exporter.
  readinessProbe:
    enabled: true
    tcpSocket:
      port: metrics
    initialDelaySeconds: 20
    periodSeconds: 30
    failureThreshold: 3

  # HTTP liveness so a wedged-but-listening exporter (TCP stays green while /metrics
  # hangs on a stuck TR-064 call) gets restarted. Generous timeout + failureThreshold
  # avoid false positives on a normal ~15s scrape. Readiness stays TCP-only so a slow
  # scrape never drops the pod from Service endpoints (spurious TargetDown).
  livenessProbe:
    enabled: true
    httpGet:
      path: /metrics
      port: metrics
    initialDelaySeconds: 60
    periodSeconds: 120
    timeoutSeconds: 30
    failureThreshold: 3

  resources:
    # Ensure Burstable QoS (no BestEffort) and prevent runaway usage.
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # pdreker/fritz_exporter image runs as root by default — pin UID/GID explicitly so
  # the chart's runAsNonRoot default is satisfied. Listening on 9787 is non-privileged.
  containerSecurityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    readOnlyRootFilesystem: true

  # Pod-level fsGroup so the mounted ConfigMap and Secret are group-readable by the non-root user.
  securityContext:
    fsGroup: 65534

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: metrics
      port: 9787
      protocol: TCP
      targetPort: metrics

# Prometheus scrapes fritz-exporter for FritzBox metrics (uplink/downlink, WiFi, etc.).
serviceMonitor:
  enabled: true
  additionalLabels:
    # Prometheus Operator label (Opt-In)
    release: prometheus
  endpoints:
    - port: metrics
      interval: 60s
      # A single live scrape already measures ~15s; headroom to avoid gaps.
      scrapeTimeout: 30s
