apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: knx-nats-bridge
resources:
  - ./namespace.yaml
  - ./import-ga-catalog-job.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: knx-nats-bridge
    version: 9.3.2
    valuesFile: values.yaml
    namespace: knx-nats-bridge
    apiVersions:
      - monitoring.coreos.com/v1

# Content-hash suffix: a config change produces a new ConfigMap name, so the
# references in the Deployment and the import-ga-catalog Job both update and
# ArgoCD rolls the pod natively. kustomize rewrites the hashed name in the
# Helm-rendered Deployment volume and the native Job volume alike.
configMapGenerator:
  - name: knx-nats-bridge-ga-catalog
    files:
      - ga-catalog.yaml=config/ga-catalog.yaml
  # One file per source; the bridge loads the mounted directory.
  - name: knx-nats-bridge-ga-mappings
    files:
      - ga-mappings/bordbar.yaml
      - ga-mappings/channels.yaml
      - ga-mappings/dyson.yaml
      - ga-mappings/ems-esp.yaml
      - ga-mappings/infra.yaml
      - ga-mappings/insights.yaml
      - ga-mappings/midea.yaml
      - ga-mappings/miele.yaml
      - ga-mappings/solaredge.yaml
      - ga-mappings/unifi.yaml
      - ga-mappings/warp.yaml

labels:
  - includeSelectors: false
    pairs:
      homelab.app: knx-nats-bridge

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
  argocd.argoproj.io/compare-options: ServerSideDiff=true
  argocd.argoproj.io/sync-options: ServerSideApply=true
