apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: knx-nats-bridge
resources:
  - ./namespace.yaml
  - ./import-ga-catalog-job.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: knx-nats-bridge
    version: 9.0.0
    valuesFile: values.yaml
    namespace: knx-nats-bridge
    apiVersions:
      - monitoring.coreos.com/v1

# disableNameSuffixHash: the import-ga-catalog Job mounts the ConfigMap
# by fixed name (subPath subPath ga-catalog.yaml).
configMapGenerator:
  - name: knx-nats-bridge-ga-catalog
    options:
      disableNameSuffixHash: true
    files:
      - ga-catalog.yaml=config/ga-catalog.yaml
  - name: knx-nats-bridge-writer-rules
    options:
      disableNameSuffixHash: true
    files:
      - writer-rules.yaml=config/writer-rules.yaml

labels:
  - includeSelectors: false
    pairs:
      homelab.app: knx-nats-bridge

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
  argocd.argoproj.io/compare-options: ServerSideDiff=true
  argocd.argoproj.io/sync-options: ServerSideApply=true
