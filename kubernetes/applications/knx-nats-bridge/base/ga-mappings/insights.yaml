# Fault severities → KNX (iot-insights-engine): the per-device and per-room
# faults, written by hand. The per-main-group and house-wide faults are
# generated into channels.yaml.

mappings:
  # Fault severities -> KNX (iot-insights-engine). The engine publishes the
  # current tier as $.severity_level (0=ok, 1=info, 2=warning, 3=critical) and
  # re-publishes 0 on auto-clear; a Basalte LUT turns it into a notification.
  # Phase A/B1: only the grid/battery reservations remain. The boiler,
  # inverter and wallbox anomaly addresses carry no rule: their faults are
  # external ones, Basalte detects them and writes the tier onto the bus
  # itself. The reservations (15/4/1,3,5,7,9 and 15/4/51,53,55) stay although
  # nothing publishes these subjects until a declared fault targets them.
  - subject: "anomaly.grid_power"
    ga: "15/4/1"
    dpt: "5.010"
    payload_path: "$.severity_level"
    description: "Versorgungstechnik.Photovoltaik.Netz-Leistung-Anomalie"
    min_delta: 0
    seed_on_start: true
  - subject: "anomaly.grid_consumption"
    ga: "15/4/3"
    dpt: "5.010"
    payload_path: "$.severity_level"
    description: "Versorgungstechnik.Photovoltaik.Netzbezug-Anomalie"
    min_delta: 0
    seed_on_start: true
  - subject: "anomaly.grid_delivery"
    ga: "15/4/5"
    dpt: "5.010"
    payload_path: "$.severity_level"
