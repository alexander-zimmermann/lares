  # Miele status as words (KNX<-NATS). Basalte shows a DPT 5.010 status as a bare
  # number; these carry the same state as text so it can be bound directly. The
  # numeric Status GAs stay — they remain the reliable input for logic, since
  # DPT 16.001 truncates at 14 bytes.
  - subject: "miele.geschirrspueler.state"
    ga: "17/1/4"
    dpt: "16.001"
    payload_path: "$.status_text"
    description: "Haushaltstechnik.Geschirrspüler.Statustext"
