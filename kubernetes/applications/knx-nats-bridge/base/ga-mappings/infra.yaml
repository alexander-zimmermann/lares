# Infrastruktur-Status → KNX (redpanda-connect infra_status from Alertmanager).

mappings:
  # Infrastruktur-Status (16/0/220..225) — the redpanda-connect infra_status
  # stream derives these from Alertmanager's active alerts, one state per
  # scope plus the aggregate over all five on 220. DPT 1.011: 1 = ok,
  # 0 = disturbed; states, not severities — notification stays with Pushover.
  # Republished once a minute, so the deadband is what keeps the bus quiet;
  # seed_on_start primes the read responder from the INFRA stream on restart.
  - subject: "infra.status.infrastruktur"
    ga: "16/0/220"
    dpt: "1.011"
    payload_path: "$.value"
    description: "Informationstechnik.Zentral.Diagnose.Infrastruktur.Status"
    min_delta: 0 # bool state: write only on change
    seed_on_start: true
  - subject: "infra.status.internet"
    ga: "16/0/221"
    dpt: "1.011"
    payload_path: "$.value"
    description: "Informationstechnik.Zentral.Diagnose.Internet.Status"
    min_delta: 0 # bool state: write only on change
    seed_on_start: true
  - subject: "infra.status.netzwerk"
    ga: "16/0/222"
    dpt: "1.011"
    payload_path: "$.value"
    description: "Informationstechnik.Zentral.Diagnose.Netzwerk.Status"
    min_delta: 0 # bool state: write only on change
    seed_on_start: true
  - subject: "infra.status.server"
    ga: "16/0/223"
    dpt: "1.011"
    payload_path: "$.value"
    description: "Informationstechnik.Zentral.Diagnose.Server.Status"
    min_delta: 0 # bool state: write only on change
    seed_on_start: true
  - subject: "infra.status.speicher"
    ga: "16/0/224"
    dpt: "1.011"
    payload_path: "$.value"
    description: "Informationstechnik.Zentral.Diagnose.Speicher.Status"
    min_delta: 0 # bool state: write only on change
    seed_on_start: true
  - subject: "infra.status.kubernetes"
    ga: "16/0/225"
    dpt: "1.011"
    payload_path: "$.value"
    description: "Informationstechnik.Zentral.Diagnose.Kubernetes.Status"
    min_delta: 0 # bool state: write only on change
    seed_on_start: true
