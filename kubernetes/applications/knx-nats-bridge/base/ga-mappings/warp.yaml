# WARP wallbox → KNX (warp_knx_republish / warp_mode_flags streams).

mappings:
  # WARP wallbox. warp.evse.state is event-driven (published only on change),
  # so seed_on_start primes the read responder from JetStream after a restart —
  # otherwise reads return no_value until the next state change.
  - subject: "warp.evse.state"
    ga: "15/6/2"
    dpt: "5.010"
    payload_path: "$.charger_state"
    description: "Versorgungstechnik.Wallbox.Ladecontroller-Status"
    min_delta: 0 # enum state: write only on change
    seed_on_start: true
  - subject: "warp.evse.state"
    ga: "15/6/4"
    dpt: "5.010"
    payload_path: "$.iec61851_state"
    description: "Versorgungstechnik.Wallbox.IEC61851-Status"
    min_delta: 0 # enum state: write only on change
    seed_on_start: true
  - subject: "warp.evse.state"
    ga: "15/6/0"
    dpt: "5.010"
    payload_path: "$.error_state"
    description: "Versorgungstechnik.Wallbox.Fehlerzustand-Status"
    min_delta: 0 # enum state: write only on change
    seed_on_start: true
  - subject: "warp.evse.state"
    ga: "15/6/8"
    dpt: "5.010"
    payload_path: "$.contactor_error"
    description: "Versorgungstechnik.Wallbox.Schütz-Fehler"
    min_delta: 0 # enum state: write only on change
    seed_on_start: true
  - subject: "warp.evse.state"
    ga: "15/6/6"
    dpt: "5.010"
    payload_path: "$.dc_fault_current_state"
    description: "Versorgungstechnik.Wallbox.DC-Fehlerstrom-Status"
    min_delta: 0 # enum state: write only on change
    seed_on_start: true
  - subject: "warp.evse.state"
    ga: "15/6/11"
    dpt: "7.012"
    payload_path: "$.allowed_charging_current"
    description: "Versorgungstechnik.Wallbox.Ladestrom-Erlaubt"
    min_delta: 100 # mA
    min_delta_pct: 2
    seed_on_start: true

  # WARP meter raw telemetry (republished by redpanda-connect
  # warp_knx_republish from the warp.meters.0.values array). Charged energy of
  # the current charge is computed in Basalte as Zählerstand-Aktuell minus
  # Zählerstand-Ladebeginn — both raw counters published here in Wh.
  - subject: "wallbox.knx.meter"
    ga: "15/6/10"
    dpt: "7.012"
    payload_path: "$.ladestrom"
    description: "Versorgungstechnik.Wallbox.Ladestrom"
    min_delta: 100 # mA
    min_delta_pct: 2
  - subject: "wallbox.knx.meter"
    ga: "15/6/12"
    dpt: "14.056"
    payload_path: "$.ladeleistung"
    description: "Versorgungstechnik.Wallbox.Ladeleistung"
    min_delta: 25 # W
    min_delta_pct: 2
  - subject: "wallbox.knx.meter"
    ga: "15/6/15"
    dpt: "13.010"
    payload_path: "$.zaehlerstand_aktuell"
    description: "Versorgungstechnik.Wallbox.Energie.Zählerstand-Aktuell"
    min_delta: 10 # Wh
  - subject: "wallbox.knx.charge"
    ga: "15/6/16"
    dpt: "13.010"
    payload_path: "$.zaehlerstand_ladebeginn"
    description: "Versorgungstechnik.Wallbox.Energie.Zählerstand-Ladebeginn"
    min_delta: 0 # changes only per charge: write on change
    seed_on_start: true

  # WARP control feedback (KNX<-WARP). The command GAs (Freigabe 15/6/20,
  # Lademodi 15/6/22, per-mode buttons 15/6/25/27/29) are driven KNX->WARP by
  # redpanda-connect streams; these rules report the actual state back so
  # Basalte reflects reality.
  # Mode state comes from the charge manager's per-charger array via
  # warp_mode_flags, not from power_manager.charge_mode: that one is only the
  # global setter and keeps the last button press while the box itself falls
  # back to default_mode on vehicle disconnect.
  - subject: "wallbox.knx.mode_flags"
    ga: "15/6/23"
    dpt: "5.010"
    payload_path: "$.mode" # 0=Schnell 1=Aus 2=PV 3=Min+PV
    description: "Versorgungstechnik.Wallbox.Lademodi-Status"
    min_delta: 0 # enum state: write only on change
    seed_on_start: true
  - subject: "wallbox.knx.charging"
    ga: "15/6/21"
    dpt: "1.001"
    payload_path: "$.on" # derived in warp_charging_status from WARP Slot 4 release
    description: "Versorgungstechnik.Wallbox.Ein-Freigabe-Status"
    min_delta: 0 # bool state: write only on change
    seed_on_start: true
  # Per-mode status bits for Basalte (radio: exactly one set, all 0 when Aus).
  # Derived in warp_mode_flags from warp.charge_manager.charge_modes[0].
  - subject: "wallbox.knx.mode_flags"
    ga: "15/6/26"
    dpt: "1.011"
    payload_path: "$.pv" # mode == 2
    description: "Versorgungstechnik.Wallbox.Lademodus-PV-Status"
    min_delta: 0
    seed_on_start: true
  - subject: "wallbox.knx.mode_flags"
    ga: "15/6/28"
    dpt: "1.011"
    payload_path: "$.pvmin" # mode == 3
    description: "Versorgungstechnik.Wallbox.Lademodus-PV+Min-Status"
    min_delta: 0
    seed_on_start: true
  - subject: "wallbox.knx.mode_flags"
    ga: "15/6/30"
    dpt: "1.011"
    payload_path: "$.fast" # mode == 0
    description: "Versorgungstechnik.Wallbox.Lademodus-Schnell-Status"
    min_delta: 0
    seed_on_start: true
