apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replacements:
  # Inject domain name into Certificate, IngressRoute, and Homepage href
  - sourceValue: rustfs-console.zimmermann.phd
    targets:
      - select:
          kind: Certificate
          name: rustfs-console-tls
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: IngressRoute
          name: rustfs-console
        fieldPaths:
          - spec.routes.0.match
        options:
          delimiter: "`"
          index: 1
      - select:
          kind: IngressRoute
          name: rustfs-console
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: "//"
          index: 1

  # Console SSO URLs — must match the redirect_uri registered in the Authentik blueprint
  - sourceValue: https://rustfs-console.zimmermann.phd
    targets:
      - select:
          kind: Deployment
          name: rustfs
        fieldPaths:
          - spec.template.spec.containers.[name=rustfs].env.[name=RUSTFS_BROWSER_REDIRECT_URL].value

  - sourceValue: https://rustfs-console.zimmermann.phd/rustfs/admin/v3/oidc/callback/default
    targets:
      - select:
          kind: Deployment
          name: rustfs
        fieldPaths:
          - spec.template.spec.containers.[name=rustfs].env.[name=RUSTFS_IDENTITY_OPENID_REDIRECT_URI].value

  # Kustomize list selectors match by prefix, so the replacement above also hits
  # RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC. Restore its literal value here.
  - sourceValue: "off"
    targets:
      - select:
          kind: Deployment
          name: rustfs
        fieldPaths:
          - spec.template.spec.containers.[name=rustfs].env.[name=RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC].value

  - sourceValue: https://auth.zimmermann.phd/application/o/rustfs/
    targets:
      - select:
          kind: Deployment
          name: rustfs
        fieldPaths:
          - spec.template.spec.containers.[name=rustfs].env.[name=RUSTFS_IDENTITY_OPENID_CONFIG_URL].value

  # Inject storage size configuration
  - sourceValue: 5Gi
    targets:
      - select:
          kind: PersistentVolumeClaim
          name: rustfs-data
        fieldPaths:
          - spec.resources.requests.storage
  - sourceValue: 1Gi
    targets:
      - select:
          kind: PersistentVolumeClaim
          name: rustfs-logs
        fieldPaths:
          - spec.resources.requests.storage

  # Rewrite external-dns target annotation to dev UDM Pro
  - sourceValue: udm-pro.zimmermann.phd
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]

patches:
  # RustFS server manages distributed storage and API access
  - target:
      kind: Deployment
      name: rustfs
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/resources
        value: {}
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
