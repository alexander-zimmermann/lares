# One-off: rewrites the April 2026 monthly files in the archive's column order
# (payload, subject, time); April keeps every row. Each original stays as monthly.parquet.orig.
apiVersion: batch/v1
kind: Job

metadata:
  name: nats-archive-dedupe-2026-04
  namespace: rustfs

spec:
  # One attempt; a rerun reads the backup again, so a failed run is safe to repeat.
  backoffLimit: 0
  # No TTL: Argo would recreate a deleted Job and run it again.
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: compactor
          image: ghcr.io/alexander-zimmermann/nats-archive-compactor:0.13.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            # The image's HOME is /app, which the read-only root makes unwritable.
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: RUSTFS_URL
              value: "http://rustfs-svc.rustfs.svc.cluster.local:9000"
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: RUSTFS_SECRET_KEY
            # Every stream with an April 2026 monthly file.
            - name: COMPACT_STREAMS
              value: "ems_esp,knx,solaredge_inverter,solaredge_powerflow,warp_charge_manager,warp_charge_tracker,warp_evse,warp_meter,warp_system"
            - name: COMPACT_DEDUPE_MONTH
              value: "2026/04"
          volumeMounts:
            # Holds the original and the rewrite, about 150 MB for knx.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: tmp
          emptyDir: {}
