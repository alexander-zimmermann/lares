# One-off: rewrites the May 2026 monthly file of warp_charge_tracker, dropping
# the rows the redelivery rules prove to be copies. The original stays as
# monthly.parquet.orig. One Job per stream: a Job's pod template cannot change.
apiVersion: batch/v1
kind: Job

metadata:
  name: nats-archive-dedupe-2026-05-warp-charge-tracker
  namespace: rustfs

spec:
  # One attempt; a rerun reads the backup again, so a failed run is safe to repeat.
  backoffLimit: 0
  # No TTL: Argo would recreate a deleted Job and run it again.
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: compactor
          image: ghcr.io/alexander-zimmermann/nats-archive-compactor:0.15.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            # The image's HOME is /app, which the read-only root makes unwritable.
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: RUSTFS_URL
              value: "http://rustfs-svc.rustfs.svc.cluster.local:9000"
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: RUSTFS_SECRET_KEY
            - name: COMPACT_STREAMS
              value: "warp_charge_tracker"
            - name: COMPACT_DEDUPE_MONTH
              value: "2026/05"
          volumeMounts:
            # Holds the original and the rewrite, up to 700 MB for the largest stream.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "2Gi"
            limits:
              cpu: "1000m"
              # Classifying the largest May file peaks at 2.0 GiB (rehearsed).
              memory: "3Gi"
      volumes:
        - name: tmp
          emptyDir: {}
