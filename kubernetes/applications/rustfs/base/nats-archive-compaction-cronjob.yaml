# Nightly compaction of nats-archive: merges each stream's hour files into one
# daily.parquet and rolls finished months up into monthly.parquet. Runs at 01:00 UTC.
# Streams are discovered from the bucket, so a new sidecar needs no change here.
# Image is built from /Users/alexander/Development/nats-archive-compactor.
apiVersion: batch/v1
kind: CronJob

metadata:
  name: nats-archive-compaction
  namespace: rustfs

spec:
  schedule: "0 1 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: default
          restartPolicy: OnFailure
          containers:
            - name: compactor
              image: ghcr.io/alexander-zimmermann/nats-archive-compactor:0.11.0
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                # The image's HOME is /app, which the read-only root makes unwritable.
                - name: HOME
                  value: /tmp
                - name: TMPDIR
                  value: /tmp
                - name: RUSTFS_URL
                  value: "http://rustfs-svc.rustfs.svc.cluster.local:9000"
                - name: ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-admin-credentials
                      key: RUSTFS_ACCESS_KEY
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-admin-credentials
                      key: RUSTFS_SECRET_KEY
                # Catch up days that never got a daily file, 5 per stream per run.
                # Once nothing is left to catch up this costs a few existence probes.
                - name: COMPACT_BACKFILL_DAYS
                  value: "5"
                # Roll up one finished month per stream per run, oldest first.
                - name: COMPACT_ROLLUP_MONTHS
                  value: "1"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
          volumes:
            - name: tmp
              emptyDir: {}
