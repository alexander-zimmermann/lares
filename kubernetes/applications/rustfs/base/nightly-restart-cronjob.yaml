# Restarts rustfs at 05:30 UTC, after the nightly load chain.
# On 1.0.2 resident memory no longer climbs without bound, but it keeps the
# high-water mark of scanner work: a day that fits an extra cycle lifts the
# floor and later quiet periods reuse that memory instead of releasing it. Over
# four uninterrupted days the floor settled into a band whose top reached 68 %
# of the limit. One restart bounds the band by a single day's worst burst
# instead of the pod's whole lifetime (lares#2143, rustfs#8121).
apiVersion: v1
kind: ServiceAccount

metadata:
  name: rustfs-restart
  namespace: rustfs

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: rustfs-restart
  namespace: rustfs

rules:
  # `rollout restart` patches the pod template; `rollout status` watches it.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: rustfs-restart
  namespace: rustfs

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rustfs-restart

subjects:
  - kind: ServiceAccount
    name: rustfs-restart
    namespace: rustfs

---
apiVersion: batch/v1
kind: CronJob

metadata:
  name: rustfs-nightly-restart
  namespace: rustfs

spec:
  # 05:30 is after the chain's last job (snapshot-cleanup, 05:00), so each day's
  # bursts build the high-water mark from a low start.
  schedule: "30 5 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: rustfs-restart
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: dhi-registry-secret
          containers:
            - name: restart
              # `:1-dev` ships /bin/sh, which the two-step restart needs.
              image: dhi.io/kubectl:1-dev
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  kubectl -n rustfs rollout restart deployment/rustfs
                  kubectl -n rustfs rollout status deployment/rustfs --timeout=5m
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
