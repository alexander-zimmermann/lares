# Post-sync Job that creates the S3 buckets RustFS tenants rely on.
# Runs after every ArgoCD sync; the script is idempotent.
apiVersion: batch/v1
kind: Job

metadata:
  name: initialize-rustfs-buckets
  namespace: rustfs
  annotations:
    argocd.argoproj.io/hook: PostSync

spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: dhi-registry-secret
      # Wait until RustFS is reachable
      initContainers:
        - name: wait-for-rustfs
          image: dhi.io/curl:8-alpine3.23
          command: ["curl"]
          args:
            - --silent
            - --show-error
            - --fail
            - --retry-connrefused
            - --retry-all-errors
            - --retry=60
            - --retry-delay=3
            - --retry-max-time=300
            - http://rustfs-svc.rustfs.svc.cluster.local:9000/health
      containers:
        - name: mc
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          command: ["/bin/sh", "/scripts/initialize-rustfs-buckets.sh"]
          env:
            - name: RUSTFS_URL
              value: "http://rustfs-svc.rustfs.svc.cluster.local:9000"
            - name: BUCKETS
              value: "authentik-backups longhorn-backups timescaledb-backups nats-archive"
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: RUSTFS_SECRET_KEY
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: rustfs-bucket-init-script
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
