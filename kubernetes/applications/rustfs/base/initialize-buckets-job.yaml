# Post-sync Job that creates the S3 buckets RustFS tenants rely on.
# Runs after every ArgoCD sync; the script is idempotent.
apiVersion: batch/v1
kind: Job

metadata:
  name: initialize-rustfs-buckets
  namespace: rustfs
  annotations:
    argocd.argoproj.io/hook: PostSync

spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: dhi-registry-secret
      # Wait until RustFS is reachable
      initContainers:
        - name: wait-for-rustfs
          image: dhi.io/curl:8-alpine3.23
          command: ["curl"]
          args:
            - --silent
            - --show-error
            - --fail
            - --retry-connrefused
            - --retry-all-errors
            - --retry=60
            - --retry-delay=3
            - --retry-max-time=300
            - http://rustfs-svc.rustfs.svc.cluster.local:9000/health
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
      containers:
        - name: rclone
          image: rclone/rclone:1.75.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              for B in $BUCKETS; do
                rclone mkdir "rustfs:$B"
              done
          env:
            - name: BUCKETS
              value: "authentik-backups wiki-js-backups longhorn-backups timescaledb-backups nats-archive influxdb-archive"
            - name: RCLONE_CONFIG_RUSTFS_TYPE
              value: s3
            - name: RCLONE_CONFIG_RUSTFS_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_RUSTFS_ENDPOINT
              value: "http://rustfs-svc.rustfs.svc.cluster.local:9000"
            - name: RCLONE_CONFIG_RUSTFS_FORCE_PATH_STYLE
              value: "true"
            - name: RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: RUSTFS_SECRET_KEY
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
