# Standalone mode (single replica) for homelab usage
replicaCount: 1
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

# Credentials are provided via SealedSecret; the chart reads them from the
# referenced Secret
secret:
  existingSecret: rustfs-admin-credentials

config:
  rustfs:
    # Service DNS used for internal access.
    server_domains: rustfs-svc.rustfs.svc.cluster.local
    # Keep at error: rustfs at info floods the Loki PVC.
    log_level: "error"
    # OTLP push to Alloy. metrics.endpoint must be set explicitly — the chart
    # does not derive it from base_endpoint.
    obs_endpoint:
      enabled: true
      base_endpoint: "http://alloy-alloy-receiver.alloy.svc.cluster.local:4318"
      metrics:
        enabled: true
        endpoint: "http://alloy-alloy-receiver.alloy.svc.cluster.local:4318/v1/metrics"

# Skip recursive chown on PVC when root perms already match (avoids ~3 min
# fsGroup walk over 100k+ files on NFS-backed PVC at every pod start)
podSecurityContext:
  fsGroupChangePolicy: OnRootMismatch

# Ingress is managed outside of the chart (Traefik IngressRoute manifests)
ingress:
  enabled: false

# Storage configuration for data and logs
storageclass:
  name: nfs-csi
  dataStorageSize: PLACEHOLDER
  logStorageSize: PLACEHOLDER

# Raise drive timeouts above the 5s defaults — too tight for NFS-CSI and
# trips FaultyDisk under scanner load (rustfs#2601).
extraEnv:
  - name: RUSTFS_DRIVE_METADATA_TIMEOUT_SECS
    value: "30"
  - name: RUSTFS_DRIVE_DISK_INFO_TIMEOUT_SECS
    value: "30"
  - name: RUSTFS_DRIVE_LIST_DIR_TIMEOUT_SECS
    value: "60"
  - name: RUSTFS_DRIVE_WALKDIR_TIMEOUT_SECS
    value: "120"
  - name: RUSTFS_DRIVE_WALKDIR_STALL_TIMEOUT_SECS
    value: "30"
  - name: RUSTFS_DRIVE_SUSPECT_FAILURE_THRESHOLD
    value: "10"
  - name: RUSTFS_DRIVE_ACTIVE_CHECK_TIMEOUT_SECS
    value: "30"
  # Periodic mi_collect — without it mimalloc never returns freed pages and RSS
  # ratchets into the memory limit. Upstream's run.sh enables it, the image does not.
  - name: RUSTFS_ALLOCATOR_RECLAIM_ENABLED
    value: "true"
  # Object data cache budgets itself from host RAM, not the cgroup limit, and holds
  # ~300 MiB that no allocator reclaim can return. Off until upstream bounds it.
  - name: RUSTFS_OBJECT_DATA_CACHE_ENABLE
    value: "false"
  # Console SSO via Authentik — replaces typing the admin access/secret key.
  # Host URLs are injected per environment via overlay replacements.
  - name: RUSTFS_BROWSER_REDIRECT_URL
    value: https://PLACEHOLDER_RUSTFS_HOST
  - name: RUSTFS_IDENTITY_OPENID_ENABLE
    value: "on"
  - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
    value: https://PLACEHOLDER_AUTH_HOST/application/o/rustfs/
  - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
    value: rustfs
  - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: rustfs-oidc-credentials
        key: RUSTFS_OIDC_CLIENT_SECRET
  - name: RUSTFS_IDENTITY_OPENID_SCOPES
    value: "openid,profile,email,groups"
  - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
    value: https://PLACEHOLDER_RUSTFS_HOST/rustfs/admin/v3/oidc/callback/default
  - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
    value: "off"
  - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
    value: Authentik
  # Claim values must match RustFS policy names — see initialize-rustfs-users.sh.
  - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM
    value: groups
  - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
    value: preferred_username
  - name: RUSTFS_IDENTITY_OPENID_EMAIL_CLAIM
    value: email
