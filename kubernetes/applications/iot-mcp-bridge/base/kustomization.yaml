apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iot-mcp-bridge
resources:
  - ./namespace.yaml
  - ./certificate.yaml
  - ./ingress-route.yaml
  - ./import-knx-catalog-job.yaml
  - ./detect-univariate-cronjob.yaml
  - ./train-iforest-cronjob.yaml
  - ./score-iforest-cronjob.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: iot-mcp-bridge
    version: 8.1.2
    valuesFile: values.yaml
    namespace: iot-mcp-bridge
    apiVersions:
      - monitoring.coreos.com/v1

labels:
  - includeSelectors: false
    pairs:
      homelab.app: iot-mcp-bridge

# Wave 11 = after Kyverno (-4), timescaledb (3), nats-operator (9) and
# knx-nats-bridge (10); aligns with the other consumer apps at wave 10.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "11"
