# PostSync Job that imports the GA catalog (group address → name/room/
# function/description) from the cloned knx-nats-bridge-ga-catalog ConfigMap
# into the `knx_catalog` Postgres table. Uses admin credentials (homelab
# role) — the read-only role the MCP server runs with cannot write.
# Idempotent: re-runs only update changed rows and purge stale ones.
apiVersion: batch/v1
kind: Job

metadata:
  name: iot-mcp-bridge-import-ga-catalog
  namespace: iot-mcp-bridge
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded

spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: importer
          image: ghcr.io/alexander-zimmermann/iot-mcp-bridge:0.10.0
          command: ["python", "-m", "iot_mcp_bridge.cli.import_ga_catalog"]
          args:
            - --catalog-path=/etc/iot-mcp-bridge/ga-catalog.yaml
          env:
            - name: MCP_DB_HOST
              value: timescaledb-db-rw.timescaledb.svc.cluster.local
            - name: MCP_DB_PORT
              value: "5432"
            - name: MCP_DB_NAME
              value: homelab
            - name: MCP_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: timescaledb-db-app
                  key: username
            - name: MCP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-db-app
                  key: password
            - name: MCP_AUTH_ENABLED
              value: "false"
            - name: TZ
              value: Europe/Berlin
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: ga-catalog
              mountPath: /etc/iot-mcp-bridge/ga-catalog.yaml
              subPath: ga-catalog.yaml
              readOnly: true
      volumes:
        - name: ga-catalog
          configMap:
            name: knx-nats-bridge-ga-catalog
            defaultMode: 0444
