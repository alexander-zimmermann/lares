apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: crowdsec-db
  namespace: crowdsec

spec:
  instances: 2

  # Registry authentication for dhi.io images
  imagePullSecrets:
    - name: dhi-registry-secret

  # PostgreSQL version and configuration
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  # Rolling update process is managed by Kubernetes
  primaryUpdateStrategy: unsupervised

  # Storage configuration
  storage:
    storageClass: longhorn-postgres
    size: PLACEHOLDER
  walStorage:
    storageClass: longhorn-postgres
    size: PLACEHOLDER

  # Use non-reusable PVCs for improved failover/rebalance behavior
  nodeMaintenanceWindow:
    reusePVC: false

  # Bootstrap from scratch or restore from backup
  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec

  postgresql:
    parameters:
      # Memory settings
      shared_buffers: "64MB"
      effective_cache_size: "256MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      autovacuum_work_mem: "64MB"

      # WAL settings
      wal_buffers: "16MB"
      max_wal_size: PLACEHOLDER
      min_wal_size: "80MB"
      wal_keep_size: "64MB"
      wal_compression: "on"

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor

metadata:
  name: crowdsec-db
  namespace: crowdsec
  # Prometheus Operator label (Opt-In)
  labels:
    release: prometheus

spec:
  selector:
    matchLabels:
      cnpg.io/cluster: crowdsec-db
  podMetricsEndpoints:
    - port: metrics
