apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lares-mcp-bridge
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml
  # The platform's sampling ratio, rendered from the trigger's use-case file.
  - ../../lares-agent-trigger/base/tracing

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: lares-mcp-bridge
    version: 9.3.2
    valuesFile: values.yaml
    namespace: lares-mcp-bridge
    apiVersions:
      - monitoring.coreos.com/v1

labels:
  - includeSelectors: false
    pairs:
      homelab.app: lares-mcp-bridge

# Wave 11 = after Kyverno (-4), timescaledb (3), nats-operator (9) and
# knx-nats-bridge (10); aligns with the other consumer apps at wave 10.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "11"
