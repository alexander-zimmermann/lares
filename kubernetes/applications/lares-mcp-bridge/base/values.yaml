applicationName: lares-mcp-bridge

deployment:
  enabled: true
  # The allowlists come in as a hashed ConfigMap (pod rolls on change), and there
  # is no Stakater Reloader controller in the cluster.
  reloadOnChange: false
  image:
    repository: ghcr.io/alexander-zimmermann/lares-mcp-bridge
    tag: 1.23.0
    pullPolicy: IfNotPresent

  # Caged by the CiliumClusterwideNetworkPolicy agent-cage (components/cilium)
  podLabels:
    role: agent

  replicas: 1
  strategy:
    type: RollingUpdate

  env:
    MCP_DB_HOST:
      value: timescaledb-db-rw.timescaledb.svc.cluster.local
    MCP_DB_PORT:
      value: "5432"
    MCP_DB_NAME:
      value: homelab
    # DB credentials mounted as files from the synced Secret (Kyverno clones from `timescaledb` namespace)
    MCP_DB_USERNAME_FILE:
      value: /etc/lares-mcp-bridge/db_username
    MCP_DB_PASSWORD_FILE:
      value: /etc/lares-mcp-bridge/db_password
    # Verdict-writer credentials — the server's only write, and a role that
    # may touch no other table.
    MCP_DB_WRITE_USERNAME_FILE:
      value: /etc/lares-mcp-bridge/db_write_username
    MCP_DB_WRITE_PASSWORD_FILE:
      value: /etc/lares-mcp-bridge/db_write_password
    MCP_AUTH_ENABLED:
      value: "true"
    MCP_AUTH_JWKS_URL:
      value: PLACEHOLDER_AUTH_JWKS_URL
    MCP_AUTH_ISSUER:
      value: PLACEHOLDER_AUTH_ISSUER
    MCP_AUTH_AUDIENCE:
      value: lares-mcp-bridge
    MCP_AUTH_RESOURCE_URL:
      value: PLACEHOLDER_AUTH_RESOURCE_URL
    # Machine clients (agents) authenticate with a key from this file instead of a JWT
    MCP_AUTH_CLIENTS_FILE:
      value: /etc/lares-mcp-bridge/auth-clients.json
    # What each machine client may see and call, rendered from the agents' use-case file
    MCP_AUTH_CLIENT_TOOLS:
      valueFrom:
        configMapKeyRef:
          name: lares-mcp-bridge-client-tools
          key: MCP_AUTH_CLIENT_TOOLS
    MCP_NATS_SERVERS:
      value: nats://nats.nats.svc:4222
    # NATS nkey seed mounted as a file from the synced Secret (Kyverno clones from `nats` namespace)
    MCP_NATS_NKEY_SEED_FILE:
      value: /etc/lares-mcp-bridge/nats-nkey-seed
    # Wiki.js over the cluster-internal Service (port 80); the read-only API key
    # is mounted as a file from the SealedSecret in this directory.
    MCP_WIKIJS_URL:
      value: http://wiki-js.wiki-js.svc
    MCP_WIKIJS_TOKEN_FILE:
      value: /etc/lares-mcp-bridge/wikijs-token
    # start_run carries the chat's request to lares-agent-trigger, with the key
    # sealed for both namespaces and mounted from the SealedSecret in this directory.
    MCP_TRIGGER_URL:
      value: http://lares-agent-trigger.agents.svc.cluster.local:8080
    MCP_TRIGGER_KEY_FILE:
      value: /etc/lares-mcp-bridge/trigger-api-key
    MCP_LOG_FORMAT:
      value: json
    TZ:
      value: Europe/Berlin

  volumes:
    db-username:
      secret:
        secretName: timescaledb-db-lares-mcp-bridge-ro-secret
        items:
          - key: username
            path: username
    db-password:
      secret:
        secretName: timescaledb-db-lares-mcp-bridge-ro-secret
        items:
          - key: password
            path: password
    db-write-username:
      secret:
        secretName: timescaledb-db-lares-mcp-bridge-verdict-secret
        items:
          - key: username
            path: username
    db-write-password:
      secret:
        secretName: timescaledb-db-lares-mcp-bridge-verdict-secret
        items:
          - key: password
            path: password
    nats-nkey-seed:
      secret:
        secretName: lares-mcp-bridge-nats-credentials
        items:
          - key: nkey-seed
            path: nkey-seed
    wikijs-token:
      secret:
        secretName: lares-mcp-bridge-wikijs-token
        items:
          - key: token
            path: token
    auth-clients:
      secret:
        secretName: lares-mcp-bridge-auth-clients
        items:
          - key: clients.json
            path: clients.json
    trigger-api-key:
      secret:
        secretName: lares-mcp-bridge-trigger-api-key
        items:
          - key: api-key
            path: api-key

  volumeMounts:
    db-username:
      mountPath: /etc/lares-mcp-bridge/db_username
      subPath: username
      readOnly: true
    db-password:
      mountPath: /etc/lares-mcp-bridge/db_password
      subPath: password
      readOnly: true
    db-write-username:
      mountPath: /etc/lares-mcp-bridge/db_write_username
      subPath: username
      readOnly: true
    db-write-password:
      mountPath: /etc/lares-mcp-bridge/db_write_password
      subPath: password
      readOnly: true
    nats-nkey-seed:
      mountPath: /etc/lares-mcp-bridge/nats-nkey-seed
      subPath: nkey-seed
      readOnly: true
    wikijs-token:
      mountPath: /etc/lares-mcp-bridge/wikijs-token
      subPath: token
      readOnly: true
    auth-clients:
      mountPath: /etc/lares-mcp-bridge/auth-clients.json
      subPath: clients.json
      readOnly: true
    trigger-api-key:
      mountPath: /etc/lares-mcp-bridge/trigger-api-key
      subPath: api-key
      readOnly: true

  ports:
    - containerPort: 8080
      name: mcp
      protocol: TCP
    - containerPort: 9090
      name: metrics
      protocol: TCP

  livenessProbe:
    enabled: true
    httpGet:
      # /livez is process-only (always 200 while the app runs) — a TSDB outage
      # must not restart the pod; /healthz stays DB-gated for readiness below.
      path: /livez
      port: mcp
    initialDelaySeconds: 10
    periodSeconds: 30

  readinessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: mcp
    initialDelaySeconds: 5
    periodSeconds: 10

  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  securityContext:
    fsGroup: 1000

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 8080
      name: mcp
      protocol: TCP
      targetPort: mcp
    - port: 9090
      name: metrics
      protocol: TCP
      targetPort: metrics

serviceMonitor:
  enabled: true
  additionalLabels:
    # Prometheus Operator label (Opt-In)
    release: prometheus
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
