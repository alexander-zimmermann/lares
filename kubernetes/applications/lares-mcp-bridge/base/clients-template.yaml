# generated by `task agents:create-harness-config`, do not edit
# The bridge's machine clients and their keys, composed from the keys sealed
# one by one in sealed-secret.yaml, each under its client's name.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lares-mcp-bridge-auth-clients
  namespace: lares-mcp-bridge
spec:
  template:
    data:
      clients.json: |
        {
          "lares-agent": {{ index . "lares-agent" | toJson }},
          "lares-runs": {{ index . "lares-runs" | toJson }},
          "lares-memory": {{ index . "lares-memory" | toJson }}
        }
