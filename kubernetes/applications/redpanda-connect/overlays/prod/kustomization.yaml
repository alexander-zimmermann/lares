apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Redpanda Connect service with static IP and BGP advertisement
  - target:
      kind: Service
      name: redpanda-connect
    patch: |-
      - op: test
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/annotations/io.cilium~1lb-ipam-ips
        value: "192.168.10.221"

  - target:
      kind: Deployment
      name: redpanda-connect
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: connect
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 1Gi
