apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: redpanda-connect
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml

helmCharts:
  - name: connect
    repo: https://charts.redpanda.com
    releaseName: redpanda-connect
    version: 3.2.26
    valuesFile: values.yaml
    namespace: redpanda-connect

configMapGenerator:
  - name: redpanda-connect-streams
    files:
      - streams/knx.yaml
      - streams/solaredge_inverter.yaml
      - streams/solaredge_powerflow.yaml
      - streams/solaredge_battery.yaml
      - streams/ems_esp.yaml
      - streams/warp_system.yaml
      - streams/warp_evse.yaml
      - streams/warp_charge_manager.yaml
      - streams/warp_charge_tracker.yaml
      - streams/warp_meter.yaml
      - streams/warp_knx_republish.yaml
      - streams/unifi_events.yaml
      - streams/unifi_webhook.yaml
      - streams/unifi_arm_alarm.yaml
      - streams/pv_surplus_to_warp.yaml
      - streams/warp_onoff_from_knx.yaml
      - streams/warp_charge_mode_from_knx.yaml
      - streams/warp_charging_status.yaml
      - streams/warp_mode_buttons_from_knx.yaml
      - streams/warp_mode_flags.yaml
      - streams/dyson_from_knx.yaml
      - streams/dyson_environment.yaml
      - streams/dyson_state.yaml
      - streams/midea_environment.yaml
      - streams/midea_state.yaml
      - streams/midea_from_knx.yaml
      - streams/bordbar_from_knx.yaml

patches:
  # Expose redpanda-connect service via Cilium/BGP-announced LoadBalancer so
  # UniFi Protect can POST its Alarm Manager webhook to the unifi_webhook
  # stream (extraPorts: 4196 in values.yaml).
  - target:
      kind: Service
      name: redpanda-connect
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/labels/bgp.cilium.io~1ip-pool
        value: default
      - op: add
        path: /metadata/labels/bgp.cilium.io~1advertise-service
        value: default
  # The connect chart's ServiceMonitor template hardcodes only the default
  # app.kubernetes.io labels and ignores serviceMonitor.labels, so the
  # `release: prometheus` label the Prometheus serviceMonitorSelector requires
  # has to be injected here — otherwise the SM is never scraped.
  - target:
      kind: ServiceMonitor
      name: redpanda-connect
    patch: |-
      - op: add
        path: /metadata/labels/release
        value: prometheus

labels:
  - includeSelectors: false
    pairs:
      homelab.app: redpanda-connect

commonAnnotations:
  argocd.argoproj.io/sync-wave: "4"
