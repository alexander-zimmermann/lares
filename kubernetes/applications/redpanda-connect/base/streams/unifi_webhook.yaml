# UniFi Protect Alarm Manager webhook handler -> per-trigger NATS messages.
#
# Splits alarm.triggers[], resolves camera MAC -> name, derives knx_value, and
# publishes one message per trigger so knx-nats-bridge can write KNX.
# Geofence triggers (key=admin_geolocation) get their own subject so the
# node-RED Geofence tab can subscribe via the NATS MQTT gateway.
input:
  http_server:
    address: 0.0.0.0:4196
    path: /unifi-protect
    allowed_verbs: [POST]

pipeline:
  processors:
    # Replace the message with the triggers[] array, then split.
    - mapping: 'root = this.alarm.triggers'
    - unarchive:
        format: json_array

    # Resolve camera, derive knx_value, set the NATS subject.
    - mapping: |
        let camera_map = {
          "28704E15C2E2": "fassade",
          "28704E153647": "eingang",
          "1C6A1B83322C": "terrasse_wohnzimmer",
          "28704E12AEEE": "terrasse_esszimmer",
        }
        # UniFi reuses the same friendly name across face and license-plate
        # of-interest/known triggers, so one person -> int lookup serves both.
        let person_map = {
          "Alexander Zimmermann": 1,
          "Vanessa Zimmermann":   2,
          "Luis Zimmermann":      3,
          "Gregory Zimmermann":   4,
        }

        let camera = $camera_map.get(this.device).or("unknown")
        let key    = this.key

        let person_keys = [
          "face_known", "face_of_interest",
          "license_plate_known", "license_plate_of_interest",
        ]
        let knx_value = if $person_keys.contains($key) {
            $person_map.get(this.value).or(0)
          } else {
            1
          }

        root = this.assign({"knx_value": $knx_value, "camera": $camera})
        # admin_geolocation has no camera and no direction info — route it
        # to a dedicated subject so the node-RED Geofence tab can subscribe
        # via NATS MQTT gateway and enrich with the iCloud notification mail.
        meta nats_subject = if $key == "admin_geolocation" {
            "unifi.geofence.trigger"
          } else {
            "unifi.events." + $camera + "." + $key
          }

output:
  nats_jetstream:
    urls: ["nats://nats.nats.svc:4222"]
    auth:
      user: redpanda-connect
      password: ${NATS_PASSWORD}
    subject: ${! meta("nats_subject") }
