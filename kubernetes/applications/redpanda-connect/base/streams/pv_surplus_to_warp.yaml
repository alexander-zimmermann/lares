# PV surplus forwarder: KNX grid net power -> WARP Charge Manager.
#
#   knx.15.1.24 Wirkleistung-Gesamt (14.056) -> charge_manager external power
#
# Lets the wallbox balance EV charging against PV surplus.
input:
  # Consumer is declared as a CRD in nats/base/consumers/pv_surplus_to_warp.yaml.
  nats_jetstream:
    urls: ["nats://nats.nats.svc:4222"]
    auth:
      user: redpanda-connect
      password: ${NATS_PASSWORD}
    stream: KNX
    durable: redpanda-connect-pv-surplus-to-warp
    bind: true
    # Join the trace carried in the NATS headers
    extract_tracing_map: root = @

pipeline:
  processors:
    # Pass-through; tags the trace with span.group for TraceQL
    - group_by_value:
        value: pv_surplus_to_warp
    # knx-nats-bridge publishes {ga, name, value, dpt, ...}.
    # WARP firmware expects /meters/1/update payload as a single-element
    # array of watts.
    - mapping: 'root = [this.value]'

output:
  mqtt:
    urls: ["tcp://nats.nats.svc:1883"]
    client_id: redpanda-connect-pv-surplus
    user: redpanda-connect
    password: ${NATS_PASSWORD}
    topic: warp/meters/1/update
    qos: 0
