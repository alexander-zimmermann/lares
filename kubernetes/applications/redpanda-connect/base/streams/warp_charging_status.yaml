# Freigabe-Status feedback: WARP charge release -> KNX Freigabe status GA.
#
#   WARP Slot 4 release -> wallbox.knx.charging $.on -> knx.15.6.21 (1.001)
#
# Mirrors the charge release that the Freigabe switch (15/6/20
# start/stop_charging) toggles. Blocked (active && max_current == 0) => off;
# otherwise => on. Tracks only the release intent, independent of car presence
# or current draw — unlike charger_state, which is 0 whenever no car is plugged
# in. The bridge can't index an array, so the bool is derived here.
input:
  nats_jetstream:
    urls: ["nats://nats.nats.svc:4222"]
    auth:
      user: redpanda-connect
      password: ${NATS_PASSWORD}
    stream: WARP
    subject: warp.evse.slots
    durable: redpanda-connect-warp-charging-status-slot4
    deliver: last
    ack_wait: 20m
    max_ack_pending: 5000

pipeline:
  processors:
    # Slot 4 = manual/button charge release; blocked == active && max_current 0.
    - mapping: 'root = { "on": !(this.index(4).active && this.index(4).max_current == 0) }'

output:
  # Core NATS publish for live delivery (the bridge writer subscribes core).
  # The WALLBOX_KNX JetStream (wallbox.knx.>) still archives it, so the writer's
  # seed_on_start can prime the read-responder from the last value on restart.
  nats:
    urls: ["nats://nats.nats.svc:4222"]
    auth:
      user: redpanda-connect
      password: ${NATS_PASSWORD}
    subject: wallbox.knx.charging
