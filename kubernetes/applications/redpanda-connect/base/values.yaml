# Pipeline definitions in streams/*.yaml, mounted via configMapGenerator
streams:
  enabled: true
  streamsConfigMap: redpanda-connect-streams

# JetStream durable consumer can only bind one subscription — Recreate avoids "already bound" loop
updateStrategy:
  type: Recreate

# Expose the UniFi Protect webhook port (stream `unifi_webhook` binds 4196).
# Service type is patched to LoadBalancer + Cilium BGP labels in kustomization.yaml.
service:
  extraPorts:
    - name: unifi-webhook
      port: 4196
      targetPort: 4196
      protocol: TCP

env:
  # NATS user (cloned from nats namespace by Kyverno)
  - name: NATS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: redpanda-connect-credentials
        key: NATS_PASSWORD
  # CNPG-managed connect-role credentials (cloned from timescaledb namespace by Kyverno)
  - name: PGUSER
    valueFrom:
      secretKeyRef:
        name: timescaledb-db-connect-secret
        key: username
  - name: PGPASSWORD
    valueFrom:
      secretKeyRef:
        name: timescaledb-db-connect-secret
        key: password
  # RustFS per-app scoped credentials (write-only on nats-archive) for the
  # cold-archive parquet output (cloned from rustfs namespace by Kyverno)
  - name: RUSTFS_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: rustfs-redpanda-connect-credentials
        key: RUSTFS_ACCESS_KEY
  - name: RUSTFS_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: rustfs-redpanda-connect-credentials
        key: RUSTFS_SECRET_KEY
  # UniFi Protect local API key + target arm-profile ID for the unifi_arm_alarm stream
  - name: UNIFI_PROTECT_API_KEY
    valueFrom:
      secretKeyRef:
        name: redpanda-connect-unifi-protect
        key: UNIFI_PROTECT_API_KEY
  - name: UNIFI_PROTECT_ARM_PROFILE_ID
    valueFrom:
      secretKeyRef:
        name: redpanda-connect-unifi-protect
        key: UNIFI_PROTECT_ARM_PROFILE_ID

# Expose connect/benthos metrics (incl. custom `metric` processors such as
# unifi_arm_sync_ok) in Prometheus format at :4195/metrics for the
# ServiceMonitor below to scrape.
metrics:
  prometheus: {}

serviceMonitor:
  enabled: true
  interval: 30s
  # NOTE: the chart's ServiceMonitor template ignores serviceMonitor.labels, so
  # the `release: prometheus` selector label is injected via a kustomize patch
  # in kustomization.yaml instead.
