apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard

metadata:
  name: knx-episodes
  namespace: grafana

spec:
  folder: "Smart Home"
  instanceSelector:
    matchLabels:
      homelab.app: grafana
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Vorfälle der Erkennungskette: wiederholte Beobachtungen eines Fehlers, zu einer Episode gefaltet. Ersetzt den Wochenbericht. Der Fehlersatz mit seiner Einheit steht in faults.yaml, der Schweregrad 0-3 ist der Zustellvertrag auf der Gruppenadresse.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Offene Situationen",
          "datasource": {
            "type": "postgres",
            "uid": "timescaledb"
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "timescaledb"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH ep AS (\n  SELECT e.id, e.fault, e.subject, e.started_at, e.last_seen_at, e.ended_at,\n         e.severity, e.peak_score, e.externally_delivered,\n         COALESCE(c.name, substring(e.subject from '\\[([^]]+)\\]'), e.subject) AS betroffen,\n         COALESCE(c.room, 'ohne Raum') AS raum,\n         v.verdict\n  FROM episodes e\n  LEFT JOIN ga_catalog c ON c.ga = substring(e.subject from '[0-9]+/[0-9]+/[0-9]+')\n  LEFT JOIN episode_verdicts v ON v.episode_id = e.id\n  WHERE (e.folded = ('$herkunft' = 'folded') OR '$herkunft' = 'both')\n    AND e.fault = ANY (ARRAY[${fault:sqlstring}]::text[])\n    AND e.severity = ANY (ARRAY[${severity:csv}]::smallint[])\n)\nSELECT count(*) AS \"Offen\" FROM ep WHERE ended_at IS NULL;",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "blue",
                    "value": 1
                  },
                  {
                    "color": "orange",
                    "value": 15
                  },
                  {
                    "color": "red",
                    "value": 40
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "description": "Vorfälle ohne ended_at — was gerade läuft. Unabhängig vom Zeitbereich: offen ist offen."
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Davon kritisch",
          "datasource": {
            "type": "postgres",
            "uid": "timescaledb"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 5,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "timescaledb"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH ep AS (\n  SELECT e.id, e.fault, e.subject, e.started_at, e.last_seen_at, e.ended_at,\n         e.severity, e.peak_score, e.externally_delivered,\n         COALESCE(c.name, substring(e.subject from '\\[([^]]+)\\]'), e.subject) AS betroffen,\n         COALESCE(c.room, 'ohne Raum') AS raum,\n         v.verdict\n  FROM episodes e\n  LEFT JOIN ga_catalog c ON c.ga = substring(e.subject from '[0-9]+/[0-9]+/[0-9]+')\n  LEFT JOIN episode_verdicts v ON v.episode_id = e.id\n  WHERE (e.folded = ('$herkunft' = 'folded') OR '$herkunft' = 'both')\n    AND e.fault = ANY (ARRAY[${fault:sqlstring}]::text[])\n    AND e.severity = ANY (ARRAY[${severity:csv}]::smallint[])\n)\nSELECT count(*) FILTER (WHERE severity = 3) AS \"Kritisch\" FROM ep WHERE ended_at IS NULL;",
              "refId": "A"
            }
