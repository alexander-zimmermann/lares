                  "editorMode": "code",
                  "format": "table",
                  "rawQuery": true,
                  "rawSql": "WITH ep AS (\n  SELECT e.id, e.fault, e.subject, e.started_at, e.last_seen_at, e.ended_at,\n         e.severity, e.peak_score, e.externally_delivered,\n         COALESCE(c.name, substring(e.subject from '\\[([^]]+)\\]'), e.subject) AS betroffen,\n         COALESCE(c.room, 'ohne Raum') AS raum,\n         v.verdict\n  FROM episodes e\n  LEFT JOIN ga_catalog c ON c.ga = substring(e.subject from '[0-9]+/[0-9]+/[0-9]+')\n  LEFT JOIN episode_verdicts v ON v.episode_id = e.id\n  WHERE (e.folded = ('$herkunft' = 'folded') OR '$herkunft' = 'both')\n    AND e.fault = ANY (ARRAY[${fault:sqlstring}]::text[])\n    AND e.severity = ANY (ARRAY[${severity:csv}]::smallint[])\n)\nSELECT ended_at                                   AS \"Beendet\",\n       severity                                   AS \"Schweregrad\",\n       fault                                      AS \"Fehler\",\n       betroffen                                  AS \"Betroffen\",\n       raum                                       AS \"Raum\",\n       started_at                                 AS \"Begonnen\",\n       EXTRACT(EPOCH FROM ended_at - started_at)  AS \"Dauer\",\n       round(peak_score::numeric, 2)              AS \"Spitzenwert\",\n       CASE verdict WHEN 'real' THEN 'Echt' WHEN 'nonsense' THEN 'Unsinn' ELSE 'unbeurteilt' END AS \"Urteil\"\nFROM ep WHERE ended_at IS NOT NULL AND $__timeFilter(ended_at)\nORDER BY ended_at DESC LIMIT 200;",
