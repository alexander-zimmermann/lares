                    "color": "red",
                    "value": 12
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
