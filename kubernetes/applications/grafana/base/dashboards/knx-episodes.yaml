        {
          "id": 4,
          "type": "stat",
          "title": "Beendet (7 Tage)",
          "datasource": {
            "type": "postgres",
            "uid": "timescaledb"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 14,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "timescaledb"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH ep AS (\n  SELECT e.id, e.fault, e.subject, e.started_at, e.last_seen_at, e.ended_at,\n         e.severity, e.peak_score, e.externally_delivered,\n         COALESCE(c.name, substring(e.subject from '\\[([^]]+)\\]'), e.subject) AS betroffen,\n         COALESCE(c.room, 'ohne Raum') AS raum,\n         v.verdict\n  FROM episodes e\n  LEFT JOIN ga_catalog c ON c.ga = substring(e.subject from '[0-9]+/[0-9]+/[0-9]+')\n  LEFT JOIN episode_verdicts v ON v.episode_id = e.id\n  WHERE (e.folded = ('$herkunft' = 'folded') OR '$herkunft' = 'both')\n    AND e.fault = ANY (ARRAY[${fault:sqlstring}]::text[])\n    AND e.severity = ANY (ARRAY[${severity:csv}]::smallint[])\n)\nSELECT count(*) AS \"Beendet\" FROM ep WHERE ended_at > now() - INTERVAL '7 days';",
              "refId": "A"
