            "rowHeight": 0.9,
            "showValue": "never",
            "tooltip": {
              "hideZeros": false,
              "mode": "single",
              "sort": "none"
            }
          },
          "description": "Je Zeile eine offene Situation, je Farbe ihr Schweregrad pro Stunde — die Evidenzzeilen unter der Episode. Nur offene Vorfälle, damit die Abfrage klein bleibt."
        },
        {
