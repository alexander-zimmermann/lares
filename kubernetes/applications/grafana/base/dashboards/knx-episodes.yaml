        {
          "id": 7,
          "type": "state-timeline",
          "title": "Schweregrad-Verlauf der offenen Situationen",
          "datasource": {
            "type": "postgres",
            "uid": "timescaledb"
          },
          "gridPos": {
            "h": 13,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "timescaledb"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "WITH ep AS (\n  SELECT e.id, e.fault, e.subject, e.started_at, e.last_seen_at, e.ended_at,\n         e.severity, e.peak_score, e.externally_delivered,\n         COALESCE(c.name, substring(e.subject from '\\[([^]]+)\\]'), e.subject) AS betroffen,\n         COALESCE(c.room, 'ohne Raum') AS raum,\n         v.verdict\n  FROM episodes e\n  LEFT JOIN ga_catalog c ON c.ga = substring(e.subject from '[0-9]+/[0-9]+/[0-9]+')\n  LEFT JOIN episode_verdicts v ON v.episode_id = e.id\n  WHERE (e.folded = ('$herkunft' = 'folded') OR '$herkunft' = 'both')\n    AND e.fault = ANY (ARRAY[${fault:sqlstring}]::text[])\n    AND e.severity = ANY (ARRAY[${severity:csv}]::smallint[])\n)\nSELECT o.time                              AS time,\n       ep.fault || ' · ' || ep.betroffen   AS metric,\n       o.severity                          AS value\nFROM episode_observations o\nJOIN ep ON ep.id = o.episode_id\nWHERE ep.ended_at IS NULL AND $__timeFilter(o.time)\nORDER BY 1;",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
