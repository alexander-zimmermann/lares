apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource

metadata:
  name: prometheus
  namespace: grafana

spec:
  valuesFrom: []
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-operated.prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "30s"
  instanceSelector:
    matchLabels:
      homelab.app: grafana

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource

metadata:
  name: loki
  namespace: grafana

spec:
  uid: loki
  valuesFrom: []
  datasource:
    name: Loki
    type: loki
    access: proxy
    url: http://loki-gateway.loki.svc:80
    isDefault: false
    editable: false
    jsonData:
      # A JSON log line written inside a span opens that span's trace.
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          datasourceUid: tempo
          url: "${__value.raw}"
          urlDisplayLabel: Trace
  instanceSelector:
    matchLabels:
      homelab.app: grafana

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource

metadata:
  name: tempo
  namespace: grafana

spec:
  uid: tempo
  valuesFrom: []
  datasource:
    name: Tempo
    type: tempo
    access: proxy
    url: http://tempo.tempo.svc:3200
    isDefault: false
    editable: false
    jsonData:
      # A span's log lines are those that carry its trace id; Tempo and Loki only echo it from a lookup.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{namespace=~".+", namespace!~"tempo|loki"} |= "${__trace.traceId}"'
  instanceSelector:
    matchLabels:
      homelab.app: grafana

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource

metadata:
  name: timescaledb
  namespace: grafana

spec:
  uid: timescaledb
  valuesFrom:
    - targetPath: secureJsonData.password
      valueFrom:
        secretKeyRef:
          name: timescaledb-db-grafana-ro-secret
          key: password
  datasource:
    name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb-db-pooler.timescaledb.svc.cluster.local:5432
    user: grafana_ro
    isDefault: false
    editable: false
    jsonData:
      database: homelab
      sslmode: disable
      postgresVersion: 1800
      timescaledb: true
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: ${password}
  instanceSelector:
    matchLabels:
      homelab.app: grafana
