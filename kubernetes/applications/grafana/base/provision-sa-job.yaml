# Post-sync Job that provisions a Grafana service account + API token via the
# admin HTTP API. Runs after every ArgoCD sync; the script is idempotent,
# and the hook-delete-policy cleans up the Job object on success.
apiVersion: batch/v1
kind: Job

metadata:
  name: provision-grafana-sa
  namespace: grafana
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded

spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: grafana-sa-provisioner
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: dhi-registry-secret
      initContainers:
        # Wait until Grafana is ready
        - name: wait-for-grafana
          image: dhi.io/curl:8-alpine3.23
          command: ["curl"]
          args:
            - --silent
            - --fail
            - --retry-connrefused
            - --retry-all-errors
            - --retry=60
            - --retry-delay=3
            - --retry-max-time=300
            - http://grafana.grafana.svc.cluster.local/api/health
      containers:
        - name: provision
          image: alpine/k8s:1.36.2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          command: ["/bin/sh", "/scripts/provision-grafana-sa.sh"]
          env:
            - name: GRAFANA_URL
              value: "http://grafana.grafana.svc.cluster.local"
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: grafana-sa-provisioner-script
            defaultMode: 0555
        - name: config
          configMap:
            name: grafana-sa-provisioner-config
        - name: tmp
          emptyDir: {}
