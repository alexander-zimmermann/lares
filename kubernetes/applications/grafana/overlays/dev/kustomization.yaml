apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replacements:
  # Inject PVC storage size for Grafana
  - sourceValue: 128Mi
    targets:
      - select:
          kind: PersistentVolumeClaim
          name: grafana
        fieldPaths:
          - spec.resources.requests.storage

  # Inject domain name into Certificate, IngressRoute, and Homepage href annotation
  - sourceValue: grafana.zimmermann.phd
    targets:
      - select:
          kind: Certificate
          name: grafana-tls-cert
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: IngressRoute
          name: grafana
        fieldPaths:
          - spec.routes.0.match
          - spec.routes.1.match
        options:
          delimiter: "`"
          index: 1
      - select:
          kind: Deployment
          name: grafana
        fieldPaths:
          - spec.template.spec.containers.2.env.[name=GF_SERVER_ROOT_URL].value
        options:
          delimiter: "//"
          index: 1
      - select:
          kind: IngressRoute
          name: grafana
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: "//"
          index: 1
      - select:
          kind: IngressRoute
          name: grafana
        fieldPaths:
          - metadata.annotations.[gatus.home-operations.com/endpoint]
        options:
          delimiter: "/"
          index: 2

  # Inject Authentik host into all three OAuth URL env vars
  - sourceValue: auth.zimmermann.phd
    targets:
      - select:
          kind: Deployment
          name: grafana
        fieldPaths:
          - spec.template.spec.containers.2.env.[name=GF_AUTH_GENERIC_OAUTH_AUTH_URL].value
        options:
          delimiter: "/"
          index: 2
      - select:
          kind: Deployment
          name: grafana
        fieldPaths:
          - spec.template.spec.containers.2.env.[name=GF_AUTH_GENERIC_OAUTH_TOKEN_URL].value
        options:
          delimiter: "/"
          index: 2
      - select:
          kind: Deployment
          name: grafana
        fieldPaths:
          - spec.template.spec.containers.2.env.[name=GF_AUTH_GENERIC_OAUTH_API_URL].value
        options:
          delimiter: "/"
          index: 2
      - select:
          kind: Deployment
          name: grafana
        fieldPaths:
          - spec.template.spec.containers.2.env.[name=GF_AUTH_SIGNOUT_REDIRECT_URL].value
        options:
          delimiter: "/"
          index: 2

  # Rewrite external-dns target annotation to dev UDM Pro
  - sourceValue: udm-pro.zimmermann.phd
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]

patches:
  # Configure resources for Grafana Instance containers (main container & dashboard/datasource sidecars)
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: grafana-sc-dashboard
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

      - op: test
        path: /spec/template/spec/containers/1/name
        value: grafana-sc-datasources
      - op: add
        path: /spec/template/spec/containers/1/resources
        value:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

      - op: test
        path: /spec/template/spec/containers/2/name
        value: grafana
      - op: add
        path: /spec/template/spec/containers/2/resources
        value:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

  # Configure resources for Grafana Image Renderer
  - target:
      kind: Deployment
      name: grafana-image-renderer
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: grafana-image-renderer
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
