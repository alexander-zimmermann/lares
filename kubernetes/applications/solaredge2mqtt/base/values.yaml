deployment:
  enabled: true
  # ConfigMap uses a kustomize content-hash name, so a config change rolls the
  # pod natively. The Stakater Reloader annotation is not used — there is no
  # Reloader controller in the cluster.
  reloadOnChange: false
  replicas: 1
  image:
    repository: ghcr.io/deroetzi/solaredge2mqtt
    tag: 2.3.1
    pullPolicy: IfNotPresent

  # No API access required.
  automountServiceAccountToken: false

  env:
    TZ:
      value: "Europe/Berlin"

  volumes:
    # Per-instance ConfigMap; the actual `name` is overridden via valuesInline.
    config-volume:
      configMap:
        name: solaredge2mqtt-config-PLACEHOLDER
    # MQTT credentials (secrets.yml with password); shared between both instances.
    secrets-volume:
      secret:
        secretName: solaredge2mqtt-credentials
    # Writable cache directory required by the application.
    cache-volume:
      emptyDir: {}

  volumeMounts:
    config-volume:
      mountPath: /app/config/configuration.yml
      subPath: configuration.yml
      readOnly: true
    secrets-volume:
      mountPath: /app/config/secrets.yml
      subPath: secrets.yml
      readOnly: true
    cache-volume:
      mountPath: /app/cache

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Image entrypoint runs as root, chown's /app/cache, then `su`'s to the solaredge2mqtt
  # user (UID 1000). The chart's runAsNonRoot default would block kubelet startup —
  # turn it off; readOnlyRootFilesystem must also stay false for the chown to succeed.
  containerSecurityContext:
    runAsNonRoot: false
    readOnlyRootFilesystem: false

# No Service / no Probes — solaredge2mqtt is an outbound-only MQTT publisher.
service:
  enabled: false
