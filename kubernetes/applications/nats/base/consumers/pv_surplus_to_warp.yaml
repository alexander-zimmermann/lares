# Durable consumer for the redpanda-connect pv_surplus_to_warp pipeline.
#
#   knx.15.1.24 Wirkleistung-Gesamt (14.056)
#
# The grid net power reading the WARP wallbox uses for surplus charging.
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: redpanda-connect-pv-surplus-to-warp
  namespace: nats
spec:
  streamName: KNX
  durableName: redpanda-connect-pv-surplus-to-warp
  filterSubject: knx.15.1.24
  deliverPolicy: new
  ackPolicy: explicit
  maxAckPending: 64
