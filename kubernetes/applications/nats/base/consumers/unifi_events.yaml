# Durable consumer for the redpanda-connect unifi_events pipeline.
#
#   unifi.events.>   per-trigger camera detections
#   unifi.geofence.> presence-change triggers
#
# Both are covered by the unifi.> subject filter.
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: redpanda-connect-unifi-events
  namespace: nats
spec:
  streamName: UNIFI
  durableName: redpanda-connect-unifi-events
  filterSubject: unifi.>
  deliverPolicy: all
  ackPolicy: explicit
  ackWait: 20m
  maxAckPending: 5000
