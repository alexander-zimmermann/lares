# Durable consumer for the redpanda-connect warp_onoff_from_knx pipeline.
#
#   knx.15.6.20 Freigabe (1.001)
#
# redpanda-connect maps it to WARP's evse/start_charging | stop_charging.
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: redpanda-connect-warp-onoff-from-knx
  namespace: nats
spec:
  streamName: KNX
  durableName: redpanda-connect-warp-onoff-from-knx
  filterSubject: knx.15.6.20
  deliverPolicy: new
  ackPolicy: explicit
  maxAckPending: 64
