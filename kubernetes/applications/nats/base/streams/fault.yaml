# DERIVED stream — NOT a primary data source. The `fault.*` subjects carry
# severity-level events emitted by the lares-diagnostics-engine fault list. They
# are event-driven (published only when a severity tier changes), so this
# stream exists only so the knx-nats-bridge read responder can be seeded on
# startup for the fault GAs; without it a read after a redeploy returns
# no_value until the next severity change (which may be days away).
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: fault
  namespace: nats
spec:
  name: FAULT
  subjects:
    - fault.>
  storage: file
  retention: limits
  maxAge: 168h
  replicas: 1
