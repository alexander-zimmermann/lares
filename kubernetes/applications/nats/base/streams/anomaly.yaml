# Predecessor of fault.yaml: the engine published its severities on
# `anomaly.*` before the fault.* rename. Kept until every severity has moved
# over, so the knx-nats-bridge read responder still seeds from it meanwhile.
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: anomaly
  namespace: nats
spec:
  name: ANOMALY
  subjects:
    - anomaly.>
  storage: file
  retention: limits
  maxAge: 168h
  replicas: 1
