# DERIVED stream — NOT a primary data source. The `energy.*` subjects carry the
# daily PV energy-balance scalars published by the iot-insights-engine
# energy-balance batch job (one publish per CronJob run). Like anomaly.>/forecast.>
# they are low-frequency event-driven, so this stream exists only so the
# knx-nats-bridge read responder can be seeded on startup for the bilanz GAs
# (15/4/60..65); without it a read after a redeploy returns no_value until the
# next CronJob run.
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: energy
  namespace: nats
spec:
  name: ENERGY
  subjects:
    - energy.>
  storage: file
  retention: limits
  maxAge: 168h
  replicas: 1
