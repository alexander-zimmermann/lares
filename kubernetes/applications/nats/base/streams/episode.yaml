# Episode events published by lares-diagnostics-engine right after the episode
# rows are written (episode.appeared|escalated|ended), one pointer message per
# event; CONTEXT.md names the payload fields. Unlike fault.>, this stream is
# not a seeding aid: an episode event happens once and is never republished,
# so the seven days are what a durable pull consumer can still read it out of
# after a restart. Nothing consumes it yet.
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: episode
  namespace: nats
spec:
  name: EPISODE
  subjects:
    - episode.>
  storage: file
  retention: limits
  maxAge: 168h
  replicas: 1
