apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: loki
resources:
  - ./namespace.yaml

helmCharts:
  - name: loki
    repo: oci://ghcr.io/grafana/helm-charts
    releaseName: loki
    version: 7.3.0
    valuesFile: values.yaml
    namespace: loki

# The chart's loki-sc-rules container mirrors ConfigMaps labelled loki_rule
# into the ruler's folder, the annotation picks the tenant ("fake": auth off)
configMapGenerator:
  - name: loki-alert-rules
    options:
      disableNameSuffixHash: true
      labels:
        loki_rule: ""
      annotations:
        k8s-sidecar-target-directory: /rules/fake
    files:
      - rules/alerts.yaml

labels:
  - includeSelectors: false
    pairs:
      homelab.app: loki

commonAnnotations:
  argocd.argoproj.io/sync-wave: "4"
