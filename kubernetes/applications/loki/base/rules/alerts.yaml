# Alerts on what only exists in the line text; each rule names its pattern.
# Pod logs only (container set): events and syslog carry no such lines. The
# loki container is out: it logs every query it evaluates, pattern included,
# and its own crashes are metric-visible (restarts, LokiRulerNoRulesLoaded).
groups:
  - name: log-content-alerts
    rules:
      - alert: LogPanic
        # Go and Rust runtime panics land on stderr unformatted, hence the
        # anchors; net/http logs a recovered handler panic with a timestamp.
        expr: |
          sum by (namespace, pod, container) (
            count_over_time({namespace=~".+", container=~".+", container!="loki"}
              |~ `^panic: |^thread '[^']*' panicked at |http: panic serving ` [10m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "Panic in {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})"
          description: "{{ $value }} panic line(s) in the last 10m. A panic that kills the process also shows as a restart; one recovered inside a handler shows only here."

      - alert: LogFatalError
        # Go runtime aborts and fatal-level lines from structured loggers
        # (logfmt and JSON); Python's CRITICAL is the same tier. The logfmt
        # level is the line's own, i.e. first or right after the timestamp
        # (logrus quotes it, slog does not): longhorn-manager quotes a child
        # process's stderr, level=fatal included, inside its own error lines.
        expr: |
          sum by (namespace, pod, container) (
            count_over_time({namespace=~".+", container=~".+", container!="loki"}
              |~ `^fatal error: |^(\w+=(\S+|"[^"]*") )?level=fatal |"level":"(fatal|FATAL|CRITICAL)"` [10m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "Fatal error in {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})"
          description: "{{ $value }} fatal line(s) in the last 10m — the process gave up on something; if it exited, PodCrashLooping follows."

      - alert: LogStackTrace
        # Python tracebacks, the sidecar bridges' exc_info; reconnect backoff
        # logs about ten in the first quarter hour of an outage
        expr: |
          sum by (namespace, pod, container) (
            count_over_time({namespace=~".+", container=~".+", container!="loki"}
              |= "Traceback (most recent call last):" [15m])
          ) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Stack traces looping in {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})"
          description: "{{ $value }} Python tracebacks in 15m and still going — an exception on every iteration, not a retry with backoff."

      - alert: LogHttp5xxBurst
        # Server errors as the apps log them: common log format (nginx),
        # logfmt (Grafana, Loki) and JSON (Authentik). Traefik's are a
        # Prometheus rule on its request counters; the agent-log containers
        # quote a model source's status, not one Hermes served.
        expr: |
          sum by (namespace, pod, container) (
            count_over_time({namespace=~".+", container=~".+", container!~"loki|traefik|agent-log.*"}
              |~ `" 5[0-9]{2} |status=5[0-9]{2}\b|"status":\s?5[0-9]{2}\b` [5m])
          ) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx burst in {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})"
          description: "More than 10 server errors per 5m for 5m straight, as logged by the service itself."

  # Traefik states the error only when it rebuilds its configuration, hours
  # apart on a quiet night: the window holds the alert instead of flapping
  - name: ingress-config-alerts
    interval: 5m
    rules:
      - alert: IngressRouteWithoutBackend
        expr: |
          sum by (namespace, container) (
            count_over_time({namespace="ingress-controller", container="traefik"}
              |~ `kubernetes service not found: |no servers found for |the service \\?"[^"]+" does not exist` [12h])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "An IngressRoute points at a backend Traefik cannot resolve"
          description: "{{ $value }} Traefik line(s) in 12h naming a Service that is missing or has no servers. Query the traefik container for 'service not found', 'no servers found' or 'does not exist' to see which."

  # Hermes logs to files only; agent-log streams the default profile's, agent-log-<handle> a person's
  - name: agent-alerts
    rules:
      - alert: AgentModelSourceFailing
        # Anchored: a bare 402 would hit the timestamp. Fires on the first line, 401/403 on the third
        expr: |
          sum by (enduser_id, signal) (
            count_over_time({namespace="agents", container=~"agent-log.*"}
              |~ `Model entitlement rejection: | error_type=NotFoundError | summary=HTTP 402: |(?i:insufficient.credits)|refused for billing/credits|Codex token refresh failed|No Codex credentials stored|Codex auth is missing`
              | regexp `(?P<signal>Model entitlement rejection|NotFoundError|HTTP 402|(?i:insufficient.credits)|refused for billing/credits|Codex token refresh failed|No Codex credentials stored|Codex auth is missing)`
              | label_format enduser_id=`{{ regexReplaceAll "^agent-log-?" .container "" }}`
              [1h])
          ) > 0
          or
          sum by (enduser_id, signal) (
            count_over_time({namespace="agents", container=~"agent-log.*"}
              |~ ` error_type=(AuthenticationError|PermissionDeniedError) `
              | regexp `(?P<signal>AuthenticationError|PermissionDeniedError)`
              | label_format enduser_id=`{{ regexReplaceAll "^agent-log-?" .container "" }}`
              [1h])
          ) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Agent model source of {{ or $labels.enduser_id \"the default profile\" }} failing ({{ $labels.signal }})"
          description: "{{ $value }} '{{ $labels.signal }}' line(s) in the agent.log of {{ or $labels.enduser_id \"the default profile\" }} in the last hour: its model source is failing, and its turns fall back to its capped OpenAI project or fail. The signal names the cause; a lost Codex login is renewed as the comment at its source in persons.yaml says."

      - alert: AgentChatFailedBeforeCall
        # Fails before the first model call: no hook, no row, so AgentChatFailed cannot see it; event runs (`for run=`) are AgentRunFailed's
        expr: |
          sum by (enduser_id) (
            count_over_time({namespace="agents", container=~"agent-log.*"}
              |~ `Model resolution failed for session |Provider resolution failed for session=`
              | label_format enduser_id=`{{ regexReplaceAll "^agent-log-?" .container "" }}`
              [10m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "Agent chat of {{ or $labels.enduser_id \"the default profile\" }} failed before its model was called"
          description: "{{ $value }} message(s) to the profile of {{ or $labels.enduser_id \"the default profile\" }} in the last 10 minutes got an error instead of an answer: Hermes found no model source with a usable login, and the message has no row in agent_runs. The line in its agent.log names the model source and why. A lost Codex login is renewed as the comment at its source in persons.yaml says; an empty key is one not sealed into the profile's .env."

      - alert: AgentHookLost
        # Each line is a delivery Hermes does not send again; the http:// warning at start is none
        expr: |
          sum(
            count_over_time({namespace="agents", container=~"agent-log.*"}
              |~ `outbound webhook (rejected|delivery failed|delivery crashed|queue full|target redirected|payload serialization failed)`
              [10m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "Agent hook delivery lost"
          description: "{{ $value }} outbound webhook line(s) in Hermes' agent.log in the last 10 minutes: a delivery to lares-agent-trigger was refused or failed and is not sent again, so a row in agent_runs is missing or incomplete. `rejected … HTTP 401` is a hook secret the two pods do not share; another 4xx is a body the trigger could not read, and its log says why; a failed delivery is a trigger that was down or slow."
