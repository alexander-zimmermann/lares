# generated by `task agents:create-harness-config`, do not edit
# An additional values file of Open WebUI's chart: one connection per enabled
# person, to their profile on the harness's API server under their own key,
# sealed in open-webui-hermes-keys. Each serves the handle as its one model and
# names the chat as the profile's session; the chart renders every value as a
# template, so the chat id's placeholder is quoted for it.
commonEnvVars:
  - name: HERMES_KEY_AZ1003
    valueFrom:
      secretKeyRef:
        name: open-webui-hermes-keys
        key: az1003-api-server-key
  - name: HERMES_KEY_GZ1410
    valueFrom:
      secretKeyRef:
        name: open-webui-hermes-keys
        key: gz1410-api-server-key
  - name: HERMES_KEY_LZ1410
    valueFrom:
      secretKeyRef:
        name: open-webui-hermes-keys
        key: lz1410-api-server-key
  - name: HERMES_KEY_VZ1604
    valueFrom:
      secretKeyRef:
        name: open-webui-hermes-keys
        key: vz1604-api-server-key
  - name: OPENAI_API_BASE_URLS
    value: http://hermes.agents.svc.cluster.local:8642/p/az1003/v1;http://hermes.agents.svc.cluster.local:8642/p/gz1410/v1;http://hermes.agents.svc.cluster.local:8642/p/lz1410/v1;http://hermes.agents.svc.cluster.local:8642/p/vz1604/v1
  - name: OPENAI_API_KEYS
    value: $(HERMES_KEY_AZ1003);$(HERMES_KEY_GZ1410);$(HERMES_KEY_LZ1410);$(HERMES_KEY_VZ1604)
  - name: OPENAI_API_CONFIGS
    value: '{"0":{"model_ids":["az1003"],"headers":{"X-Hermes-Session-Id":"{{`{{CHAT_ID}}`}}"}},"1":{"model_ids":["gz1410"],"headers":{"X-Hermes-Session-Id":"{{`{{CHAT_ID}}`}}"}},"2":{"model_ids":["lz1410"],"headers":{"X-Hermes-Session-Id":"{{`{{CHAT_ID}}`}}"}},"3":{"model_ids":["vz1604"],"headers":{"X-Hermes-Session-Id":"{{`{{CHAT_ID}}`}}"}}}'
