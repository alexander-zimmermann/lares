apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: open-webui
resources:
  - ./namespace.yaml
  - ./persistentvolume.yaml
  - ./sealed-secret.yaml
  - ./certificate.yaml
  - ./ingress-route.yaml

helmCharts:
  - name: open-webui
    repo: oci://ghcr.io/open-webui/helm-charts
    releaseName: open-webui
    version: 17.4.0
    valuesFile: values.yaml
    # One connection per person to their profile (task agents:create-harness-config)
    additionalValuesFiles:
      - config/connections.values.yaml
    namespace: open-webui

labels:
  - includeSelectors: false
    pairs:
      homelab.app: open-webui

# Wave 13 = after hermes (12), whose profiles the connections reach.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "13"
