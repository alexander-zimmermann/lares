apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: open-webui
  namespace: open-webui
  annotations:
    # ExternalDNS configuration for Cloudflare
    external-dns.kubernetes.io/target: PLACEHOLDER
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    # Homepage Service Discovery
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Data & AI"
    gethomepage.dev/name: "Open WebUI"
    gethomepage.dev/icon: "open-webui.png"
    gethomepage.dev/weight: "2"
    gethomepage.dev/href: "https://PLACEHOLDER"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=open-webui"

spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`PLACEHOLDER`)
      priority: 10
      # The household door, then Open WebUI's own sign-in against Authentik
      middlewares:
        - name: chain-household-auth
          namespace: ingress-controller
      services:
        - kind: Service
          name: open-webui
          port: 80
  tls:
    secretName: open-webui-tls-cert
