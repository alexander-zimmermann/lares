apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: holmesgpt
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml
  - ./scheduled-healthchecks.yaml
  - ./rbac.yaml
  - ./alert-bridge-cronjob.yaml

configMapGenerator:
  - name: holmes-alert-bridge-script
    options:
      disableNameSuffixHash: true
    files:
      - scripts/alert-bridge.sh

helmCharts:
  - name: holmes
    repo: https://robusta-charts.storage.googleapis.com
    releaseName: holmes
    version: 0.34.0
    valuesFile: values.yaml
    namespace: holmesgpt
    includeCRDs: true

labels:
  - includeSelectors: false
    pairs:
      homelab.app: holmesgpt

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
