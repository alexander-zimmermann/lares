# Only overrides — chart defaults provide the read-only ClusterRole
# (createServiceAccount + k8sRBAC=false) and the default investigation toolsets.

# LLM backend: Claude Sonnet 4.6 via the E.ON LiteLLM gateway (OpenAI-compatible).
additionalEnvVars:
  - name: MODEL
    value: openai/claude-4.6-sonnet
  - name: OPENAI_API_BASE
    value: https://genai-api.eon.com/genai/llmgw/central/v1
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: holmesgpt-llm
        key: api-key
  # In-cluster Prometheus query endpoint for the prometheus/metrics toolset
  - name: PROMETHEUS_URL
    value: http://prometheus-prometheus.prometheus.svc.cluster.local:9090
  # Writable HOME (read-only rootfs; agent caches under $HOME/.holmes)
  - name: HOME
    value: /tmp
  # ArgoCD read-only token (Kyverno-cloned) + in-cluster server for the argocd/core toolset
  - name: ARGOCD_AUTH_TOKEN
    valueFrom:
      secretKeyRef:
        name: argocd-holmes-token
        key: token
  - name: ARGOCD_SERVER
    value: argocd-server.gitops-controller.svc.cluster.local:80
  - name: ARGOCD_OPTS
    value: --plaintext --grpc-web

# Satisfy the namespace's restricted Pod Security Standard (image defaults to root).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

toolsets:
  # Robusta SaaS platform toolset — no Robusta account here, so it would be inert
  robusta:
    enabled: false
  # Historical logs (14d) — direct to in-cluster Loki (auth_enabled: false)
  grafana/loki:
    enabled: true
    config:
      api_url: http://loki.loki.svc.cluster.local:3100
  # GitOps state/drift/sync status (read-only token; default role:readonly)
  argocd/core:
    enabled: true
