# Only overrides — chart defaults provide the read-only ClusterRole
# (createServiceAccount + k8sRBAC=false) and the default investigation toolsets.

# Extend the chart's read-only ClusterRole with CRD groups it omits (traefik/grafana/cert-manager/cnpg).
customClusterRoleRules:
  - apiGroups: ["traefik.io"]
    resources: [ingressroutes, ingressroutetcps, ingressrouteudps, middlewares, traefikservices, tlsoptions, serverstransports]
    verbs: [get, list, watch]
  - apiGroups: ["grafana.integreatly.org"]
    resources: [grafanas, grafanadashboards, grafanadatasources, grafanafolders]
    verbs: [get, list, watch]
  - apiGroups: ["cert-manager.io"]
    resources: [certificates, certificaterequests, issuers, clusterissuers]
    verbs: [get, list, watch]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: [clusters, poolers, backups, scheduledbackups]
    verbs: [get, list, watch]

# LLM backend: Claude Sonnet 4.6 via the E.ON LiteLLM gateway (OpenAI-compatible).
additionalEnvVars:
  - name: MODEL
    value: openai/claude-4.6-sonnet
  - name: OPENAI_API_BASE
    value: https://genai-api.eon.com/genai/llmgw/central/v1
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: holmesgpt-llm
        key: api-key
  # In-cluster Prometheus query endpoint for the prometheus/metrics toolset
  - name: PROMETHEUS_URL
    value: http://prometheus-prometheus.prometheus.svc.cluster.local:9090
  # Writable HOME (read-only rootfs; agent caches under $HOME/.holmes)
  - name: HOME
    value: /tmp
  # ArgoCD read-only token (Kyverno-cloned) + in-cluster server for the argocd/core toolset
  - name: ARGOCD_AUTH_TOKEN
    valueFrom:
      secretKeyRef:
        name: argocd-holmes-token
        key: token
  - name: ARGOCD_SERVER
    value: argocd-server.gitops-controller.svc.cluster.local:80
  - name: ARGOCD_OPTS
    value: --plaintext --grpc-web

# Satisfy the namespace's restricted Pod Security Standard (image defaults to root).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

toolsets:
  # Robusta SaaS platform toolset — no Robusta account here, so it would be inert
  robusta:
    enabled: false
  # Historical logs (14d) — direct to in-cluster Loki (auth_enabled: false)
  grafana/loki:
    enabled: true
    config:
      api_url: http://loki.loki.svc.cluster.local:3100
  # GitOps state/drift/sync status (read-only token; default role:readonly)
  argocd/core:
    enabled: true

# Phase 2: operator runs ScheduledHealthChecks against the holmes server (read-only)
operator:
  enabled: true
  # Pinned back: the 0.37.0/0.38.0 images lack the holmes package their entrypoint imports (CrashLoop).
  # Registry split off the image so the repository path stays resolvable for dependency lookups.
  registry: docker.io
  image: robustadev/holmes-operator:0.38.2

# Custom skills as real .md files (kustomize ConfigMap) — a reusable registry of known-benign
# log noise so investigations (esp. log-anomaly) don't escalate steady-state patterns.
customSkillPaths:
  - /etc/holmes/skills-custom
additionalVolumes:
  - name: holmes-skills-custom
    configMap:
      name: holmes-skills-custom
      # Project into a <skill-name>/SKILL.md subdir (the canonical layout the
      # 2-level customSkillPaths scan expects; skill name then matches the dir).
      items:
        - key: SKILL.md
          path: known-log-noise/SKILL.md
additionalVolumeMounts:
  - name: holmes-skills-custom
    mountPath: /etc/holmes/skills-custom
    readOnly: true
