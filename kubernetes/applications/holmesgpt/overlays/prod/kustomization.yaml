apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Sized from observed usage (~428Mi steady, flat through investigations).
  - target:
      kind: Deployment
      name: holmes-holmes
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: holmes
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 1Gi
