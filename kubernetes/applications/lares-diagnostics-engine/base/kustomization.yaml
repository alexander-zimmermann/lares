apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lares-diagnostics-engine
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml
  - ./forecast-solar-cronjob.yaml
  - ./forecast-weather-cronjob.yaml
  - ./energy-balance-cronjob.yaml
  - ./detect-faults-cronjob.yaml

# The engine's two declared files: what counts as wrong, and what the
# house is. A fixed name, because Kyverno clones the ConfigMap by name to
# the applications that read it; every run starts a pod on the current files.
configMapGenerator:
  - name: lares-diagnostics-engine-config
    options:
      disableNameSuffixHash: true
    files:
      - ./config/faults.yaml
      - ./config/site.yaml

labels:
  - includeSelectors: false
    pairs:
      lares.app: lares-diagnostics-engine

# Wave 11 = after Kyverno (-4), timescaledb (3), nats-operator (9) and
# knx-nats-bridge (10) — aligns with lares-mcp-bridge so the secret
# clones from those upstream namespaces are already in place.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "11"
