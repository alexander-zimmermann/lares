# CronJob: PV energy balance every 15 min. Reads today's authoritative meter
# counters (inverter energytotal + KNX energy meter 15/1) from TSDB, computes the
# daily kWh balance + ratios, and publishes them on energy.pv.* for the
# knx-nats-bridge GA mappings → KNX 15/4/60..65. Read-only DB role (no writes).
apiVersion: batch/v1
kind: CronJob

metadata:
  name: lares-diagnostics-engine-energy-balance
  namespace: lares-diagnostics-engine

spec:
  schedule: "*/15 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600

  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: energy-balance
              image: ghcr.io/alexander-zimmermann/lares-diagnostics-engine:1.39.0
              command: ["lares-diagnostics-engine", "energy-balance"]
              env:
                - name: MCP_DB_HOST
                  value: timescaledb-db-rw.timescaledb.svc.cluster.local
                - name: MCP_DB_PORT
                  value: "5432"
                - name: MCP_DB_NAME
                  value: homelab
                - name: MCP_DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-db-lares-mcp-bridge-ro-secret
                      key: username
                - name: MCP_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-db-lares-mcp-bridge-ro-secret
                      key: password
                # NATS — publish energy.pv.* scalars for the KNX bilanz GAs.
                - name: MCP_NATS_SERVERS
                  value: nats://nats.nats.svc.cluster.local:4222
                - name: MCP_NATS_NKEY_SEED_FILE
                  value: /etc/lares-diagnostics-engine/nats/nkey-seed
                - name: MCP_AUTH_ENABLED
                  value: "false"
                # The site file — what the house is; read by every job.
                - name: MCP_SITE_FILE
                  value: /etc/lares-diagnostics-engine/site.yaml
                - name: TZ
                  value: Europe/Berlin
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: nats-credentials
                  mountPath: /etc/lares-diagnostics-engine/nats/nkey-seed
                  subPath: nkey-seed
                  readOnly: true
                - name: site
                  mountPath: /etc/lares-diagnostics-engine/site.yaml
                  subPath: site.yaml
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: nats-credentials
              secret:
                secretName: lares-diagnostics-engine-credentials
            - name: site
              configMap:
                name: lares-diagnostics-engine-config
                defaultMode: 0444
