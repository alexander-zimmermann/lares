apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dyson-nats-bridge
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: dyson-nats-bridge
    version: 9.1.0
    valuesFile: values.yaml
    namespace: dyson-nats-bridge
    apiVersions:
      - monitoring.coreos.com/v1

labels:
  - includeSelectors: false
    pairs:
      homelab.app: dyson-nats-bridge

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
