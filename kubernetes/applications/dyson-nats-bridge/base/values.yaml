applicationName: dyson-nats-bridge

deployment:
  enabled: true
  reloadOnChange: false
  image:
    repository: ghcr.io/alexander-zimmermann/dyson-nats-bridge
    tag: 0.9.0
    pullPolicy: IfNotPresent

  # A second replica would apply every command to the device twice.
  replicas: 1
  strategy:
    type: Recreate

  env:
    DYSON_DEVICES_FILE:
      value: /etc/dyson-nats-bridge/devices.yaml
    DYSON_CREDENTIALS_DIR:
      value: /etc/dyson-nats-bridge/credentials
    NATS_SERVERS:
      value: nats://nats.nats.svc.cluster.local:4222
    # NKey seed mounted as a file from the synced Secret (Kyverno clones from `nats` namespace)
    NATS_NKEY_SEED_FILE:
      value: /etc/dyson-nats-bridge/nkey-seed
    LOG_FORMAT:
      value: json
    METRICS_PORT:
      value: "9090"
    TZ:
      value: Europe/Berlin

  volumes:
    devices:
      configMap:
        name: dyson-nats-bridge-devices
    nats-credentials:
      secret:
        secretName: dyson-nats-bridge-credentials
    device-credentials:
      secret:
        secretName: dyson-nats-bridge-device-credentials

  volumeMounts:
    devices:
      mountPath: /etc/dyson-nats-bridge/devices.yaml
      subPath: devices.yaml
    nats-credentials:
      mountPath: /etc/dyson-nats-bridge/nkey-seed
      subPath: nkey-seed
    # Directory mount: the bridge reads one credential file per device name.
    device-credentials:
      mountPath: /etc/dyson-nats-bridge/credentials

  ports:
    - containerPort: 9090
      name: metrics
      protocol: TCP

  # Liveness deliberately excludes the device connection: an unplugged fan
  # surfaces via the dyson_connected metric instead of a pod restart loop.
  livenessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 30
    periodSeconds: 30

  readinessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 10
    periodSeconds: 10

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  securityContext:
    fsGroup: 1000

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 9090
      name: metrics
      protocol: TCP
      targetPort: metrics

serviceMonitor:
  enabled: true
  additionalLabels:
    # Prometheus Operator label (Opt-In)
    release: prometheus
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
