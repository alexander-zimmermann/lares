apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replacements:
  # Inject PVC storage size for the rotated refresh token
  - sourceValue: 32Mi
    targets:
      - select:
          kind: PersistentVolumeClaim
          name: miele-nats-bridge-token-state
        fieldPaths:
          - spec.resources.requests.storage

patches:
  - target:
      kind: Deployment
      name: miele-nats-bridge
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: miele-nats-bridge
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
