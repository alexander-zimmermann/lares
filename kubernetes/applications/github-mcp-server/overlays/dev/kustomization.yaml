apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # One Go process; each call is a GitHub API request it passes through.
  - target:
      kind: Deployment
      name: github-mcp-server
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: github-mcp-server
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
