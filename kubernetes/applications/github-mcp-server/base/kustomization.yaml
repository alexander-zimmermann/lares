apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agents

# No namespace.yaml here: `agents` is created and owned by the hermes
# application at wave 12, and two ArgoCD apps rendering one Namespace would
# fight over its labels.
# The read-only App's key, which the token generator signs in with.
resources:
  - sealed-secret.yaml
  - token.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: github-mcp-server
    version: 9.3.2
    valuesFile: values.yaml
    namespace: agents

labels:
  - includeSelectors: false
    pairs:
      homelab.app: github-mcp-server

# Wave 12 = beside hermes, which owns the namespace; the token needs the
# External Secrets CRDs (component, wave -1).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "12"
