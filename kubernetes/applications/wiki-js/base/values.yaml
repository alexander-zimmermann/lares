# Pinned, so Renovate bumps it; unset, the chart pulls the floating tag 2 from Docker Hub
image:
  repository: ghcr.io/requarks/wiki
  tag: 3.0.1

# Disable built-in PostgreSQL (using CloudNativePG instead)
postgresql:
  enabled: false

# Disable built-in ingress (using Traefik IngressRoute instead)
ingress:
  enabled: false

# No service account needed
serviceAccount:
  create: false

# LoadBalancer for Cilium BGP advertisement
service:
  type: LoadBalancer

# The database password is read only at start, so Reloader rolls the pod when it changes
podAnnotations:
  reloader.stakater.com/auto: "true"

# Database connection via CloudNativePG
extraEnvVars:
  - name: DB_HOST
    value: wiki-js-db-rw
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: wikijs
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: wiki-js-db-app
        key: username
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: wiki-js-db-app
        key: password
