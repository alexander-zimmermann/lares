apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: midea-nats-bridge
resources:
  - ./namespace.yaml
  - ./sealed-secret.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: midea-nats-bridge
    version: 9.2.0
    valuesFile: values.yaml
    namespace: midea-nats-bridge
    apiVersions:
      - monitoring.coreos.com/v1

# Content-hash suffix: a device-list change produces a new ConfigMap name, so the
# Deployment reference updates and ArgoCD rolls the pod natively.
configMapGenerator:
  - name: midea-nats-bridge-devices
    files:
      - devices.yaml=config/devices.yaml

labels:
  - includeSelectors: false
    pairs:
      homelab.app: midea-nats-bridge

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
