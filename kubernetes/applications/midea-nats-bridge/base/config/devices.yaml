# Comfee dehumidifiers served by the bridge. `name` is the NATS subject slug
# (midea.<name>.state) and the prefix of the matching entries in the
# midea-nats-bridge-device-credentials Secret (<name>.token, <name>.key).
#
# The slug matches the hostname without the domain, so a device is called the
# same thing in DNS, in NATS subjects and in the credentials Secret.
# `ga_name` names the device's address block: the group-address name prefix
# every datapoint of the bridge's descriptor resolves under when
# ga-mappings/midea.yaml is generated (task knx:create-ga-mappings).
devices:
  # Registered as "Technikraum" in the Comfee cloud but stands in the
  # Hauswirtschaftsraum; the slug follows the room.
  - name: entfeuchter-kg5
    host: entfeuchter-kg5.zimmermann.eu.com
    ga_name: Raumklima.KG.Hauswirtschaftsraum.Entfeuchter
  - name: entfeuchter-kg4
    host: entfeuchter-kg4.zimmermann.eu.com
    ga_name: Raumklima.KG.Vorratsraum.Entfeuchter
