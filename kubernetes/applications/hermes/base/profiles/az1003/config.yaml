# generated by `task agents:create-harness-config`, do not edit
# az1003's profile: the hand-written settings.yaml first, then the parts
# rendered from persons.yaml and use-cases.yaml.

# Hermes settings: everything use-cases.yaml and persons.yaml do not render.
# Copied whole into every profile's config.yaml, which is mounted read-only:
# what runs is what is reviewed here. The model, its fallbacks and the working
# directory come from persons.yaml.

# Compact at 256k tokens at the latest; the fallback's price doubles past 272k input tokens.
compression:
  threshold_tokens: 256000

agent:
  # Unattended and read-only: everything the agent may read comes through the
  # bridge's MCP tools, and the bridge denies the rest a second time.
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - browser
    - web
    - search
    - image_gen
    - video_gen
    - tts
    - vision
    - cronjob
    - delegation
    - computer_use
    - discord_admin
    - kanban
    # Discord's server-reading tools, which any explicit Discord toolset list switches on
    - discord
    # The Nous tool gateway
    - connections
  # Wall-clock budget per run
  run_budget_seconds: 600
  # The first live answers stopped after one tool call at the default (medium)
  reasoning_effort: high

approvals:
  # Nobody answers approval prompts on a chat platform at 03:00: deny, never wait.
  unattended_mode: deny
  cron_mode: deny

# Each profile learns into its own skills/; the repo's skills come read-only from hermes-skills.
skills:
  external_dirs:
    - /opt/skills

# First-touch hints latch into config.yaml, which is read-only here: no profile
# offer, and every hint pre-marked as seen, else the intro repeats on every message.
onboarding:
  profile_build: "off"
  seen:
    profile_build_offered: true
    busy_input_prompt: true
    tool_progress_prompt: true
    openclaw_residue_cleanup: true

# Bounded working notes per install; facts live in the database, not here.
memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2200
  write_approval: false
  # Profile notes: a background review every 5th message of a session.
  nudge_interval: 5

discord:
  # One private server, one user: answer everywhere, no threads per message
  require_mention: false
  auto_thread: false
  # A DM from outside allow_from is ignored; no pairing code is ever handed out
  dm_policy: allowlist

platforms:
  discord:
    # Where the house writes first; /sethome cannot, the config is read-only
    home_channel:
      platform: discord
      chat_id: "1548229055348736034"
      name: "#Allgemein"

display:
  platforms:
    discord:
      # No tool-call bubbles in the channel; the answer names its sources itself
      tool_progress: "off"

# Session isolation on every gateway platform
group_sessions_per_user: true

# Read by the session-reset plugin: a message after an hour of quiet, or the first after 04:00, starts a fresh conversation.
session_reset:
  mode: both
  idle_minutes: 60
  at_hour: 4

# Third-party plugins load only when named here; their files are mounted from the repo.
plugins:
  enabled:
    - hermes-session-reset-policy

# One gateway on 8642 serves every profile, a person's under /p/<handle>/.
# Hermes would write the switch into config.yaml at boot, which is read-only here.
gateway:
  multiplex_profiles: true

# Gateway and Discord liveness as metrics into the Alloy receiver; Kubernetes
# cannot see a gateway crash under s6, the alert rules on hermes_gateway_up can.
monitoring:
  gateway_health_export:
    enabled: true
    # The receiver takes metrics and traces only; the OTLP log signal would 404 every 5 s
    warning_error_events_enabled: false
  export:
    otlp:
      enabled: true
      endpoint: http://alloy-alloy-receiver.alloy.svc.cluster.local:4318/v1/traces

# No remote model catalogs: the gateway would refetch the Nous manifest, the OpenRouter
# list and the portal recommendations every 20 minutes, four hosts the agent cage does
# not open. The /model picker keeps the snapshot shipped with the image; the provider
# above is not on either list anyway.
model_catalog:
  enabled: false

# Behind Traefik: its forwarded headers are trusted from the pod network only,
# and the public URL comes from the environment per cluster.
dashboard:
  trusted_proxies:
    - 10.244.0.0/16

# Every tool definition in the prompt, not behind a search. Hermes defers MCP
# tools by default, which costs a round per lookup and lets a step call one
# of them only; the bridge's tools are about 5k tokens, and cached.
tools:
  tool_search:
    enabled: "off"

# Rendered from persons.yaml: az1003's source, its fallbacks in order,
# and the profile's directory, where Hermes discovers the context files.
model:
  provider: openai-codex
  default: gpt-6-sol
fallback_providers:
  - provider: openai-api
    model: gpt-6-luna
terminal:
  cwd: /opt/data/profiles/az1003

# Rendered from persons.yaml and use-cases.yaml: az1003's tool servers on
# Discord and the API server, the web chat's skill tools, and the hook that
# reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - lares
    - lares-runs
    - github
    - grafana
    - cloudflare
  api_server:
    - skills
    - lares
    - lares-runs
    - github
    - grafana
    - cloudflare
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - post_tool_call
        - api_request_error
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_schema
        - get_forecast
        - get_pv_forecast
        - get_weather_forecast
        - get_episode
        - get_current_state
        - get_current_knx
        - get_wiki_page
        - query_*
        - correlate_events
        - search_wiki
        - backtest_fault
      resources: false
      prompts: false
  lares-runs:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares-runs
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 30
    tools:
      include:
        - start_run
      resources: false
      prompts: false
  github:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/github
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - get_*
        - list_*
        - search_*
        - issue_read
        - pull_request_read
      resources: false
      prompts: false
  grafana:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/grafana
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_datasources
        - query_prometheus
        - list_prometheus_metric_names
        - list_prometheus_label_values
        - query_loki_logs
        - query_loki_stats
        - list_loki_label_values
        - search_tempo_traces
        - get_tempo_trace
        - alerting_rules_read
        - alerting_silences_read
        - search_dashboards
        - get_dashboard_panel_queries
      resources: false
      prompts: false
  cloudflare:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/cloudflare
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - search
        - execute
        - docs
        - whoami
      resources: false
      prompts: false
