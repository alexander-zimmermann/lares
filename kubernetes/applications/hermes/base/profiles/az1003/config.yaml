# generated by `task agents:create-harness-config`, do not edit
# az1003's profile: rendered from persons.yaml and use-cases.yaml. The
# hand-written settings.yaml is the managed scope, /etc/hermes/config.yaml,
# which Hermes reads over this file.

# Rendered from persons.yaml: az1003's source, its fallbacks in order,
# and the profile's directory, where Hermes discovers the context files.
model:
  provider: openai-codex
  default: gpt-6-sol
fallback_providers:
  - provider: openai-api
    model: gpt-6-luna
terminal:
  cwd: /opt/data/profiles/az1003

# Rendered from persons.yaml and use-cases.yaml: az1003's tool servers on
# Discord and the API server, the web chat's skill tools, and the hook that
# reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - lares
    - lares-runs
    - github
    - grafana
    - cloudflare
  api_server:
    - skills
    - lares
    - lares-runs
    - github
    - grafana
    - cloudflare
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - post_tool_call
        - api_request_error
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_schema
        - get_forecast
        - get_pv_forecast
        - get_weather_forecast
        - get_episode
        - get_current_state
        - get_current_knx
        - get_wiki_page
        - query_*
        - correlate_events
        - search_wiki
        - backtest_fault
      resources: false
      prompts: false
  lares-runs:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares-runs
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 30
    tools:
      include:
        - start_run
      resources: false
      prompts: false
  github:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/github
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - get_*
        - list_*
        - search_*
        - issue_read
        - pull_request_read
      resources: false
      prompts: false
  grafana:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/grafana
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_datasources
        - query_prometheus
        - list_prometheus_metric_names
        - list_prometheus_label_values
        - query_loki_logs
        - query_loki_stats
        - list_loki_label_values
        - search_tempo_traces
        - get_tempo_trace
        - alerting_rules_read
        - alerting_silences_read
        - search_dashboards
        - get_dashboard_panel_queries
      resources: false
      prompts: false
  cloudflare:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/cloudflare
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - search
        - execute
        - docs
        - whoami
      resources: false
      prompts: false
