# generated by `task agents:create-harness-config`, do not edit
# az1003's profile: settings.yaml, then the parts rendered from persons.yaml
# and use-cases.yaml.

# From settings.yaml, the hand-written part every profile shares; its comments
# stay there.
compression:
  threshold_tokens: 256000
  codex_gpt55_autoraise_notice: false
agent:
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - browser
    - web
    - search
    - image_gen
    - video_gen
    - tts
    - vision
    - cronjob
    - delegation
    - computer_use
    - discord_admin
    - kanban
    - discord
    - connections
  run_budget_seconds: 600
  reasoning_effort: high
approvals:
  unattended_mode: deny
  cron_mode: deny
skills:
  external_dirs:
    - /opt/skills
onboarding:
  profile_build: 'off'
  seen:
    profile_build_offered: true
    busy_input_prompt: true
    tool_progress_prompt: true
    openclaw_residue_cleanup: true
memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2200
  write_approval: false
  nudge_interval: 5
discord:
  require_mention: true
  free_response_channels:
    - '1548229055348736034'
  auto_thread: false
  dm_policy: allowlist
platforms:
  discord:
    home_channel:
      platform: discord
      chat_id: '1548229055348736034'
      name: '#admin'
display:
  platforms:
    discord:
      tool_progress: 'off'
stt:
  provider: openai
  language: de
  openai:
    base_url: http://agentgateway.agents.svc.cluster.local:8080/v1
    api_key: ${env:GATEWAY_KEY}
group_sessions_per_user: true
session_reset:
  mode: both
  idle_minutes: 60
  at_hour: 4
sessions:
  auto_prune: true
plugins:
  enabled:
    - hermes-session-reset-policy
gateway:
  multiplex_profiles: true
monitoring:
  gateway_health_export:
    enabled: true
    warning_error_events_enabled: false
  export:
    otlp:
      enabled: true
      endpoint: http://alloy-alloy-receiver.alloy.svc.cluster.local:4318/v1/traces
model_catalog:
  enabled: false
dashboard:
  trusted_proxies:
    - 10.244.0.0/16
tools:
  tool_search:
    enabled: 'off'

# Rendered from persons.yaml: az1003's source, its fallbacks in order,
# and the profile's directory, where Hermes discovers the context files.
model:
  provider: openai-codex
  default: gpt-6-sol
fallback_providers:
  - provider: openai-api
    model: gpt-6-luna
terminal:
  cwd: /opt/data/profiles/az1003

# Rendered from persons.yaml and use-cases.yaml: az1003's tool servers on
# Discord and the API server, the web chat's skill tools, and the hook that
# reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - lares
    - lares-runs
    - github
    - grafana
    - cloudflare
    - unifi-network
    - unifi-protect
  api_server:
    - skills
    - lares
    - lares-runs
    - github
    - grafana
    - cloudflare
    - unifi-network
    - unifi-protect
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - post_tool_call
        - api_request_error
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_schema
        - get_forecast
        - get_pv_forecast
        - get_weather_forecast
        - get_episode
        - get_current_state
        - get_current_knx
        - get_wiki_page
        - query_*
        - correlate_events
        - search_wiki
        - backtest_fault
      resources: false
      prompts: false
  lares-runs:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares-runs
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 30
    tools:
      include:
        - start_run
      resources: false
      prompts: false
  github:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/github
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - get_*
        - list_*
        - search_*
        - issue_read
        - pull_request_read
      resources: false
      prompts: false
  grafana:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/grafana
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_datasources
        - query_prometheus
        - list_prometheus_metric_names
        - list_prometheus_label_values
        - query_loki_logs
        - query_loki_stats
        - list_loki_label_values
        - search_tempo_traces
        - get_tempo_trace
        - alerting_rules_read
        - alerting_silences_read
        - search_dashboards
        - get_dashboard_panel_queries
      resources: false
      prompts: false
  cloudflare:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/cloudflare
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - search
        - execute
        - docs
        - whoami
      resources: false
      prompts: false
  unifi-network:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/unifi-network
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - unifi_list_clients
        - unifi_get_client_details
        - unifi_get_client_wifi_details
        - unifi_list_devices
        - unifi_get_device_details
        - unifi_list_events
        - unifi_get_event_types
        - unifi_list_alarms
        - unifi_list_networks
        - unifi_list_wlans
        - unifi_get_network_health
        - unifi_get_system_info
        - unifi_get_device_stats
        - unifi_get_client_stats
        - unifi_get_top_clients
        - unifi_get_gateway_stats
        - unifi_get_ips_events
      resources: false
      prompts: false
  unifi-protect:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/unifi-protect
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - protect_list_cameras
        - protect_get_camera
        - protect_get_camera_analytics
        - protect_list_events
        - protect_get_event
        - protect_list_smart_detections
        - protect_list_sensors
        - protect_list_lights
        - protect_list_chimes
        - protect_get_system_info
        - protect_get_health
        - protect_get_firmware_status
        - protect_list_viewers
      resources: false
      prompts: false
