# generated by `task agents:create-harness-config`, do not edit
# lz1410's profile: settings.yaml, then the parts rendered from persons.yaml
# and use-cases.yaml.

# From settings.yaml, the hand-written part every profile shares; its comments
# stay there.
compression:
  threshold_tokens: 256000
  codex_gpt55_autoraise_notice: false
agent:
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - browser
    - web
    - search
    - image_gen
    - video_gen
    - tts
    - vision
    - cronjob
    - delegation
    - computer_use
    - discord_admin
    - kanban
    - discord
    - connections
  run_budget_seconds: 600
  reasoning_effort: high
approvals:
  unattended_mode: deny
  cron_mode: deny
skills:
  external_dirs:
    - /opt/skills
onboarding:
  profile_build: 'off'
  seen:
    profile_build_offered: true
    busy_input_prompt: true
    tool_progress_prompt: true
    openclaw_residue_cleanup: true
memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2200
  write_approval: false
  nudge_interval: 5
discord:
  require_mention: true
  free_response_channels:
    - '1548229055348736034'
  auto_thread: false
  dm_policy: allowlist
platforms:
  discord:
    home_channel:
      platform: discord
      chat_id: '1548229055348736034'
      name: '#Allgemein'
display:
  platforms:
    discord:
      tool_progress: 'off'
group_sessions_per_user: true
session_reset:
  mode: both
  idle_minutes: 60
  at_hour: 4
plugins:
  enabled:
    - hermes-session-reset-policy
gateway:
  multiplex_profiles: true
monitoring:
  gateway_health_export:
    enabled: true
    warning_error_events_enabled: false
  export:
    otlp:
      enabled: true
      endpoint: http://alloy-alloy-receiver.alloy.svc.cluster.local:4318/v1/traces
model_catalog:
  enabled: false
dashboard:
  trusted_proxies:
    - 10.244.0.0/16
tools:
  tool_search:
    enabled: 'off'

# Rendered from persons.yaml: lz1410's source, its fallbacks in order,
# and the profile's directory, where Hermes discovers the context files.
model:
  provider: openai-codex
  default: gpt-6-luna
fallback_providers:
  - provider: openai-api
    model: gpt-6-luna
terminal:
  cwd: /opt/data/profiles/lz1410

# Rendered from persons.yaml and use-cases.yaml: lz1410's tool servers on
# Discord and the API server, the web chat's skill tools, and the hook that
# reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - lares
  api_server:
    - skills
    - lares
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - post_tool_call
        - api_request_error
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_schema
        - get_forecast
        - get_pv_forecast
        - get_weather_forecast
        - get_episode
        - get_current_state
        - get_current_knx
        - get_wiki_page
        - query_*
        - correlate_events
        - search_wiki
        - backtest_fault
      resources: false
      prompts: false
