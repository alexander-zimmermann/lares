# generated by `task agents:create-harness-config`, do not edit
# An additional values file of Hermes's chart: each person's config and .env, the
# persons' SOUL.md, AGENTS.md and the marker that keeps the bundled skills out,
# each mounted read-only into the person's profile, and the container that
# streams the profile's agent.log for Loki. Every plugin settings.yaml enables is
# the ConfigMap of its name, mounted read-only as its directory in every profile.
deployment:
  volumes:
    hermes-session-reset-policy:
      configMap:
        name: hermes-session-reset-policy
    hermes-az1003-env:
      secret:
        secretName: hermes-credentials
        items:
          - key: az1003.env
            path: .env
    hermes-az1003-config:
      configMap:
        name: hermes-profiles
        items:
          - key: az1003
            path: config.yaml
    hermes-az1003-soul:
      configMap:
        name: hermes-config
        items:
          - key: persons-SOUL.md
            path: SOUL.md
    hermes-az1003-agents:
      configMap:
        name: hermes-config
        items:
          - key: AGENTS.md
            path: AGENTS.md
    hermes-az1003-no-bundled-skills:
      configMap:
        name: hermes-config
        items:
          - key: .no-bundled-skills
            path: .no-bundled-skills
    hermes-az1003-hermes-session-reset-policy:
      configMap:
        name: hermes-session-reset-policy
  volumeMounts:
    hermes-session-reset-policy:
      mountPath: /opt/data/plugins/hermes-session-reset-policy
      readOnly: true
    hermes-az1003-env:
      mountPath: /opt/data/profiles/az1003/.env
      subPath: .env
      readOnly: true
    hermes-az1003-config:
      mountPath: /opt/data/profiles/az1003/config.yaml
      subPath: config.yaml
      readOnly: true
    hermes-az1003-soul:
      mountPath: /opt/data/profiles/az1003/SOUL.md
      subPath: SOUL.md
      readOnly: true
    hermes-az1003-agents:
      mountPath: /opt/data/profiles/az1003/AGENTS.md
      subPath: AGENTS.md
      readOnly: true
    hermes-az1003-no-bundled-skills:
      mountPath: /opt/data/profiles/az1003/.no-bundled-skills
      subPath: .no-bundled-skills
      readOnly: true
    hermes-az1003-hermes-session-reset-policy:
      mountPath: /opt/data/profiles/az1003/plugins/hermes-session-reset-policy
      readOnly: true
  additionalContainers:
    agent-log-az1003:
      image: agent-log
      command:
        - tail
        - -n
        - '0'
        - -F
        - /opt/data/profiles/az1003/logs/agent.log
      volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
          readOnly: true
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
