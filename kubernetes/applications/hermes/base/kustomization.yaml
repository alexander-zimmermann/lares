apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agents
resources:
  - ./namespace.yaml
  - ./persistentvolume.yaml
  - ./sealed-secret.yaml
  - ./certificate.yaml
  - ./ingress-route.yaml
  # Each person's profile config (task agents:create-harness-config)
  - ./profiles

# Every profile's .env, a template of the sealed keys (task agents:create-harness-config)
patches:
  - path: ./env-template.yaml

helmCharts:
  - name: application
    repo: oci://ghcr.io/stakater/charts
    releaseName: hermes
    version: 9.3.2
    valuesFile: values.yaml
    # Each person's config, .env and shared files, mounted into their profile
    additionalValuesFiles:
      - profiles/profiles.values.yaml
    namespace: agents

# Hash on: the Deployment mounts these, so the pod rolls when config, a skill or a script changes.
configMapGenerator:
  - name: hermes-config
    files:
      - config/config.yaml
      - config/SOUL.md
      # One persona for every person, beside the default profile's own
      - config/persons-SOUL.md
      - config/AGENTS.md
    # Empty marker file: without it Hermes seeds its 58 bundled skills into the volume on every boot
    literals:
      - .no-bundled-skills=
  # One key per skill; values.yaml lays each out as <name>/SKILL.md under /opt/skills.
  - name: hermes-skills
    files:
      - lares-explain=skills/lares-explain/SKILL.md
      - lares-propose=skills/lares-propose/SKILL.md
  # fastfinge/hermes-session-reset-policy v0.3.0, unchanged at the catalog's pin 0f2ea5ad995f1e4ba7c92c2dbd21afa868b8ae21; Renovate does not track it
  - name: hermes-plugin-session-reset-policy
    files:
      - plugins/hermes-session-reset-policy/plugin.yaml
      - plugins/hermes-session-reset-policy/__init__.py
  # The scripts Hermes's cron runs without a model; values.yaml mounts them as the default
  # profile's scripts/ directory.
  - name: hermes-scripts
    files:
      - scripts/skill-digest.py

# Every agent-log container, the default profile's and each person's, runs this one image.
images:
  - name: agent-log
    newName: dhi.io/busybox
    newTag: 1-alpine3.23

labels:
  - includeSelectors: false
    pairs:
      homelab.app: hermes

# Wave 12 = after lares-mcp-bridge (11), the only in-cluster dependency.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "12"
