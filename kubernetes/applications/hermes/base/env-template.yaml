# generated by `task agents:create-harness-config`, do not edit
# Each profile's .env, composed from the keys sealed one by one in
# sealed-secret.yaml; Hermes mounts the default's read-only at the home's root,
# a person's in their profile's directory.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hermes-credentials
  namespace: agents
spec:
  template:
    data:
      default.env: |
        API_SERVER_KEY='{{ index . "api-server-key" }}'
        DISCORD_BOT_TOKEN='{{ index . "discord-bot-token" }}'
        DISCORD_USER_AZ1003='{{ index . "az1003-discord-user" }}'
        DISCORD_USER_GZ1410='{{ index . "gz1410-discord-user" }}'
        DISCORD_USER_LZ1410='{{ index . "lz1410-discord-user" }}'
        DISCORD_USER_VZ1604='{{ index . "vz1604-discord-user" }}'
        LARES_AGENT_TRIGGER_HOOK_SECRET='{{ index . "lares-agent-trigger-hook-secret" }}'
        GATEWAY_KEY='{{ index . "gateway-key" }}'
        OPENAI_API_KEY='{{ index . "openai-api-key" }}'
      az1003.env: |
        API_SERVER_KEY='{{ index . "az1003-api-server-key" }}'
        LARES_AGENT_TRIGGER_HOOK_SECRET='{{ index . "lares-agent-trigger-hook-secret" }}'
        GATEWAY_KEY='{{ index . "az1003-gateway-key" }}'
        OPENAI_API_KEY='{{ index . "az1003-openai-api-key" }}'
      gz1410.env: |
        API_SERVER_KEY='{{ index . "gz1410-api-server-key" }}'
        LARES_AGENT_TRIGGER_HOOK_SECRET='{{ index . "lares-agent-trigger-hook-secret" }}'
        GATEWAY_KEY='{{ index . "gz1410-gateway-key" }}'
        OPENAI_API_KEY='{{ index . "gz1410-openai-api-key" }}'
      lz1410.env: |
        API_SERVER_KEY='{{ index . "lz1410-api-server-key" }}'
        LARES_AGENT_TRIGGER_HOOK_SECRET='{{ index . "lares-agent-trigger-hook-secret" }}'
        GATEWAY_KEY='{{ index . "lz1410-gateway-key" }}'
        OPENAI_API_KEY='{{ index . "lz1410-openai-api-key" }}'
      vz1604.env: |
        API_SERVER_KEY='{{ index . "vz1604-api-server-key" }}'
        LARES_AGENT_TRIGGER_HOOK_SECRET='{{ index . "lares-agent-trigger-hook-secret" }}'
        GATEWAY_KEY='{{ index . "vz1604-gateway-key" }}'
        OPENAI_API_KEY='{{ index . "vz1604-openai-api-key" }}'
