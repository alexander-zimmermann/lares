# generated by `task agents:create-harness-config`, do not edit
# The default profile's .env, composed from the keys sealed one by one in
# sealed-secret.yaml; Hermes mounts it read-only at the home's root.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hermes-credentials
  namespace: agents
spec:
  template:
    data:
      default.env: |
        API_SERVER_KEY='{{ index . "api-server-key" }}'
        DISCORD_BOT_TOKEN='{{ index . "discord-bot-token" }}'
        LARES_AGENT_TRIGGER_HOOK_SECRET='{{ index . "lares-agent-trigger-hook-secret" }}'
        LARES_MCP_KEY='{{ index . "lares-mcp-key" }}'
        LARES_RUNS_MCP_KEY='{{ index . "lares-runs-mcp-key" }}'
        LARES_MEMORY_MCP_KEY='{{ index . "lares-memory-mcp-key" }}'
        OPENAI_API_KEY='{{ index . "openai-api-key" }}'
