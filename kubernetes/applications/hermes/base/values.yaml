applicationName: hermes

deployment:
  enabled: true
  image:
    repository: nousresearch/hermes-agent
    tag: v0.22.4
    pullPolicy: IfNotPresent

  # Caged by the CiliumClusterwideNetworkPolicy agent-cage (components/cilium)
  podLabels:
    role: agent

  # One gateway per data volume, never two; the PVC is ReadWriteOnce anyway.
  replicas: 1
  strategy:
    type: Recreate

  # The image entrypoint (s6-overlay) stays; only the command changes.
  args: ["gateway", "run"]

  # Registry authentication for the dhi.io image of the agent-log containers
  imagePullSecrets:
    - name: dhi-registry-secret

  # Every key comes from the profile's .env (hermes-env below); the pod env holds no secret.
  # Who may write to the bot is discord.allow_from in config.yaml, rendered from persons.yaml.
  env:
    # API server: /health for the probes, the Runs and Jobs API for lares-agent-trigger
    API_SERVER_ENABLED:
      value: "true"
    API_SERVER_HOST:
      value: 0.0.0.0
    API_SERVER_PORT:
      value: "8642"
    # Web dashboard, supervised by s6 beside the gateway; the OIDC login against
    # Authentik is what a non-loopback bind requires, and the public URL fixes the callback
    HERMES_DASHBOARD:
      value: "1"
    HERMES_DASHBOARD_PORT:
      value: "9119"
    HERMES_DASHBOARD_OIDC_ISSUER:
      value: PLACEHOLDER_OIDC_ISSUER
    HERMES_DASHBOARD_OIDC_CLIENT_ID:
      value: hermes-dashboard
    HERMES_DASHBOARD_PUBLIC_URL:
      value: PLACEHOLDER_PUBLIC_URL
    # config.yaml is mounted read-only from the repo; a schema migration could not write it
    HERMES_SKIP_CONFIG_MIGRATION:
      value: "1"
    TZ:
      value: Europe/Berlin

  volumes:
    hermes-data:
      persistentVolumeClaim:
        claimName: hermes-data
    # The default profile's keys, composed from the sealed keys (env-template.yaml)
    hermes-env:
      secret:
        secretName: hermes-credentials
        items:
          - key: default.env
            path: .env
    hermes-config:
      configMap:
        name: hermes-config
        items:
          - key: config.yaml
            path: config.yaml
    hermes-soul:
      configMap:
        name: hermes-config
        items:
          - key: SOUL.md
            path: SOUL.md
    hermes-agents:
      configMap:
        name: hermes-config
        items:
          - key: AGENTS.md
            path: AGENTS.md
    hermes-no-bundled-skills:
      configMap:
        name: hermes-config
        items:
          - key: .no-bundled-skills
            path: .no-bundled-skills
    hermes-skill-explain:
      configMap:
        name: hermes-skills
        items:
          - key: lares-explain
            path: SKILL.md
    hermes-skill-propose:
      configMap:
        name: hermes-skills
        items:
          - key: lares-propose
            path: SKILL.md
    hermes-plugin-session-reset-policy:
      configMap:
        name: hermes-plugin-session-reset-policy

  volumeMounts:
    # All Hermes state: sessions, memories, cron ledger, logs
    hermes-data:
      mountPath: /opt/data
    # A mount, never a file on the volume; the Reloader rolls the pod when a key is resealed
    hermes-env:
      mountPath: /opt/data/.env
      subPath: .env
      readOnly: true
    # The repo wins over runtime edits: config and persona are read-only files inside the data volume
    hermes-config:
      mountPath: /opt/data/config.yaml
      subPath: config.yaml
      readOnly: true
    hermes-soul:
      mountPath: /opt/data/SOUL.md
      subPath: SOUL.md
      readOnly: true
    hermes-agents:
      mountPath: /opt/data/AGENTS.md
      subPath: AGENTS.md
      readOnly: true
    # Marker only; the skill index then holds the lares skills and Hermes' own essential skill
    hermes-no-bundled-skills:
      mountPath: /opt/data/.no-bundled-skills
      subPath: .no-bundled-skills
      readOnly: true
    hermes-skill-explain:
      mountPath: /opt/data/skills/lares-explain/SKILL.md
      subPath: SKILL.md
      readOnly: true
    hermes-skill-propose:
      mountPath: /opt/data/skills/lares-propose/SKILL.md
      subPath: SKILL.md
      readOnly: true
    # A plugin is its own directory under plugins/; Hermes finds the manifest there and looks no deeper
    hermes-plugin-session-reset-policy:
      mountPath: /opt/data/plugins/hermes-session-reset-policy
      readOnly: true

  ports:
    - containerPort: 8642
      name: api
      protocol: TCP
    - containerPort: 9119
      name: dashboard
      protocol: TCP

  # /health is unauthenticated and process-only; the gateway is supervised by s6 inside the container.
  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: api
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 4

  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: api
    initialDelaySeconds: 30
    periodSeconds: 15

  # Starts as root (s6-overlay chowns the volume, then drops to UID 10000); writes to /run and /tmp.
  # The added capabilities are the ones root needs for that: own the volume, drop
  # privileges, and signal the UID-10000 services it supervises.
  containerSecurityContext:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
      add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]

  securityContext:
    fsGroup: 10000

  # Streams the default profile's agent.log for Loki; each person's is rendered into profiles/
  additionalContainers:
    agent-log:
      image: agent-log
      command: ["tail", "-n", "0", "-F", "/opt/data/logs/agent.log"]
      volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
          readOnly: true
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 8642
      name: api
      protocol: TCP
      targetPort: api
    - port: 9119
      name: dashboard
      protocol: TCP
      targetPort: dashboard
