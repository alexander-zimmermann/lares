# generated by `task agents:create-harness-config`, do not edit
# The default profile's: settings.yaml, then the parts rendered from persons.yaml
# and use-cases.yaml.

# From settings.yaml, the hand-written part every profile shares; its comments
# stay there.
compression:
  threshold_tokens: 256000
  codex_gpt55_autoraise_notice: false
agent:
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - browser
    - web
    - search
    - image_gen
    - video_gen
    - tts
    - vision
    - cronjob
    - delegation
    - computer_use
    - discord_admin
    - kanban
    - discord
    - connections
  run_budget_seconds: 600
  reasoning_effort: high
approvals:
  unattended_mode: deny
  cron_mode: deny
skills:
  external_dirs:
    - /opt/skills
onboarding:
  profile_build: 'off'
  seen:
    profile_build_offered: true
    busy_input_prompt: true
    tool_progress_prompt: true
    openclaw_residue_cleanup: true
memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2200
  write_approval: false
  nudge_interval: 5
discord:
  require_mention: true
  free_response_channels:
    - '1548229055348736034'
  auto_thread: false
  dm_policy: allowlist
  allow_from:
    - ${env:DISCORD_USER_AZ1003}
    - ${env:DISCORD_USER_GZ1410}
    - ${env:DISCORD_USER_LZ1410}
    - ${env:DISCORD_USER_VZ1604}
  allow_admin_from:
    - ${env:DISCORD_USER_AZ1003}
  group_allow_admin_from:
    - ${env:DISCORD_USER_AZ1003}
  user_allowed_commands:
    - new
    - stop
    - retry
    - undo
  group_user_allowed_commands:
    - new
    - stop
    - retry
    - undo
platforms:
  discord:
    home_channel:
      platform: discord
      chat_id: '1548229055348736034'
      name: '#admin'
display:
  platforms:
    discord:
      tool_progress: 'off'
stt:
  language: de
group_sessions_per_user: true
session_reset:
  mode: both
  idle_minutes: 60
  at_hour: 4
sessions:
  auto_prune: true
plugins:
  enabled:
    - hermes-session-reset-policy
gateway:
  multiplex_profiles: true
  profile_routes:
    - name: az1003
      platform: discord
      user_id: ${env:DISCORD_USER_AZ1003}
      profile: az1003
    - name: gz1410
      platform: discord
      user_id: ${env:DISCORD_USER_GZ1410}
      profile: gz1410
    - name: lz1410
      platform: discord
      user_id: ${env:DISCORD_USER_LZ1410}
      profile: lz1410
    - name: vz1604
      platform: discord
      user_id: ${env:DISCORD_USER_VZ1604}
      profile: vz1604
monitoring:
  gateway_health_export:
    enabled: true
    warning_error_events_enabled: false
  export:
    otlp:
      enabled: true
      endpoint: http://alloy-alloy-receiver.alloy.svc.cluster.local:4318/v1/traces
model_catalog:
  enabled: false
dashboard:
  trusted_proxies:
    - 10.244.0.0/16
tools:
  tool_search:
    enabled: 'off'

# Rendered from persons.yaml: the default profile's source, its fallbacks in order,
# and the profile's directory, where Hermes discovers the context files.
model:
  provider: openai-codex
  default: gpt-6-sol
fallback_providers:
  - provider: openai-api
    model: gpt-6-luna
terminal:
  cwd: /opt/data

# Rendered from use-cases.yaml: what each surface may hold, the tool servers,
# and the hook that reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - no_mcp
  api_server:
    - lares
  cron:
    - hermes-cron
    - lares
    - lares-memory
    - github
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - post_tool_call
        - api_request_error
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_schema
        - get_forecast
        - get_pv_forecast
        - get_weather_forecast
        - get_episode
        - get_current_state
        - get_current_knx
        - get_wiki_page
        - query_*
        - correlate_events
        - search_wiki
        - backtest_fault
      resources: false
      prompts: false
  lares-memory:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares-memory
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 30
    tools:
      include:
        - get_memory
        - append_memory
      resources: false
      prompts: false
  github:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/github
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - get_*
        - list_*
        - search_*
        - issue_read
        - pull_request_read
      resources: false
      prompts: false
