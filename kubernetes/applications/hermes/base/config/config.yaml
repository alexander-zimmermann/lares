# generated by `task agents:create-harness-config`, do not edit
# The default profile's: rendered from persons.yaml and use-cases.yaml. The
# hand-written settings.yaml is the managed scope, /etc/hermes/config.yaml,
# which Hermes reads over this file.

# Rendered from persons.yaml: the default profile's source, its fallbacks in order,
# and the profile's directory, where Hermes discovers the context files.
model:
  provider: openai-codex
  default: gpt-6-sol
fallback_providers:
  - provider: openai-api
    model: gpt-6-luna
terminal:
  cwd: /opt/data

# Rendered from use-cases.yaml: what each surface may hold, the tool servers,
# and the hook that reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - no_mcp
  api_server:
    - lares
  cron:
    - hermes-cron
    - lares
    - lares-memory
    - github
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - post_tool_call
        - api_request_error
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_schema
        - get_forecast
        - get_pv_forecast
        - get_weather_forecast
        - get_episode
        - get_current_state
        - get_current_knx
        - get_wiki_page
        - query_*
        - correlate_events
        - search_wiki
        - backtest_fault
      resources: false
      prompts: false
  lares-memory:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares-memory
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 30
    tools:
      include:
        - get_memory
        - append_memory
      resources: false
      prompts: false
  github:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/github
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - get_*
        - list_*
        - search_*
        - issue_read
        - pull_request_read
      resources: false
      prompts: false

# Rendered from persons.yaml: who may write to the bot, who runs every command,
# what everyone else may run, and each Discord person's route to their profile.
discord:
  allow_from:
    - ${env:DISCORD_USER_AZ1003}
  allow_admin_from:
    - ${env:DISCORD_USER_AZ1003}
  group_allow_admin_from:
    - ${env:DISCORD_USER_AZ1003}
  user_allowed_commands:
    - reset
    - stop
    - retry
    - undo
  group_user_allowed_commands:
    - reset
    - stop
    - retry
    - undo
gateway:
  profile_routes:
    - name: az1003
      platform: discord
      user_id: ${env:DISCORD_USER_AZ1003}
      profile: az1003
