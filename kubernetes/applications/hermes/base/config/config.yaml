# generated by `task agents:create-harness-config`, do not edit
# The hand-written settings.yaml first, then the part rendered from use-cases.yaml.

# Hermes settings: everything use-cases.yaml does not render. Copied whole into
# config.yaml, which is mounted read-only: what runs is what is reviewed here.

# Codex via the ChatGPT login (flat, token on the data volume); Grok on prepaid
# credits takes over when Codex fails: auth, rate window, outage.
# The Codex backend serves the current line only: it answers a retired id with
# HTTP 404 `model_not_found`, and because `model_catalog` below is off, Hermes
# cannot notice and silently spends the day on the fallback. Pin an id the
# picker (`hermes model --refresh`) lists, and re-check it when the fallback
# banner shows up in an answer.
model:
  provider: openai-codex
  default: gpt-6-sol
fallback_providers:
  - provider: xai
    model: grok-4.3

agent:
  # Unattended and read-only: everything the agent may read comes through the
  # bridge's MCP tools, and the bridge denies the rest a second time.
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - browser
    - web
    - search
    - image_gen
    - video_gen
    - tts
    - vision
    - cronjob
    - delegation
    - computer_use
    - discord_admin
    - homeassistant
    - kanban
    # Discord's server-reading tools, which any explicit Discord toolset list switches on
    - discord
    # x_search registers itself as soon as XAI_API_KEY is set; connections is the Nous tool gateway
    - x_search
    - connections
  # Wall-clock budget per run
  run_budget_seconds: 600
  # The first live answers stopped after one tool call at the default (medium)
  reasoning_effort: high

# Context files (AGENTS.md) are discovered from the gateway's working directory
terminal:
  cwd: /opt/data

approvals:
  # Nobody answers approval prompts on a chat platform at 03:00: deny, never wait.
  unattended_mode: deny
  cron_mode: deny

# Skills are files in the repo; agent edits are staged and never approved.
skills:
  write_approval: true

# First-touch hints latch into config.yaml, which is read-only here: no profile
# offer, and every hint pre-marked as seen, else the intro repeats on every message.
onboarding:
  profile_build: "off"
  seen:
    profile_build_offered: true
    busy_input_prompt: true
    tool_progress_prompt: true
    openclaw_residue_cleanup: true

# Bounded working notes per install; facts live in the database, not here.
memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2200
  write_approval: false

discord:
  # One private server, one user: answer everywhere, no threads per message
  require_mention: false
  auto_thread: false

display:
  platforms:
    discord:
      # No tool-call bubbles in the channel; the answer names its sources itself
      tool_progress: "off"

# Session isolation on every gateway platform
group_sessions_per_user: true

# Gateway and Discord liveness as metrics into the Alloy receiver; Kubernetes
# cannot see a gateway crash under s6, the alert rules on hermes_gateway_up can.
monitoring:
  gateway_health_export:
    enabled: true
    # The receiver takes metrics and traces only; the OTLP log signal would 404 every 5 s
    warning_error_events_enabled: false
  export:
    otlp:
      enabled: true
      endpoint: http://alloy-alloy-receiver.alloy.svc.cluster.local:4318/v1/traces

# No remote model catalogs: the gateway would refetch the Nous manifest, the OpenRouter
# list and the portal recommendations every 20 minutes, four hosts the agent cage does
# not open. The /model picker keeps the snapshot shipped with the image; the provider
# above is not on either list anyway.
model_catalog:
  enabled: false

# Behind Traefik: its forwarded headers are trusted from the pod network only,
# and the public URL comes from the environment per cluster.
dashboard:
  trusted_proxies:
    - 10.244.0.0/16

# Every tool definition in the prompt, not behind a search. Hermes defers MCP
# tools by default, which costs a round per lookup and lets a step call one
# of them only; the bridge's tools are about 5k tokens, and cached.
tools:
  tool_search:
    enabled: "off"

# Rendered from use-cases.yaml: what each surface may hold, the tool servers,
# and the hook that reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - lares
    - lares-runs
  api_server:
    - lares
  cron:
    - hermes-cron
    - lares
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    headers:
      Authorization: Bearer ${env:LARES_MCP_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_*
        - query_*
        - correlate_events
        - search_wiki
  lares-runs:
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    headers:
      Authorization: Bearer ${env:LARES_RUNS_MCP_KEY}
    timeout: 30
    tools:
      include:
        - start_run
