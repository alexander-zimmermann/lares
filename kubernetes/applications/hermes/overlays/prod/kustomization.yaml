apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replacements:
  - sourceValue: 2Gi
    targets:
      - select:
          kind: PersistentVolumeClaim
          name: hermes-data
        fieldPaths:
          - spec.resources.requests.storage

  # Dashboard hostname into Certificate dnsNames and IngressRoute Host(...) match
  - sourceValue: hermes.zimmermann.sh
    targets:
      - select:
          kind: Certificate
          name: hermes-tls-cert
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: IngressRoute
          name: hermes
        fieldPaths:
          - spec.routes.0.match
        options:
          delimiter: "`"
          index: 1
      - select:
          kind: IngressRoute
          name: hermes
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: "//"
          index: 1

  # OIDC issuer (the Authentik application `hermes`) and the dashboard's public URL
  - sourceValue: https://auth.zimmermann.sh/application/o/hermes/
    targets:
      - select:
          kind: Deployment
          name: hermes
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=HERMES_DASHBOARD_OIDC_ISSUER].value

  - sourceValue: https://hermes.zimmermann.sh
    targets:
      - select:
          kind: Deployment
          name: hermes
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=HERMES_DASHBOARD_PUBLIC_URL].value

  # Rewrite external-dns target annotation to the UDM Pro
  - sourceValue: udm-pro.zimmermann.sh
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]

patches:
  # Sized for one gateway with a Discord session and the MCP results in context.
  - target:
      kind: Deployment
      name: hermes
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: hermes
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi
