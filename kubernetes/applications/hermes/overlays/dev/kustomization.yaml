apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replacements:
  - sourceValue: 1Gi
    targets:
      - select:
          kind: PersistentVolumeClaim
          name: hermes-data
        fieldPaths:
          - spec.resources.requests.storage

patches:
  # Sized for one gateway with a Discord session and the MCP results in context.
  - target:
      kind: Deployment
      name: hermes
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: hermes
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 768Mi
