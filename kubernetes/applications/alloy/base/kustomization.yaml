apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alloy
resources:
  - ./namespace.yaml
  - ./certificate.yaml
  - ./ingress-route.yaml

helmCharts:
  - name: k8s-monitoring
    repo: oci://ghcr.io/grafana/helm-charts
    releaseName: alloy
    version: 4.6.1
    valuesFile: values.yaml
    namespace: alloy
    includeCRDs: true

patches:
  # Add the Cilium BGP label to the chart-rendered receiver Service (chart doesn't support custom service labels)
  - target:
      kind: Service
      name: alloy-alloy-receiver
    patch: |-
      - op: add
        path: /metadata/labels/bgp.cilium.io~1advertise-service
        value: default

labels:
  - includeSelectors: false
    pairs:
      homelab.app: alloy

commonAnnotations:
  argocd.argoproj.io/sync-wave: "8"
