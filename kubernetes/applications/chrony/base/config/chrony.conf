# Time server for the zones without WAN (IoT LAN, Outdoor); the UDM answers no NTP itself.

# Upstream: the servers the Talos nodes use (cluster/patches/global-settings.yaml)
pool time.cloudflare.com iburst
pool pool.ntp.org iburst

# Unprivileged port so chronyd runs as nobody; the Service maps 123 onto it
port 1123
# The UDM decides which zones reach the LB IP; no ratelimit, clients may arrive SNATed to a node IP
allow all

# Command channel on localhost UDP only, for the probes; the Unix socket would need a chrony-owned directory
cmdport 1323
bindcmdaddress 127.0.0.1
bindcmdaddress /

pidfile /var/lib/chrony/chronyd.pid
driftfile /var/lib/chrony/drift
