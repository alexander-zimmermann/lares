apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: chrony
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: chrony
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          # Ensure Burstable QoS (no BestEffort) and prevent runaway usage.
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
