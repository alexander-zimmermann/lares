apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # NTP service with static IP and BGP advertisement; DHCP on VLAN 6 and VLAN 3 hands this address out
  - target:
      kind: Service
      name: chrony
    patch: |-
      - op: test
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/annotations/io.cilium~1lb-ipam-ips
        value: "192.168.10.222"

  - target:
      kind: Deployment
      name: chrony
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: chrony
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          # Ensure Burstable QoS (no BestEffort) and prevent runaway usage.
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
