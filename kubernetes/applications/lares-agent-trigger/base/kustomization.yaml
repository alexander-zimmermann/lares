apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agents

# No namespace.yaml here: `agents` is created and owned by the hermes
# application at wave 12, and two ArgoCD apps rendering one Namespace would
# fight over its labels.

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: lares-agent-trigger
    version: 9.3.2
    valuesFile: values.yaml
    namespace: agents
    apiVersions:
      - monitoring.coreos.com/v1

# Content-hash suffix: a change to the declared use cases produces a new
# ConfigMap name, so the Deployment reference updates and ArgoCD rolls the pod.
configMapGenerator:
  - name: lares-agent-trigger-use-cases
    files:
      - use-cases.yaml=config/use-cases.yaml

labels:
  - includeSelectors: false
    pairs:
      homelab.app: lares-agent-trigger

# Wave 13 = after nats (10), lares-mcp-bridge (11) and hermes (12): the trigger
# needs the stream, the ledger and the Runs API before it has anything to do.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "13"
