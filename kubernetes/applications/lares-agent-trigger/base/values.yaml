applicationName: lares-agent-trigger

deployment:
  enabled: true
  # The use-case file and the cron job set come in as hashed ConfigMaps (pod
  # rolls on change), and there is no Stakater Reloader controller in the cluster.
  reloadOnChange: false
  image:
    repository: ghcr.io/alexander-zimmermann/lares-agent-trigger
    tag: 0.11.0
    pullPolicy: IfNotPresent

  # Caged by the CiliumClusterwideNetworkPolicy agent-cage (components/cilium)
  podLabels:
    role: agent

  # A second replica would fetch the same event twice; the dedupe would catch
  # it, but the durable consumer is meant to have one reader.
  replicas: 1
  strategy:
    type: Recreate

  env:
    USE_CASES_FILE:
      value: /etc/lares-agent-trigger/use-cases.yaml
    # The cron job set rendered from it, reconciled into Hermes at every start
    CRON_JOBS_FILE:
      value: /etc/lares-agent-trigger/cron-jobs.yaml
    NATS_SERVERS:
      value: nats://nats.nats.svc.cluster.local:4222
    # NKey seed mounted as a file from the synced Secret (Kyverno clones from `nats` namespace)
    NATS_NKEY_SEED_FILE:
      value: /etc/lares-agent-trigger/nkey-seed
    NATS_STREAM_NAME:
      value: EPISODE
    CONSUMER_NAME:
      value: agent-trigger
    DB_HOST:
      value: timescaledb-db-rw.timescaledb.svc.cluster.local
    DB_PORT:
      value: "5432"
    DB_NAME:
      value: homelab
    # Ledger-writer credentials mounted as files from the synced Secret
    # (Kyverno clones from `timescaledb` namespace); the role may insert and
    # update agent_runs and agent_memory, nothing else.
    DB_USERNAME_FILE:
      value: /etc/lares-agent-trigger/db_username
    DB_PASSWORD_FILE:
      value: /etc/lares-agent-trigger/db_password
    # Which midnight the daily cap counts from
    TIMEZONE:
      value: Europe/Berlin
    # Harness: the API server of the gateway in this namespace, and the key it
    # was given in the hermes SealedSecret
    HERMES_URL:
      value: http://hermes.agents.svc.cluster.local:8642
    HERMES_API_KEY_FILE:
      value: /etc/lares-agent-trigger/hermes-api-key
    # A run still failed after its one retry is posted here as AgentRunFailed
    ALERTMANAGER_URL:
      value: http://prometheus-alertmanager.prometheus.svc.cluster.local:9093
    # Delivery to Discord: the bot token of the hermes SealedSecret and the
    # harness's own DISCORD_HOME_CHANNEL (#Allgemein)
    DISCORD_BOT_TOKEN_FILE:
      value: /etc/lares-agent-trigger/discord-bot-token
    DISCORD_HOME_CHANNEL:
      value: "1548229055348736034"
    # Delivery by mail: the in-cluster relay speaks plaintext SMTP and passes
    # mail from its one accepted sender only
    SMTP_HOST:
      value: smtprelay.smtprelay.svc.cluster.local
    SMTP_PORT:
      value: "25"
    MAIL_FROM:
      value: Lares <admin@zimmermann.sh>
    MAIL_TO:
      value: admin@zimmermann.sh
    # The engine's fault list, for the sentence in the mail subject
    FAULTS_FILE:
      value: /etc/lares-agent-trigger/faults.yaml
    # The episode on the knx-episodes dashboard; the host is set per overlay
    DASHBOARD_EPISODE_URL:
      value: PLACEHOLDER_DASHBOARD_EPISODE_URL
    # Delivery to GitHub: pull requests, issues and comments opened as the write
    # App (Lares Agent Writer), whose key stays in this pod; the
    # open pull requests are read back once a day as the same App
    GITHUB_APP_ID:
      valueFrom:
        secretKeyRef:
          name: lares-agent-github-app
          key: app-id
    GITHUB_APP_INSTALLATION_ID:
      valueFrom:
        secretKeyRef:
          name: lares-agent-github-app
          key: installation-id
    GITHUB_APP_PRIVATE_KEY_FILE:
      value: /etc/lares-agent-trigger/github-app-private-key
    # Hook receiver and the trigger's own API: Hermes posts every finished chat
    # and cron turn here, signed with the key both pods read from the hermes
    # SealedSecret; the bridge forwards start_run here with a key sealed for both
    # namespaces
    HTTP_PORT:
      value: "8080"
    HOOK_SECRET_FILE:
      value: /etc/lares-agent-trigger/hook-secret
    API_KEY_FILE:
      value: /etc/lares-agent-trigger/api-key
    LOG_FORMAT:
      value: json
    METRICS_PORT:
      value: "9090"
    # OTLP/HTTP collector for traces; the sampling ratio defaults to 0.1 like connect
    TRACING_ENDPOINT:
      value: http://alloy-alloy-receiver.alloy.svc.cluster.local:4318
    TZ:
      value: Europe/Berlin

  volumes:
    use-cases:
      configMap:
        name: lares-agent-trigger-use-cases
    cron-jobs:
      configMap:
        name: lares-agent-trigger-cron-jobs
    nats-credentials:
      secret:
        secretName: lares-agent-trigger-nats-credentials
        items:
          - key: nkey-seed
            path: nkey-seed
    db-username:
      secret:
        secretName: timescaledb-db-lares-agent-trigger-secret
        items:
          - key: username
            path: username
    db-password:
      secret:
        secretName: timescaledb-db-lares-agent-trigger-secret
        items:
          - key: password
            path: password
    hermes-api-key:
      secret:
        secretName: hermes-credentials
        items:
          - key: api-server-key
            path: api-server-key
    discord-bot-token:
      secret:
        secretName: hermes-credentials
        items:
          - key: discord-bot-token
            path: discord-bot-token
    faults:
      configMap:
        name: lares-diagnostics-engine-faults
    hook-secret:
      secret:
        secretName: hermes-credentials
        items:
          - key: trigger-hook-secret
            path: trigger-hook-secret
    api-key:
      secret:
        secretName: hermes-credentials
        items:
          - key: trigger-api-key
            path: trigger-api-key
    github-app-private-key:
      secret:
        secretName: lares-agent-github-app
        items:
          - key: private-key
            path: private-key

  volumeMounts:
    use-cases:
      mountPath: /etc/lares-agent-trigger/use-cases.yaml
      subPath: use-cases.yaml
      readOnly: true
    cron-jobs:
      mountPath: /etc/lares-agent-trigger/cron-jobs.yaml
      subPath: cron-jobs.yaml
      readOnly: true
    nats-credentials:
      mountPath: /etc/lares-agent-trigger/nkey-seed
      subPath: nkey-seed
      readOnly: true
    db-username:
      mountPath: /etc/lares-agent-trigger/db_username
      subPath: username
      readOnly: true
    db-password:
      mountPath: /etc/lares-agent-trigger/db_password
      subPath: password
      readOnly: true
    hermes-api-key:
      mountPath: /etc/lares-agent-trigger/hermes-api-key
      subPath: api-server-key
      readOnly: true
    discord-bot-token:
      mountPath: /etc/lares-agent-trigger/discord-bot-token
      subPath: discord-bot-token
      readOnly: true
    faults:
      mountPath: /etc/lares-agent-trigger/faults.yaml
      subPath: faults.yaml
      readOnly: true
    hook-secret:
      mountPath: /etc/lares-agent-trigger/hook-secret
      subPath: trigger-hook-secret
      readOnly: true
    api-key:
      mountPath: /etc/lares-agent-trigger/api-key
      subPath: trigger-api-key
      readOnly: true
    github-app-private-key:
      mountPath: /etc/lares-agent-trigger/github-app-private-key
      subPath: private-key
      readOnly: true

  ports:
    - containerPort: 8080
      name: http
      protocol: TCP
    - containerPort: 9090
      name: metrics
      protocol: TCP

  # /healthz is NATS- and ledger-gated; a harness outage is a failed run with
  # its own alert, never a restart loop here.
  livenessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 30
    periodSeconds: 30

  readinessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 10
    periodSeconds: 10

  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  securityContext:
    fsGroup: 1000

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: http
    - port: 9090
      name: metrics
      protocol: TCP
      targetPort: metrics

serviceMonitor:
  enabled: true
  additionalLabels:
    # Prometheus Operator label (Opt-In)
    release: prometheus
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
