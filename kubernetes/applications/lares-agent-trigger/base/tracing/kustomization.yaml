apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The sampling ratio of the agent platform as its own ConfigMap, rendered from
# use-cases.yaml (`task agents:create-harness-config`). The trigger, the bridge
# and the engine include this directory, so each namespace holds one.
configMapGenerator:
  - name: agent-tracing
    envs:
      - tracing.env
