# The model sources of the agent platform, the one the default profile runs
# on, and the persons. The default profile belongs to the machines: every event
# and cron run. Each enabled person chats on a profile of their own, named by
# the handle, which is also their Authentik username and whom the gateway names
# to the tool servers.
#
# The schema and the loader live in lares-agent-trigger, which mounts this file
# beside use-cases.yaml and prices every model call by the source step that
# served it. `task agents:create-harness-config` renders every profile's
# `model` and `fallback_providers` from it, and each person's profile.
#
# A person's identity never lands here: their Discord id is sealed in
# hermes-credentials as <handle>-discord-user, which the default profile's .env
# reads as DISCORD_USER_<HANDLE>; their keys as <handle>-<key>.
#
# A source's `bound` caps what it may spend: `subscription` costs nothing per
# call, `capped` is metered against a hard limit and names its list price in
# USD per million tokens. A call no step here covers keeps a NULL cost and
# is counted in agent_trigger_unpriced_calls_total.

default_profile:
  model: owner-subscription

model_sources:
  # The owner's ChatGPT subscription, one login per profile on the data volume:
  # the default profile's and the owner's, sharing one Codex window. The Codex
  # backend serves the current line only: it answers a retired id with HTTP 404
  # `model_not_found`, and because `model_catalog` is off, Hermes cannot notice
  # and silently spends the day on the fallback. Pin an id the picker
  # (`hermes model --refresh`) lists, and re-check it when the fallback banner
  # shows up in an answer.
  # Login, by hand, once per profile: ChatGPT Settings → Security → device code
  # authorization = on, then `kubectl -n agents exec -it deploy/hermes -c hermes
  # -- /command/s6-setuidgid hermes hermes auth add openai-codex --type oauth`,
  # with `-p <handle>` before `auth` for a person's profile; as root, the login
  # would be root's file until Hermes restarts. Only `auth add` writes the
  # profile's own login; `hermes -p <handle> model` or a copied auth.json puts
  # the person's token into the machines' login or is healed away. Then
  # `task agents:check-codex-login [<handle>]` must say `ok`; it fails when the
  # profile still runs on the machines' login or its account breaks the
  # source's `account` rule. A login's refresh token is single-use, so a volume
  # restored from a backup may need a new login.
  - name: owner-subscription
    provider: openai-codex
    model: gpt-6-sol
    account: shared-with-default
    bound: subscription
    fallback:
      # Each profile's own OpenAI project: `machines` for the default, `owner`
      # for the owner, one per handle. Limits → monthly budget = 5 USD, enforce
      # hard limit = on; prepaid credit, auto recharge off. List price of 2026-10-20.
      - &own-project
        provider: openai-api
        model: gpt-6-luna
        bound: capped
        price: {input: 0.10, cached_input: 0.01, output: 0.50}

  # A person's own free ChatGPT account, logged in on their profile alone, the
  # way owner-subscription's comment says. The free plan refuses gpt-6-sol with
  # HTTP 400, and its window resets once every 30 days.
  # Account settings, by hand, before the login: for a teen, Parental controls
  # → linked account = the owner's, model training = off; for everyone, Data
  # controls → Improve the model for everyone = off and Security → device code
  # login for Codex = on.
  - name: free-account
    provider: openai-codex
    model: gpt-6-luna
    account: per-person
    bound: subscription
    fallback: [*own-project]

# Adding a person: seal <handle>-discord-user and every key the rendered
# env-template names, add their agent-log-<handle> patch to both Hermes
# overlays, log their profile in after the sync, and see one test DM answered
# before telling them. A valid but wrong Discord id drops their messages silently.
# Locking one out: `dormant: <reason>` and a kick from the Discord server, never
# a ban, which Discord sets by IP and so for the whole household.
persons:
  # The owner, on the machines' subscription with a Codex login of their own.
  - name: az1003
    discord: admin
    tools: [lares, lares-runs, github, grafana, cloudflare]
    connectors: [claude-ai]
    model: owner-subscription
    keep_answers: true
    enabled: true

  # The rest of the household: the house only, each on their own free account.
  - name: gz1410
    discord: true
    tools: [lares]
    model: free-account
    enabled: true

  - name: lz1410
    discord: true
    tools: [lares]
    model: free-account
    enabled: true

  - name: vz1604
    discord: true
    tools: [lares]
    model: free-account
    enabled: true
