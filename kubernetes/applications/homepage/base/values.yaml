applicationName: homepage

deployment:
  enabled: true
  # homepage-config/-icons use kustomize content-hash names (see kustomization.yaml),
  # so a config change rolls the pod natively. The Stakater Reloader annotation is not
  # used — there is no Reloader controller in the cluster.
  reloadOnChange: false
  # Kubernetes widget queries the cluster API via the SA token; v7 flipped the chart default to false
  automountServiceAccountToken: true
  replicas: 1
  # Recreate avoids Multi-Attach errors on the homepage-images RWO PVC — old pod must terminate before new one starts.
  strategy:
    type: Recreate

  image:
    repository: ghcr.io/gethomepage/homepage
    tag: v2.1.0
    pullPolicy: IfNotPresent

  env:
    # Host validation: kubelet probes send a static "localhost:3000" Host header (set on the
    # liveness/readinessProbe below), so a fixed entry suffices instead of the dynamic pod IP.
    # The public domain is injected via overlay replacement (delimiter: ",", index: 1).
    HOMEPAGE_ALLOWED_HOSTS:
      value: "localhost:3000,PLACEHOLDER"
    # Authentik API token — cloned from authentik namespace by Kyverno.
    HOMEPAGE_VAR_AUTHENTIK_KEY:
      valueFrom:
        secretKeyRef:
          name: authentik-homepage-token
          key: AUTHENTIK_HOMEPAGE_API_TOKEN
    # Grafana admin credentials — cloned from grafana namespace by Kyverno.
    HOMEPAGE_VAR_GRAFANA_USERNAME:
      valueFrom:
        secretKeyRef:
          name: grafana-admin-credentials
          key: admin-user
    HOMEPAGE_VAR_GRAFANA_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: grafana-admin-credentials
          key: admin-password
    # ArgoCD API token — provisioned by post-sync job, cloned by Kyverno.
    HOMEPAGE_VAR_ARGOCD_TOKEN:
      valueFrom:
        secretKeyRef:
          name: argocd-homepage-token
          key: token
    # CrowdSec widget username — static value, matches machine name in CrowdSec LAPI.
    HOMEPAGE_VAR_CROWDSEC_USERNAME:
      value: "homepage"
    # CrowdSec LAPI password for the "homepage" machine — cloned from crowdsec namespace by Kyverno.
    HOMEPAGE_VAR_CROWDSEC_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: crowdsec-homepage-lapi-key
          key: crowdsec_homepage_lapi_key

  envFrom:
    # Proxmox, Unifi, and other API credentials. nameSuffix combines with applicationName → "homepage-secrets".
    homepage-secrets:
      type: secret
      nameSuffix: secrets

  volumes:
    homepage-config:
      configMap:
        name: homepage-config
    homepage-icons:
      configMap:
        name: homepage-icons
    homepage-images:
      persistentVolumeClaim:
        claimName: homepage-images
    homepage-logs:
      emptyDir: {}

  volumeMounts:
    homepage-config:
      mountPath: /app/config
    homepage-icons:
      mountPath: /app/public/icons
    homepage-images:
      mountPath: /app/public/images
    homepage-logs:
      mountPath: /app/logs

  ports:
    - containerPort: 3000
      name: http
      protocol: TCP

  livenessProbe:
    enabled: true
    httpGet:
      path: /api/healthcheck
      port: http
      # Static Host header so the request matches HOMEPAGE_ALLOWED_HOSTS instead of the pod IP.
      httpHeaders:
        - name: Host
          value: localhost:3000
    initialDelaySeconds: 5
    periodSeconds: 15

  # Chart disables the readiness probe by default; enable it so the pod only
  # receives traffic once /api/healthcheck passes (homepage starts slowly).
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/healthcheck
      port: http
      # Static Host header so the request matches HOMEPAGE_ALLOWED_HOSTS instead of the pod IP.
      httpHeaders:
        - name: Host
          value: localhost:3000
    initialDelaySeconds: 5
    periodSeconds: 15

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    fsGroup: 1000

# LoadBalancer with BGP advertisement via Cilium — static IP injected per environment via overlay
service:
  enabled: true
  type: LoadBalancer
  additionalLabels:
    bgp.cilium.io/ip-pool: default
    bgp.cilium.io/advertise-service: default
  ports:
    - port: 3000
      name: http
      protocol: TCP
      targetPort: http

# ServiceAccount bound to ClusterRole in rbac.yaml (needed for the Kubernetes widget that lists pods/nodes/services).
rbac:
  serviceAccount:
    create: true
    name: homepage
