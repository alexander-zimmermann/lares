apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homepage
resources:
  - ./namespace.yaml
  - ./rbac.yaml
  - ./persistentvolume.yaml
  - ./certificate.yaml
  - ./ingress-route.yaml
  - ./sealed-secret.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: homepage
    version: 9.1.0
    valuesFile: values.yaml
    namespace: homepage

# Content-hash suffix: a config/icon change produces a new ConfigMap name, so the
# Deployment volume references update and ArgoCD rolls the pod natively.
configMapGenerator:
  - name: homepage-config
    files:
      - config/bookmarks.yaml
      - config/custom.css
      - config/custom.js
      - config/docker.yaml
      - config/kubernetes.yaml
      - config/proxmox.yaml
      - config/services.yaml
      - config/settings.yaml
      - config/widgets.yaml
  - name: homepage-icons
    files:
      - icons/2n.svg
      - icons/basalte.png
      - icons/hubble.svg
      - icons/mdt.svg
      - icons/telenot.svg
      - icons/thinkstation.png
      - icons/warp.png

labels:
  - includeSelectors: false
    pairs:
      homelab.app: homepage

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
