apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # One Go process; each call is a few Grafana API requests, a Loki answer the largest.
  - target:
      kind: Deployment
      name: grafana-mcp
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: mcp-grafana
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 500m
            memory: 256Mi
