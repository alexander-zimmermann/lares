# The account grafana-mcp reads Grafana as: Viewer, which may read and query
# every data source, one token without expiry. The operator writes the token
# into lares-agent-reader-token beside it, under `token`.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount

metadata:
  name: lares-agent-reader

spec:
  instanceName: grafana
  name: lares-agent-reader
  role: Viewer
  tokens:
    - name: lares-agent-reader
      secretName: lares-agent-reader-token
