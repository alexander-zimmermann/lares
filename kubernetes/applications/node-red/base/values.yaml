applicationName: node-red

deployment:
  enabled: true
  # ConfigMap uses a kustomize content-hash name, so a config change rolls the
  # pod natively. The Stakater Reloader annotation is not used — there is no
  # Reloader controller in the cluster.
  reloadOnChange: false
  replicas: 1
  # Node-RED uses local state on a PVC; avoid concurrent writers.
  strategy:
    type: Recreate

  image:
    repository: docker.io/nodered/node-red
    tag: 5.0.5
    pullPolicy: IfNotPresent

  # No API access required.
  automountServiceAccountToken: false

  args:
    - --settings
    - /config/settings.js

  # initContainer installs passport-openidconnect into /data/node_modules for OIDC adminAuth.
  # NODE_PATH on the main container makes this available to require() in settings.js.
  initContainers:
    install-oidc-deps:
      image: docker.io/library/node:lts-alpine
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - npm install --prefix /data --no-save passport-openidconnect
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      volumeMounts:
        - name: node-red-data
          mountPath: /data

  env:
    # Keep logs/timestamps consistent with local timezone.
    TZ:
      value: "Europe/Berlin"
    # Credential encryption key for flows_cred.json (sourced from SealedSecret).
    NODE_RED_CREDENTIAL_SECRET:
      valueFrom:
        secretKeyRef:
          name: node-red-credentials
          key: credential-secret
    # OIDC: makes /data/node_modules available to require() in settings.js.
    NODE_PATH:
      value: /data/node_modules
    # OIDC: Authentik base URL — injected per environment via overlay replacements.
    AUTHENTIK_HOST:
      value: PLACEHOLDER
    # OIDC: callback URL after authentication — injected per environment via overlay replacements.
    NODE_RED_CALLBACK_URL:
      value: PLACEHOLDER
    # OIDC: client secret synced from authentik namespace by Kyverno.
    NODE_RED_OIDC_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: node-red-oidc-secret
          key: NODE_RED_OIDC_CLIENT_SECRET

  volumes:
    # Persistent data directory (flows, credentials, node_modules, etc.).
    node-red-data:
      persistentVolumeClaim:
        claimName: node-red-data
    # settings.js is managed via ConfigMap; mounted at a separate path.
    node-red-settings:
      configMap:
        name: node-red-settings

  volumeMounts:
    # Node-RED stores flows, credentials and node_modules under /data.
    node-red-data:
      mountPath: /data
    # ConfigMap settings.js mounted at /config (no overlap with PVC).
    node-red-settings:
      mountPath: /config/settings.js
      subPath: settings.js

  ports:
    - name: http
      containerPort: 1880
      protocol: TCP

  # Consider Node-RED ready when the UI responds.
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 20
    failureThreshold: 5

  # Restart if Node-RED stops responding.
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 60
    failureThreshold: 5

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Image runs as user 'node' (UID 1000); keep the chart's runAsNonRoot default and pin the UID.
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true

  # Pod-level fsGroup so the PVC is writable by the non-root user.
  securityContext:
    fsGroup: 1000

# LoadBalancer with BGP advertisement via Cilium — static IP injected per environment via overlay
service:
  enabled: true
  type: LoadBalancer
  additionalLabels:
    bgp.cilium.io/ip-pool: default
    bgp.cilium.io/advertise-service: default
  ports:
    - port: 1880
      name: http
      protocol: TCP
      targetPort: http
