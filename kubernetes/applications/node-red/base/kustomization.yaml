apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: node-red
resources:
  - ./namespace.yaml
  - ./persistentvolume.yaml
  - ./sealed-secret.yaml
  - ./certificate.yaml
  - ./ingress-route.yaml

helmCharts:
  - name: application
    repo: https://stakater.github.io/stakater-charts
    releaseName: node-red
    version: 8.2.0
    valuesFile: values.yaml
    namespace: node-red

configMapGenerator:
  - name: node-red-settings
    files:
      - config/settings.js

labels:
  - includeSelectors: false
    pairs:
      homelab.app: node-red

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
