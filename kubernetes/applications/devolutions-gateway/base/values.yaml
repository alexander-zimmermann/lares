applicationName: devolutions-gateway

deployment:
  enabled: true
  # ConfigMap uses a kustomize content-hash name, so a config change rolls the
  # pod natively. The Stakater Reloader annotation is not used — there is no
  # Reloader controller in the cluster.
  reloadOnChange: false
  replicas: 1

  image:
    repository: docker.io/devolutions/devolutions-gateway
    tag: 2026.2.4
    pullPolicy: IfNotPresent

  # No API access required.
  automountServiceAccountToken: false

  # Bypass the image's pwsh entrypoint: it only generates a config and
  # provisioner keys — both supplied here — and then stays resident at ~58 MiB.
  command:
    - /opt/devolutions/gateway/devolutions-gateway
  args:
    - --config-path
    - /var/lib/devolutions-gateway

  env:
    # Keep logs/timestamps consistent with local timezone.
    TZ:
      value: "Europe/Berlin"

  # The gateway needs gateway.json inside its own writable data directory — it
  # writes jrl.json, boot.stacktrace and the libsql databases next to it. A
  # ConfigMap mounted there directly would be shadowed by the emptyDir, so the
  # config is seeded into it instead.
  initContainers:
    seed-config:
      image: docker.io/devolutions/devolutions-gateway:2026.2.4
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - cp /config/gateway.json /var/lib/devolutions-gateway/gateway.json
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      volumeMounts:
        - name: devolutions-gateway-config
          mountPath: /config
          readOnly: true
        - name: devolutions-gateway-data
          mountPath: /var/lib/devolutions-gateway

  volumes:
    # Writable data directory: gateway.json plus jrl.json and the libsql
    # job-queue and traffic-audit databases. Deliberately not persisted.
    devolutions-gateway-data:
      emptyDir: {}
    devolutions-gateway-config:
      configMap:
        name: devolutions-gateway-config
    # Provisioner keys sign the session tokens issued by the web app.
    devolutions-gateway-keys:
      secret:
        secretName: devolutions-gateway-keys
        defaultMode: 0440

  volumeMounts:
    devolutions-gateway-data:
      mountPath: /var/lib/devolutions-gateway
    devolutions-gateway-keys:
      mountPath: /etc/devolutions-gateway/keys
      readOnly: true

  ports:
    - name: http
      containerPort: 7171
      protocol: TCP

  readinessProbe:
    enabled: true
    httpGet:
      path: /jet/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 20
    failureThreshold: 5

  livenessProbe:
    enabled: true
    httpGet:
      path: /jet/health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 5

  # Idle footprint measured at ~10 MiB RSS for the gateway process.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Image declares no USER; keep the chart's runAsNonRoot default and pin the UID.
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Pod-level fsGroup so the emptyDir and the mounted keys are readable/writable
  # by the non-root user.
  securityContext:
    fsGroup: 1000

# ClusterIP only. The web app runs with Authentication "None", so Authentik
# forwardAuth on the IngressRoute is the sole gate — a LoadBalancer IP would
# expose it unauthenticated on the LAN.
service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 7171
      name: http
      protocol: TCP
      targetPort: http

# Disable built-in ingress (using Traefik IngressRoute instead)
ingress:
  enabled: false
