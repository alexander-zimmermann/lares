configs:
  cm:
    # Allows Argo CD to render Kustomize projects that use `helmCharts:`
    kustomize.buildOptions: --enable-helm
    # GitHub webhook triggers instant refresh; polling is only the fallback
    timeout.reconciliation: 1h
    timeout.reconciliation.jitter: 5m
    # Exclude noisy resources from tracking to reduce memory footprint
    resource.exclusions: |
      - apiGroups:
          - "*"
        kinds:
          - Event
          - Endpoints
        clusters:
          - "*"
    # Homepage service account – read-only API key for the homepage widget
    accounts.homepage: apiKey
    # HolmesGPT service account – read-only API key for the AIOps agent's argocd toolset
    accounts.holmes: apiKey
    # ArgoCD server URL – PLACEHOLDER is replaced per environment via overlay replacements
    url: https://argocd.PLACEHOLDER
    # OIDC via bundled Dex with Authentik upstream — PLACEHOLDER replaced per env
    dex.config: |
      connectors:
        - type: oidc
          id: authentik
          name: Authentik
          config:
            issuer: https://PLACEHOLDER/application/o/argocd/
            clientID: argocd
            clientSecret: $argocd-oidc-secret:oidc.authentik.clientSecret
            insecureEnableGroups: true
            scopes:
              - openid
              - profile
              - email
              - groups
            userIDKey: sub
            userNameKey: name

  rbac:
    # Default role for authenticated users without a matching group
    policy.default: role:readonly
    policy.csv: |
      g, platform-admins, role:admin
    scopes: "[groups, email]"

  secret:
    # GitHub webhook HMAC – reference resolved from the SealedSecret-managed argocd-webhook-secret
    githubSecret: $argocd-webhook-secret:webhook.github.secret

  params:
    # TLS is terminated externally via Ingress / reverse proxy.
    server.insecure: "true"
    # Reduce memory usage by splitting application tree into multiple Redis keys
    controller.app.tree.shard.size: "100"
    # Limit concurrent helm/kustomize processes (forking) to save RAM
    reposerver.parallelism.limit: "1"

# ArgoCD controller manages state of Applications, and performs sync/health checks
controller:
  metrics:
    # Exposes application sync status and controller performance metrics to Prometheus
    enabled: true
    serviceMonitor:
      enabled: true
      # Chart key is additionalLabels; a plain `labels` block is silently ignored.
      additionalLabels:
        release: prometheus

# Repo server renders manifests; livenessProbe default 1s is too tight for /healthz?full=true
# (does git ls-remote on every registered repo) and caused restart storms on transient network blips.
repoServer:
  livenessProbe:
    timeoutSeconds: 3

# ApplicationSet controller generates Applications from generators (e.g. Git, List, Cluster, etc.)
applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Notifications controller off: Alertmanager owns delivery, and the
# ArgoCD alerts already exist as debounced PrometheusRules on argocd_app_info
notifications:
  enabled: false

# Internal Redis for ArgoCD (caching/locking)
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Dex fronts Authentik as OIDC upstream — see configs.cm.[dex.config]
dex:
  enabled: true
