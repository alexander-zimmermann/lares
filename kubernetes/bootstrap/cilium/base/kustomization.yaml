apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cilium
resources:
  - ./namespace.yaml
  - ./grafana-dashboards.yaml

helmCharts:
  - name: cilium
    repo: oci://quay.io/cilium/charts
    releaseName: cilium
    version: 1.19.5
    valuesFile: values.yaml
    namespace: cilium
    includeCRDs: true
    apiVersions:
      - monitoring.coreos.com/v1

patches:
  # These dashboards are imported via the Grafana Operator (grafana-dashboards.yaml) into the
  # "Kubernetes" folder. Drop the sidecar label so they are not also auto-imported into "General".
  - target:
      kind: ConfigMap
      name: cilium-dashboard
    patch: |-
      - op: remove
        path: /metadata/labels/grafana_dashboard
  - target:
      kind: ConfigMap
      name: cilium-operator-dashboard
    patch: |-
      - op: remove
        path: /metadata/labels/grafana_dashboard

labels:
  - includeSelectors: false
    pairs:
      homelab.component: cilium

commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"
  argocd.argoproj.io/compare-options: ServerSideDiff=true
  argocd.argoproj.io/sync-options: ServerSideApply=true
