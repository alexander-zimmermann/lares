###############################################################################
## Global cluster definition
###############################################################################
kind: Cluster
name: homelab-prod
kubernetes:
  # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
  version: v1.36.6
talos:
  # renovate: datasource=github-releases depName=siderolabs/talos
  version: v1.14.6
features:
  diskEncryption: true

## Inherited by every machine set below (a set may override with its own list)
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
  - siderolabs/i915
  - siderolabs/intel-ucode
  - siderolabs/nvidia-open-gpu-kernel-modules-lts
  - siderolabs/iscsi-tools
  - siderolabs/zfs

patches:
  - name: global-settings
    file: patches/global-settings.yaml
  - name: manifests
    file: patches/extraManifests-prod.yaml

---
###############################################################################
## Control plane definition
###############################################################################
kind: ControlPlane
machineClass:
  name: control-plane-prod
  size: 3

patches:
  - name: control-plane-settings
    file: patches/control-plane-settings.yaml

---
###############################################################################
## Data plane definition
###############################################################################
kind: Workers
name: data-plane
machineClass:
  name: data-plane-prod
  size: 2

## Update Strategies: critical for storage nodes: Ensure only one node reboots at a time
updateStrategy:
  rolling:
    maxParallelism: 1
deleteStrategy:
  type: Rolling
  rolling:
    maxParallelism: 1

patches:
  - name: data-plane-settings
    file: patches/data-plane-settings.yaml
  - name: data-plane-volumes
    file: patches/data-plane-volumes.yaml
