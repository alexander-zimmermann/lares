###############################################################################
## Global cluster definition
###############################################################################
kind: Cluster
name: homelab-prod
kubernetes:
  version: v1.34.6
talos:
  # renovate: datasource=github-releases depName=siderolabs/talos
  version: v1.14.6
features:
  diskEncryption: true

## Inherited by every machine set below (a set may override with its own list)
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
  - siderolabs/i915
  - siderolabs/intel-ucode
  - siderolabs/nvidia-open-gpu-kernel-modules-lts
  - siderolabs/iscsi-tools
  - siderolabs/zfs

patches:
  - name: global-settings
    file: patches/global-settings.yaml
  - name: manifests
    file: patches/extraManifests-prod.yaml

---
###############################################################################
## Control plane definition
###############################################################################
kind: ControlPlane
machineClass:
  name: control-plane-prod
  size: 3

patches:
  - name: control-plane-settings
    file: patches/control-plane-settings.yaml

---
###############################################################################
## Data plane definition
###############################################################################
## Three workers in three sets of one: a set's patches follow whichever machine fills it (README)
kind: Workers
name: data-plane
machineClass:
  name: data-plane-prod
  size: 1

## Tear down one machine at a time when the set shrinks
deleteStrategy:
  type: Rolling
  rolling:
    maxParallelism: 1

patches:
  - name: data-plane-settings
    file: patches/data-plane-settings.yaml
  - name: data-plane-volumes
    file: patches/data-plane-volumes.yaml

---
###############################################################################
## Egress gateway a: one worker that owns the egress IP 192.168.10.2
###############################################################################
kind: Workers
name: data-plane-egress-a
machineClass:
  name: data-plane-prod
  size: 1

patches:
  - name: data-plane-settings
    file: patches/data-plane-settings.yaml
  - name: data-plane-volumes
    file: patches/data-plane-volumes.yaml
  - name: data-plane-egress-a
    file: patches/data-plane-egress-a.yaml

---
###############################################################################
## Egress gateway b: one worker that owns the egress IP 192.168.10.3
###############################################################################
kind: Workers
name: data-plane-egress-b
machineClass:
  name: data-plane-prod
  size: 1

patches:
  - name: data-plane-settings
    file: patches/data-plane-settings.yaml
  - name: data-plane-volumes
    file: patches/data-plane-volumes.yaml
  - name: data-plane-egress-b
    file: patches/data-plane-egress-b.yaml
