###############################################################################
## Global cluster definition
###############################################################################
kind: Cluster
name: homelab-prod
kubernetes:
  version: v1.34.6
talos:
  version: v1.12.6
features:
  diskEncryption: true

## Inherited by every machine set below (a set may override with its own list)
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
  - siderolabs/i915
  - siderolabs/intel-ucode
  - siderolabs/nvidia-open-gpu-kernel-modules-lts
  - siderolabs/iscsi-tools
  - siderolabs/zfs

patches:
  - name: global-settings
    file: patches/global-settings.yaml
  - name: manifests
    file: patches/extraManifests-prod.yaml

---
###############################################################################
## Control plane definition
###############################################################################
kind: ControlPlane
machineClass:
  name: control-plane-prod
  size: 3

patches:
  - name: control-plane-settings
    file: patches/control-plane-settings.yaml

---
###############################################################################
## Data plane definition
###############################################################################
## Three workers of one machine class in three machine sets: the worker without an
## egress role here, one set per egress gateway below. A set of size 1 is what binds an Omni patch
## to exactly one worker and lets a rebuilt worker inherit it (docs/adr/0004, README).
kind: Workers
name: data-plane
machineClass:
  name: data-plane-prod
  size: 1

## Tear down one machine at a time (default would be all at once); updates roll one at a time
## by default. The gateway sets below are size 1 for good, so they need no strategy.
deleteStrategy:
  type: Rolling
  rolling:
    maxParallelism: 1

patches:
  - name: data-plane-settings
    file: patches/data-plane-settings.yaml

---
###############################################################################
## Egress gateway a: one worker that owns the egress IP 192.168.10.2
###############################################################################
kind: Workers
name: data-plane-egress-a
machineClass:
  name: data-plane-prod
  size: 1

patches:
  - name: data-plane-settings
    file: patches/data-plane-settings.yaml
  - name: data-plane-egress-a
    file: patches/data-plane-egress-a.yaml

---
###############################################################################
## Egress gateway b: one worker that owns the egress IP 192.168.10.3
###############################################################################
kind: Workers
name: data-plane-egress-b
machineClass:
  name: data-plane-prod
  size: 1

patches:
  - name: data-plane-settings
    file: patches/data-plane-settings.yaml
  - name: data-plane-egress-b
    file: patches/data-plane-egress-b.yaml
