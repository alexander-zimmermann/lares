###############################################################################
## Global cluster definition
###############################################################################
kind: Cluster
name: homelab-dev
kubernetes:
  version: v1.34.6
talos:
  version: v1.12.6
features:
  diskEncryption: true

## Inherited by every machine set below (a set may override with its own list)
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
  - siderolabs/i915
  - siderolabs/intel-ucode
  - siderolabs/nvidia-open-gpu-kernel-modules-lts
  - siderolabs/iscsi-tools
  - siderolabs/zfs

patches:
  - name: global-settings
    file: patches/global-settings.yaml
  - name: manifests
    file: patches/extraManifests-dev.yaml

---
###############################################################################
## Control plane definition
###############################################################################
kind: ControlPlane
machineClass:
  name: control-plane-dev
  size: 3

patches:
  - name: control-plane-settings
    file: patches/control-plane-settings.yaml

---
###############################################################################
## Data Plane definition
###############################################################################
kind: Workers
name: data-plane
machineClass:
  name: data-plane-dev
  size: 3

## Tear down one machine at a time (default would be all at once); updates roll one at a time by default
deleteStrategy:
  type: Rolling
  rolling:
    maxParallelism: 1

patches:
  - name: data-plane-settings
    file: patches/data-plane-settings.yaml
