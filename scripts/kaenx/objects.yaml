# The generated ETS devices, one section per device: the application version
# last handed to Kaenx-Creator, and every object's number. knxproj-to-kaenx
# maintains this file — it seeds a section from the device in the ETS export,
# appends every new collector with the next free number and never renumbers.
# Keep it committed: the numbers are what lets an application update in ETS
# keep the group links, the version keeps every publish above the last one.
# A key the configuration no longer produces stays here and is still emitted,
# so links on it survive; delete it only when its links are gone.
