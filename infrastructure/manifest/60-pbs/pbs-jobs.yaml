## Verify, prune and sync jobs on the PBS (Datastore -> Verify/Prune & GC
## and Sync Jobs in the PBS UI). Verify jobs are provider resources; prune
## and sync jobs are applied over SSH until the provider carries them, so
## changes to them show up as a re-run, not as a diff.
pbs_jobs:
  verify:
    verify-datastore-primary:
      store: "datastore-primary"
      schedule: "daily"
    verify-datastore-secondary:
      store: "datastore-secondary"
      schedule: "daily"

  prune:
    ## The primary keeps the last few; the secondary keeps the history
    prune-datastore-primary:
      store: "datastore-primary"
      schedule: "daily"
      keep:
        last: 5
    prune-datastore-secondary:
      store: "datastore-secondary"
      schedule: "daily"
      keep:
        daily: 7
        weekly: 4
        monthly: 6
        yearly: 1

  sync:
    ## Local pull from NVMe to NFS, the morning after the nightly PVE backup (23:00)
    pull-from-primary:
      store: "datastore-secondary"
      remote_store: "datastore-primary"
      schedule: "*-*-* 05:00"
      remove_vanished: true
