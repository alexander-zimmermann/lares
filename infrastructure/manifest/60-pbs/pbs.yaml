## Proxmox Backup Server (the `backup_server_01` VM from 50-fleet). The 60-pbs
## layer configures the running PBS through its API, and over SSH where the
## API has no coverage; installation, disks, mounts and the root password stay
## in cloud-init (30-cloud-init).
pbs:
  api_connection:
    api_url: "https://backup-01.zimmermann.eu.com:8007"
    ## Password ticket: the provider has no API-token path. The password is
    ## `ci_secrets.pbs_bootstrap_conf.pbs_root_password`, set at first boot.
    username: "root@pam"
    ## A fresh VM serves a self-signed certificate until its ACME order has run
    insecure: true

  ## Remote-exec for what the API does not cover; the user comes from the
  ## cloud-init user config (30-cloud-init) and mirrors the one on the PVE nodes
  ssh_connection:
    address: "backup-01.zimmermann.eu.com"
    port: 22
    username: "opentofu"
    private_key_path: "~/.ssh/proxmox_opentofu"
