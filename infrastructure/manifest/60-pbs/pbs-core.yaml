## Host-level settings of the PBS VM: the repositories through its API, the
## subscription nag over SSH as the `opentofu` user from pbs.yaml.
pbs_core:
  repositories:
    ## No subscription: enterprise off; `pbs-no-subscription` comes from
    ## cloud-init, which needs it to install PBS
    enterprise: false
  ## Patch the "No valid subscription" dialog out of the web UI
  disable_subscription_nag: true
