## Datacenter-level OpenID Connect realms (Datacenter -> Realms in the PVE UI).
## Replaces PVE's own login form behind the Authentik forward-auth edge: one
## sign-in at Authentik, PVE trusts the resulting ID token. The `pve` realm and
## its API-token users stay untouched as break-glass and automation paths.
##
## Client secret: `pve_cluster_realm_openid_client_keys.<realm>` in terraform.tfvars.
## The same value is sealed for Authentik in kubernetes/applications/authentik
## (`proxmox-oidc-secret`). Rotation: new value in both places, then bump
## `client_key_version` so the write-only key is re-sent to PVE.
pve_cluster_realm_openid:
  authentik:
    ## Issuer = Authentik application slug; PVE discovers the endpoints from it
    issuer_url: "https://auth.zimmermann.sh/application/o/proxmox/"
    client_id: "proxmox"
    client_key_version: 1
    comment: "Authentik SSO"
    default: true

    ## `username` maps to preferred_username -> <authentik username>@authentik
    username_claim: "username"
    autocreate: true

    ## PVE names claim groups "<name>-authentik" and, with autocreate off, only
    ## assigns the ones declared below - the group set stays declarative.
    scopes: "email profile groups"
    groups_claim: "groups"
    groups_autocreate: false
    groups_overwrite: true
    groups:
      platform-admins:
        role_id: "Administrator"
        path: "/"
