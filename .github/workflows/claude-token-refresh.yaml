name: "Maintenance: Claude Token Refresh"

on:
  schedule:
    - cron: "23 */2 * * *" # Every two hours
  workflow_dispatch:

permissions: {}

# The refresh token is single-use: two runs at once would spend the same one.
concurrency:
  group: claude-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Claude Token
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ secrets.SECRETS_WRITER_APP_ID }}
          private-key: ${{ secrets.SECRETS_WRITER_PRIVATE_KEY }}
          permission-secrets: write

      - name: Refresh Claude login
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # `claude auth login` exchanges this refresh token instead of opening a browser.
          CLAUDE_CODE_OAUTH_REFRESH_TOKEN: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          # The scopes a claude.ai login asks for, which the refresh token was issued with.
          CLAUDE_CODE_OAUTH_SCOPES: user:profile user:inference user:sessions:claude_code user:mcp_servers user:file_upload
          # renovate: datasource=npm depName=@anthropic-ai/claude-code
          CLAUDE_CODE_VERSION: 2.1.323
        run: |
          if ! npx -y "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" auth login; then
            echo "::error::claude auth login rejected the stored refresh token."
            exit 1
          fi
          credentials="$HOME/.claude/.credentials.json"
          access=$(jq -er .claudeAiOauth.accessToken "$credentials")
          refresh=$(jq -er .claudeAiOauth.refreshToken "$credentials")
          expires_at=$(jq -er .claudeAiOauth.expiresAt "$credentials")
          refresh_expires_at=$(jq -r '.claudeAiOauth.refreshTokenExpiresAt // empty' "$credentials")
          echo "::add-mask::$access"
          echo "::add-mask::$refresh"

          # The old refresh token is spent once the login succeeds, so the new one is stored first.
          for attempt in 1 2 3; do
            printf '%s' "$refresh" | gh secret set CLAUDE_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" && break
            if [ "$attempt" = 3 ]; then
              echo "::error::The new refresh token was not stored; the login has to be renewed by hand."
              exit 1
            fi
            sleep 10
          done
          printf '%s' "$access" | gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo "$GITHUB_REPOSITORY"

          expires_in=$((expires_at / 1000 - $(date +%s)))
          echo "Access token valid for $((expires_in / 3600)) h." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$refresh_expires_at" ]; then
            refresh_days=$(((refresh_expires_at / 1000 - $(date +%s)) / 86400))
            echo "Refresh token valid for $refresh_days d." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$refresh_days" -lt 7 ]; then
              echo "::error::The refresh token expires in $refresh_days d; renew the login by hand (setup page, step 4)."
              exit 1
            fi
          fi
          if [ "$expires_in" -lt 10800 ]; then
            echo "::error::The access token lives under 3 h, so the two-hour schedule no longer covers it."
            exit 1
          fi
