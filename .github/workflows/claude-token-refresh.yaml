name: "Maintenance: Claude Token Refresh"

on:
  schedule:
    - cron: "23 */2 * * *" # Every two hours
  workflow_dispatch:

permissions: {}

# The refresh token is single-use: two runs at once would spend the same one.
concurrency:
  group: claude-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Claude Token
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ secrets.SECRETS_WRITER_APP_ID }}
          private-key: ${{ secrets.SECRETS_WRITER_PRIVATE_KEY }}
          permission-secrets: write

      - name: Refresh Claude login
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REFRESH_TOKEN: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          # Claude Code's own token endpoint and public OAuth client, as the CLI calls them.
          TOKEN_URL: https://platform.claude.com/v1/oauth/token
          CLIENT_ID: 9d1c250a-e61b-44d9-88ed-5944d1962f5e
        run: |
          request=$(jq -n --arg token "$REFRESH_TOKEN" --arg client "$CLIENT_ID" \
            '{grant_type: "refresh_token", refresh_token: $token, client_id: $client}')
          if ! response=$(curl -sS --fail-with-body -H 'Content-Type: application/json' --data "$request" "$TOKEN_URL"); then
            echo "::error::Refresh failed: $response"
            exit 1
          fi
          access=$(jq -er .access_token <<< "$response")
          refresh=$(jq -r '.refresh_token // empty' <<< "$response")
          expires_in=$(jq -er .expires_in <<< "$response")
          echo "::add-mask::$access"
          [ -n "$refresh" ] && echo "::add-mask::$refresh"

          # The old refresh token is spent once a new one comes back, so the new one is stored first.
          if [ -n "$refresh" ]; then
            for attempt in 1 2 3; do
              printf '%s' "$refresh" | gh secret set CLAUDE_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" && break
              if [ "$attempt" = 3 ]; then
                echo "::error::The new refresh token was not stored; the login has to be renewed by hand."
                exit 1
              fi
              sleep 10
            done
          fi
          printf '%s' "$access" | gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo "$GITHUB_REPOSITORY"

          echo "Access token valid for $((expires_in / 3600)) h." >> "$GITHUB_STEP_SUMMARY"
          if [ "$expires_in" -lt 10800 ]; then
            echo "::error::The access token lives under 3 h, so the two-hour schedule no longer covers it."
            exit 1
          fi
