name: "Maintenance: Issue Labeler"

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  issues: write
  contents: read

jobs:
  label-issue:
    name: Label Issue
    runs-on: ubuntu-latest
    if: github.actor != 'homelab-zimmermann-renovate-bot[bot]'
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Labeler
        uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: .github/settings/issue-labeler.yaml
          enable-versioned-regex: false
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
