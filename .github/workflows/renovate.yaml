name: "Maintenance: Renovate"

on:
  push:
    branches:
      - main
    paths:
      - .renovaterc.json5
      - .renovate/**.json5
  schedule:
    - cron: '0 * * * *' # Every hour
  issues:
    types:
      - edited
  # The PR's rebase checkbox; base context, so the workflow and checkout stay main's and the PR's code never runs.
  pull_request_target:
    branches:
      - main
    types:
      - edited
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
      logLevel:
        description: Log Level
        default: debug
      version:
        description: Renovate Version
        default: latest

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  renovate:
    name: Renovate
    # Only a person's edit of a Renovate PR; Renovate's own PR edits would each start another run.
    if: github.event_name != 'pull_request_target' || (startsWith(github.head_ref, 'renovate/') && github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app-token
        with:
          # NOTE: 'app-id' is marked deprecated by the action, but GitHub's
          # installation-token endpoint still rejects string client-id values
          # with 'iss must be an Integer' (HTTP 401). Staying on numeric App ID.
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}

      # Omni accepts only Kubernetes versions the pinned Talos supports, one minor at a time.
      - name: Kubernetes Range
        id: kubernetes
        shell: bash
        run: |
          talos=$(yq 'select(.kind == "Cluster") | .talos.version' cluster/homelab-cluster-prod.yaml)
          kubernetes=$(yq 'select(.kind == "Cluster") | .kubernetes.version' cluster/homelab-cluster-prod.yaml)
          compat=$(echo "${talos}" | cut -d. -f1-2 | tr -d 'v.')
          max=$(curl -fsSL "https://raw.githubusercontent.com/siderolabs/talos/${talos}/pkg/machinery/compatibility/talos${compat}/talos${compat}.go" \
            | sed -n 's/.*MaximumKubernetesVersion = semver.MustParse("\(.*\)").*/\1/p')
          test -n "${max}"
          IFS=. read -r major minor _ <<< "${kubernetes#v}"
          echo "range=<=${max} <${major}.$((minor + 2)).0" >> "${GITHUB_OUTPUT}"

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun }}
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: "true"
          RENOVATE_HOST_RULES: '[{"matchHost":"dhi.io","username":"${{ secrets.DHI_USER }}","password":"${{ secrets.DHI_PASS }}"}]'
          RENOVATE_PACKAGE_RULES: '[{"matchPackageNames":["ghcr.io/siderolabs/kubelet"],"allowedVersions":"${{ steps.kubernetes.outputs.range }}"}]'
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ inputs.version || 'latest' }}
