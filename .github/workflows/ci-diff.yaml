name: "CI: ArgoCD Diff Preview"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-diff:
    name: Generate Diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pull-request

      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: main

      - name: Install CLI Tools
        uses: alexellis/arkade-get@master
        with:
          kustomize: v5.8.1

      - name: Render ApplicationSets (Base)
        shell: bash
        run: |
          echo "::group::Render ApplicationSets"
          echo "Rendering Base Branch ApplicationSets..."
          kustomize build --enable-helm main/kubernetes/bootstrap/gitops-controller/overlays/prod > main/rendered-apps.yaml
          echo "::endgroup::"

      - name: Render ApplicationSets (PR)
        shell: bash
        run: |
          echo "::group::Render ApplicationSets"
          echo "Rendering PR Branch ApplicationSets..."
          kustomize build --enable-helm pull-request/kubernetes/bootstrap/gitops-controller/overlays/prod > pull-request/rendered-apps.yaml
          echo "::endgroup::"

      - name: Set Argo CD Custom Values
        run: |
          cat > values.yaml << "EOF"
          # set whatever helm values you want
          configs:
            cm:
              kustomize.buildOptions: --load-restrictor LoadRestrictionsNone --enable-helm
          EOF

      - name: Generate Diff
        run: |
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/main:/base-branch" \
            -v "$(pwd)/pull-request:/target-branch" \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/values.yaml:/argocd-config/values.yaml" \
            -e TARGET_BRANCH=refs/pull/${{ github.event.number }}/merge \
            -e REPO=${{ github.repository }} \
            -e TIMEOUT=300 \
            -e DEBUG=true \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=* \
            dagandersen/argocd-diff-preview:v0.1.25

      - name: Post diff as comment
        run: |
          # If output/diff.md exists, post it. The image might fail if diff fails generation?
          # The tool guarantees output/diff.md usually.
          if [ -f output/diff.md ]; then
            gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md --edit-last || \
            gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md
          else
            echo "::warning::No diff.md generated."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
