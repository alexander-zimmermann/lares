# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
        exclude: '^\.vscode/'
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
        # Vendored plugins stay byte-identical to their upstream commit
        exclude: '.*/secrets/.*|^kubernetes/applications/hermes/base/plugins/'
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/tofuutils/pre-commit-opentofu
    rev: v2.4.2
    hooks:
      - id: tofu_fmt

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
        exclude: '^kubernetes/applications/hermes/base/plugins/'

  # The validate tasks install the sidecar loaders from GitHub at the tags the
  # app manifests deploy, so the tag-bearing manifests are watched as well.
  - repo: local
    hooks:
      - id: knx-validate-ga-catalog
        name: knx:validate-ga-catalog
        entry: task knx:validate-ga-catalog
        language: system
        pass_filenames: false
        files: ^kubernetes/applications/knx-nats-bridge/base/(config/ga-catalog\.yaml|values\.yaml)$
      - id: knx-create-ga-mappings
        name: knx:create-ga-mappings
        entry: task knx:create-ga-mappings
        language: system
        pass_filenames: false
        # Writes the generated files; a commit whose files it changed stops once.
        # Runs on everything they derive from: the mappings and the catalog,
        # the sidecar bridges' device lists with their bindings and the tags
        # their descriptors are read at, the fault list and the tag its loader
        # is read at, and the generator itself.
        files: ^(kubernetes/applications/knx-nats-bridge/base/(ga-mappings/.*\.yaml|config/ga-catalog\.yaml|values\.yaml)|kubernetes/applications/(miele|midea|dyson)-nats-bridge/base/(config/.*\.yaml|values\.yaml)|kubernetes/applications/lares-diagnostics-engine/base/(config/faults\.yaml|detect-faults-cronjob\.yaml)|scripts/knx_generate_ga_mappings\.py)$
      - id: validate-ingest-grants
        name: k8s:validate-ingest-grants
        entry: task k8s:validate-ingest-grants
        language: system
        pass_filenames: false
        # Both sides of the comparison, and the comparison itself.
        files: ^(kubernetes/applications/(redpanda-connect/base/streams/.*\.yaml|timescaledb/base/scripts/grants\.sql)|scripts/validate_ingest_grants\.py)$
      - id: diagnostics-validate-faults
        name: diagnostics:validate-faults
        entry: task diagnostics:validate-faults
        language: system
        pass_filenames: false
        files: ^kubernetes/applications/lares-diagnostics-engine/base/(config/faults\.yaml|detect-faults-cronjob\.yaml)$
      - id: diagnostics-validate-site
        name: diagnostics:validate-site
        entry: task diagnostics:validate-site
        language: system
        pass_filenames: false
        files: ^kubernetes/applications/lares-diagnostics-engine/base/(config/site\.yaml|detect-faults-cronjob\.yaml)$
      - id: agents-create-harness-config
        name: agents:create-harness-config
        entry: task agents:create-harness-config
        language: system
        pass_filenames: false
        # Writes the rendered files; a commit whose files it changed stops once.
        # Runs on the declarations and the settings, the rendered files a hand
        # edit would change, and the tag the generator is installed at.
        files: ^kubernetes/applications/(lares-agent-trigger/base/(config/(use-cases|persons)\.yaml|values\.yaml)|hermes/base/(config/(settings|config)\.yaml|env-template\.yaml|profiles/.*)|agentgateway/base/config/routes(\.values)?\.yaml|authentik/base/blueprints/persons\.yaml|open-webui/base/config/connections\.values\.yaml)$
      - id: k8s-validate-sealed-templates
        name: k8s:validate-sealed-templates
        entry: task k8s:validate-sealed-templates
        language: system
        pass_filenames: false
        # Every SealedSecret, the templates beside it, every manifest and values file that
        # reads a key of one, and the check itself.
        files: ^(kubernetes/.*\.yaml|scripts/validate_sealed_templates\.py)$
