version: "3"

# Tasks for the KNX catalog pipeline. Paths come from Taskfile.yaml vars:
#   KNX_BRIDGE_DIR         — sibling repo holding the knxproj tools
#   KNX_BRIDGE_VALUES_PATH — the bridge app's values.yaml; its image tag is
#                            the version the validate tasks install
#   KNX_CATALOG_PATH       — destination ConfigMap source file in lares
#   KNX_GA_MAPPINGS_DIR    — the GA mappings directory, one file per source
#   INSIGHTS_FAULTS_PATH   — the fault-list source file in lares
# The local inputs come from .env (see .env.example):
#   KNX_PROJECT_PATH      — the ETS project export
#   KNXPROJ_PASSWORD      — its password, read by the knxproj tools
#   BASALTE_EXPORT_PATH   — the Basalte Studio project export
#   NODE_RED_FLOWS_PATH   — the Node-Red flow export

tasks:
  catalog:
    desc: "rebuild ga-catalog.yaml from the ETS export [path/to/project.knxproj]"
    summary: |
      Run knxproj-to-yaml against the ETS export — by default the one at
      KNX_PROJECT_PATH, or a path given as argument — and write the
      catalog into the ConfigMap source file. The extractor strips what
      ETS adds by itself — the Building numbering around a space name and
      the description it pre-fills from space plus function — so there is
      nothing left to post-process here.
      Arguments: [path/to/project.knxproj, default KNX_PROJECT_PATH]
      Needs KNXPROJ_PASSWORD from .env (the tools read it from the environment).
    vars:
      KNXPROJ: '{{.CLI_ARGS | default .KNX_PROJECT_PATH}}'
    preconditions:
      - sh: test -f "{{.KNXPROJ}}"
        msg: "ETS project export not found at '{{.KNXPROJ}}' — set KNX_PROJECT_PATH in .env (see .env.example) or pass a path"
      - sh: test -n "$KNXPROJ_PASSWORD"
        msg: "KNXPROJ_PASSWORD is not set — add it to .env (see .env.example)"
    cmds:
      # --ignore-write-from Dummy: the GIRA dummy products. The software
      # placeholders are gone; what is left is the Telenot alarm panel, whose
      # flags were never curated, so it does not vote. The named devices are
      # the generated visualisation devices: a visualisation receives status
      # addresses in order to display them, which is indistinguishable from
      # acting on them, so their Write flags must not vote either — only the
      # bridge's may, and those are exact (Write on consumed addresses only).
      # --project keeps the cwd here, so a relative path in .env resolves
      # from the repository root.
      - uv run --project "{{.KNX_BRIDGE_DIR}}" --extra tools knxproj-to-yaml
        --input "{{.KNXPROJ}}"
        --output "{{.KNX_CATALOG_PATH}}"
        --ignore-write-from Dummy
        --ignore-write-from "Basalte Core S4"
        --ignore-write-from "Node-Red"
      # The extractor strips ETS' Building numbering; nothing here does it
      # any more. An extractor from before that fails silently, and the
      # numbering reaches ga_catalog.room, which iot-mcp-bridge lists rooms
      # by. Assert the behaviour rather than a version — it cannot drift.
      - >
        ! grep -qE '^  room: [0-9]+ - ' "{{.KNX_CATALOG_PATH}}" ||
        { echo "rooms still carry ETS' Building numbering: update {{.KNX_BRIDGE_DIR}}
        (needs the extractor that strips it, knx-nats-bridge >= v0.19.0)"; exit 1; }
      - task: check-wiring

  ets-devices:
    desc: "generate Kaenx-Creator projects for the software bus devices [output-dir]"
    summary: |
      Build one Kaenx-Creator project per software bus participant —
      KNX-NATS-Bridge, Basalte, Node-Red — with collector objects: one
      communication object per main group and DPT main type, so every
      address of a kind is linked with one multi-select in ETS. A
      wiring worksheet lands beside each project and lists, per object,
      exactly the addresses to link.
      The address sets are defined by lares, not by ETS: the bridge
      carries the GA-mapping targets (Transmit+Read) plus the addresses
      NATS consumers act on (Write, the *_from_knx manifests); Basalte
      carries the bindings from the Studio export at BASALTE_EXPORT_PATH
      (Write+Transmit, excluded from the catalog's write vote). The ETS
      export at KNX_PROJECT_PATH only supplies names, DPTs and
      group-range names. Node-Red carries the addresses its flow export
      at NODE_RED_FLOWS_PATH touches. All three come from .env.
      Filter-table coverage is not modelled here at all — the couplers
      are set to forward group telegrams towards the bridge's line.
      Object numbers are positional (main group, DPT, direction). ETS
      keeps no link across an application update of these products, so
      a changed object set is always a new version built as a second
      device with the links dragged over; the worksheet says per object
      "NEU" or "war N" (its number on the old device). The run says per
      device whether anything changed — "no publish needed, only links"
      or "N new, M renumbered: publish" — and refuses to write when an
      installed object with links is dropped. scripts/kaenx/versions.yaml
      holds the version last handed out per device (commit it after
      every run): ETS remembers every version it ever imported, so the
      next one must go above what was published, not just above what
      is installed.
      Open each .ae-manu in Kaenx-Creator on the ETS VM, publish the
      .knxprod, import it into ETS, rebuild the device per worksheet.
      Arguments: [output-dir, default ~/Downloads]
      Needs KNXPROJ_PASSWORD from .env (the tools read it from the environment).
    vars:
      OUTDIR: '{{.CLI_ARGS | default "$HOME/Downloads"}}'
    preconditions:
      - sh: test -f "{{.KNX_PROJECT_PATH}}"
        msg: "ETS project export not found at '{{.KNX_PROJECT_PATH}}' — set KNX_PROJECT_PATH in .env (see .env.example)"
      - sh: test -f "{{.BASALTE_EXPORT_PATH}}"
        msg: "Basalte Studio export not found at '{{.BASALTE_EXPORT_PATH}}' — set BASALTE_EXPORT_PATH in .env (see .env.example)"
      - sh: test -f "{{.NODE_RED_FLOWS_PATH}}"
        msg: "Node-Red flow export not found at '{{.NODE_RED_FLOWS_PATH}}' — set NODE_RED_FLOWS_PATH in .env (see .env.example)"
      - sh: test -n "$KNXPROJ_PASSWORD"
        msg: "KNXPROJ_PASSWORD is not set — add it to .env (see .env.example)"
    cmds:
      # --project keeps the cwd here, so relative paths (.env, output dirs)
      # resolve from the repository root.
      - >
        set -e;
        consumed="$(mktemp)"; bridge="$(mktemp)"; basalte="$(mktemp)"; nodered="$(mktemp)";
        trap 'rm -f "$consumed" "$bridge" "$basalte" "$nodered"' EXIT;
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/knx_consumed_gas.py"
        "{{.ROOT_DIR}}/kubernetes/applications/nats/base/consumers" > "$consumed";
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/knx_bridge_gas.py"
        "{{.KNX_GA_MAPPINGS_DIR}}"
        "{{.ROOT_DIR}}/kubernetes/applications/nats/base/consumers" > "$bridge";
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/basalte_gas.py"
        "{{.BASALTE_EXPORT_PATH}}" > "$basalte";
        uv run --no-project python "{{.SCRIPTS_DIR}}/node_red_gas.py"
        "{{.NODE_RED_FLOWS_PATH}}" > "$nodered";
        uv run --project "{{.KNX_BRIDGE_DIR}}" --extra tools knxproj-to-kaenx
        --input "{{.KNX_PROJECT_PATH}}"
        --template "{{.SCRIPTS_DIR}}/kaenx/template.ae-manu"
        --write-gas "$consumed"
        --device "@$bridge=KNX-NATS-Bridge:split"
        --device "@$basalte=Basalte Core S4:both"
        --device "@$nodered=Node-Red:both"
        --catalog-section "Lares"
        --versions "{{.SCRIPTS_DIR}}/kaenx/versions.yaml"
        --output-dir "{{.OUTDIR}}"

  check-wiring:
    desc: "hold the ETS export against the software-device footprints"
    summary: |
      Compare the ETS export at KNX_PROJECT_PATH against what lares says
      each software device touches: GA mappings and *_from_knx
      consumers for the bridge, the Studio export at BASALTE_EXPORT_PATH
      for Basalte, the flow export at NODE_RED_FLOWS_PATH for Node-Red.
      All three come from .env. Reports footprint
      addresses without an ETS link, ETS links no configuration claims,
      and consumed addresses on objects without the Write flag; any
      finding fails the run, a device not yet imported is reported as
      such. Per device with findings a rest worksheet
      (<gerät>-wiring-todo.md) lands in TODO_DIR: only the links still
      to make, grouped under the object numbers of the device in the
      project (matched by object name, so an older installed version
      is checked correctly and objects it lacks are flagged). Runs
      automatically after knx:catalog.
      Needs KNXPROJ_PASSWORD from .env (the tools read it from the environment).
    vars:
      TODO_DIR: '{{.TODO_DIR | default "$HOME/Downloads"}}'
    preconditions:
      - sh: test -f "{{.KNX_PROJECT_PATH}}"
        msg: "ETS project export not found at '{{.KNX_PROJECT_PATH}}' — set KNX_PROJECT_PATH in .env (see .env.example)"
      - sh: test -f "{{.BASALTE_EXPORT_PATH}}"
        msg: "Basalte Studio export not found at '{{.BASALTE_EXPORT_PATH}}' — set BASALTE_EXPORT_PATH in .env (see .env.example)"
      - sh: test -f "{{.NODE_RED_FLOWS_PATH}}"
        msg: "Node-Red flow export not found at '{{.NODE_RED_FLOWS_PATH}}' — set NODE_RED_FLOWS_PATH in .env (see .env.example)"
      - sh: test -n "$KNXPROJ_PASSWORD"
        msg: "KNXPROJ_PASSWORD is not set — add it to .env (see .env.example)"
    cmds:
      # --project keeps the cwd here, so relative paths (.env, output dirs)
      # resolve from the repository root.
      - >
        set -e;
        consumed="$(mktemp)"; bridge="$(mktemp)"; basalte="$(mktemp)"; nodered="$(mktemp)";
        trap 'rm -f "$consumed" "$bridge" "$basalte" "$nodered"' EXIT;
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/knx_consumed_gas.py"
        "{{.ROOT_DIR}}/kubernetes/applications/nats/base/consumers" > "$consumed";
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/knx_bridge_gas.py"
        "{{.KNX_GA_MAPPINGS_DIR}}"
        "{{.ROOT_DIR}}/kubernetes/applications/nats/base/consumers" > "$bridge";
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/basalte_gas.py"
        "{{.BASALTE_EXPORT_PATH}}" > "$basalte";
        uv run --no-project python "{{.SCRIPTS_DIR}}/node_red_gas.py"
        "{{.NODE_RED_FLOWS_PATH}}" > "$nodered";
        uv run --project "{{.KNX_BRIDGE_DIR}}" --extra tools knxproj-check-wiring
        --input "{{.KNX_PROJECT_PATH}}"
        --write-gas "$consumed"
        --device "@$bridge=KNX-NATS-Bridge:split"
        --device "@$basalte=Basalte Core S4:both"
        --device "@$nodered=Node-Red:both"
        --todo-dir "{{.TODO_DIR}}"

  fault-writer-rules:
    desc: "regenerate ga-mappings/channels.yaml from faults.yaml and the GA catalog"
    summary: |
      Write channels.yaml whole: one rule per main group for every fault the
      fault list declares as delivering per main group (channel silence and
      constancy) and one rule per fault delivering to a declared house-wide
      address, each resolved against the catalog for address, DPT and name.
      The rules follow the address plan, so run this after every catalog
      change; it validates the result on the way out.
    cmds:
      - >
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/fault_writer_rules.py"
        "{{.INSIGHTS_FAULTS_PATH}}" "{{.KNX_CATALOG_PATH}}" "{{.KNX_GA_MAPPINGS_DIR}}"
      - task: validate-ga-mappings

  validate-ga-mappings:
    desc: "validate ga-mappings/ with the bridge's loader at the deployed tag"
    summary: |
      Load every file in ga-mappings/ with the bridge's own loader, installed
      from GitHub at the image tag the bridge app deploys: schema, DPT
      existence, the reader-loop guard (prefix "knx", as in production) and
      one writer per group address across all files. Then cross-check every
      target GA against ga-catalog.yaml, and regenerate every generated file
      into a temporary directory and diff — a stale one fails with the diff
      shown. What passes here is what the cluster accepts.
      Called by the pre-commit hook. Needs network (the git tag is fetched on
      every run) and a uv that knows the bridge's Python floor.
    vars:
      KNX_BRIDGE_TAG:
        sh: yq '.deployment.image.tag' "{{.KNX_BRIDGE_VALUES_PATH}}"
    cmds:
      - >
        uv run --no-project --python 3.14
        --with "knx-nats-bridge @ git+https://github.com/alexander-zimmermann/knx-nats-bridge@v{{.KNX_BRIDGE_TAG}}"
        python -c
        "import sys; from pathlib import Path;
        import yaml;
        from knx_nats_bridge.writer_rules import WriterRules;
        rules = WriterRules.load(Path(sys.argv[1]), reader_subject_prefix='knx');
        catalog = yaml.safe_load(Path(sys.argv[2]).read_text());
        dangling = sorted({r.ga for r in rules} - set(catalog));
        sys.exit(f'dangling rule targets, GA not in catalog: {dangling}') if dangling else
        print(f'OK: {len(rules)} rules on {len(rules.subjects())} subjects, all GAs in catalog (bridge v{{.KNX_BRIDGE_TAG}})')"
        "{{.KNX_GA_MAPPINGS_DIR}}" "{{.KNX_CATALOG_PATH}}"
      # Freshness: every generated file must match a fresh run of its generator.
      - >
        set -e; tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT;
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/fault_writer_rules.py"
        "{{.INSIGHTS_FAULTS_PATH}}" "{{.KNX_CATALOG_PATH}}" "$tmp" >/dev/null;
        for f in "$tmp"/*.yaml; do
        diff -u "{{.KNX_GA_MAPPINGS_DIR}}/$(basename "$f")" "$f" ||
        { echo "$(basename "$f") is stale: run 'task knx:fault-writer-rules'"; exit 1; };
        done;
        echo "OK: generated files current"

  validate-ga-catalog:
    desc: "validate ga-catalog.yaml with the bridge's loader at the deployed tag"
    summary: |
      Load the catalog with the bridge's own loader, installed from GitHub at
      the image tag the bridge app deploys — the JSON-Schema ships inside the
      package — so a skew between the extractor that wrote the file and the
      loader that reads it in the cluster fails here.
      Called by the pre-commit hook. Needs network (the git tag is fetched on
      every run) and a uv that knows the bridge's Python floor.
    vars:
      KNX_BRIDGE_TAG:
        sh: yq '.deployment.image.tag' "{{.KNX_BRIDGE_VALUES_PATH}}"
    cmds:
      - >
        uv run --no-project --python 3.14
        --with "knx-nats-bridge @ git+https://github.com/alexander-zimmermann/knx-nats-bridge@v{{.KNX_BRIDGE_TAG}}"
        python -c
        "import sys; from pathlib import Path;
        from knx_nats_bridge.mapping import GroupAddressMapping;
        catalog = GroupAddressMapping.load(Path(sys.argv[1]));
        print(f'OK: {len(catalog)} entries valid (bridge v{{.KNX_BRIDGE_TAG}})')"
        "{{.KNX_CATALOG_PATH}}"
