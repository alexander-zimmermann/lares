version: "3"

# What changed decides the task. A lares config, a Studio or a Node-Red
# export changed: create-ets-devices. "only links" — link the new addresses
# in ETS per worksheet. "publish" — Kaenx-Creator: open the .ae-manu,
# publish; ETS: import the .knxprod, add the new version as a second device,
# drag the links over per worksheet (war N), delete the old device, give the
# new one its address, link the new addresses. ETS changed: export the
# project. Then always: create-ga-catalog → validate-ets-devices → commit
# the catalog and versions.yaml. ETS and Kaenx-Creator: wiki ets-kaenx-creator.
# Paths come from Taskfile.yaml vars, the local inputs from .env (.env.example).

vars:
  CONSUMERS_DIR: "{{.ROOT_DIR}}/kubernetes/applications/nats/base/consumers"
  # Scratch for the footprints; .task/ is git-ignored.
  FOOTPRINTS_DIR: "{{.ROOT_DIR}}/.task/footprints"
  # One device list (footprint, product name, flag mode) for both knxproj tools.
  DEVICE_ARGS: >-
    --write-gas "{{.FOOTPRINTS_DIR}}/consumed"
    --device "@{{.FOOTPRINTS_DIR}}/bridge=KNX-NATS-Bridge:split"
    --device "@{{.FOOTPRINTS_DIR}}/basalte=Basalte Core S4:both"
    --device "@{{.FOOTPRINTS_DIR}}/nodered=Node-Red:both"

tasks:
  create-ga-catalog:
    desc: "write ga-catalog.yaml from the ETS export [path/to/project.knxproj]"
    summary: |
      Extract every typed group address with its DPT, name, function and room
      from the ETS export and write the catalog the bridge deploys; the
      pre-commit hook validates it (validate-ga-catalog). Only real actuators
      and the bridge's consumed-address collectors vote on writable (CONTEXT.md).
      Reads: the ETS export, KNXPROJ_PASSWORD_FILE from .env. Writes: ga-catalog.yaml.
      Arguments: [path/to/project.knxproj, default KNX_PROJECT_PATH]
    vars:
      KNXPROJ: '{{.CLI_ARGS | default .KNX_PROJECT_PATH}}'
    preconditions:
      - sh: test -f "{{.KNXPROJ}}"
        msg: "ETS project export not found at '{{.KNXPROJ}}' — set KNX_PROJECT_PATH in .env (see .env.example) or pass a path"
      - sh: test -s "$KNXPROJ_PASSWORD_FILE"
        msg: "KNXPROJ_PASSWORD_FILE is not set or the file is empty — add it to .env (see .env.example)"
    cmds:
      # --ignore-write-from: visualisations and the Telenot dummy do not vote on writable (CONTEXT.md)
      # --project keeps the cwd here, so a relative path in .env resolves from the repo root.
      - KNXPROJ_PASSWORD="$(cat "$KNXPROJ_PASSWORD_FILE")"
        uv run --project "{{.KNX_BRIDGE_DIR}}" --extra tools knxproj-to-yaml
        --input "{{.KNXPROJ}}"
        --output "{{.KNX_CATALOG_PATH}}"
        --ignore-write-from Dummy
        --ignore-write-from "Basalte Core S4"
        --ignore-write-from "Node-Red"
      # An older extractor leaves ETS' Building numbering in room; assert the behaviour, not a version.
      - >
        ! grep -qE '^  room: [0-9]+ - ' "{{.KNX_CATALOG_PATH}}" ||
        { echo "rooms still carry ETS' Building numbering: update {{.KNX_BRIDGE_DIR}}
        (needs the extractor that strips it, knx-nats-bridge >= v0.19.0)"; exit 1; }

  extract-footprints:
    internal: true
    desc: "write the three footprints and the consumed-address list into FOOTPRINTS_DIR"
    preconditions:
      - sh: test -f "{{.BASALTE_EXPORT_PATH}}"
        msg: "Basalte Studio export not found at '{{.BASALTE_EXPORT_PATH}}' — set BASALTE_EXPORT_PATH in .env (see .env.example)"
      - sh: test -f "{{.NODE_RED_FLOWS_PATH}}"
        msg: "Node-Red flow export not found at '{{.NODE_RED_FLOWS_PATH}}' — set NODE_RED_FLOWS_PATH in .env (see .env.example)"
    cmds:
      - mkdir -p "{{.FOOTPRINTS_DIR}}"
      - >
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/knx_consumed_gas.py"
        "{{.CONSUMERS_DIR}}" > "{{.FOOTPRINTS_DIR}}/consumed"
      - >
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/knx_bridge_gas.py"
        "{{.KNX_GA_MAPPINGS_DIR}}" "{{.CONSUMERS_DIR}}" > "{{.FOOTPRINTS_DIR}}/bridge"
      - >
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/basalte_gas.py"
        "{{.BASALTE_EXPORT_PATH}}" > "{{.FOOTPRINTS_DIR}}/basalte"
      - >
        uv run --no-project python "{{.SCRIPTS_DIR}}/node_red_gas.py"
        "{{.NODE_RED_FLOWS_PATH}}" > "{{.FOOTPRINTS_DIR}}/nodered"

  create-ets-devices:
    desc: "write the Kaenx-Creator projects for the software bus participants [output-dir]"
    summary: |
      Build one Kaenx-Creator project per software bus participant — bridge,
      Basalte, Node-Red — with collector objects (ADR-0001, ADR-0003) and a wiring
      worksheet each, NEU or war N per object; says per device "only links" or
      "publish". Reads: the footprints, the ETS export, scripts/kaenx/, and
      KNXPROJ_PASSWORD_FILE from .env. Writes: <device>.ae-manu, <device>-wiring.md, versions.yaml.
      Arguments: [output-dir, default ~/Downloads]
    vars:
      OUTDIR: '{{.CLI_ARGS | default "$HOME/Downloads"}}'
    preconditions:
      - sh: test -f "{{.KNX_PROJECT_PATH}}"
        msg: "ETS project export not found at '{{.KNX_PROJECT_PATH}}' — set KNX_PROJECT_PATH in .env (see .env.example)"
      - sh: test -s "$KNXPROJ_PASSWORD_FILE"
        msg: "KNXPROJ_PASSWORD_FILE is not set or the file is empty — add it to .env (see .env.example)"
    cmds:
      - task: extract-footprints
      # --project keeps the cwd here, so relative paths resolve from the repo root.
      - KNXPROJ_PASSWORD="$(cat "$KNXPROJ_PASSWORD_FILE")"
        uv run --project "{{.KNX_BRIDGE_DIR}}" --extra tools knxproj-to-kaenx
        --input "{{.KNX_PROJECT_PATH}}"
        --template "{{.SCRIPTS_DIR}}/kaenx/template.ae-manu"
        {{.DEVICE_ARGS}}
        --catalog-section "Lares"
        --versions "{{.SCRIPTS_DIR}}/kaenx/versions.yaml"
        --output-dir "{{.OUTDIR}}"

  validate-ets-devices:
    desc: "check the software bus participants' devices in ETS against their footprints"
    summary: |
      Hold the ETS export against the three footprints: footprint addresses
      without a link, links no configuration claims, consumed addresses on
      objects without Write. Any finding fails; a missing device is reported.
      Reads: the footprints, the ETS export, KNXPROJ_PASSWORD_FILE from .env. Writes:
      <device>-wiring-todo.md per device with findings — only the links still to
      make — into TODO_DIR (default ~/Downloads). Not a hook: the export may lag lares.
    vars:
      TODO_DIR: '{{.TODO_DIR | default "$HOME/Downloads"}}'
    preconditions:
      - sh: test -f "{{.KNX_PROJECT_PATH}}"
        msg: "ETS project export not found at '{{.KNX_PROJECT_PATH}}' — set KNX_PROJECT_PATH in .env (see .env.example)"
      - sh: test -s "$KNXPROJ_PASSWORD_FILE"
        msg: "KNXPROJ_PASSWORD_FILE is not set or the file is empty — add it to .env (see .env.example)"
    cmds:
      - task: extract-footprints
      # --project keeps the cwd here, so relative paths resolve from the repo root.
      - KNXPROJ_PASSWORD="$(cat "$KNXPROJ_PASSWORD_FILE")"
        uv run --project "{{.KNX_BRIDGE_DIR}}" --extra tools knxproj-check-wiring
        --input "{{.KNX_PROJECT_PATH}}"
        {{.DEVICE_ARGS}}
        --todo-dir "{{.TODO_DIR}}"

  create-ga-mappings:
    desc: "write the generated files in ga-mappings/ from descriptors, bindings and faults.yaml"
    summary: |
      Write every generated GA-mapping file whole, each with its package
      installed at the deployed tag: miele/midea/dyson.yaml from descriptor ×
      bindings, insights.yaml and channels.yaml from the fault list's name
      templates. Every rule resolves against the catalog by name, so run it after
      every catalog change; a DPT mismatch fails, an unnamed field is listed.
      Reads: the catalog, the sidecar configs, faults.yaml. Writes: ga-mappings/ (hook validates).
    cmds:
      - task: generate-ga-mappings
        vars: { OUT_DIR: "{{.KNX_GA_MAPPINGS_DIR}}" }

  generate-ga-mappings:
    internal: true
    desc: "write the generated GA-mapping files into OUT_DIR"
    requires:
      vars: [OUT_DIR]
    vars:
      MIELE_TAG:
        sh: yq '.deployment.image.tag' "{{.MIELE_VALUES_PATH}}"
      MIDEA_TAG:
        sh: yq '.deployment.image.tag' "{{.MIDEA_VALUES_PATH}}"
      DYSON_TAG:
        sh: yq '.deployment.image.tag' "{{.DYSON_VALUES_PATH}}"
      INSIGHTS_ENGINE_TAG:
        sh: yq '.spec.jobTemplate.spec.template.spec.containers[0].image | split(":") | .[1]' "{{.INSIGHTS_CRONJOB_PATH}}"
    cmds:
      # One environment per package: the bridges pin nats-bridge-core at
      # their own tags, which one shared resolve could not satisfy.
      - >
        uv run --no-project --python 3.14
        --with "miele-nats-bridge @ git+https://github.com/alexander-zimmermann/miele-nats-bridge@v{{.MIELE_TAG}}"
        python "{{.SCRIPTS_DIR}}/ga_mappings.py" miele
        "{{.KNX_CATALOG_PATH}}" "{{.OUT_DIR}}" "{{.MIELE_CONFIG_PATH}}"
      - >
        uv run --no-project --python 3.14
        --with "midea-nats-bridge @ git+https://github.com/alexander-zimmermann/midea-nats-bridge@v{{.MIDEA_TAG}}"
        python "{{.SCRIPTS_DIR}}/ga_mappings.py" midea
        "{{.KNX_CATALOG_PATH}}" "{{.OUT_DIR}}" "{{.MIDEA_CONFIG_PATH}}"
      - >
        uv run --no-project --python 3.14
        --with "dyson-nats-bridge @ git+https://github.com/alexander-zimmermann/dyson-nats-bridge@v{{.DYSON_TAG}}"
        python "{{.SCRIPTS_DIR}}/ga_mappings.py" dyson
        "{{.KNX_CATALOG_PATH}}" "{{.OUT_DIR}}" "{{.DYSON_CONFIG_PATH}}"
      - for: [insights, channels]
        cmd: >
          uv run --no-project --python 3.14
          --with "iot-insights-engine @ git+https://github.com/alexander-zimmermann/iot-insights-engine@v{{.INSIGHTS_ENGINE_TAG}}"
          python "{{.SCRIPTS_DIR}}/ga_mappings.py" {{.ITEM}}
          "{{.KNX_CATALOG_PATH}}" "{{.OUT_DIR}}" "{{.INSIGHTS_FAULTS_PATH}}"

  validate-ga-mappings:
    desc: "validate ga-mappings/ with the bridge's loader at the deployed tag"
    summary: |
      Load every file in ga-mappings/ with the bridge's loader at the deployed
      tag — schema, DPTs, the reader-loop guard, one writer per address across
      files — check every target against the catalog, and diff each generated
      file against a fresh run of its generator; a stale one fails with the diff.
      Reads: ga-mappings/, the catalog, everything create-ga-mappings reads.
      Pre-commit hook; needs network (git tags) and a uv that knows Python 3.14.
    vars:
      KNX_BRIDGE_TAG:
        sh: yq '.deployment.image.tag' "{{.KNX_BRIDGE_VALUES_PATH}}"
      TMP_DIR:
        sh: mktemp -d
    cmds:
      - defer: rm -rf "{{.TMP_DIR}}"
      - >
        uv run --no-project --python 3.14
        --with "knx-nats-bridge @ git+https://github.com/alexander-zimmermann/knx-nats-bridge@v{{.KNX_BRIDGE_TAG}}"
        python -c
        "import sys; from pathlib import Path;
        import yaml;
        from knx_nats_bridge.writer_rules import WriterRules;
        rules = WriterRules.load(Path(sys.argv[1]), reader_subject_prefix='knx');
        catalog = yaml.safe_load(Path(sys.argv[2]).read_text());
        dangling = sorted({r.ga for r in rules} - set(catalog));
        sys.exit(f'dangling rule targets, GA not in catalog: {dangling}') if dangling else
        print(f'OK: {len(rules)} rules on {len(rules.subjects())} subjects, all GAs in catalog (bridge v{{.KNX_BRIDGE_TAG}})')"
        "{{.KNX_GA_MAPPINGS_DIR}}" "{{.KNX_CATALOG_PATH}}"
      # Freshness: every generated file must match a fresh run of its generator.
      - task: generate-ga-mappings
        vars: { OUT_DIR: "{{.TMP_DIR}}" }
      - >
        for f in "{{.TMP_DIR}}"/*.yaml; do
        diff -u "{{.KNX_GA_MAPPINGS_DIR}}/$(basename "$f")" "$f" ||
        { echo "$(basename "$f") is stale: run 'task knx:create-ga-mappings'"; exit 1; };
        done;
        echo "OK: generated files current"

  validate-ga-catalog:
    desc: "validate ga-catalog.yaml with the bridge's loader at the deployed tag"
    summary: |
      Load the catalog with the bridge's loader at the image tag the app
      deploys — the JSON-Schema ships in the package — so a skew between the
      extractor that wrote the file and the loader in the cluster fails here.
      Reads: ga-catalog.yaml, the bridge's values.yaml (tag). Writes nothing.
      Pre-commit hook; needs network (the git tag is fetched every run).
    vars:
      KNX_BRIDGE_TAG:
        sh: yq '.deployment.image.tag' "{{.KNX_BRIDGE_VALUES_PATH}}"
    cmds:
      - >
        uv run --no-project --python 3.14
        --with "knx-nats-bridge @ git+https://github.com/alexander-zimmermann/knx-nats-bridge@v{{.KNX_BRIDGE_TAG}}"
        python -c
        "import sys; from pathlib import Path;
        from knx_nats_bridge.mapping import GroupAddressMapping;
        catalog = GroupAddressMapping.load(Path(sys.argv[1]));
        print(f'OK: {len(catalog)} entries valid (bridge v{{.KNX_BRIDGE_TAG}})')"
        "{{.KNX_CATALOG_PATH}}"
