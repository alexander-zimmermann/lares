version: "3"

# Tasks for the KNX catalog pipeline. Paths come from Taskfile.yaml vars:
#   KNX_BRIDGE_DIR        — sibling repo holding knxproj-to-yaml and the schema
#   KNX_CATALOG_PATH      — destination ConfigMap source file in lares
#   KNX_WRITER_RULES_PATH — writer-rules ConfigMap source file in lares
#   INSIGHTS_FAULTS_PATH  — the fault-list source file in lares

tasks:
  catalog:
    desc: "rebuild ga-catalog.yaml from an ETS project export [path/to/project.knxproj]"
    summary: |
      Run knxproj-to-yaml against the supplied .knxproj and write the catalog
      into the ConfigMap source file. The extractor strips what ETS adds by
      itself — the Building numbering around a space name and the description
      it pre-fills from space plus function — so there is nothing left to
      post-process here.
      Arguments: [path/to/project.knxproj]
      Pass KNXPROJ_PASSWORD=… for encrypted projects.
    vars:
      KNXPROJ: "{{index .CLI_ARGS_LIST 0}}"
    env:
      # passed through the environment so the plaintext password never appears
      # in the command line that task echoes
      KNXPROJ_PASSWORD: "{{.KNXPROJ_PASSWORD}}"
    requires:
      vars:
        - KNXPROJ
    preconditions:
      - sh: test -f "{{.KNXPROJ}}"
        msg: "'{{.KNXPROJ}}' not found"
    cmds:
      # --ignore-write-from Dummy: the GIRA placeholder device receives ~1850
      # addresses purely to get them into the coupler filter tables. Counting
      # its Write flag would mark almost everything writable, status mirrors
      # included. The named devices are their knx:ets-devices replacements:
      # a visualisation receives status addresses in order to display them,
      # which is indistinguishable from acting on them, so their Write flags
      # must not vote either — only the bridge's may.
      - uv run --directory "{{.KNX_BRIDGE_DIR}}" --extra tools knxproj-to-yaml
        --input "{{.KNXPROJ}}"
        --output "{{.KNX_CATALOG_PATH}}"
        --ignore-write-from Dummy
        --ignore-write-from "Basalte Core S4"
        --ignore-write-from "Node-Red"
        {{if .KNXPROJ_PASSWORD}}--password "$KNXPROJ_PASSWORD"{{end}}
      # The extractor strips ETS' Building numbering; nothing here does it
      # any more. An extractor from before that fails silently, and the
      # numbering reaches ga_catalog.room, which iot-mcp-bridge lists rooms
      # by. Assert the behaviour rather than a version — it cannot drift.
      - >
        ! grep -qE '^  room: [0-9]+ - ' "{{.KNX_CATALOG_PATH}}" ||
        { echo "rooms still carry ETS' Building numbering: update {{.KNX_BRIDGE_DIR}}
        (needs the extractor that strips it, knx-nats-bridge >= v0.19.0)"; exit 1; }

  ets-devices:
    desc: "generate Kaenx-Creator projects for the software bus devices [output-dir]"
    summary: |
      Build one Kaenx-Creator project per software bus participant —
      KNX-NATS-Bridge, Basalte, Node-Red — with collector objects: one
      communication object per main group and DPT main type, so every
      address of a kind is linked with one multi-select in ETS. A
      wiring worksheet lands beside each project and lists, per object,
      exactly the addresses to link.
      The address sets are defined by lares, not by ETS: the bridge
      carries writer-rule targets (Transmit+Read) plus the addresses
      NATS consumers act on (Write, the *_from_knx manifests); Basalte
      carries the bindings from the Studio export at BCFG (Write+
      Transmit, excluded from the catalog's write vote). The ETS export
      at KNX_PROJECT_PATH only supplies names, DPTs and group-range
      names. Node-Red carries the addresses its flow export at FLOWS
      touches. All inputs from foreign systems live in exports/.
      Filter-table coverage is not modelled here at all — the couplers
      are set to forward group telegrams towards the bridge's line.
      Open each .ae-manu in Kaenx-Creator on the ETS VM, publish the
      .knxprod, import it into ETS, link the addresses per worksheet;
      the placeholders stay until knx:catalog and check-wiring are
      green, then they go.
      Arguments: [output-dir, default ~/Downloads]
      Pass KNXPROJ_PASSWORD=… for encrypted projects.
    vars:
      OUTDIR: '{{.CLI_ARGS | default "$HOME/Downloads"}}'
      BCFG: '{{.BCFG | default "exports/basalte/Steinroth.bcfg"}}'
      FLOWS: '{{.FLOWS | default "exports/node-red/flows.json"}}'
    env:
      # passed through the environment so the plaintext password never appears
      # in the command line that task echoes
      KNXPROJ_PASSWORD: "{{.KNXPROJ_PASSWORD}}"
    preconditions:
      - sh: test -f "{{.KNX_PROJECT_PATH}}"
        msg: "'{{.KNX_PROJECT_PATH}}' not found"
      - sh: test -f "{{.BCFG}}"
        msg: "'{{.BCFG}}' not found — export from Basalte Studio first"
      - sh: test -f "{{.FLOWS}}"
        msg: "'{{.FLOWS}}' not found — Node-Red: menu, Export, all flows"
    cmds:
      - >
        set -e;
        consumed="$(mktemp)"; bridge="$(mktemp)"; basalte="$(mktemp)"; nodered="$(mktemp)";
        trap 'rm -f "$consumed" "$bridge" "$basalte" "$nodered"' EXIT;
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/knx_consumed_gas.py"
        "{{.ROOT_DIR}}/kubernetes/applications/nats/base/consumers" > "$consumed";
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/knx_bridge_gas.py"
        "{{.KNX_WRITER_RULES_PATH}}"
        "{{.ROOT_DIR}}/kubernetes/applications/nats/base/consumers" > "$bridge";
        uv run --no-project --with pyyaml python "{{.SCRIPTS_DIR}}/basalte_gas.py"
        "{{.BCFG}}" > "$basalte";
        uv run --no-project python "{{.SCRIPTS_DIR}}/node_red_gas.py"
        "{{.FLOWS}}" > "$nodered";
        uv run --directory "{{.KNX_BRIDGE_DIR}}" --extra tools knxproj-to-kaenx
        --input "{{.KNX_PROJECT_PATH}}"
        --template "{{.ROOT_DIR}}/exports/kaenx/template.ae-manu"
        --write-gas "$consumed"
        --device "@$bridge=KNX-NATS-Bridge:split"
        --device "@$basalte=Basalte Core S4:both"
        --device "@$nodered=Node-Red:both"
        --catalog-section "Lares"
        --output-dir "{{.OUTDIR}}"
        {{if .KNXPROJ_PASSWORD}}--password "$KNXPROJ_PASSWORD"{{end}}

  fault-writer-rules:
    desc: "regenerate the fault writer rules from faults.yaml and the GA catalog"
    summary: |
      Rewrite the generated block in writer-rules.yaml: one rule per main
      group for every fault the fault list declares as delivering per main
      group (channel silence), resolved against the catalog for address,
      DPT and name. The rules follow the address plan, so run this after
      every catalog change; it validates the result on the way out.
    cmds:
      - >
        uv run --no-project --with pyyaml python scripts/fault_writer_rules.py
        "{{.INSIGHTS_FAULTS_PATH}}" "{{.KNX_CATALOG_PATH}}" "{{.KNX_WRITER_RULES_PATH}}"
      - task: validate-writer-rules

  validate-writer-rules:
    desc: "validate writer-rules.yaml with the bridge's own loader"
    summary: |
      Load the writer rules with the bridge's loader — schema validation plus
      the DPT existence check and the reader-loop guard (prefix "knx", as in
      production) — then cross-check every target GA against ga-catalog.yaml,
      so a bad edit or a dangling rule fails here instead of in the cluster.
    cmds:
      - >
        uv run --directory "{{.KNX_BRIDGE_DIR}}" python -c
        "import sys; from pathlib import Path;
        import yaml;
        from knx_nats_bridge.writer_rules import WriterRules;
        rules = WriterRules.load(Path(sys.argv[1]), reader_subject_prefix='knx');
        catalog = yaml.safe_load(Path(sys.argv[2]).read_text());
        dangling = sorted({r.ga for r in rules} - set(catalog));
        sys.exit(f'dangling rule targets, GA not in catalog: {dangling}') if dangling else
        print(f'OK: {len(rules)} rules on {len(rules.subjects())} subjects, all GAs in catalog')"
        "{{.KNX_WRITER_RULES_PATH}}" "{{.KNX_CATALOG_PATH}}"

  validate-catalog:
    desc: "validate ga-catalog.yaml against the JSON-Schema"
    summary: |
      Check the rendered ConfigMap source against the upstream JSON-Schema.
    vars:
      SCHEMA: "{{.KNX_BRIDGE_DIR}}/src/knx_nats_bridge/_schemas/ga-catalog.schema.json"
    cmds:
      - >
        uv run --directory "{{.KNX_BRIDGE_DIR}}" python -c
        "import json, sys, yaml, jsonschema;
        schema = json.load(open(sys.argv[1]));
        data   = yaml.safe_load(open(sys.argv[2]));
        jsonschema.validate(data, schema);
        print(f'OK: {len(data)} entries valid')"
        "{{.SCHEMA}}" "{{.KNX_CATALOG_PATH}}"
