version: "3"

# Tasks for the insights-engine's declared files. Paths come from
# Taskfile.yaml vars:
#   INSIGHTS_CRONJOB_PATH — the detect-faults CronJob manifest; its image tag
#                           is the version the validate tasks install
#   INSIGHTS_FAULTS_PATH  — the fault-list source file in lares
#   INSIGHTS_SITE_PATH    — the site file beside it

tasks:
  validate-faults:
    desc: "validate faults.yaml with the engine's loader at the deployed tag"
    summary: |
      Load the fault list with the engine's own loader, installed from GitHub
      at the image tag the detect-faults cronjob deploys — schema validation
      plus the loader's checks (duplicate names, per-kind parameters) — so a
      bad edit fails here instead of at startup in the cluster.
      Called by the pre-commit hook. Needs network (the git tag is fetched on
      every run).
    vars:
      INSIGHTS_ENGINE_TAG:
        sh: yq '.spec.jobTemplate.spec.template.spec.containers[0].image | split(":") | .[1]' "{{.INSIGHTS_CRONJOB_PATH}}"
    cmds:
      - >
        uv run --no-project --python 3.14
        --with "iot-insights-engine @ git+https://github.com/alexander-zimmermann/iot-insights-engine@v{{.INSIGHTS_ENGINE_TAG}}"
        python -c
        "import sys; from pathlib import Path;
        from iot_insights_engine.faults import FaultList;
        faults = FaultList.load(Path(sys.argv[1]));
        print(f'OK: {len(faults)} faults, {len(faults.schedulable())} schedulable (engine v{{.INSIGHTS_ENGINE_TAG}})')"
        "{{.INSIGHTS_FAULTS_PATH}}"

  validate-site:
    desc: "validate site.yaml with the engine's loader at the deployed tag"
    summary: |
      Load the site file — what the house is: location, timezone, PV planes
      — with the engine's own loader at the deployed tag: schema validation
      plus the loader's checks (known timezone, one inverter per plane).
      Called by the pre-commit hook. Needs network.
    vars:
      INSIGHTS_ENGINE_TAG:
        sh: yq '.spec.jobTemplate.spec.template.spec.containers[0].image | split(":") | .[1]' "{{.INSIGHTS_CRONJOB_PATH}}"
    cmds:
      - >
        uv run --no-project --python 3.14
        --with "iot-insights-engine @ git+https://github.com/alexander-zimmermann/iot-insights-engine@v{{.INSIGHTS_ENGINE_TAG}}"
        python -c
        "import sys; from pathlib import Path;
        from iot_insights_engine.site import Site;
        site = Site.load(Path(sys.argv[1]));
        print(f'OK: {len(site.planes)} planes, {site.timezone} (engine v{{.INSIGHTS_ENGINE_TAG}})')"
        "{{.INSIGHTS_SITE_PATH}}"
