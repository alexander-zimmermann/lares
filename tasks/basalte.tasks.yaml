version: "3"

tasks:
  create-inventory:
    desc: "write the Basalte logic inventory from a Studio export [path/to/export.bcfg]"
    summary: |
      List every logic block in the Studio export with its devices, thresholds
      and notifications — the set a newly planned fault is checked against.
      What the block types do is product knowledge: wiki basalte-logic-blocks.
      Reads: the Studio export. Writes: ~/Downloads/basalte-inventory.md, the
      wiki page basalte-logic-inventory verbatim (replace it after every export).
      Arguments: [path/to/export.bcfg, default BASALTE_EXPORT_PATH]
    vars:
      EXPORT: '{{.CLI_ARGS | default .BASALTE_EXPORT_PATH}}'
      OUTPUT: "$HOME/Downloads/basalte-inventory.md"
    preconditions:
      - sh: test -f "{{.EXPORT}}"
        msg: "Basalte Studio export not found at '{{.EXPORT}}' — set BASALTE_EXPORT_PATH in .env (see .env.example) or pass a path"
    cmds:
      - uv run --no-project python scripts/basalte_create_inventory.py "{{.EXPORT}}" > "{{.OUTPUT}}"
      - cmd: echo "wrote {{.OUTPUT}}"
        silent: true

  validate-bindings:
    summary: |
      The pre-commit hook basalte:validate-bindings. Studio holds the bus
      twice: the imported ETS project, and a copy of the address name in every
      device and logic block wired with it — a move or rename in ETS leaves the
      copies behind. Reports moved bindings (fails the run), stale labels and
      addresses the catalog lacks. Fails while the .knxproj is newer than the
      catalog: run `task knx:create-ga-catalog` first. Skips without an export.
      Reads: the Studio export, ga-catalog.yaml. Writes: nothing.
      Arguments: [path/to/export.bcfg, default BASALTE_EXPORT_PATH]
    vars:
      EXPORT: '{{.CLI_ARGS | default .BASALTE_EXPORT_PATH}}'
    cmds:
      - |
        if [ ! -f "{{.EXPORT}}" ]; then
          echo "{{if .EXPORT}}no Basalte export at '{{.EXPORT}}'{{else}}BASALTE_EXPORT_PATH not set{{end}}, skipped"
          exit 0
        fi
        # Absent .knxproj: nothing to be stale against, so the check runs.
        if [ -n "{{.KNX_PROJECT_PATH}}" ] && [ "{{.KNX_PROJECT_PATH}}" -nt "{{.KNX_CATALOG_PATH}}" ]; then
          echo "the ETS project is newer than ga-catalog.yaml — run \`task knx:create-ga-catalog\` first"
          exit 1
        fi
        uv run --no-project --with pyyaml python scripts/basalte_validate_bindings.py "{{.EXPORT}}" \
          "{{.KNX_CATALOG_PATH}}"

  validate-wiring:
    summary: |
      The pre-commit hook basalte:validate-wiring. A node whose output is
      wired but whose input is not stays silent, and Studio draws it like any
      other: a Nummer einstellen without a trigger, a Tor with nothing on in 1.
      Lists every such node by block and fails. Skips without an export.
      Reads: the Studio export. Writes: nothing.
      Arguments: [path/to/export.bcfg, default BASALTE_EXPORT_PATH]
    vars:
      EXPORT: '{{.CLI_ARGS | default .BASALTE_EXPORT_PATH}}'
    cmds:
      - |
        if [ ! -f "{{.EXPORT}}" ]; then
          echo "{{if .EXPORT}}no Basalte export at '{{.EXPORT}}'{{else}}BASALTE_EXPORT_PATH not set{{end}}, skipped"
          exit 0
        fi
        uv run --no-project python scripts/basalte_validate_wiring.py "{{.EXPORT}}"
