version: "3"

# Tasks for the agent platform's declared files. Paths come from Taskfile.yaml vars:
#   AGENT_TRIGGER_VALUES_PATH    — the trigger's values file; its image tag is
#                                  the version the generator is installed at
#   AGENT_USE_CASES_PATH         — the use-case file
#   AGENT_PERSONS_PATH           — the person declaration: the model sources and the persons
#   HERMES_SETTINGS_PATH         — the hand-written Hermes settings
#   HERMES_CONFIG_PATH           — rendered: the default profile's Hermes configuration
#   HERMES_PROFILES_PATH         — rendered: each person's profile config, their ConfigMap
#                                  and the chart values that mount them
#   AGENT_CRON_JOBS_PATH         — rendered: the cron job set
#   AGENT_TRACING_PATH           — rendered: the sampling ratio of the platform's services
#   HERMES_ENV_TEMPLATE_PATH     — rendered: every profile's .env, a template of
#                                  the sealed keys beside Hermes's SealedSecret
#   AGENT_GATEWAY_ROUTES_PATH    — rendered: the gateway's routes, which name every key
#                                  as a variable and every credential as a file
#   AGENT_GATEWAY_ROUTES_VALUES_PATH
#                                — rendered: the gateway's chart values that set those
#                                  variables and mount the routes and each credential

tasks:
  create-harness-config:
    summary: |
      The pre-commit hook agents:create-harness-config. Render the use-case
      file and the person declaration with the trigger's generator, installed
      at the image tag the trigger deploys, and write every file in place:
      the default profile's Hermes configuration (settings.yaml copied whole,
      then its model, fallbacks and directory, the platform toolsets, MCP
      servers and outbound hook, and the persons' Discord routes and rights),
      each enabled person's profile config with the ConfigMap and chart
      values that mount it, the cron job set for the trigger, the sampling
      ratio the trigger, the bridge and the engine trace at, the template that
      composes every profile's .env from the keys sealed one by one beside it,
      the gateway's routes, and the gateway's chart values that set their keys
      and mount the routes and each credential they attach.
      The trigger's loaders refuse a declaration that breaks a rule and name
      the field. A commit whose rendered files this changed stops once: add
      them and commit again. A key a template names must be sealed too
      (task k8s:validate-sealed-templates).
      Reads: use-cases.yaml, persons.yaml, settings.yaml, the trigger's values.yaml (tag).
      Writes: config.yaml, profiles/, cron-jobs.yaml, tracing.env, env-template.yaml,
      config/routes.yaml and config/routes.values.yaml.
      Needs network (the git tag) and a uv that knows Python 3.15.
    vars:
      AGENT_TRIGGER_TAG:
        sh: yq '.deployment.image.tag' "{{.AGENT_TRIGGER_VALUES_PATH}}"
    cmds:
      - >
        uv run --no-project --python 3.15
        --with "lares-agent-trigger @ git+https://github.com/alexander-zimmermann/lares-agent-trigger@v{{.AGENT_TRIGGER_TAG}}"
        lares-agent-trigger generate
        --use-cases "{{.AGENT_USE_CASES_PATH}}"
        --persons "{{.AGENT_PERSONS_PATH}}"
        --settings "{{.HERMES_SETTINGS_PATH}}"
        --hermes-config "{{.HERMES_CONFIG_PATH}}"
        --cron-jobs "{{.AGENT_CRON_JOBS_PATH}}"
        --tracing "{{.AGENT_TRACING_PATH}}"
        --env-template "{{.HERMES_ENV_TEMPLATE_PATH}}"
        --routes "{{.AGENT_GATEWAY_ROUTES_PATH}}"
        --routes-values "{{.AGENT_GATEWAY_ROUTES_VALUES_PATH}}"
        --profiles "{{.HERMES_PROFILES_PATH}}"
