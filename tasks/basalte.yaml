---
version: "3"

tasks:
  inventory:
    desc: "print the Basalte logic inventory from a Studio export [path/to/export.bcfg]"
    vars:
      EXPORT: '{{.CLI_ARGS | default .BASALTE_EXPORT_PATH}}'
    preconditions:
      - sh: test -f "{{.EXPORT}}"
        msg: "Basalte Studio export not found at '{{.EXPORT}}' — set BASALTE_EXPORT_PATH in .env (see .env.example) or pass a path"
    cmds:
      - uv run --no-project python scripts/basalte_inventory.py "{{.EXPORT}}"

  sync:
    desc: "check the Studio export against the GA catalog [path/to/export.bcfg]"
    summary: |
      Report where Basalte and ETS disagree about a group address: bindings
      whose address moved (the ones that matter), labels left over from an
      older name, and addresses ETS does not define. Exits non-zero on a
      moved address.

      Compares against ga-catalog.yaml, which is a snapshot of the project.
      The task refuses to run while the .knxproj is newer than it — an
      address created in ETS since would otherwise be reported as one
      Basalte invented. Rebuild with `task knx:catalog` first.
    vars:
      EXPORT: '{{.CLI_ARGS | default .BASALTE_EXPORT_PATH}}'
    preconditions:
      - sh: test -f "{{.EXPORT}}"
        msg: "Basalte Studio export not found at '{{.EXPORT}}' — set BASALTE_EXPORT_PATH in .env (see .env.example) or pass a path"
      # Absent .knxproj: nothing to be stale against, so the check runs.
      - sh: '! test "{{.KNX_PROJECT_PATH}}" -nt "{{.KNX_CATALOG_PATH}}"'
        msg: "the ETS project is newer than ga-catalog.yaml — run `task knx:catalog` first"
    cmds:
      - >
        uv run --no-project --with pyyaml python scripts/basalte_sync.py "{{.EXPORT}}"
        "{{.KNX_CATALOG_PATH}}"
